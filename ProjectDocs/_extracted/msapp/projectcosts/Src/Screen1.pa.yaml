Screens:
  Screen1:
    Properties:
      OnVisible: |+
        =ClearCollect(
            colDeviceTypesInProject,
            AddColumns(
                Filter(
                    DeviceTypesInProjects,
                    AsType(
                        TypeInProject,
                        GeneratorTypeInProjects
                    ).Project.Project = gblSelectedProject.Project
                ),
                IsFolded,
                true
            )
        );
        Collect(
            colDeviceTypesInProject,
            AddColumns(
                Filter(
                    DeviceTypesInProjects,
                    AsType(
                        TypeInProject,
                        PVModuleTypeInProjects
                    ).Project.Project = gblSelectedProject.Project
                ),
                IsFolded,
                true
            )
        );
        ClearCollect(
            colOpexProjectCosts,
            Filter(
                'Opex Project Costs',
                Project.Project = gblSelectedProject.Project
            )
        );
    Children:
      - cmp_Header_1:
          Control: CanvasComponent
          ComponentName: cmp_Header
          Properties:
            ApprovalStatesColor: |-
              =Table(
                  {
                      State: "Draft",
                      Color: "#41aab4"
                  },
                  {
                      State: "Approving",
                      Color: "#f5911e"
                  },
                  {
                      State: "Approved",
                      Color: "#82a51e"
                  },
                  {
                      State: "Rejected",
                      Color: "#d20532"
                  }
              )
            Height: =74
            LogoWidth: =210
            MainScreen: =App.ActiveScreen
            OnLogoClick: =true
            Project: =gblProjectHeaderData
            Width: =1366
      - Button1:
          Control: Classic/Button@2.2.0
          Properties:
            Color: =RGBA(255, 255, 255, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            OnSelect: =
            X: =603
            Y: =348
      - cmp_ReportErrorRightPanel_LandLeaseCosts_1:
          Control: CanvasComponent
          ComponentName: cmp_ReportErrorRightPanel
          Properties:
            Height: =Parent.Height
            Visible: =gblShowReportProblemPanel
            Width: =Parent.Width
      - ComboboxCanvas1:
          Control: ComboBox@0.0.51
          Properties:
            SelectMultiple: =true
            X: =220
            Y: =185
      - ComboBox1:
          Control: Classic/ComboBox@2.4.0
          Properties:
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            PressedColor: =RGBA(255, 255, 255, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            X: =180
            Y: =325
      - ButtonCanvas1:
          Control: Button@0.0.45
          Properties:
            OnSelect: |
              =
                      // Step 1: Get all first periods (cost types) for the current subaccount
              ClearCollect(
                  colFirstPeriods,
                  Filter(
                      colOpexProjectCosts,
                      Subaccount.'Opex Subaccount' = First(colOpexSubaccounts).'Opex Subaccount' && IsBlank('Parent Cost')
                  )
              );
              ClearCollect(
                  colLastPeriods,
                  ForAll(
                      colFirstPeriods As FirstPeriod,
                      With(
                          {
                              costTypePeriods: Filter(
                                  colOpexProjectCosts,
                                  Subaccount.'Opex Subaccount' = First(colOpexSubaccounts).'Opex Subaccount' && ('Parent Cost'.'Opex Project Cost' = FirstPeriod.'Opex Project Cost' || 'Opex Project Cost' = FirstPeriod.'Opex Project Cost')
                              )
                          },
                                  // Last periods: where no other period references them as parent
                          Last(
                              Sort(
                                  costTypePeriods,
                                  Name,
                                  SortOrder.Ascending
                              )
                          )
                                  /*
                                  First(
                                      Filter(
                                          costTypePeriods,
                                          CountRows(
                                              Filter(
                                                  costTypePeriods,
                                                  'Parent Cost'.'Opex Project Cost' = 'Opex Project Cost'
                                              )
                                          ) = 0
                                      )
                                  )*/
                      )
                  )
              );
            X: =975
            Y: =217
      - TextCanvas2:
          Control: Text@0.0.51
          Properties:
            Text: =
            X: =1083
            Y: =456
      - TextInputCanvas1:
          Control: TextInput@0.0.54
          Properties:
            Height: =344
