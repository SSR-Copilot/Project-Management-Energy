      - cmp_Project_PopUp_ConfirmationDeleteProject:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Delete"
            Description: =$"Are you sure you want to delete the project ""{gblRecordSelectedProject.'Project Name'}""?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="Trash"
            OnCancel: |-
              =UpdateContext({locProjectDelitionDialog: false});
            OnConfirm: |
              =IfError(
                  Remove(
                      Projects,
                      gblRecordSelectedProject
                  );
                  Notify(
                      $"The project '{gblRecordSelectedProject.'Project Name'}' was successfully deleted!",
                      NotificationType.Success,
                      1000
                  ),
                  Notify(
                      "Error: Permit could not be deleted. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse,
                      NotificationType.Error
                  )
              );
              Refresh(Projects);
              Set(
                  gblRecordSelectedProject,
                  Blank()
              );
              Set(
                  gblProjectHeaderData,
                  Blank()
              );
              UpdateContext({locProjectDelitionDialog: false});
              If(
                  gblAppStarted,
                  Select(but_Main_Project_Overview_Context_Filter_Apply)
              );
            Title: ="Delete project?"
            Visible: =locProjectDelitionDialog
            Width: =Parent.Width
