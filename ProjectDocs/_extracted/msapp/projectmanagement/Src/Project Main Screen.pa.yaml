Screens:
  Project Main Screen:
    Properties:
      Fill: =gblAppColors.Screen.Fill
      LoadingSpinner: =If(locRefreshOverviewList, LoadingSpinner.None, LoadingSpinner.Data)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =Clear(colProjectManagersPreSelected);

            UpdateContext(
                {
                    locProjectDelitionDialog: false,
                    locRefreshOverviewList: false
                }
            );
            If(
                gblAppStarted,
                Select(but_Main_Project_Overview_Context_Filter_Apply)
            );
            ClearCollect(
                colReportViewers,
                Table(
                    {Mail: "alexander.pilevski@vsb.energy"},
                    {Mail: "andreas.laeubli@vsb.energy"},
                    {Mail: "andriy.chevychalov@vsb.energy"},
                    {Mail: "dominik.simon@vsb.energy"},
                    {Mail: "christoph.sperling@vsb.energy"},
                    {Mail: "thomas.lorenz@vsb.energy"},
                    {Mail: "benjamin.goepfert@vsb.energy"},
                    {Mail: "ravindra.mund@vsb.energy"},
                    {Mail: "test-vsbcloud-01@vsb.energy"},
                    {Mail: "test-vsbcloud-02@vsb.energy"}
                )
            )
