                  - con_Main_Project_Overview_Header_SuitBar:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Height: =Parent.Height
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =6
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =50
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_Main_Project_Overview_Header_SuitBar_CommandBar:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.CommandBar
                            Properties:
                              Height: =Parent.Height/2
                              Items: |-
                                =With(
                                    {
                                        varCanEdit: If(
                                            IsBlank(
                                                LookUp(
                                                    Projects,
                                                    ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                )
                                            ),
                                            false,
                                            And(
                                                DataSourceInfo(
                                                    Projects,
                                                    DataSourceInfo.CreatePermission
                                                ),
                                                Coalesce(
                                                    RecordInfo(
                                                        LookUp(
                                                            Projects,
                                                            ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                        ),
                                                        RecordInfo.EditPermission
                                                    ),
                                                    false
                                                )
                                            )
                                        )
                                    },
                                    Table(
                                        {
                                            ItemKey: "addProject",
                                            ItemDisplayName: "Add Project",
                                            ItemIconName: "Add",
                                            ItemEnabled: DataSourceInfo(
                                                Projects,
                                                DataSourceInfo.CreatePermission
                                            )
                                        },
                                        {
                                            ItemKey: "editProject",
                                            ItemDisplayName: If(
                                                IsBlank(locDetailsListRowKey),
                                                "Edit Project",
                                                If(
                                                    varCanEdit,
                                                    "Edit Project",
                                                    "View Project"
                                                )
                                            ),
                                            ItemIconName: If(
                                                IsBlank(locDetailsListRowKey),
                                                "Edit",
                                                If(
                                                    varCanEdit,
                                                    "Edit",
                                                    "ReadingMode"
                                                )
                                            ),
                                            ItemEnabled: Not(IsBlank(locDetailsListRowKey))
                                        },
                                        {
                                            ItemKey: "editCosts",
                                            ItemDisplayName: If(
                                                IsBlank(locDetailsListRowKey),
                                                "Edit Costs",
                                                If(
                                                    varCanEdit,
                                                    "Edit Costs",
                                                    "View Costs"
                                                )
                                            ),
                                            ItemIconName: If(
                                                IsBlank(locDetailsListRowKey),
                                                "Edit",
                                                If(
                                                    varCanEdit,
                                                    "Edit",
                                                    "ReadingMode"
                                                )
                                            ),
                                            ItemEnabled: !IsBlank(locDetailsListRowKey)/*,
                                            ItemIconColor: If(
                                                Or(
                                                    gblRecordSelectedProject.'Cluster State'.Name = "Draft",
                                                    IsBlank(gblRecordSelectedProject)
                                                ),
                                                "#8FBCE4",
                                                "#006EB9"
                                            )*/
                                /*,
                                            ItemVisible: Or(
                                                gblEnvironmentName in [
                                                    "Dev",
                                                    "Nightly",
                                                    "QA"
                                                ],
                                                User().Email in varUserCanEditCost
                                            )*/
                                        },
                                        {
                                            ItemKey: "deleteProject",
                                            ItemDisplayName: "Delete Project",
                                            ItemIconName: "Delete",
                                            ItemEnabled: With(
                                                {
                                                    varProjectRecord: LookUp(
                                                        Projects,
                                                        ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                    )
                                                },
                                                And(
                                                    Not(IsBlank(locDetailsListRowKey)),
                                                    RecordInfo(
                                                        varProjectRecord,
                                                        RecordInfo.EditPermission
                                                    ),
                                                    varProjectRecord.'Approval States' <> 'Approval States'.Approved
                                                )
                                            )
                                        },
                                        {
                                            ItemKey: "simulateProject",
                                            ItemDisplayName: "Simulate",
                                            ItemIconName: "Play",
                                            ItemEnabled: With(
                                                {
                                                    varProjectRecord: LookUp(
                                                        Projects,
                                                        ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                    )
                                                },
                                                And(
                                                    Not(IsBlank(locDetailsListRowKey)),
                                                    RecordInfo(
                                                        varProjectRecord,
                                                        RecordInfo.EditPermission
                                                    ),
                                                    varProjectRecord.'Cluster State'.Order > 0
                                                )
                                            ),
                                            ItemVisible: User().Email in colAnalyticsAppUsers
                                        },
                                        {
                                            ItemKey: "ViewSharepoint",
                                            ItemDisplayName: "View Sharepoint Site",
                                            ItemIconName: "View",
                                            ItemEnabled: With(
                                                {
                                                    varProjectRecord: LookUp(
                                                        Projects,
                                                        ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                    )
                                                },
                                                And(
                                                    Not(IsBlank(locDetailsListRowKey)),
                                                    Not(IsBlank(varProjectRecord.'SPO Sharepoint URL')),
                                                    Not(IsBlank(varProjectRecord.'SPO Teams URL'))
                                                )
                                            ),
                                            ItemVisible: With(
                                                {
                                                    varProjectRecord: LookUp(
                                                        Projects,
                                                        ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                    )
                                                },
                                                varProjectRecord.Country.Name = "Croatia"
                                            )
                                        }
                                            /*,
                                            ItemVisible: gblEnvironmentName in [
                                                "Dev",
                                                "Nightly",
                                                "QA"
                                            ]*/
                                ,
                                        {
                                            ItemKey: "ViewTeams",
                                            ItemDisplayName: "View Teams",
                                            ItemIconName: "View",
                                            ItemEnabled: With(
                                                {
                                                    varProjectRecord: LookUp(
                                                        Projects,
                                                        ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                    )
                                                },
                                                And(
                                                    Not(IsBlank(locDetailsListRowKey)),
                                                    Not(IsBlank(varProjectRecord.'SPO Sharepoint URL')),
                                                    Not(IsBlank(varProjectRecord.'SPO Teams URL'))
                                                )
                                            ),
                                            ItemVisible: With(
                                                {
                                                    varProjectRecord: LookUp(
                                                        Projects,
                                                        ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)
                                                    )
                                                },
                                                varProjectRecord.Country.Name = "Croatia"
                                            )
                                            /*,
                                            ItemVisible: gblEnvironmentName in [
                                                "Dev",
                                                "Nightly",
                                                "QA"
                                            ]*/
                                        },
                                        {
                                            ItemKey: "viewProjectOverviewPowerBI",
                                            ItemDisplayName: "Show Project Overview (Beta)",
                                            ItemIconName: "View",
                                            ItemVisible: CountIf(
                                                Filter(
                                                    colReportViewers,
                                                    ThisRecord.Mail = gblCurrentUser.Mail
                                                ),
                                                true
                                            ) > 0,
                                            ItemEnabled: Not(IsBlank(locDetailsListRowKey))
                                        },
                                        {
                                            ItemKey: "viewPortfolioOverviewPowerBI",
                                            ItemDisplayName: "Show Portfolio Overview (Beta)",
                                            ItemIconName: "View",
                                            ItemVisible: CountIf(
                                                Filter(
                                                    colReportViewers,
                                                    ThisRecord.Mail = gblCurrentUser.Mail
                                                ),
                                                true
                                            ) > 0
                                        },
                                        {
                                            ItemKey: "viewDashboardFunctionality",
                                            ItemDisplayName: "Dashboard",
                                            ItemIconName: "BIDashboard",
                                            ItemVisible: true
                                        }
                                    )
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: "=If(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"addProject\",\n    Set(\n        gblRecordSelectedProject,\n        Blank()\n    );\n    Set(\n        gblProjectHeaderData,\n        Blank()\n    );\n    Set(\n        gblReportError,\n        Blank()\n    );\n    Set(\n        gblLeftNavigationSelected,\n        LookUp(\n            LeftNavigationMenu,\n            ItemKey = \"GeneralDataCommonKey\"\n        )\n    );\n    Navigate(\n        'Project General Data Screen',\n        ScreenTransition.Fade\n    );\n    \n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"editProject\",\n    Trace($\"OnSelect MainCommandBar: {psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid}\");\n    Set(\n        gblRecordSelectedProject,\n        LookUp(\n            Projects,\n            ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n        )\n    );\n    If(\n        gblProduction,\n        Launch(\n            gblPMAppURL,\n            {projectid: GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)}\n        ),\n        Set(\n            gblRecordSelectedProjectCountry,\n            LookUp(\n                Countries,\n                Country = gblRecordSelectedProject.Country.Country\n            )\n        );\n        Set(\n            gblCurrentUser,\n            Patch(\n                gblCurrentUser,\n                {\n                    CanEditSelectedProject: And(\n                        DataSourceInfo(\n                            Projects,\n                            DataSourceInfo.CreatePermission\n                        ),\n                        Coalesce(\n                            RecordInfo(\n                                gblRecordSelectedProject,\n                                RecordInfo.EditPermission\n                            ),\n                            false\n                        )\n                    )\n                }\n            )\n        );\n        Set(\n            gblProjectHeaderData,\n            {\n                ID: gblRecordSelectedProject.Project,\n                Name: gblRecordSelectedProject.'Project Name',\n                Technology: Text(gblRecordSelectedProject.Technology),\n                Capacity: gblRecordSelectedProject.'Plant WTG Capacity [MW]',\n                Status: LookUp(\n                    'Project States',\n                    ThisRecord.'Project State' = gblRecordSelectedProject.'Cluster State'.'Project State'\n                ).Name,\n                Approval: Text(gblRecordSelectedProject.'Approval States')\n            }\n        );\n        Set(\n            gblLeftNavigationSelected,\n            LookUp(\n                LeftNavigationMenu,\n                ThisRecord.ItemKey = \"GeneralDataCommonKey\"\n            )\n        );\n        Navigate(\n            'Project General Data Screen',\n            ScreenTransition.Fade,\n            {locGeneralDataTabSelected: \"generalDataTab\"}\n        )\n    );\n    \n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"editCosts\",\n    If(\n        With(\n            {\n                varProjectRecord: LookUp(\n                    Projects,\n                    ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n                )\n            },\n            varProjectRecord.'Cluster State'.Name = \"Draft\"\n        ),\n        UpdateContext({locPreventEditCostPopUp: true}),\n        Set(\n            gblRecordSelectedProject,\n            LookUp(\n                Projects,\n                ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n            )\n        );\n        Launch(\n            gblCostAppLaunchUrl,\n            {projectId: GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)}\n        )\n    )\n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"deleteProject\",\n    UpdateContext({locProjectDelitionDialog: true});\n    Set(\n        gblRecordSelectedProject,\n        First(\n            Filter(\n                Projects,\n                ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n            )\n        )\n    );\n    Set(\n        gblProjectHeaderData,\n        {\n            ID: gblRecordSelectedProject.Project,\n            Name: gblRecordSelectedProject.'Project Name',\n            Technology: Text(gblRecordSelectedProject.Technology),\n            Capacity: gblRecordSelectedProject.'Plant WTG Capacity [MW]',\n            Status: gblRecordSelectedProject.'Cluster State'.Name,\n            Approval: Text(gblRecordSelectedProject.'Approval States')\n        }\n    );\n    Refresh(Projects);\n    Set(\n        gblRecordSelectedProjectCountry,\n        Blank()\n    );\n    \n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"viewProjectOverviewPowerBI\",\n    Set(\n        gblRecordSelectedProject,\n        LookUp(\n            Projects,\n            ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n        )\n    );\n    Launch($\"https://app.powerbi.com/reportEmbed?reportId={gblProjectOverviewPowerBIReportID}&autoAuth=true&ctid={gblPowerBITenantID}&filter=Project/id eq '{gblRecordSelectedProject.Project}'&navContentPaneEnabled=false\")\n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"viewPortfolioOverviewPowerBI\",\n    Set(\n        gblRecordSelectedProject,\n        LookUp(\n            Projects,\n            ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n        )\n    );\n    Launch($\"https://app.powerbi.com/reportEmbed?reportId={gblPortfolioOverviewPowerBIReportID}&autoAuth=true&ctid={gblPowerBITenantID}&navContentPaneEnabled=false\")\n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"ViewSharepoint\",\n    Set(\n        gblRecordSelectedProject,\n        LookUp(\n            Projects,\n            ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n        )\n    );\n    If(\n        IsBlank(gblRecordSelectedProject.'SPO Sharepoint URL'),\n        Notify(\"For this Project, No Sharepoint site is available.\"),\n        Launch(gblRecordSelectedProject.'SPO Sharepoint URL')\n    )\n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"ViewTeams\",\n    Set(\n        gblRecordSelectedProject,\n        LookUp(\n            Projects,\n            ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n        )\n    );\n    If(\n        IsBlank(gblRecordSelectedProject.'SPO Teams URL'),\n        Notify(\"For this Project, No Teams channel is available.\"),\n        Launch(gblRecordSelectedProject.'SPO Teams URL')\n    )\n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"viewDashboardFunctionality\",\n    Launch(gblPowerBIDashboardLink)\n);\nIf(\n    !IsBlank(Self.Selected.ItemKey) && Self.Selected.ItemKey = \"simulateProject\",\n    If(\n        With(\n            {\n                varProjectRecord: LookUp(\n                    Projects,\n                    ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n                )\n            },\n            varProjectRecord.'Cluster State'.Name = \"Draft\"\n        ),\n        UpdateContext({locPreventEditCostPopUp: true}),\n        Set(\n            gblRecordSelectedProject,\n            LookUp(\n                Projects,\n                ThisRecord.Project = GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)\n            )\n        );\n        Launch(\n            gblAnalyticsAppLaunchUrl,\n            {projectId: GUID(psf_MainScreen_DetailList_Container_FluentDetailsList.Selected.vsb_projectid)}\n        )\n    )\n);\n"
                              Theme: =gblCommandBarSurfaceThemeJson
