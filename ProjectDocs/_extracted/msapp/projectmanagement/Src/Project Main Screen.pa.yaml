                                  Children:
                                    - but_Main_Project_Overview_Context_Filter_Apply:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Apply Filter"
                                          OnSelect: "=\n//Optimized Version\nUpdateContext(\n    {\n        locRefreshOverviewList: true,\n        locFilterValues: LookUp(\n            colFiltersOverview,\n            true\n        )\n    }\n);\nWith(\n    {\n        \n        baseFiltered: Filter(\n            Projects,\n            And(\n                Or(\n                    IsBlank(locFilterValues.ProjectManager),\n                    ThisRecord.'Project Manager'.Id = GUID(locFilterValues.ProjectManager.PersonaKey)\n                ),\n                Or(\n                    IsBlank(locFilterValues.Country),\n                    ThisRecord.Country.Country = locFilterValues.Country.Country\n                ),\n                Or(\n                    IsBlank(locFilterValues.Area),\n                    ThisRecord.'Area/State/Province'.Name = locFilterValues.Area.Name\n                ),\n                Or(\n                    IsBlank(locFilterValues.Technology),\n                    ThisRecord.Technology = locFilterValues.Technology.Value\n                ),\n                Or(\n                    IsBlank(locFilterValues.ProjectStatus),\n                    ThisRecord.'Cluster State'.'Project State' = locFilterValues.ProjectStatus.'Project State'\n                )\n            )\n        )\n    },\n    With(\n        {\n            keywordFiltered: If(\n                Or(\n                    IsBlank(locFilterValues.ProjectKeyword),\n                    Len(locFilterValues.ProjectKeyword) < 3\n                ),\n                baseFiltered,\n                Filter(\n                    baseFiltered,\n                    Or(\n                        locFilterValues.ProjectKeyword in ThisRecord.'Project Name',\n                        locFilterValues.ProjectKeyword in ThisRecord.'Project ID',\n                        locFilterValues.ProjectKeyword in ThisRecord.'Internal Project ID',\n                        locFilterValues.ProjectKeyword in ThisRecord.'Short Name'\n                    )\n                )\n            )\n        },\n        ClearCollect(\n            colFilteredProjects,\n            If(\n                IsBlank(locFilterValues.Capacity),\n                keywordFiltered,\n                If(\n                    locFilterValues.CapacityOperator = gblAppConstants.FilterOperators.Equals,\n                    Filter(\n                        keywordFiltered,\n                        ThisRecord.'Total Capacity' = Value(locFilterValues.Capacity)\n                    ),\n                    If(\n                        locFilterValues.CapacityOperator = gblAppConstants.FilterOperators.GreaterThan,\n                        Filter(\n                            keywordFiltered,\n                            ThisRecord.'Total Capacity' > Value(locFilterValues.Capacity)\n                        ),\n                        If(\n                            locFilterValues.CapacityOperator = gblAppConstants.FilterOperators.GreaterThanOrEqualTo,\n                            Filter(\n                                keywordFiltered,\n                                ThisRecord.'Total Capacity' >= Value(locFilterValues.Capacity)\n                            ),\n                            If(\n                                locFilterValues.CapacityOperator = gblAppConstants.FilterOperators.LessThan,\n                                Filter(\n                                    keywordFiltered,\n                                    ThisRecord.'Total Capacity' < Value(locFilterValues.Capacity)\n                                ),\n                                If(\n                                    locFilterValues.CapacityOperator = gblAppConstants.FilterOperators.LessThanOrEqualsTo,\n                                    Filter(\n                                        keywordFiltered,\n                                        ThisRecord.'Total Capacity' <= Value(locFilterValues.Capacity)\n                                    ),\n                                    keywordFiltered// Default case\n                                )\n                            )\n                        )\n                    )\n                )\n            )\n        )\n    )\n);\nWith(\n    {\n        totalRows: CountRows(colFilteredProjects),\n        currentPage: locFilterValues.Page,\n        pageSize: Coalesce(locFilterValues.PageSize,1)\n    },\n    With(\n        {\n            calculatedTotalPages: RoundUp(\n                totalRows / pageSize,\n                0\n            ) + If(\n                totalRows = 0,\n                1,\n                0\n            ),\n            adjustedPage: If(\n                currentPage > Value(\n                    RoundUp(\n                        totalRows / pageSize,\n                        0\n                    ) + If(\n                        totalRows = 0,\n                        1,\n                        0\n                    )\n                ),\n                1,\n                currentPage\n            )\n        },\n        UpdateIf(\n            colFiltersOverview,\n            true,\n            {\n                TotalRows: totalRows,\n                TotalPages: calculatedTotalPages,\n                Page: adjustedPage\n            }\n        )\n    )\n);\nUpdateContext({locRefreshOverviewList: false});\n"
