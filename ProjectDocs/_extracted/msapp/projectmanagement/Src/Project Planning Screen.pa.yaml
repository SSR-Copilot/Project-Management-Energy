                            Children:
                              - pcf_ProjectPlanning_DisplayProjectBodyRightContent_ButtonsSave:
                                  Control: CodeComponent
                                  ComponentName: cat_PowerCAT.Icon
                                  Properties:
                                    AccessibilityLabel: ="pcf_ProjectPlanning_DisplayProjectBodyRightContent_ButtonsSave"
                                    DisplayMode: |-
                                      =If(
                                          And(
                                              gblCurrentUser.CanEditSelectedProject,
                                              gblRecordSelectedProject.'Cluster State'.Name <> "Draft",
                                              CountRows(
                                                  Filter(
                                                      colPlanningFormValidation,
                                                      Valid = false
                                                  )
                                              ) = 0,
                                              CountRows(
                                                  Filter(
                                                      colPlanningFormValidation,
                                                      Dirty = true
                                                  )
                                              ) > 0,
                                              !lbl_HeightLimit_ErrorMsg_ProjectPlanning.Visible,
                                              If(tgl_HeightLimitation_ProjectPlanning.Checked, !IsBlank(txt_HeightLimit_ProjectPlanning.Value),true),
                                              !con_Milestones_Page_LockMessage_5.Visible
                                          ),
                                          DisplayMode.Edit,
                                          DisplayMode.Disabled
                                      )
                                    FillColor: =gblAppTheme.palette.themePrimary
                                    FontColor: =gblAppTheme.palette.white
                                    Height: =32
                                    HoverFillColor: =gblAppTheme.palette.hoverButton
                                    HoverFontColor: =gblAppTheme.palette.themePrimary
                                    HoverIconColor: =gblAppTheme.palette.themePrimary
                                    IconColor: |-
                                      =If(
                                          Self.DisplayMode = DisplayMode.Disabled,
                                          gblAppTheme.palette.black,
                                          gblAppTheme.palette.white
                                      )
                                    IconName: ="CheckMark"
                                    IconType: ='PowerCAT.Icon.IconType'.ActionButton
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnChange: |
                                      =UpdateContext(
                                          {
                                              locIsVisiblePlanningLongOperationProcessingDialog: true,
                                              locPlanningLongOperationProcessingDialogText: $"Project Planning will be saved, please wait..."
                                          }
                                      );
                                      IfError(
                                          Set(
                                              gblRecordProjectPlanning,
                                              Patch(
                                                  'Project Plannings',
                                                  If(
                                                      IsBlank(gblRecordProjectPlanning),
                                                      Defaults('Project Plannings'),
                                                      gblRecordProjectPlanning
                                                  ),
                                                  {
                                                      Project: gblRecordSelectedProject,
                                                      Name: gblRecordSelectedProject.'Project Name',
                                                      Cooperation: drp_ProjectPlanning_DisplayProjectBodyRightContent_Cooperation.Selected.Value,
                                                      'Cooperation Partner': txt_ProjectPlanning_DisplayProjectBodyRightContent_CooperationPartner.Value,
                                                      'Cooperation Details': txt_ProjectPlanning_DisplayProjectBodyRightContent_CooperationDetails.Value,
                                                      'Legal Planning': LookUp(
                                                          'Custom Choice Values',
                                                          'Custom Choice Value' = drp_ProjectPlanning_DisplayProjectBodyRightContent_LegalPlanningBasis.Selected.vsb_customchoicevalueid
                                                      ),
                                                      'Planning Basis Category': drp_ProjectPlanning_DisplayProjectBodyRightContent_PlanningBasisCategory.Selected.Value,
                                                      'Permit Procedure': LookUp(
                                                          'Custom Choice Values',
                                                          'Custom Choice Value' = drp_ProjectPlanning_DisplayProjectBodyRightContent_PermitProcedure.Selected.vsb_customchoicevalueid
                                                      ),
                                                      'Planning Basis Details': txt_ProjectPlanning_DisplayProjectBodyRightContent_PlanningBasisDetails.Value,
                                                      Repowering: drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering.Selected.Value,
                                                      'Secured Access': If(
                                                          drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering.Selected.Value = Repowering.No,
                                                          Blank(),
                                                          txt_ProjectPlanning_DisplayProjectBodyRightContent_SecuredAccess.Value
                                                      ),
                                                      'Repowering Details': If(
                                                          drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering.Selected.Value = Repowering.No,
                                                          Blank(),
                                                          txt_ProjectPlanning_DisplayProjectBodyRightContent_RepoweringDetails.Value
                                                      ),
                                                      'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)', 
                                                      'Is Height Limitation For WTG': tgl_HeightLimitation_ProjectPlanning.Checked, 
                                                      'Height limitation [m]': If(tgl_HeightLimitation_ProjectPlanning.Checked,Value(txt_HeightLimit_ProjectPlanning.Value), Blank())
                                                  }
                                              )
                                          );
                                          Notify(
                                              "Project Planning data was successfully saved!",
                                              NotificationType.Success,
                                              1000
                                          ),
                                          Notify(
                                              "Error: Project Planning could not be saved. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse,
                                              NotificationType.Error
                                          )
                                      );
                                      /*
                                      IfError(
                                          ClearCollect(
                                              colPermits,
                                              ForAll(
                                                  colPermits As Candidate,
                                                  Patch(
                                                      Permits,
                                                      If(
                                                          IsBlank(
                                                              LookUp(
                                                                  Permits,
                                                                  Permit = Candidate.Permit
                                                              )
                                                          ),
                                                          Defaults(Permits),
                                                          LookUp(
                                                              Permits,
                                                              Permit = Candidate.Permit
                                                          )
                                                      ),
                                                      {
                                                          'Project Planning': gblRecordProjectPlanning,
                                                          Name: Candidate.Name,
                                                          'Submission Date': Candidate.'Submission Date',
                                                          'Submission Date Type': Candidate.'Submission Date Type',
                                                          'Approval Date': Candidate.'Approval Date',
                                                          'Approval Date Type': Candidate.'Approval Date Type',
                                                          'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                      }
                                                  )
                                              )
                                          ),
                                          Notify(
                                              "Error: Permits could not be saved. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse,
                                              NotificationType.Error
                                          )
                                      );

                                      IfError(
                                          ClearCollect(
                                              colAquisitionStatusesUnderLaw,
                                              ForAll(
                                                  colAquisitionStatusesUnderLaw As Candidate,
                                                  Patch(
                                                      'Aquisition Statuses',
                                                      If(
                                                          IsBlank(
                                                              LookUp(
                                                                  'Aquisition Statuses',
                                                                  Name = Candidate.Name
                                                              )
                                                          ),
                                                          Defaults('Aquisition Statuses'),
                                                          LookUp(
                                                              'Aquisition Statuses',
                                                              Name = Candidate.Name
                                                          )
                                                      ),
                                                      {
                                                          Project: Candidate.Project,
                                                          'Aquisition Status Type': Candidate.'Aquisition Status Type',
                                                          Required: Candidate.Required,
                                                          Secured: Candidate.Secured,
                                                          'Aquisition Status [%]': Candidate.'Aquisition Status [%]',
                                                          'Owning Business Unit': Candidate.Project.'Besitzer (Unternehmenseinheit)'
                                                      }
                                                  )
                                              )
                                          ),
                                          Notify(
                                              "Error: Aquisition Status could not be saved. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse,
                                              NotificationType.Error
                                          )
                                      );
                                      IfError(
                                          ClearCollect(
                                              colAquisitionStatusesInRem,
                                              ForAll(
                                                  colAquisitionStatusesInRem As CandidateInRem,
                                                  Patch(
                                                      'Aquisition Statuses',
                                                      If(
                                                          IsBlank(
                                                              LookUp(
                                                                  'Aquisition Statuses',
                                                                  Name = CandidateInRem.Name
                                                              )
                                                          ),
                                                          Defaults('Aquisition Statuses'),
                                                          LookUp(
                                                              'Aquisition Statuses',
                                                              Name = CandidateInRem.Name
                                                          )
                                                      ),
                                                      {
                                                          Project: CandidateInRem.Project,
                                                          'Aquisition Status Type': CandidateInRem.'Aquisition Status Type',
                                                          Required: CandidateInRem.Required,
                                                          Secured: CandidateInRem.Secured,
                                                          'Aquisition Status [%]': CandidateInRem.'Aquisition Status [%]',
                                                          'Owning Business Unit': CandidateInRem.Project.'Besitzer (Unternehmenseinheit)'
                                                      }
                                                  )
                                              )
                                          ),
                                          Notify(
                                              "Error: Aquisition Status could not be saved. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse,
                                              NotificationType.Error
                                          )
                                      );*/

                                      Concurrent(
                                          ClearCollect(
                                              colAquisitionStatusesUnderLaw,
                                              SortByColumns(
                                                  AddColumns(
                                                      Filter(
                                                          'Aquisition Statuses',
                                                          And(
                                                              Project.Project = gblRecordSelectedProject.Project,
                                                              'Aquisition Status Type'.Type = gblAppConstants.AquisitionStatus.UnderLawOfObligationId
                                                          )
                                                      ),
                                                      Order,
                                                      'Aquisition Status Type'.Order
                                                  ),
                                                  "Order"
                                              )
                                          ),
                                          ClearCollect(
                                              colAquisitionStatusesInRem,
                                              SortByColumns(
                                                  AddColumns(
                                                      Filter(
                                                          'Aquisition Statuses',
                                                          And(
                                                              Project.Project = gblRecordSelectedProject.Project,
                                                              'Aquisition Status Type'.Type = gblAppConstants.AquisitionStatus.InRemId
                                                          )
                                                      ),
                                                      Order,
                                                      'Aquisition Status Type'.Order
                                                  ),
                                                  "Order"
                                              )
                                          ),
                                          ClearCollect(
                                              colPermits,
                                              Filter(
                                                  Permits,
                                                  'Project Planning'.'Project Planning' = gblRecordProjectPlanning.'Project Planning'
                                              )
                                          )
                                      );
                                      UpdateIf(
                                          colPlanningFormValidation,
                                          true,
                                          {
                                              Valid: true,
                                              Dirty: false
                                          }
                                      );
                                      UpdateContext(
                                          {
                                              locIsVisiblePlanningLongOperationProcessingDialog: false,
                                              locPlanningLongOperationProcessingDialogText: Blank(),
                                              locAllowPlanningReset: false
                                          }
                                      );
                                    Text: ="Save"
                                    TextAlignment: ='PowerCAT.Icon.TextAlignment'.Center
                                    Theme: =gblAppThemeJson
                                    Tooltip: ="Save Planning data"
                                    Width: =96
                                    X: =Parent.Width - 35
