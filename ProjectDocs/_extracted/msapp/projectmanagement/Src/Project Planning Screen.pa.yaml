                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              HoverIconColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.themePrimary
                                )
                              IconName: ="Cancel"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              OnChange: |
                                =UpdateContext(
                                    {
                                        locIsVisibleRightPanelNewEditPermit: false,
                                        locSelectedPermit: Blank()
                                    }
                                );
                                Reset(txt_ProjectPlanning_RightPanel_NewEditPermitBodyContent_Name);
                                Reset(dte_ProjectPlanning_RightPanel_NewEditPermitBodyContent_SubmissionDate);
                                Reset(rad_ProjectPlanning_RightPanel_NewEditPermitBodyContent_SubmissionDateType);
                                Reset(dte_ProjectPlanning_RightPanel_NewEditPermitBodyContent_ApprovalDate);
                                Reset(rad_ProjectPlanning_RightPanel_NewEditPermitBodyContent_ApprovalDateType);
                              Text: ="Cancel"
                              Theme: =gblAppThemeJson
                              Tooltip: ="Cancel"
                              Width: =96
                              X: =Parent.Width-Self.Width-20
                              Y: =Parent.Height/2-Self.Height/2
      - cmp_ProjectPlanning_PopUp_ConfirmationDeletePermit:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Delete"
            Description: ="Are you sure that you want to delete permit " & locSelectedPermit.Name & "?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="Trash"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpConfirmationDeletePermit: false});
            OnConfirm: |-
              =IfError(
                  Remove(Permits, locSelectedPermit);
                  Remove(colPermits, locSelectedPermit);
                  Notify("Permit deleted.", NotificationType.Success, 2000),
                  Notify("Error: Permit could not be deleted. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse, NotificationType.Error)
              );

              UpdateContext({
                  locSelectedPermit: Blank(),
                  locIsVisiblePopUpConfirmationDeletePermit: false
              });
            Title: ="Delete permit?"
            Visible: =locIsVisiblePopUpConfirmationDeletePermit
            Width: =Parent.Width
      - cmp_ReportErrorRightPanel_ProjectPlanning:
          Control: CanvasComponent
          ComponentName: cmp_ReportErrorRightPanel
          Properties:
            Height: =Parent.Height
            Visible: =gblShowReportProblemPanel
            Width: =Parent.Width
      - cmp_PopUp_Leave_Planning_Confirmation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Yes"
            Description: ="You have unsaved data. Do you really want to leave current form without saving?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locLeavePlanningConfirmationDialog: false});
            OnConfirm: |
              =UpdateContext({locLeavePlanningConfirmationDialog: false});
              If(
                  CountRows(
                      Filter(
                          colPlanningFormValidation,
                          Dirty = true
                      )
                  ) > 0,
                  If(
                      cmp_ProjectPlanning_Left_Navigation.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                      Set(
                          gblLeftNavigationSelected,
                          LookUp(
                              LeftNavigationMenu,
                              ItemKey = cmp_ProjectPlanning_Left_Navigation.SelectedKey
                          )
                      );
                      Navigate(gblLeftNavigationSelected.TargetScreen),
                      Navigate(
                          'Project Main Screen',
                          ScreenTransition.Fade
                      )
                  )
              );
            Title: ="Unsaved data"
            Visible: =locLeavePlanningConfirmationDialog
            Width: =Parent.Width
      - cmp_PopUp_Loading_Planning_Screen:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Loading
          Properties:
            Height: =Parent.Height
            InformationText: =locPlanningLongOperationProcessingDialogText
            Visible: =locIsVisiblePlanningLongOperationProcessingDialog
            Width: =Parent.Width
