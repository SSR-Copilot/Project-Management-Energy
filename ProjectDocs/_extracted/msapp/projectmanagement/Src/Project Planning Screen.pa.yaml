Screens:
  Project Planning Screen:
    Properties:
      Fill: |-
        =RGBA(
            255,
            255,
            255,
            1
        )
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: |
        =Concurrent(
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_Cooperation),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_CooperationPartner),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_CooperationDetails),
            Reset(tgl_HeightLimitation_ProjectPlanning);
            Reset(txt_HeightLimit_ProjectPlanning);
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_LegalPlanningBasis),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_PlanningBasisCategory),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_PermitProcedure),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_PlanningBasisDetails),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_SecuredAccess),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_RepoweringDetails)
        );
        Set(
            gblRecordProjectPlanning,
            Blank()
        );
        ClearCollect(
            colPlanningFormValidation,
            Blank()
        );
        Clear(colPermits);
      OnVisible: |-
        =UpdateContext(
            {
                locIsVisiblePlanningLongOperationProcessingDialog: true,
                locPlanningLongOperationProcessingDialogText: "Loading, Please wait..."
            }
        );Set(
            gblRecordSelectedProject,
            LookUp(
                Projects,
                ThisRecord.Project = gblRecordSelectedProject.Project
            )
        );
        Set(
                        gblCurrentUser,
                        Patch(
                            gblCurrentUser,
                            {
                                CanEditSelectedProject: And(
                                    DataSourceInfo(
                                        Projects,
                                        DataSourceInfo.CreatePermission
                                    ),
                                    Coalesce(
                                        RecordInfo(
                                            gblRecordSelectedProject,
                                            RecordInfo.EditPermission
                                        ),
                                        false
                                    )
                                )
                            }
                        )
                    );
        Set(
            gblRecordProjectPlanning,
            LookUp(
                'Project Plannings',
                Project.Project = gblRecordSelectedProject.Project
            )
        );
        If(
            IsBlank(gblRecordProjectPlanning),
            Set(
                gblRecordProjectPlanning,
                Patch(
                    'Project Plannings',
                    Defaults('Project Plannings'),
                    {
                        Project: gblRecordSelectedProject,
                        Name: gblRecordSelectedProject.'Project Name','Owning Business Unit':gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                    }
                )
            )
        );
        If(
            IsBlank(gblRecordProjectPlanning),
            Trace(
                $"Warning: Project Planning record was not loaded. Project {gblRecordSelectedProject.'Project Name'}:={gblRecordSelectedProject.Project} ",
                TraceSeverity.Information
            )
        );
        UpdateContext(
            {
                locTabList: [
                    "General",
                    "Repowering",
                    "Aquisition Status"
                ]
            }
        );
        UpdateContext(
            {
                locAllowPlanningReset: true,
                locSelectedTab: First(locTabList),
                locSelectedPermit: Blank(),
                locIsVisibleRightPanelNewEditPermit: false,
                locIsVisiblePopUpConfirmationDeletePermit: false,
                locAquisitionStatusEntity: Blank(),
                locIsVisibleRightPanelAquisitionStatus: false,
                locLeavePlanningConfirmationDialog: false,
                locIsVisiblePlanningLongOperationProcessingDialog: false,
                locPlanningLongOperationProcessingDialogText: ""
            }
        );
        ClearCollect(
            colPermits,
            Filter(
                Permits,
                'Project Planning'.'Project Planning' = gblRecordProjectPlanning.'Project Planning'
            )
        );
        Collect(
            colAquisitionStatusesUnderLawTypes,
            Blank()
        );
        Collect(
            colAquisitionStatusesInRemTypes,
            Blank()
        );
        Concurrent(
            ClearCollect(
                colAquisitionStatusesUnderLawTypes,
                Sort(
                    Filter(
                        'Aquisition Types',
                        Type = gblAppConstants.AquisitionStatus.UnderLawOfObligationId
                    ),
                    Order
                )
            ),
            ClearCollect(
                colAquisitionStatusesInRemTypes,
                Sort(
                    Filter(
                        'Aquisition Types',
                        Type = gblAppConstants.AquisitionStatus.InRemId
                    ),
                    Order
                )
            )
        );
        Concurrent(
            ClearCollect(
                colAquisitionStatusesUnderLaw,
                SortByColumns(
                    AddColumns(
                        Filter(
                            'Aquisition Statuses',
                            And(
                                Project.Project = gblRecordSelectedProject.Project,
                                'Aquisition Status Type'.Type = gblAppConstants.AquisitionStatus.UnderLawOfObligationId
                            )
                        ),
                        Order,
                        'Aquisition Status Type'.Order
                    ),
                    "Order"
                )
            ),
            ClearCollect(
                colAquisitionStatusesInRem,
                SortByColumns(
                    AddColumns(
                        Filter(
                            'Aquisition Statuses',
                            And(
                                Project.Project = gblRecordSelectedProject.Project,
                                'Aquisition Status Type'.Type = gblAppConstants.AquisitionStatus.InRemId
                            )
                        ),
                        Order,
                        'Aquisition Status Type'.Order
                    ),
                    "Order"
                )
            )
        );
        If(
            Or(
                IsBlank(colAquisitionStatusesUnderLaw),
                IsEmpty(colAquisitionStatusesUnderLaw)
            ),
            ForAll(
                colAquisitionStatusesUnderLawTypes As UnderLaw,
                Patch(
                    'Aquisition Statuses',
                    Defaults('Aquisition Statuses'),
                    {
                        'Aquisition Status Type': UnderLaw,
                        Project: gblRecordSelectedProject,
                        Secured: Blank(),
                        Required: Blank(),
                        'Aquisition Status [%]': Blank(),'Owning Business Unit':gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                    }
                )
            );
            ClearCollect(
                colAquisitionStatusesUnderLaw,
                SortByColumns(
                    AddColumns(
                        Filter(
                            'Aquisition Statuses',
                            And(
                                Project.Project = gblRecordSelectedProject.Project,
                                'Aquisition Status Type'.Type = gblAppConstants.AquisitionStatus.UnderLawOfObligationId
                            )
                        ),
                        Order,
                        'Aquisition Status Type'.Order
                    ),
                    "Order"
                )
            )
        );
        If(
            Or(
                IsBlank(colAquisitionStatusesInRem),
                IsEmpty(colAquisitionStatusesInRem)
            ),
            ForAll(
                colAquisitionStatusesInRemTypes As InRem,
                Patch(
                    'Aquisition Statuses',
                    Defaults('Aquisition Statuses'),
                    {
                        'Aquisition Status Type': InRem,
                        Project: gblRecordSelectedProject,
                        Secured: Blank(),
                        Required: Blank(),
                        'Aquisition Status [%]': Blank(),'Owning Business Unit':gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                    }
                )
            );
            ClearCollect(
                colAquisitionStatusesInRem,
                SortByColumns(
                    AddColumns(
                        Filter(
                            'Aquisition Statuses',
                            And(
                                Project.Project = gblRecordSelectedProject.Project,
                                'Aquisition Status Type'.Type = gblAppConstants.AquisitionStatus.InRemId
                            )
                        ),
                        Order,
                        'Aquisition Status Type'.Order
                    ),
                    "Order"
                )
            )
        );
        ClearCollect(
            colPlanningFormValidation,
            Table(
                {
                    Name: "Cooperation",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "CooperationPartner",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "CooperationDetails",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "LegalPlanningBasis",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "PlanningBasisCategory",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "PermitProcedure",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "PlanningHeightLimitationWTG",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "PlanningHeightLimitation",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "PlanningBasisDetails",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "Repowering",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "SecuredAccess",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "RepoweringDetails",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "Permits",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                },
                {
                    Name: "AquisitionStatus",
                    Dirty: false,
                    Valid: true,
                    Text: ""
                }
            )
        );
        Concurrent(
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_Cooperation),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_CooperationPartner),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_CooperationDetails),
            Reset(tgl_HeightLimitation_ProjectPlanning);
            Reset(txt_HeightLimit_ProjectPlanning);
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_LegalPlanningBasis),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_PlanningBasisCategory),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_PermitProcedure),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_PlanningBasisDetails),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_SecuredAccess),
            Reset(drp_ProjectPlanning_DisplayProjectBodyRightContent_Repowering),
            Reset(txt_ProjectPlanning_DisplayProjectBodyRightContent_RepoweringDetails)
        );
        UpdateContext(
            {
                locIsVisiblePlanningLongOperationProcessingDialog: false,
                locPlanningLongOperationProcessingDialogText: ""
            }
        );
    Children:
      - con_ProjectPlanning_DisplayProject:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmp_ProjectPlanning_DisplayProjectHeader:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: =gblTableApprovalStateColors
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: ='Project Main Screen'
                  OnLogoClick: |
                    =If(
                        CountRows(
                            Filter(
                                colPlanningFormValidation,
                                Dirty = true
                            )
                        ) > 0,
                        UpdateContext({locLeavePlanningConfirmationDialog: true}),
                        Navigate(
                            'Project Main Screen',
                            ScreenTransition.Fade
                        )
                    );
                  Project: =gblProjectHeaderData
                  Width: =1024
            - con_ProjectPlanning_DisplayProjectBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ColorValue(gblAppTheme.palette.neutralLighter)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutWrap: =true
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - con_ProjectPlanning_DisplayProjectBody_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(gblLeftNavigationMenuIsExpanded, gblAppSizes.LeftNavigation.ExpandedWidth,gblAppSizes.LeftNavigation.DecreasedWidth)
                      Children:
                        - cmp_ProjectPlanning_Left_Navigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftNavigationMenu
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnExpand: |
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |
                                =If(
                                    CountRows(
                                        Filter(
                                            colPlanningFormValidation,
                                            Dirty = true
                                        )
                                    ) > 0,
                                    UpdateContext({locLeavePlanningConfirmationDialog: true}),
                                    If(
                                        Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                        Set(
                                            gblLeftNavigationSelected,
                                            LookUp(
                                                LeftNavigationMenu,
                                                ItemKey = Self.SelectedKey
                                            )
                                        );
                                        Navigate(
                                            gblLeftNavigationSelected.TargetScreen,
                                            ScreenTransition.Fade
                                        )
                                    )
                                );
                              Selected: =gblLeftNavigationSelected
                              Width: =200
                  - con_ProjectPlanning_DisplayProjectBodyRightContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_Milestones_Page_LockMessage_5:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(89, 89, 89, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    And(
                                        IsBlank(gblRecordSelectedProject.'Project ID'),
                                        IsBlank(gblRecordSelectedProject.'Project Start Date'),
                                        Or(
                                            gblRecordSelectedProject.'Total Capacity' = 0,
                                            IsBlank(gblRecordSelectedProject.'Total Capacity')
                                        ),
                                        Or(
                                            gblRecordSelectedProject.'Net Yield p50' = 0,
                                            IsBlank(gblRecordSelectedProject.'Net Yield p50')
                                        ),
                                        Or(
                                            IsBlank(gblRecordSelectedProject.'Cluster State'.Name),
                                            gblRecordSelectedProject.'Cluster State'.Name = "Draft"
                                        )
                                    ),
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.Height * 7,
                                    IsBlank(gblRecordSelectedProject.'Project Start Date'),
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.Height * 6,
                                    Or(
                                        gblRecordSelectedProject.'Total Capacity' = 0,
                                        IsBlank(gblRecordSelectedProject.'Total Capacity')
                                    ),
                                    // else / default height when none of the above conditions are true
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.Height * 5,
                                    Or(
                                        gblRecordSelectedProject.'Net Yield p50' = 0,
                                        IsBlank(gblRecordSelectedProject.'Net Yield p50')
                                    ),
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.Height * 4,
                                    Or(
                                        IsBlank(gblRecordSelectedProject.'Cluster State'.Name),
                                        gblRecordSelectedProject.'Cluster State'.Name = "Draft"
                                    ),
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.Height * 3,
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.Height
                                )
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =Parent.Width
                              LayoutMinHeight: =
                              PaddingLeft: =20
                              Visible: |-
                                =Or(
                                    IsBlank(gblRecordSelectedProject.'Project ID'),// General not completed
                                    IsBlank(gblRecordSelectedProject.'End Date'),// Milestones not completed
                                    Or(
                                        gblRecordSelectedProject.'Total Capacity' = 0,
                                        IsBlank(gblRecordSelectedProject.'Total Capacity')
                                    ),
                                    Or(
                                        gblRecordSelectedProject.'Net Yield p50' = 0,
                                        IsBlank(gblRecordSelectedProject.'Net Yield p50')
                                    ),
                                    Or(
                                        IsBlank(gblRecordSelectedProject.'Cluster State'.Name),
                                        gblRecordSelectedProject.'Cluster State'.Name = "Draft"
                                    )
                                )
                              X: =40
                              Y: =40
                            Children:
                              - icon_milestones_lock_5:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    AccessibleLabel: ="icon_milestones_lock_5"
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                    DisabledColor: =RGBA(225, 223, 221, 1)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =20
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Icon: =Icon.Lock
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(16, 110, 190, 1)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =20
                                    X: =40
                                    Y: =Parent.Height-Self.Height
                              - con_Milestones_pagelock_section_5:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMaxHeight: =
                                    LayoutMinHeight: =
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                  Children:
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =20
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          Text: ="This page is locked. To unlock it, please complete the following sections:"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          X: =icon_milestones_lock_5.Width+icon_milestones_lock_5.X+10
                                          Y: =Parent.Height-Self.Height
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_22:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.X
                                          PaddingTop: =0
                                          Text: ="• General"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: =IsBlank(gblRecordSelectedProject.'Project ID')
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_23:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.X
                                          PaddingTop: =0
                                          Text: ="• Milestones"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: =IsBlank(gblRecordSelectedProject.'End Date')
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_24:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.X
                                          PaddingTop: =0
                                          Text: ="• Generator"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: =Or(gblRecordSelectedProject.'Total Capacity' = 0,IsBlank(gblRecordSelectedProject.'Total Capacity'))
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_25:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.X
                                          PaddingTop: =0
                                          Text: ="• Production"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: =Or(gblRecordSelectedProject.'Net Yield p50' = 0,IsBlank(gblRecordSelectedProject.'Net Yield p50'))
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_26:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_21.X
                                          PaddingTop: =0
                                          Text: ="• Change the project status from Draft"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: |-
                                            =Or(
                                                IsBlank(gblRecordSelectedProject.'Cluster State'.Name),
                                                gblRecordSelectedProject.'Cluster State'.Name = "Draft"
                                            )
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                        - con_ProjectPlanning_DisplayProjectBodyRightContent_Tab:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =50
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - tab_ProjectPlanning_DisplayProjectBodyRightContent:
                                  Control: TabList@2.2.31
                                  Properties:
                                    AccessibleLabel: ="tab_ProjectPlanning_DisplayProjectBodyRightContent"
                                    BasePaletteColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                    DefaultSelectedItems: =locSelectedTab
                                    DisplayMode: |-
                                      =If(
                                          Or(
                                              IsBlank(gblRecordSelectedProject.'Cluster State'.Name),
                                              gblRecordSelectedProject.'Cluster State'.Name = "Draft",
                                              con_Milestones_Page_LockMessage_5.Visible
                                          ),
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Height: =Parent.Height
                                    Items: =locTabList
