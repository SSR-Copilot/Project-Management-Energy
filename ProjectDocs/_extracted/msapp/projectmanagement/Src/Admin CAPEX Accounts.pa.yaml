Screens:
  Admin CAPEX Accounts:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext(
            {
                locSelectedCapexAccountCategory: First(colCapexAccountCategories),
                locIsVisibleRightPanelNewEditAccount: false,
                locSpinnerInformationText: "",
                locIsVisiblePopUpSpinner: false,
                locIsVisiblePopUpChangeStatusOfAccount: false,
                locIsVisiblePopUpChangeStatusOfSubaccount: false,
                locIsVisibleRightPanelOrdering: false,
                locIsVisibleRightPanelNewEditSubaccount: false,
                locIsVisiblePopUpDeleteAccount: false,
                locIsVisiblePopUpDeleteSubaccount: false,
                locIfOrderingSubaccounts: false,
                locIfAccountOrSubAccountNumberAlreadyExists: false,
                locSelectedAccount: Blank(),
                locSelectedCapexSubaccount: Blank()
            }
        );
        UpdateIf(
            colCapexAccounts,
            Not(IsFolded),
            {IsFolded: true}
        )
    Children:
      - con_CAPEX_Accounts:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmp_Admin_CAPEX_Accounts_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: |-
                    =Table(
                        {
                            State: "Draft",
                            Color: "#41aab4"
                        },
                        {
                            State: "Approving",
                            Color: "#f5911e"
                        },
                        {
                            State: "Approved",
                            Color: "#82a51e"
                        },
                        {
                            State: "Rejected",
                            Color: "#d20532"
                        }
                    )
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: =Navigate('Project Main Screen',ScreenTransition.Fade)
                  Project: |-
                    ={
                        ID: GUID("00000000-0000-0000-0000-000000000000"),
                        Name: "CAPEX Accounts",
                        Technology: Blank(),
                        Capacity: Blank(),
                        Status: Blank(),
                        Approval: Blank()
                    }
                  Width: =1024
            - con_Admin_CAPEX_Accounts_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                Children:
                  - con_Admin_CAPEX_Accounts_Body_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =200
                      Children:
                        - cmp_Admin_CAPEX_Accounts_LeftNavigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftAdminNavigationMenu
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnExpand: |+
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |-
                                =If(
                                    Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                    Set(
                                        gblLeftNavigationSelected,
                                        LookUp(
                                            LeftAdminNavigationMenu,
                                            ItemKey = Self.SelectedKey
                                        )
                                    );
                                    Navigate(
                                        gblLeftNavigationSelected.TargetScreen,
                                        ScreenTransition.Fade
                                    )
                                )
                              Selected: =gblLeftNavigationSelected
                              Width: =200
                  - con_Admin_CAPEX_Accounts_RightContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        Height: =Parent.Height
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - tab_Admin_CAPEX_Accounts_RightContent_Parents:
                            Control: TabList@2.2.31
                            Properties:
                              Alignment: ='TabList.Alignment'.Horizontal
                              Height: =50
                              Items: =colCapexAccountCategories
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |
                                =UpdateContext(
                                    {
                                        locSelectedAccount:Blank(),
                                        locSelectedCapexAccountCategory:Self.Selected
                                    }
                                );
                              Size: ='TabList.Size'.Medium
                              Width: =Parent.Width
                              Y: =2
                            Children:
                              - vsb_name3:
                                  Control: TabListDataField@1.5.0
                                  Variant: textualColumn
                                  IsLocked: true
                                  Properties:
                                    FieldDisplayName: ="vsb_name"
                                    FieldName: ="vsb_name"
                                    FieldType: ="s"
                                    Order: =1
                        - pcf_Admin_CAPEX_Accounts_RightContent_Parents_CommandBar:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.CommandBar
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Height: =32
                              Items: |-
                                =With(
                                    {
                                        varColParentAccounts: Filter(
                                            'CAPEX Account Lists',
                                            And(
                                                Or(
                                                    IsBlank('Parent Account'),
                                                    'Parent Account'.Number = "10005"
                                                ),
                                                Not(Number = "10005")
                                            )
                                        )
                                    },
                                    Table(
                                        {
                                            ItemKey: "orderAccounts",
                                            ItemDisplayName: "Reorder",
                                            ItemIconName: "NumberedList",
                                            ItemEnabled: And(
                                                CountIf(
                                                    varColParentAccounts,
                                                    true
                                                ) > 1,
                                                DataSourceInfo(
                                                    'CAPEX Account Lists',
                                                    DataSourceInfo.EditPermission
                                                )
                                            )
                                        },
                                        {
                                            ItemKey: "newAccount",
                                            ItemDisplayName: "New",
                                            ItemIconName: "Add",
                                            ItemEnabled: DataSourceInfo(
                                                'CAPEX Account Lists',
                                                DataSourceInfo.CreatePermission
                                            )
                                        },
                                        {
                                            ItemKey: "editAccount",
                                            ItemDisplayName: "Edit",
                                            ItemIconName: "Edit",
                                            ItemEnabled: And(
                                                Not(IsBlank(locSelectedAccount)),
                                                RecordInfo(
                                                    locSelectedAccount,
                                                    RecordInfo.EditPermission
                                                )
                                            )
                                        },
                                        {
                                            ItemKey: "activateAccount",
                                            ItemDisplayName: "Activate",
                                            ItemIconName: "ActivateOrders",
                                            ItemVisible: And(
                                                Not(IsBlank(locSelectedAccount)),
                                                Not(locSelectedAccount.Status = 'Status (CAPEX Account Lists)'.Active)
                                            ),
                                            ItemEnabled: RecordInfo(
                                                locSelectedAccount,
                                                RecordInfo.EditPermission
                                            )
                                        },
                                        {
                                            ItemKey: "deactivateAccount",
                                            ItemDisplayName: "Deactivate",
                                            ItemIconName: "DeactivateOrders",
                                            ItemVisible: And(
                                                Not(IsBlank(locSelectedAccount)),
                                                locSelectedAccount.Status = 'Status (CAPEX Account Lists)'.Active
                                            ),
                                            ItemEnabled: RecordInfo(
                                                locSelectedAccount,
                                                RecordInfo.EditPermission
                                            )
                                        },
                                        {
                                            ItemKey: "deleteAccount",
                                            ItemDisplayName: "Delete",
                                            ItemIconName: "Delete",
                                            ItemVisible: And(
                                                Not(IsBlank(locSelectedAccount)),
                                                And(
                                                    IsBlank(
                                                      LookUp(
                                                            'CAPEX Project Contracts',
                                                            Account.'CAPEX Account List' in  Filter('CAPEX Account Lists','Parent Account'.'CAPEX Account List'= locSelectedAccount.'CAPEX Account List').'CAPEX Account List'
                                                        )
                                                    ),
                                                    IsEmpty(
                                                        Filter(
                                                            colCapexAccounts,
                                                            'Parent Account'.'CAPEX Account List' = locSelectedAccount.'CAPEX Account List'
                                                        ).'CAPEX Account List'
                                                    )
                                                )
                                            ),
                                            ItemEnabled: RecordInfo(
                                                locSelectedAccount,
                                                RecordInfo.DeletePermission
                                            )
                                        }
                                    )
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |-
                                =/*Switch(
                                    Self.Selected.ItemKey,
                                    "newAccount",
                                    UpdateContext(
                                        {
                                            locSelectedAccount: Blank(),
                                            locIsVisibleRightPanelNewEditAccount: true
                                        }
                                    ),
                                    "editAccount",
                                        // Toggle value to correctly reset modern controls 
                                    With(
                                        {varSelectedAccountCopy: locSelectedAccount},
                                        UpdateContext({locSelectedAccount: Blank()});
                                        UpdateContext({locSelectedAccount: varSelectedAccountCopy});
                                    );
                                    UpdateContext({locIsVisibleRightPanelNewEditAccount: true}),
                                    "deactivateAccount",
                                    UpdateContext({locIsVisiblePopUpChangeStatusOfAccount: true}),
                                    "activateAccount",
                                    UpdateContext({locIsVisiblePopUpChangeStatusOfAccount: true}),
                                    "orderAccounts",
                                    UpdateContext(
                                        {
                                            locIfOrderingSubaccounts: false,
                                            locResetOrderingList: "Reset" & Rand(),
                                            locIsVisibleRightPanelOrdering: true
                                        }
                                    ),
                                    "deleteAccount",
                                    UpdateContext({locIsVisiblePopUpDeleteAccount: true}),
                                    ""
                                )*/

                                Switch(
                                    Self.Selected.ItemKey,
                                    "newAccount",
                                    UpdateContext(
                                        {
                                            locSelectedAccount: Blank(),
                                            locIsVisibleRightPanelNewEditAccount: true
                                        }
                                    ),
                                    "editAccount",
                                        // Toggle value to correctly reset modern controls 
                                    With(
                                        {varSelectedAccountCopy: locSelectedAccount},
                                        UpdateContext({locSelectedAccount: Blank()});
                                        UpdateContext({locSelectedAccount: varSelectedAccountCopy});
                                    );
                                    UpdateContext({locIsVisibleRightPanelNewEditAccount: true}),
                                    "deactivateAccount",
                                    UpdateContext({locIsVisiblePopUpChangeStatusOfAccount: true}),
                                    "activateAccount",
                                    UpdateContext({locIsVisiblePopUpChangeStatusOfAccount: true}),
                                    "orderAccounts",
                                    UpdateContext(
                                        {
                                            locIfOrderingSubaccounts: false,
                                            locResetOrderingList: "Reset" & Rand(),
                                            locIsVisibleRightPanelOrdering: true
                                        }
                                    ),
                                    "deleteAccount",
                                    UpdateContext({locIsVisiblePopUpDeleteAccount: true}),
                                    ""
                                )
                              Theme: =gblAppThemeJson
                              Width: =Parent.Width-gblAppSizes.Position.X*2
                              X: =gblAppSizes.Position.X
                              Y: =tab_Admin_CAPEX_Accounts_RightContent_Parents.Y+tab_Admin_CAPEX_Accounts_RightContent_Parents.Height +20
                        - gal_Account_Accounts:
                            Control: Gallery@2.15.0
                            Variant: VariableHeight
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =gblAppColors.Gallery.BorderColor
                              BorderStyle: =gblAppColors.Gallery.BorderStyle
                              BorderThickness: =gblAppColors.Gallery.BorderThickness
                              Fill: =gblAppColors.Gallery.Fill
                              FillPortions: =0
                              FocusedBorderColor: =gblAppColors.Gallery.BorderColor
                              FocusedBorderThickness: =gblAppColors.Gallery.FocusedBorderThickness
                              Height: |+
                                =//Sum(RenameColumns(ForAll(gal_Account_Accounts.AllItems, Value(lbl_Account_AccountItemHeightValue_Hidden.Text)),"Value", "RowHeight"), RowHeight) + Self.TemplatePadding * Self.AllItemsCount + gblAppSizes.Padding.Page
                                Parent.Height-Self.Y

                              Items: |-
                                =/*Sort(
                                    Filter(colCapexAccounts, Category.'Capex Account Category' = locSelectedCapexAccountCategory.'Capex Account Category'),
                                    Order,
                                    SortOrder.Ascending
                                )
                                */
                                Sort(
                                    Filter(
                                        colCapexAccounts,
                                        'Parent Account'.'CAPEX Account List' = locSelectedCapexAccountCategory.'CAPEX Account List'
                                    ),
                                    Order,
                                    SortOrder.Ascending
                                )
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LoadingSpinnerColor: =gblAppColors.Gallery.LoadingSpinnerColor
                              TemplateFill: =gblAppColors.Gallery.TemplateFill
                              TemplatePadding: =0
                              TemplateSize: =500
                              Visible: =Self.AllItemsCount>0
                              Width: =Parent.Width-6
                            Children:
                              - lbl_Account_AccountItemHeightValue_Hidden:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    AutoHeight: =true
                                    BorderColor: =gblAppColors.Label.BorderColor
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =gblAppColors.Label.BorderThickness
                                    Color: =gblAppColors.Label.Color
                                    DisabledBorderColor: =gblAppColors.Label.DisabledBorderColor
                                    DisabledColor: =gblAppColors.Label.DisabledColor
                                    DisabledFill: =gblAppColors.Label.DisabledFill
                                    DisplayMode: =DisplayMode.View
                                    Fill: =gblAppColors.Label.Fill
                                    FocusedBorderColor: =gblAppColors.Label.FocusedBorderColor
                                    FocusedBorderThickness: =gblAppColors.Label.FocusedBorderThickness
                                    Font: =gblAppColors.Label.Font
                                    FontWeight: =FontWeight.Semibold
                                    Height: =35
                                    HoverBorderColor: =gblAppColors.Label.HoverBorderColor
                                    HoverColor: =gblAppColors.Label.HoverColor
                                    HoverFill: =gblAppColors.Label.HoverFill
                                    PaddingLeft: =0
                                    PressedBorderColor: =gblAppColors.Label.PressedBorderColor
                                    PressedColor: =gblAppColors.Label.PressedColor
                                    PressedFill: =gblAppColors.Label.PressedFill
                                    Size: =gblAppSizes.Font.Medium
                                    Text: =con_Account_AccountCard.Height
                                    Width: =Len(Self.Text)*14
                                    Wrap: =false
                              - con_Account_AccountCard:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =gblAppColors.BorderColor
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Fill: =ColorValue(gblAppTheme.palette.white)
                                    Height: |+
                                      =If(
                                          ThisItem.IsFolded,
                                          con_Account_AccountCardHeader.Height,
                                          con_Account_AccountCardHeader.Height+con_Account_AccountCardBody.Height
                                      )

                                    Width: =Parent.Width-10
                                  Children:
                                    - con_Account_AccountCardBody:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =ColorValue(gblAppTheme.palette.white)
                                          Height: =pcf_Account_AccountCardBody_SubAccounts.Y+pcf_Account_AccountCardBody_SubAccounts.Height+10
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutGap: =5
                                          LayoutOverflowY: =LayoutOverflow.Scroll
                                          PaddingLeft: =30
                                          Width: =Parent.Width
                                          Y: =con_Account_AccountCardHeader.Y+con_Account_AccountCardHeader.Height+10
                                        Children:
                                          - pcf_Account_AccountCardBody_SubAccountsCommandBar:
                                              Control: CodeComponent
                                              ComponentName: cat_PowerCAT.CommandBar
                                              Properties:
                                                Height: =40
                                                Items: |-
                                                  =Table(
                                                      {
                                                          ItemKey: "orderSubaccounts",
                                                          ItemDisplayName: "Reorder subaccounts",
                                                          ItemIconName: "NumberedList"
                                                          //,
                                                          //ItemEnabled: And(CountRows(Filter('CAPEX Account Lists','Parent Account'.'CAPEX Account List' = ThisItem.'CAPEX Account ////List'))>1,RecordInfo(locSelectedAccount,RecordInfo.EditPermission))
                                                      },
                                                      {
                                                          ItemKey: "newSubaccount",
                                                          ItemDisplayName: "Add subaccount",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: DataSourceInfo('CAPEX Account Lists',DataSourceInfo.CreatePermission)
                                                      }
                                                  )
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                OnSelect: |-
                                                  =Switch(
                                                      Self.Selected.ItemKey,
                                                      "newSubaccount",
                                                      UpdateContext(
                                                          {
                                                              locSelectedAccount: gal_Account_Accounts.Selected,
                                                              locSelectedCapexSubaccount: Blank(),
                                                              locIsVisibleRightPanelNewEditSubaccount: true
                                                          }
                                                      ),
                                                      "orderSubaccounts",
                                                      UpdateContext(
                                                          {
                                                              locSelectedAccount: gal_Account_Accounts.Selected,
                                                              locIfOrderingSubaccounts: true,
                                                              locResetOrderingList: "Reset" & Rand(),
                                                              locIsVisibleRightPanelOrdering: true
                                                          }
                                                      ),
                                                      ""
                                                  )
                                                Theme: =gblAppThemeJson
                                                Tooltip: =""
                                                Width: =Parent.Width-Self.X*2-20
                                                Y: =
                                          - pcf_Account_AccountCardBody_SubAccounts:
                                              Control: CodeComponent
                                              ComponentName: cat_PowerCAT.FluentDetailsList
                                              Properties:
                                                HeaderVisible: =false
                                                Height: |
                                                  =Max(Self.Y+Self.TotalRecords*32,30)
                                                Items: |-
                                                  =AddColumns(
                                                      Sort(
                                                          Filter(
                                                              colCapexAccounts,
                                                              'Parent Account'.'CAPEX Account List' = ThisItem.'CAPEX Account List'
                                                          ),
                                                          Order,
                                                          SortOrder.Ascending
                                                      ),
                                                      EditIcon,
                                                      If(
                                                          RecordInfo(
                                                              ThisItem,
                                                              RecordInfo.EditPermission
                                                          ),
                                                          "icon:Edit"
                                                      ),
                                                      ChangeStatusIcon,
                                                      Switch(
                                                          ThisRecord.Status,
                                                          'Status (CAPEX Account Lists)'.Active,
                                                          If(
                                                              RecordInfo(
                                                                  ThisItem,
                                                                  RecordInfo.EditPermission
                                                              ),
                                                              "icon:DeactivateOrders"
                                                          ),
                                                          'Status (CAPEX Account Lists)'.Inactive,
                                                          If(
                                                              And(
                                                                  ThisItem.Status = 'Status (CAPEX Account Lists)'.Active,
                                                                  RecordInfo(
                                                                      ThisItem,
                                                                      RecordInfo.EditPermission
                                                                  )
                                                              ),
                                                              "icon:ActivateOrders"
                                                          )
                                                      ),
                                                      DeleteIcon,
                                                      With(
                                                          {varThisRecord: ThisRecord},
                                                          If(
                                                              And(
                                                                  IsBlank(
                                                                      LookUp(
                                                                          colCapexProjectContracts,
                                                                          Account.'CAPEX Account List' = varThisRecord.'CAPEX Account List'
                                                                      )
                                                                  ),
                                                                  RecordInfo(
                                                                      ThisItem,
                                                                      RecordInfo.DeletePermission
                                                                  )
                                                              ),
                                                              "icon:Delete"
                                                          )
                                                      ),
                                                      RecordKey,
                                                      ThisRecord.'CAPEX Account List'
                                                  )
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                OnChange: |
                                                  =If(
                                                      Self.EventName = "CellAction" && Self.EventColumn = "EditIcon",
                                                      UpdateContext({locSelectedCapexSubaccount: Blank()});
                                                      UpdateContext(
                                                          {
                                                              locSelectedCapexSubaccount: LookUp(
                                                                  colCapexAccounts,
                                                                  'CAPEX Account List' = GUID(Self.EventRowKey)
                                                              )
                                                          }
                                                      );
                                                      UpdateContext({locSelectedAccount: gal_Account_Accounts.Selected});
                                                      UpdateContext({locIsVisibleRightPanelNewEditSubaccount: true}),
                                                      Self.EventName = "CellAction" && Self.EventColumn = "ChangeStatusIcon",
                                                      UpdateContext(
                                                          {
                                                              locSelectedCapexSubaccount: LookUp(
                                                                  colCapexAccounts,
                                                                  'CAPEX Account List' = GUID(Self.EventRowKey)
                                                              )
                                                          }
                                                      );
                                                      UpdateContext({locSelectedAccount: gal_Account_Accounts.Selected});
                                                      UpdateContext({locIsVisiblePopUpChangeStatusOfSubaccount: true}),
                                                      Self.EventName = "CellAction" && Self.EventColumn = "DeleteIcon",
                                                      UpdateContext(
                                                          {
                                                              locSelectedCapexSubaccount: LookUp(
                                                                  colCapexAccounts,
                                                                  'CAPEX Account List' = GUID(Self.EventRowKey)
                                                              )
                                                          }
                                                      );
                                                      UpdateContext({locSelectedAccount: gal_Account_Accounts.Selected});
                                                      UpdateContext({locIsVisiblePopUpDeleteSubaccount: true})
                                                  );
                                                SelectionType: ="0"
                                                Theme: =gblAppThemeJson
                                                Tooltip: =""
                                                Width: =Min(Parent.Width-Self.X*2, 900)
                                                X: =30
                                                Y: =40
                                                columns_Items: |-
                                                  =Table(  
                                                      {
                                                          ColName: "vsb_number",
                                                          ColDisplayName:"Number",
                                                          ColWidth: 80,
                                                          ColRowHeader:true,
                                                          ColSortable:true,
                                                          ColResizble:true
                                                      },
                                                      {
                                                          ColName: "vsb_name",
                                                          ColDisplayName:"Subaccount",
                                                          ColWidth: Max(Self.Width-400, 80),
                                                          ColRowHeader:true,
                                                          ColSortable:true,
                                                          ColResizble:true
                                                      },    
                                                      {
                                                          ColName: "statecode",
                                                          ColDisplayName:"Status",
                                                          ColWidth:80,
                                                          ColRowHeader:true,
                                                          ColSortable:true,
                                                          ColResizble:true
                                                      },
                                                      {
                                                          ColName: "EditIcon",
                                                          ColCellType:"clickableimage",
                                                          ColWidth: 18,
                                                          ColImageWidth: 15,
                                                          ColImagePadding: 1,
                                                          ColVerticalAlign: "Top"
                                                      },
                                                      {
                                                          ColName: "ChangeStatusIcon",
                                                          ColCellType:"clickableimage",
                                                          ColWidth: 18,
                                                          ColImageWidth: 15,
                                                          ColImagePadding: 1,
                                                          ColVerticalAlign: "Top"
                                                      },
                                                      {
                                                          ColName: "DeleteIcon",
                                                          ColCellType:"clickableimage",
                                                          ColWidth: 18,
                                                          ColImageWidth: 15,
                                                          ColImagePadding: 1,
                                                          ColVerticalAlign: "Top"
                                                      }
                                                  )
                                    - con_Account_AccountCardHeader:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          BorderColor: =gblAppColors.BorderColor
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          Fill: =ColorValue("#fdffff")
                                          Height: =42
                                          Width: =Parent.Width
                                        Children:
                                          - lbl_Account_AccountName:
                                              Control: Label@2.5.1
                                              Properties:
                                                AutoHeight: =true
                                                BorderColor: =gblAppColors.Label.BorderColor
                                                BorderStyle: =BorderStyle.None
                                                BorderThickness: =gblAppColors.Label.BorderThickness
                                                Color: =gblAppColors.Label.Color
                                                DisabledBorderColor: =gblAppColors.Label.DisabledBorderColor
                                                DisabledColor: =gblAppColors.Label.DisabledColor
                                                DisabledFill: =gblAppColors.Label.DisabledFill
                                                Fill: =gblAppColors.Label.Fill
                                                FocusedBorderColor: =gblAppColors.Label.FocusedBorderColor
                                                FocusedBorderThickness: =gblAppColors.Label.FocusedBorderThickness
                                                Font: =gblAppColors.Label.Font
                                                FontWeight: |-
                                                  =If(
                                                      ThisItem.'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',
                                                      FontWeight.Semibold,    
                                                      FontWeight.Normal
                                                  )
                                                Height: =35
                                                HoverBorderColor: =gblAppColors.Label.HoverBorderColor
                                                HoverColor: =gblAppColors.Label.HoverColor
                                                HoverFill: =gblAppColors.Label.HoverFill
                                                PaddingLeft: =0
                                                PressedBorderColor: =gblAppColors.Label.PressedBorderColor
                                                PressedColor: =gblAppColors.Label.PressedColor
                                                PressedFill: =gblAppColors.Label.PressedFill
                                                Size: =gblAppSizes.Font.Small
                                                Text: =ThisItem.Number & " - " &ThisItem.Name
                                                Width: =Parent.Width-Self.X-110
                                                Wrap: =false
                                                X: =36
                                                Y: =(Parent.Height-Self.Height)/2
                                          - shp_Account_AccountCardHeaderBottomLine:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                BorderColor: =gblAppColors.Divider.BorderColor
                                                BorderStyle: =gblAppColors.Divider.BorderStyle
                                                BorderThickness: =gblAppColors.Divider.BorderThickness
                                                DisabledFill: =gblAppColors.Divider.DisabledColor
                                                DisplayMode: =DisplayMode.View
