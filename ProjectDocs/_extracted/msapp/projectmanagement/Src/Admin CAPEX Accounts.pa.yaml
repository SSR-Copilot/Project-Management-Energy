                              OnChange: "=UpdateContext({\n    locIfAccountOrSubAccountNumberAlreadyExists: Not(IsBlank(LookUp('CAPEX Account Lists', Number = Trim(txt_Account_RightPanel_NewEditAccount_BodyContent_Number.Value))))\n});\n\n// If new account is creating and account number already exists, show error message, otherwise save/update account\nIf(\n    And(IsBlank(locSelectedAccount), locIfAccountOrSubAccountNumberAlreadyExists),\n    \"\",\n\nUpdateContext({\n    locSpinnerInformationText: \"Saving Account...\",\n    locIsVisiblePopUpSpinner: true,\n    locIsVisibleRightPanelNewEditAccount: false\n});\n\nIf(\n    IsBlank(locSelectedAccount),\n\n    // New Account\n    With(\n        {\n            varNewAccount: Patch(\n                'CAPEX Account Lists',\n                Defaults('CAPEX Account Lists'),\n                {\n                    'Parent Account':drp_Account_RightPanel_NewEditAccount_BodyContent_Category.Selected,\n              \n                    Number: Trim(txt_Account_RightPanel_NewEditAccount_BodyContent_Number.Value),\n                    Name: txt_Account_RightPanel_NewEditAccount_BodyContent_Name.Value,\n                    Order: Max(Max(Filter(colCapexAccounts, 'Parent Account'.'CAPEX Account List' = drp_Account_RightPanel_NewEditAccount_BodyContent_Category.Selected.'CAPEX Account List'), Order),0)+1\n                }\n            )\n        },\n        Collect(colCapexAccounts, \n            AddColumns(\n                varNewAccount,\n            IsFolded,\n            true\n        ));\n        UpdateContext({locSelectedAccount: LookUp(colCapexAccounts,'CAPEX Account List' = varNewAccount.'CAPEX Account List')})\n    );\n\n\n    \n    UpdateIf('CAPEX Account Lists', 'CAPEX Account List'=locSelectedAccount.'CAPEX Account List', {Status: 'Status (CAPEX Account Lists)'.Inactive});\n    UpdateIf(colCapexAccounts, 'CAPEX Account List'=locSelectedAccount.'CAPEX Account List', {Status: 'Status (CAPEX Account Lists)'.Inactive});\n    UpdateContext({locSelectedAccount: LookUp(colCapexAccounts,'CAPEX Account List'=locSelectedAccount.'CAPEX Account List')}),\n\n    // Existing account updated\n    UpdateIf(\n        'CAPEX Account Lists',\n         'CAPEX Account List'=locSelectedAccount.'CAPEX Account List',\n        {\n            Name: txt_Account_RightPanel_NewEditAccount_BodyContent_Name.Value\n        }\n    );\n    UpdateIf(colCapexAccounts, 'CAPEX Account List'=locSelectedAccount.'CAPEX Account List', {Name: txt_Account_RightPanel_NewEditAccount_BodyContent_Name.Value});\n    UpdateContext({locSelectedAccount: LookUp(colCapexAccounts, 'CAPEX Account List'=locSelectedAccount.'CAPEX Account List')})\n);\n\nUpdateContext({\n    locIfAccountOrSubAccountNumberAlreadyExists: false,\n    locIsVisiblePopUpSpinner: false,\n    locSpinnerInformationText: \"\"\n});\n\n);"
