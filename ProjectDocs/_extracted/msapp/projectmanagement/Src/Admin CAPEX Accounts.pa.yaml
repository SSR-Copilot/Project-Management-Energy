      - cmp_Account_PopUpConfirmation_DeleteSubAccount:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: ="Are you sure that you want to permanently delete """ & locSelectedCapexSubaccount.Name & """ subaccount?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteSubaccount: false})
            OnConfirm: |-
              =UpdateContext({
                  locSpinnerInformationText: "Deleting Subaccount...",
                  locIsVisiblePopUpSpinner: true,
                  locIsVisiblePopUpDeleteSubaccount: false
              });

              With(
                  {
                      varSubaccountToDelete: LookUp(colCapexAccounts, 'CAPEX Account List' = locSelectedCapexSubaccount.'CAPEX Account List')
                  },
                  Remove('CAPEX Account Lists', varSubaccountToDelete);
                  Remove(colCapexAccounts, varSubaccountToDelete);
              );

              UpdateContext({
                  locIsVisiblePopUpSpinner: false,
                  locSpinnerInformationText: ""
              });
            Title: ="Delete Subaccount?"
            Visible: =locIsVisiblePopUpDeleteSubaccount
            Width: =Parent.Width
      - cmp_Account_PopUpConfirmation_DeleteAccount:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: ="Are you sure that you want to permanently delete """ & locSelectedAccount.Name & """ account with its all related subaccounts?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteAccount: false})
            OnConfirm: |-
              =UpdateContext({
                  locSpinnerInformationText: "Deleting Account...",
                  locIsVisiblePopUpSpinner: true,
                  locIsVisiblePopUpDeleteAccount: false
              });

              Remove('CAPEX Account Lists', LookUp('CAPEX Account Lists', 'CAPEX Account List'=locSelectedAccount.'CAPEX Account List'));
              Remove(colCapexAccounts, LookUp(colCapexAccounts, 'CAPEX Account List'=locSelectedAccount.'CAPEX Account List'));
              ClearCollect(colCapexSubaccounts,'CAPEX Account Lists');

              UpdateContext({
                  locSelectedAccount: Blank()
              });

              UpdateContext({
                  locIsVisiblePopUpSpinner: false,
                  locSpinnerInformationText: ""
              });
            Title: ="Delete Account?"
            Visible: =locIsVisiblePopUpDeleteAccount
            Width: =Parent.Width
      - cmp_Account_PopUpConfirmation_ChangeStatusOfAccount:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: |-
              =If(
                  locSelectedAccount.Status = 'Status (CAPEX Account Lists)'.Active,
                  "Deactivate",
                  "Activate"
              )
            Description: |-
              =If(
                  locSelectedAccount.Status = 'Status (CAPEX Account Lists)'.Active,
                  "Are you sure that you want to deactivate """ & locSelectedAccount.Name & """ account? All related subaccounts will be automatically deactivated and associated forecasted costs will be deleted.",
                  "Are you sure that you want to activate """ & locSelectedAccount.Name & """ account?"
              )
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpChangeStatusOfAccount: false})
            OnConfirm: "=UpdateContext(\r\n    {\r\n        locSpinnerInformationText: \"Updating Account...\",\r\n        locIsVisiblePopUpSpinner: true,\r\n        locIsVisiblePopUpChangeStatusOfAccount: false\r\n    }\r\n);\r\nIf(\r\n    locSelectedAccount.Status = 'Status (CAPEX Account Lists)'.Active,\r\n    UpdateIf(\r\n        'CAPEX Account Lists',\r\n        'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',\r\n        {Status: 'Status (CAPEX Account Lists)'.Inactive}\r\n    );\r\n    UpdateIf(\r\n        colCapexAccounts,\r\n        'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',\r\n        {Status: 'Status (CAPEX Account Lists)'.Inactive}\r\n    );\r\n    UpdateIf(\r\n        'CAPEX Account Lists',\r\n        'Parent Account'.'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',\r\n        {Status: 'Status (CAPEX Account Lists)'.Active}\r\n    );\r\n    UpdateIf(\r\n        colCapexAccounts,\r\n        'Parent Account'.'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',\r\n        {Status: 'Status (CAPEX Account Lists)'.Active}\r\n    );\r\n    With(\r\n        {\r\n            locSubaccounts: Filter(\r\n                colCapexAccounts,\r\n                'Parent Account'.'CAPEX Account List' = locSelectedAccount.'CAPEX Account List'\r\n            )\r\n        },\r\n        With(\r\n            {\r\n                varCapexContractsForSubaccountInCurrentYearRecords: Filter(\r\n                    colCapexProjectContracts,\r\n                    Account.'CAPEX Account List' in locSubaccounts.'CAPEX Account List'\r\n                ).'CAPEX Project Contract'\r\n            },\r\n            With(\r\n                {\r\n                    varCapexCostsForSubaccountInCurrentYearRecords: Filter(\r\n                        'CAPEX Costs',\r\n                        And(\r\n                            Contract.'CAPEX Project Contract' in varCapexContractsForSubaccountInCurrentYearRecords,\r\n                            Year = Year(Today()),\r\n                            Month > Month(Today())\r\n                        )\r\n                    )\r\n                },\r\n                ForAll(\r\n                    varCapexCostsForSubaccountInCurrentYearRecords As varCapexCostRecord,\r\n                    Patch(\r\n                        'CAPEX Costs',\r\n                        varCapexCostRecord,\r\n                        {Cost: 0}\r\n                    )\r\n                );\r\n                RemoveIf(\r\n                    'CAPEX Costs',\r\n                    And(\r\n                        Contract.'CAPEX Project Contract' in varCapexContractsForSubaccountInCurrentYearRecords,\r\n                        Year > Year(Today())\r\n                    )\r\n                )\r\n            )\r\n        );\r\n    ),\r\n    UpdateIf(\r\n        'CAPEX Account Lists',\r\n        'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',\r\n        {Status: 'Status (CAPEX Account Lists)'.Active}\r\n    );\r\n    UpdateIf(\r\n        colCapexAccounts,\r\n        'CAPEX Account List' = locSelectedAccount.'CAPEX Account List',\r\n        {Status: 'Status (CAPEX Account Lists)'.Active}\r\n    );\r\n    \r\n);\r\nUpdateContext(\r\n    {\r\n        locIsVisiblePopUpSpinner: false,\r\n        locSpinnerInformationText: \"\"\r\n    }\r\n);\r\n"
