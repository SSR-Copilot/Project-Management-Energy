Screens:
  Grid Operator Screen:
    Properties:
      Fill: |-
        =RGBA(
            255,
            255,
            255,
            1
        )
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |
        =
        Set(
            gblRecordSelectedProject,
            LookUp(
                Projects,
                ThisRecord.Project = gblRecordSelectedProject.Project
            )
        );
        Set(
                        gblCurrentUser,
                        Patch(
                            gblCurrentUser,
                            {
                                CanEditSelectedProject: And(
                                    DataSourceInfo(
                                        Projects,
                                        DataSourceInfo.CreatePermission
                                    ),
                                    Coalesce(
                                        RecordInfo(
                                            gblRecordSelectedProject,
                                            RecordInfo.EditPermission
                                        ),
                                        false
                                    )
                                )
                            }
                        )
                    );Set(
            gblRecordGridOperator,
            Blank()
        );
        Set(
            gblRecordGridOperator,
            LookUp(
                'Grid Operators',
                Project.Project = gblRecordSelectedProject.Project
            )
        );
        UpdateContext(
            {
                locAllowGridOperatorReset: true,
                locGridOperatorTabSelected: "operatorTab",
                locGridOperatorTabListItems: Table(
                    {
                        TabName: "Grid Operator",
                        TabValue: "operatorTab"
                    },
                    {
                        TabName: "Grid Connection",
                        TabValue: "connectionTab"
                    }
                ),
                locIsFormDirtyNewEditGridOperator: false,
                locLeaveGridOperatorConfirmationDialog: false
            }
        );
        Collect(
            colGridOperatorFormValidation,
            Blank()
        );
        ClearCollect(
            colGridOperatorFormValidation,
            Table(
                {
                    Name: "GridOperator",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "GridVoltage",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "GridExpansionRequired",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "GridExpansionDetails",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "SubstationConstruction",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "SubstationOperator",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "LengthInternalCabeling",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "DiameterInternalCabeling",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "LengthExternalCabeling",
                    Dirty: false,
                    Valid: true
                },
                {
                    Name: "DiameterExternalCabeling",
                    Dirty: false,
                    Valid: true
                }
            )
        );
        If(
            IsBlank(gblRecordGridOperator),
            Concurrent(
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_GridOperator),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_GridVoltage),
                Reset(drp_GridOperator_DisplayProjectBodyRightContent_GridExpansionRequired),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_GridExpansionDetails),
                Reset(drp_GridOperator_DisplayProjectBodyRightContent_SubstationConstruction),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_SubstationOperator),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_LengthInternalCabeling),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_DiameterInternalCabeling),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_LengthExternalCabeling),
                Reset(txt_GridOperator_DisplayProjectBodyRightContent_DiameterExternalCabeling)
            )
        );
    Children:
      - fn_Numeric_GridOperator:
          Control: CanvasComponent
          ComponentName: fn_Numeric
          Properties:
            Height: =10
            Width: =10
            Y: =Parent.Height - Self.Height
      - con_GridOperator_DisplayProject:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmp_GridOperator_DisplayProjectHeader:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: =gblTableApprovalStateColors
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: ='Project Main Screen'
                  OnLogoClick: |
                    =If(
                        CountRows(
                            Filter(
                                colGridOperatorFormValidation,
                                Dirty = true
                            )
                        ) > 0,
                        UpdateContext({locLeaveGridOperatorConfirmationDialog: true}),
                        Navigate(
                            'Project Main Screen',
                            ScreenTransition.Fade
                        )
                    );
                  Project: =gblProjectHeaderData
                  Width: =1024
            - con_GridOperator_DisplayProjectBody:
