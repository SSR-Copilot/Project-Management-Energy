ComponentDefinitions:
  cmp_Project_States:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      DefaultValue:
        PropertyKind: Input
        DisplayName: DefaultValue
        Description: A default value defined selected item
        RaiseOnReset: true
        DataType: Record
        Default: |-
          ={
                  RowNumber: 1,
                  ID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b5",
                  Name: "Cluster 1",
                  State: {
                      ID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0",
                      Name: "PST-0",
                      ProjectID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0",
                      ClusterProjectStateID: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0"),
                      StateProgress: 952850002,
                      Comment: "",
                      DueDate: Now()
                  },
                  HasGate: true,
                  Gate: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0")
              }
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: A state items
        RaiseOnReset: true
        DataType: Table
        Default: |+
          =Table(
              {
                  RowNumber: 1,
                  ID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b5",
                  Name: "Cluster 1",
                  Description: "Cluster 1: Lorem Ipsum",
                  State: {
                      ID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0",
                      Name: "PST-0",
                      ProjectID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0",
                      ClusterProjectStateID: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0"),
                      StateProgress: 952850002,
                      Comment: "",
                      DueDate: Now()
                  },
                  HasGate: true,
                  Gate: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0")
              },
              {
                  RowNumber: 2,
                  ID: "4b3b63da-5c8b-4e47-aa89-f91220ac04dc",
                  Name: "Cluster 2",
                  Description: "Cluster 2: Lorem Ipsum",
                  State: {
                      ID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b1",
                      Name: "PST-1",
                      ProjectID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b1",
                      ClusterProjectStateID: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b1"),
                      StateProgress: 952850001,
                      Comment: "",
                      DueDate: Now()
                  },
                  HasGate: true,
                  Gate: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0")
              },
              {
                  RowNumber: 3,
                  ID: "4b3b63da-5c8b-4e47-aa89-f91220ac04dd",
                  Name: "Cluster 3",
                  Description: "Cluster 3: Lorem Ipsum",
                  State: {
                      ID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b2",
                      Name: "PST-2",
                      ProjectID: "e2d4179b-3688-4ed1-a9e9-daf2ab6f01b2",
                      ClusterProjectStateID: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b2"),
                      StateProgress: 952850000,
                      Comment: "",
                      DueDate: Now()
                  },
                  HasGate: true,
                  Gate: GUID("e2d4179b-3688-4ed1-a9e9-daf2ab6f01b0")
              }
          )
      LineColor:
        PropertyKind: Input
        DisplayName: LineColor
        Description: A line color property
        RaiseOnReset: true
        DataType: Color
        Default: =RGBA(0, 0, 0, 1)
      OnRefresh:
        PropertyKind: Event
        DisplayName: OnRefresh
        Description: A custom property
        ReturnType: None
        Default: =
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: A OnSelect event
        ReturnType: None
        Default: =
      RefreshButtonVisibility:
        PropertyKind: Input
        DisplayName: Refresh button visibility
        Description: A custom property defined if refresh button visibly.
        RaiseOnReset: true
        DataType: Boolean
        Default: =true
      Selected:
        PropertyKind: Output
        DisplayName: Selected
        Description: A selected item property
        DataType: Record
      SelectedCluster:
        PropertyKind: Output
        DisplayName: SelectedCluster
        Description: A custom property
        DataType: Record
    Properties:
      Height: =104
      OnReset: =false
      Selected: |-
        =If(
            IsBlank(cmp_Project_States.DefaultValue.ID),
            Blank(),
            ShowColumns(gal_States.Selected, ID, Name, State, HasGate, Gate, RowNumber)
        )
      SelectedCluster: =gal_States.Selected
      Width: =840
    Children:
      - con_Project_States:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(0, 0, 0, 0)
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height-2
            PaddingBottom: =5
            PaddingTop: =5
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width-If(cmp_Project_States.RefreshButtonVisibility, 32, 0)
            Y: =2
          Children:
            - gal_States:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Default: =cmp_Project_States.DefaultValue
                  Height: =Parent.Height
                  Items: =cmp_Project_States.Items
                  TemplatePadding: =0
                  TemplateSize: =If(CountRows(cmp_Project_States.Items)>0, Parent .Width/CountRows(cmp_Project_States.Items),100)
                  Width: = Parent.Width
                Children:
                  - con_State_Card:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        BorderColor: =If(cmp_Project_States.DefaultValue.ID=ThisItem.ID,gblAppColors.BorderColor,Color.Transparent)
                        BorderStyle: =If(cmp_Project_States.DefaultValue.ID = ThisItem.ID, BorderStyle.Solid, BorderStyle.None)
                        BorderThickness: =If(cmp_Project_States.DefaultValue.ID = ThisItem.ID,1,0)
                        DropShadow: =If(cmp_Project_States.DefaultValue.ID=ThisItem.ID,DropShadow.Light,DropShadow.None)
                        Fill: =If(cmp_Project_States.DefaultValue.ID=ThisItem.ID,gblAppColors.ButtonSelectedBg,Color.Transparent)
                        Height: =con_Project_States.Height-5
                        RadiusBottomLeft: =2
                        RadiusBottomRight: =2
                        RadiusTopLeft: =2
                        RadiusTopRight: =2
                        Width: |-
                          =If(
                              CountRows(cmp_Project_States.Items) > 0,
                              Parent.Width / CountRows(cmp_Project_States.Items),
                              300
                          )
                        X: =2
                        Y: =Parent.Height/2-Self.Height/2
                      Children:
                        - con_State_Card_Data:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Height: =60
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =rec_First.Width + but_State.Width + rec_Last.Width
                              Y: =con_State_Card_Button.Height - 12
                            Children:
                              - lbl_State_Card_Data_SubTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =gblAppColors.Label.Color
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisplayMode: =DisplayMode.View
                                    Font: =Font.'Segoe UI'
                                    Height: =Parent.Height/3
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    PaddingTop: =4
                                    Size: =gblAppSizes.Font.ExtraSmall
                                    Text: |-
                                      =Switch(
                                          ThisItem.State.StateProgress,
                                          gblAppConstants.ApprovalClusterStates.InProgress,
                                          gblAppConstants.ApprovalClusterStatesLabels.InProgress,
                                          gblAppConstants.ApprovalClusterStates.Completed,
                                          gblAppConstants.ApprovalClusterStatesLabels.Completed,
                                          gblAppConstants.ApprovalClusterStates.Rejected,
                                          gblAppConstants.ApprovalClusterStatesLabels.Rejected,
                                          gblAppConstants.ApprovalClusterStates.RequestCanceled,
                                          gblAppConstants.ApprovalClusterStatesLabels.RequestCanceled,
                                          gblAppConstants.ApprovalClusterStates.Abandoned,
                                          gblAppConstants.ApprovalClusterStatesLabels.Abandoned,
                                          gblAppConstants.ApprovalClusterStates.Inactive,
                                          gblAppConstants.ApprovalClusterStatesLabels.Inactive,
                                          If(
                                              And(
                                                  ThisItem.RowNumber = 1,
                                                  IsBlank(ThisItem.State)
                                              ),
                                              gblAppConstants.ApprovalClusterStatesLabels.InProgress,
                                              ""
                                          )
                                      )
                                    Tooltip: =Self.Text
                                    Width: =Parent.Width-20
                                    Wrap: =false
                                    X: =rec_First.X+rec_First.Width
                                    Y: =lbl_State_Card_Data_Title.Height-2
                              - lbl_State_Card_Data_Title:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Center
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    Color: =RGBA(50, 49, 48, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    DisplayMode: =DisplayMode.View
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =Parent.Height / 3 *2
                                    LineHeight: =1
                                    PaddingBottom: =4
                                    PaddingLeft: =4
                                    PaddingRight: =4
                                    PaddingTop: =4
                                    Size: =gblAppSizes.Font.ExtraSmall
                                    Text: |-
                                      =With(
                                          {
                                              pieces: Split(ThisItem.Description,": ")
                                          },
                                          If(
                                              Self.Width < 200,
                                              $"{Concat(pieces, Value, Char(13))}",
                                              ThisItem.Description
                                          )
                                      )
                                    VerticalAlign: =VerticalAlign.Top
                                    Width: =Parent.Width-20
                                    Wrap: =false
                                    X: =rec_First.X+rec_First.Width
                        - con_State_Card_Button:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              Height: =Parent.Height/2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - con_State_Card_Gate:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderStyle: =BorderStyle.None
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.Height
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: |-
                                      =And(
                                          ThisItem.HasGate,
                                          Not(Last(cmp_Project_States.Items).ID = ThisItem.ID)
                                      )
                                    Width: =but_State_Card_Gate_Approval.Width+rec_State_Card_Gate_Approval.Width
                                    X: =rec_Last.X+rec_Last.Width
                                  Children:
                                    - rec_State_Card_Gate_Approval:
                                        Control: Rectangle@2.3.0
                                        Properties:
                                          AccessibleLabel: ="rec_State_Card_Gate_Approval"
                                          BorderColor: =RGBA(0, 0, 0, 0)
                                          BorderStyle: =BorderStyle.None
                                          DisabledFill: =cmp_Project_States.LineColor
                                          DisplayMode: =DisplayMode.View
                                          Fill: =cmp_Project_States.LineColor
                                          FocusedBorderThickness: =4
                                          Height: =2
                                          HoverFill: =cmp_Project_States.LineColor
                                          PressedFill: =cmp_Project_States.LineColor
                                          Visible: =If(Last(cmp_Project_States.Items).ID = ThisItem.ID, false, true)
                                          Width: =10
                                          X: =but_State_Card_Gate_Approval.X+but_State_Card_Gate_Approval.Width
                                          Y: =Parent.Height/2-Self.Height/2
                                    - circ_State_Card_Gate_Approval:
                                        Control: Circle@2.3.0
                                        Properties:
                                          AccessibleLabel: ="circ_State_Card_Gate_Approval"
                                          BorderColor: =RGBA(245, 245, 245, 1)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          Fill: |
                                            =Switch(
                                                ThisItem.State.StateProgress,
                                                gblAppConstants.ApprovalClusterStates.InProgress,
                                                gblAppColors.ApprovalClusterStates.InProgress,
                                                gblAppConstants.ApprovalClusterStates.Completed,
                                                gblAppColors.ApprovalClusterStates.Completed,
                                                gblAppConstants.ApprovalClusterStates.Rejected,
                                                gblAppColors.ApprovalClusterStates.Rejected,
                                                gblAppConstants.ApprovalClusterStates.RequestCanceled,
                                                gblAppColors.ApprovalClusterStates.RequestCanceled,
                                                gblAppColors.ApprovalClusterStates.NotStarted
                                            )
                                          Height: =30
                                          HoverFill: =RGBA(0, 0, 0, 0)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Width: =30
                                          X: =1
                                          Y: =Parent.Height/2-Self.Height/2
                                    - but_State_Card_Gate_Approval:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="but_State_Card_Gate_Approval"
                                          Appearance: |-
                                            =If(
                                                ThisItem.State.StateProgress = gblAppConstants.ApprovalClusterStates.Completed,
                                                'ButtonCanvas.Appearance'.Transparent,
                                                'ButtonCanvas.Appearance'.Secondary
                                            )
                                          FontColor: |
                                            =Switch(
                                                ThisItem.State.StateProgress,
                                                gblAppConstants.ApprovalClusterStates.InProgress,
                                                gblAppColors.ApprovalClusterStates.InProgress,
                                                gblAppConstants.ApprovalClusterStates.Completed,
                                                gblAppColors.ApprovalClusterStates.NotStarted,
                                                gblAppColors.Label.Color
                                            )
                                          FontWeight: =FontWeight.Bold
                                          Icon: =If(LookUp('Project Default Approvals', 'Project Default Approvals' = ThisItem.Gate).'Approval Mode' = 'Approval Mode'.'Only Notifications',"Mail","People")
                                          Layout: ='ButtonCanvas.Layout'.IconOnly
                                          Text: ="Approval"
                                          Width: =32
                                          Y: =Parent.Height/2-Self.Height/2
                                    - circ_State_Card_Gate_Approval_ToolTip:
                                        Control: Circle@2.3.0
                                        Properties:
                                          AccessibleLabel: ="circ_State_Card_Gate_Approval_ToolTip"
                                          BorderColor: =RGBA(245, 245, 245, 1)
                                          BorderStyle: =BorderStyle.None
                                          BorderThickness: =2
                                          DisabledFill: =RGBA(0, 0, 0, 0)
                                          DisplayMode: =DisplayMode.View
                                          Fill: =Color.Transparent
                                          Height: =31
                                          HoverFill: =RGBA(255, 255, 255, 0.17)
                                          PressedFill: =RGBA(0, 0, 0, 0)
                                          Tooltip: |-
                                            =/*With(
                                                {
                                                    varDefaultApproval: Table(
                                                        ParseJSON(
                                                            LookUp(
                                                                'Project State Trackings',
                                                                'Project State Tracking' = GUID(ThisItem.State.ID),
                                                                'Last Triggered Approval Personas'
                                                            )
                                                        )
                                                    ),
                                                    varDefaultApprovalMode: LookUp(
                                                                'Project State Trackings',
                                                                'Project State Tracking' = GUID(ThisItem.State.ID)
                                                            )
                                                },
                                                If(
                                                    IsBlank(varDefaultApproval),
                                                    With(
                                                        {
                                                            varDefaultApprovalAppSettings: LookUp(
                                                                'Project Default Approvals',
                                                                'Project Default Approvals' = ThisItem.Gate
                                                            )
                                                        },
                                                        With(
                                                            {
                                                                varPortfolioManager: Coalesce(
                                                                    varDefaultApprovalAppSettings.'Portfolio Manager'.Mail,
                                                                    "None"
                                                                ),
                                                                varDefaultApprovers: Coalesce(
                                                                    Concat(
                                                                        ForAll(
                                                                            Table(ParseJSON(varDefaultApprovalAppSettings.'Default Approvals')),
                                                                            {Mail: Value.PersonaRole}
                                                                        ),
                                                                        Mail,
                                                                        Char(13)
                                                                    ),
                                                                    "None"
                                                                ),
                                                                varDefaultContributors: Coalesce(
                                                                    Concat(
                                                                        ForAll(
                                                                            Table(ParseJSON(varDefaultApprovalAppSettings.'Default Contributors')),
                                                                            {Mail: Value.PersonaRole}
                                                                        ),
                                                                        Mail,
                                                                        Char(13)
                                                                    ),
                                                                    "None"
                                                                ),
                                                                varDefaultNotifications: Coalesce(
                                                                    Concat(
                                                                        ForAll(
                                                                            Table(ParseJSON(varDefaultApprovalAppSettings.'Default Notifications')),
                                                                            {Mail: Value.PersonaRole}
                                                                        ),
                                                                        Mail,
                                                                        Char(13)
                                                                    ),
                                                                    "None"
                                                                )
                                                            },
                                                            Switch(
                                                                varDefaultApprovalAppSettings.'Approval Mode',
                                                                'Approval Mode'.'Formal Approval',
                                                                $"Portfolio Manager:{Char(13)}{varPortfolioManager}{Char(13)}{Char(13)}Contributors:{Char(13)}{varDefaultContributors}{Char(13)}{Char(13)}Approvers:{Char(13)}{varDefaultApprovers}{Char(13)}{Char(13)}Notifications:{Char(13)}{varDefaultNotifications}",
                                                                'Approval Mode'.'Local Approval',
                                                                $"Approvers:{Char(13)}{varDefaultApprovers}{Char(13)}{Char(13)}Notifications:{Char(13)}{varDefaultNotifications}",
                                                                'Approval Mode'.'Only Notifications',
                                                                $"Notifications:{Char(13)}{varDefaultNotifications}"
                                                            )
                                                        )
                                                    ),
                                                    With(
                                                        {
                                                            varPortfolioManager: Coalesce(
                                                                Concat(
                                                                    ForAll(
                                                                        varDefaultApproval,
                                                                        {Mail: Value.PortfolioManager}
                                                                    ),
                                                                    Mail,
                                                                    Char(13)
                                                                ),
                                                                "None"
                                                            ),
                                                            varDefaultApprovers: Coalesce(
                                                                Concat(
                                                                    ForAll(
                                                                        Split(
                                                                            Concat(
                                                                                ForAll(
                                                                                    varDefaultApproval,
                                                                                    {Mail: Value.Approvers}
                                                                                ),
                                                                                Mail,
                                                                                Char(13)
                                                                            ),
                                                                            "\r"
                                                                        ),
                                                                        {Mail: Trim(Value)}
                                                                    ),
                                                                    Mail,
                                                                    Char(13)
                                                                ),
                                                                "None"
                                                            ),
                                                            varDefaultContributors: Coalesce(
                                                                Concat(
                                                                    ForAll(
                                                                        varDefaultApproval,
                                                                        {Mail: Value.Contributors}
                                                                    ),
                                                                    Mail,
                                                                    Char(13)
                                                                ),
                                                                "None"
                                                            ),
                                                            varDefaultNotifications: Coalesce(
                                                                Concat(
                                                                    ForAll(
                                                                        varDefaultApproval,
                                                                        {Mail: Value.Notifications}
                                                                    ),
                                                                    Mail,
                                                                    Char(13)
                                                                ),
                                                                "None"
                                                            )
                                                        },
                                                        Switch(
                                                            varDefaultApprovalMode.'Last Triggered Approval Mode',
                                                            'Approval Mode'.'Formal Approval',
                                                            $"Portfolio Manager:{Char(13)}{varPortfolioManager}{Char(13)}{Char(13)}Contributors:{Char(13)}{varDefaultContributors}{Char(13)}{Char(13)}Approvers:{Char(13)}{varDefaultApprovers}{Char(13)}{Char(13)}Notifications:{Char(13)}{varDefaultNotifications}",
                                                            'Approval Mode'.'Local Approval',
                                                            $"Approvers:{Char(13)}{varDefaultApprovers}{Char(13)}{Char(13)}Notifications:{Char(13)}{varDefaultNotifications}",
                                                            'Approval Mode'.'Only Notifications',
                                                            $"Notifications:{Char(13)}{varDefaultNotifications}"
                                                        )
                                                    )
                                                )
                                            )*/

                                            If(
                                                IsBlank(ThisItem.Gate),
                                                Blank(),
                                                With(
                                                    {
                                                        varTracking: If(
                                                            IsBlank(ThisItem.State) || IsBlank(ThisItem.State.ID),
                                                            Blank(),
                                                            LookUp(
                                                                'Project State Trackings',
                                                                'Project State Tracking' = GUID(ThisItem.State.ID)
                                                            )
                                                        ),
                                                        varDefaultApprovalAppSettings: LookUp(
                                                            'Project Default Approvals',
                                                            'Project Default Approvals' = ThisItem.Gate
                                                        )
                                                    },
                                                    With(
                                                        {
                                                            varLastTriggeredText: Coalesce(
                                                                varTracking.'Last Triggered Approval Personas',
                                                                ""
                                                            )
                                                        },
                                                        With(
                                                            {
                                                                varUseLastTriggeredPersonas: And(
                                                                    Not(IsBlank(Trim(varLastTriggeredText))),
                                                                    Or(
                                                                        Not(IsBlank(varTracking.FlowRunId)),
                                                                        Not(IsBlank(varTracking.FlowApprovalId)),
                                                                        varTracking.'Approval Cluster State' in [
                                                                            'Approval Cluster States'.Completed,
                                                                            'Approval Cluster States'.Rejected,
                                                                            'Approval Cluster States'.'Request canceled',
                                                                            'Approval Cluster States'.Canceling,
                                                                            'Approval Cluster States'.Abandoned,
                                                                            'Approval Cluster States'.'Inactive/ On-hold'
                                                                        ]
                                                                    )
                                                                )
                                                            },
                                                            If(
                                                                varUseLastTriggeredPersonas,
                                                                With(
                                                                    {
                                                                        varLastTriggeredApproval: Table(
                                                                            ParseJSON(varLastTriggeredText)
                                                                        )
                                                                    },
                                                                    With(
                                                                        {
                                                                            varPortfolioManager: Coalesce(
                                                                                Concat(
                                                                                    ForAll(
                                                                                        varLastTriggeredApproval,
                                                                                        {Mail: Text(Value.PortfolioManager)}
                                                                                    ),
                                                                                    Mail,
                                                                                    Char(13)
                                                                                ),
                                                                                "None"
                                                                            ),
                                                                            varDefaultApprovers: Coalesce(
                                                                                Concat(
                                                                                    ForAll(
                                                                                        varLastTriggeredApproval,
                                                                                        {Mail: Text(Value.Approvers)}
                                                                                    ),
                                                                                    Mail,
                                                                                    Char(13)
                                                                                ),
                                                                                "None"
                                                                            ),
                                                                            varDefaultContributors: Coalesce(
                                                                                Concat(
                                                                                    ForAll(
                                                                                        varLastTriggeredApproval,
                                                                                        {Mail: Text(Value.Contributors)}
                                                                                    ),
                                                                                    Mail,
                                                                                    Char(13)
                                                                                ),
                                                                                "None"
                                                                            ),
                                                                            varDefaultNotifications: Coalesce(
                                                                                Concat(
                                                                                    ForAll(
                                                                                        varLastTriggeredApproval,
                                                                                        {Mail: Text(Value.Notifications)}
                                                                                    ),
                                                                                    Mail,
                                                                                    Char(13)
                                                                                ),
                                                                                "None"
                                                                            )
                                                                        },
                                                                        Switch(
                                                                            varTracking.'Last Triggered Approval Mode',
                                                                            'Approval Mode'.'Formal Approval',
                                                                            $"Portfolio Manager:{Char(13)}{varPortfolioManager}{Char(13)}{Char(13)}Contributors:{Char(13)}{varDefaultContributors}{Char(13)}{Char(13)}Approvers:{Char(13)}{varDefaultApprovers}{Char(13)}{Char(13)}Notifications:{Char(13)}{varDefaultNotifications}",
                                                                            'Approval Mode'.'Local Approval',
                                                                            $"Approvers:{Char(13)}{varDefaultApprovers}{Char(13)}{Char(13)}Notifications:{Char(13)}{varDefaultNotifications}",
                                                                            'Approval Mode'.'Only Notifications',
                                                                            $"Notifications:{Char(13)}{varDefaultNotifications}",
                                                                            Blank()
                                                                        )
                                                                    )
                                                                ),
                                                                With(
                                                                    {
                                                                        varPortfolioManager: Coalesce(
                                                                            varDefaultApprovalAppSettings.'Portfolio Manager'.Mail,
                                                                            "None"
                                                                        ),
                                                                        varDefaultApprovers: Coalesce(
                                                                            Concat(
                                                                                ForAll(
                                                                                    Table(ParseJSON(varDefaultApprovalAppSettings.'Default Approvals')),
                                                                                    {Mail: Text(Value.PersonaRole)}
                                                                                ),
                                                                                Mail,
                                                                                Char(13)
                                                                            ),
                                                                            "None"
                                                                        ),
                                                                        varDefaultContributors: Coalesce(
                                                                            Concat(
                                                                                ForAll(
                                                                                    Table(ParseJSON(varDefaultApprovalAppSettings.'Default Contributors')),
