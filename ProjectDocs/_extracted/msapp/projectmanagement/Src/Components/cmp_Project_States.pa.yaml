                                    Text: =
                                    Tooltip: =$"{ThisItem.Name}"
                                    Width: =If(ThisItem.HasGate, Parent.Width-con_State_Card_Gate.Width-20, Parent.Width-20)
                                    X: =rec_First.X+rec_First.Width
                                    Y: =Parent.Height/2-Self.Height/2
                              - ico_Check:
                                  Control: Classic/Icon@2.5.0
