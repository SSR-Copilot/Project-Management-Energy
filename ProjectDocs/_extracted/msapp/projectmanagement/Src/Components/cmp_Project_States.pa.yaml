                                    Fill: |-
                                      =Switch(
                                          ThisItem.State.StateProgress,
                                          gblAppConstants.ApprovalClusterStates.InProgress,
                                          gblAppColors.ApprovalClusterStates.InProgress,
                                          gblAppConstants.ApprovalClusterStates.Completed,
                                          gblAppColors.ApprovalClusterStates.Completed,
                                          gblAppConstants.ApprovalClusterStates.Rejected,
                                          gblAppColors.ApprovalClusterStates.Rejected,
                                          gblAppConstants.ApprovalClusterStates.RequestCanceled,
                                          gblAppColors.ApprovalClusterStates.RequestCanceled,
                                          gblAppConstants.ApprovalClusterStates.Abandoned,
                                          gblAppColors.ApprovalClusterStates.Inactive,
                                          gblAppConstants.ApprovalClusterStates.Inactive,
                                          gblAppColors.ApprovalClusterStates.Inactive,
                                          If(
                                              And(
                                                  ThisItem.RowNumber = 1,
                                                  IsBlank(ThisItem.State)
                                              ),
                                              gblAppColors.ApprovalClusterStates.InProgress,
                                              gblAppColors.ApprovalClusterStates.NotStarted
                                          )
                                      )
                                    Font: =Font.'Segoe UI'
                                    Height: =Min(24,Parent.Height-4)
                                    HoverBorderColor: =gblAppColors.BorderColor
