ComponentDefinitions:
  cmp_PopUp_Confirmation:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      CancelButtonText:
        PropertyKind: Input
        DisplayName: Cancel Button Text
        Description: Right Button Text
        DataType: Text
        Default: ="Cancel"
      ConfirmButtonText:
        PropertyKind: Input
        DisplayName: Confirm Button Text
        Description: Confirm Button Text
        DataType: Text
        Default: ="Confirm"
      Description:
        PropertyKind: Input
        DisplayName: Description
        Description: Description text
        DataType: Text
        Default: ="Description..."
      IconLeftButton:
        PropertyKind: Input
        DisplayName: Icon Left Button
        Description: Icon Fluent UI Name Left Button
        DataType: Text
        Default: ="Cancel"
      IconRightButton:
        PropertyKind: Input
        DisplayName: Icon Right Button
        Description: Icon Fluent UI Name Right Button
        DataType: Text
        Default: ="CheckMark"
      OnCancel:
        PropertyKind: Event
        DisplayName: OnCancel
        Description: OnCancel action of cancel button
        ReturnType: Boolean
        Default: =true
      OnConfirm:
        PropertyKind: Event
        DisplayName: OnConfirm
        Description: OnConfirm action of confirm button
        ReturnType: None
        Default: =
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Title text
        DataType: Text
        Default: ="Title"
    Children:
      - con_PopUpConfirmation:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_PopUpConfirmation_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.White
                  Height: =260
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =Min(490, Parent.Width)
                  X: =Parent.Width/2-Self.Width/2
                  Y: =Parent.Height/2-Self.Height/2
                Children:
                  - con_PopUpConfirmation_BodyHeader:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue(gblAppTheme.palette.themePrimary)
                        FillPortions: =0
                        Height: =40
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_PopUpConfirmation_BodyHeader:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisplayMode: =DisplayMode.View
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              PaddingLeft: =0
                              Size: =12
                              Text: =cmp_PopUp_Confirmation.Title
                              Width: =Parent.Width-Self.X-40
                              X: =20
                              Y: =Parent.Height/2-Self.Height/2
                        - ico_PopUpConfirmation_BodyHeader:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =Color.Transparent
                              BorderStyle: =BorderStyle.None
                              Color: =ColorValue(gblAppTheme.palette.white)
                              DisabledBorderColor: =Color.Transparent
                              Height: =20
                              HoverColor: =Self.Color
                              Icon: =Icon.Cancel
                              OnSelect: =cmp_PopUp_Confirmation.OnCancel()
                              PressedColor: =ColorValue(gblAppTheme.palette.themeLighter)
                              Tooltip: ="Cancel"
                              Width: =20
                              X: =Parent.Width-Self.Width-15
                              Y: =Parent.Height/2-Self.Height/2
                  - con_PopUpConfirmation_BodyDescription:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_PopUpConfirmation_BodyDescription:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisplayMode: =DisplayMode.View
                              Font: =Font.'Open Sans'
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingBottom: =0
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =0
                              Size: =11
                              Text: =cmp_PopUp_Confirmation.Description
                              Width: =Parent.Width
                  - con_PopUpConfirmation_BodyButtons:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =60
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - pcf_PopUpConfirmation_BodyButtons_Confirm:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.Icon
                            Properties:
                              DisplayMode: |
                                =DisplayMode.Edit
                              FillColor: =gblAppTheme.palette.themePrimary
                              FontColor: =gblAppTheme.palette.white
                              Height: =32
                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              HoverIconColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.white
                                )
                              IconName: ="CheckMark"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              OnChange: =cmp_PopUp_Confirmation.OnConfirm()
                              Text: =cmp_PopUp_Confirmation.ConfirmButtonText
                              TextAlignment: ='PowerCAT.Icon.TextAlignment'.Center
                              Theme: =gblAppThemeJson
                              Tooltip: =""
                              Width: =128
                              X: =pcf_PopUpConfirmation_BodyButtons_Cancel.X - Self.Width - 20
                              Y: =Parent.Height/2-Self.Height/2
                        - pcf_PopUpConfirmation_BodyButtons_Cancel:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.Icon
                            Properties:
                              BorderColor: =gblAppTheme.palette.themePrimary
                              FillColor: =gblAppTheme.palette.white
                              FontColor: =gblAppTheme.palette.themePrimary
                              Height: =32
                              HoverBorderColor: =gblAppTheme.palette.hoverButton
                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.themePrimary
                                )
                              IconName: ="Cancel"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              OnChange: =cmp_PopUp_Confirmation.OnCancel()
                              Text: =cmp_PopUp_Confirmation.CancelButtonText
                              Theme: =gblAppThemeJson
                              Tooltip: =""
                              Width: =96
                              X: =Parent.Width -Self.Width - 20
                              Y: =Parent.Height/2-Self.Height/2
