ComponentDefinitions:
  cmp_PopUp_Confirmation_2:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      CancelButtonText:
        PropertyKind: Input
        DisplayName: Cancel Button Text
        Description: Right Button Text
        DataType: Text
        Default: ="Cancel"
      ConfirmButtonText:
        PropertyKind: Input
        DisplayName: Confirm Button Text
        Description: Confirm Button Text
        DataType: Text
        Default: ="Confirm"
      Description:
        PropertyKind: Input
        DisplayName: Description
        Description: Description text
        DataType: Text
        Default: ="Description..."
      IconLeftButton:
        PropertyKind: Input
        DisplayName: Icon Left Button
        Description: Icon Fluent UI Name Left Button
        DataType: Text
        Default: ="Cancel"
      IconRightButton:
        PropertyKind: Input
        DisplayName: Icon Right Button
        Description: Icon Fluent UI Name Right Button
        DataType: Text
        Default: ="CheckMark"
      OnCancel:
        PropertyKind: Event
        DisplayName: OnCancel
        Description: OnCancel action of cancel button
        ReturnType: Boolean
        Default: =true
      OnConfirm:
        PropertyKind: Event
        DisplayName: OnConfirm
        Description: OnConfirm action of confirm button
        ReturnType: Boolean
        Default: =true
      Title:
        PropertyKind: Input
        DisplayName: Title
        Description: Title text
        DataType: Text
        Default: ="Title"
    Children:
      - con_PopUpConfirmation_1:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.7)
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - con_PopUpConfirmation_Body_1:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =Color.White
                  Height: =260
                  LayoutDirection: =LayoutDirection.Vertical
                  Width: =Min(450, Parent.Width)
                  X: =Parent.Width/2-Self.Width/2
                  Y: =Parent.Height/2-Self.Height/2
                Children:
                  - con_PopUpConfirmation_BodyHeader_1:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        Fill: =ColorValue(gblAppTheme.palette.themePrimary)
                        FillPortions: =0
                        Height: =40
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_PopUpConfirmation_BodyHeader_1:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =Color.White
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisplayMode: =DisplayMode.View
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              PaddingLeft: =0
                              Size: =12
                              Text: =cmp_PopUp_Confirmation_2.Title
                              Width: =Parent.Width-Self.X-40
                              X: =20
                              Y: =Parent.Height/2-Self.Height/2
                        - ico_PopUpConfirmation_BodyHeader_1:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              BorderColor: =Color.Transparent
                              BorderStyle: =BorderStyle.None
                              Color: =ColorValue(gblAppTheme.palette.white)
                              DisabledBorderColor: =Color.Transparent
                              Height: =20
                              HoverColor: =Self.Color
                              Icon: =Icon.Cancel
                              OnSelect: =cmp_PopUp_Confirmation_2.OnCancel()
                              PressedColor: =ColorValue(gblAppTheme.palette.themeLighter)
                              Tooltip: ="Cancel"
                              Width: =20
                              X: =Parent.Width-Self.Width-15
                              Y: =Parent.Height/2-Self.Height/2
                  - con_PopUpConfirmation_BodyDescription_1:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        DropShadow: =DropShadow.None
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingTop: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - lbl_PopUpConfirmation_BodyDescription_1:
                            Control: Label@2.5.1
                            Properties:
                              AutoHeight: =true
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              Color: =RGBA(50, 49, 48, 1)
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledColor: =RGBA(161, 159, 157, 1)
                              DisplayMode: =DisplayMode.View
                              Font: =Font.'Open Sans'
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingBottom: =0
                              PaddingLeft: =20
                              PaddingRight: =20
                              PaddingTop: =0
                              Size: =11
                              Text: =cmp_PopUp_Confirmation_2.Description
                              Width: =Parent.Width
                  - con_PopUpConfirmation_BodyButtons_1:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        FillPortions: =0
                        Height: =60
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
