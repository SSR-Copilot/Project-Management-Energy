# The gates from VSBCloud-Harness-Plan.md, section 6.5, as CI.
#
# Ordered so the cheapest failure comes first: a bad type is 14 seconds, the unit suite is a
# minute, the scenario walk needs a browser. A contributor should learn what is wrong in the
# first job, not the last.
#
# G-SEC is deliberately absent from the `gates` job and lives in `security` below, because it
# cannot be satisfied from a repository: it is a statement about a Dataverse environment. It
# skips loudly and passes when no environment is configured, which is the normal state of
# this package, and that must never be mistaken for the gate having been met.
name: gates

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  gates:
    name: G-TYPE · G-IDS · G-MATRIX · G-OWN · G-LABEL · G-UNIT · G-BUILD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: G-TYPE — tsc --noEmit
        run: npm run gate:type

      # The four static gates need no build and no browser, so they run before the suite.
      - name: G-IDS — no duplicate or phantom test ids
        run: npm run gate:ids
      - name: G-MATRIX — the security matrix is consistent
        run: npm run gate:matrix
      - name: G-OWN — every create writes the owning business unit
        run: npm run gate:own
      - name: G-LABEL — no new label drift against the canvas
        run: npm run gate:label

      - name: G-UNIT — the whole suite
        run: npm run gate:unit
      - name: G-BUILD — vite build
        run: npm run gate:build

      - name: coverage
        run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  walk:
    name: G-WALK · the scenario walk
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Playwright is deliberately NOT a dependency of this package: a browser download in
      # every developer's install, for one script, is a bad trade. CI adds it outside the
      # lockfile, which is exactly what the script's own header tells a human to do.
      - name: install a browser, outside the lockfile
        run: |
          npm i -D --no-save playwright
          npx playwright install --with-deps chromium

      - name: build and serve
        run: |
          npm run build
          npx vite preview --port 4176 --host 127.0.0.1 &
          for i in $(seq 1 20); do curl -sf -o /dev/null http://127.0.0.1:4176/ && break; sleep 2; done

      - name: G-WALK — walk every screen in mock mode
        run: APP_URL=http://127.0.0.1:4176 node scripts/scenario.mjs

  security:
    name: G-SEC · Dataverse must refuse
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # No environment configured: the gate says so and exits 0. Configure the two secrets
      # and it becomes the check that closes Phase 1 — an authenticated identity holding no
      # VSB admin role must be refused BY DATAVERSE on a direct write to each of the 13
      # master-data tables. The token must belong to an UNPRIVILEGED identity; running this
      # as the deployment identity reports every table as a failure, which is the gate
      # working correctly.
      - name: G-SEC
        env:
          VSB_GSEC_URL: ${{ secrets.VSB_GSEC_URL }}
          VSB_GSEC_TOKEN: ${{ secrets.VSB_GSEC_TOKEN }}
        run: npm run gate:sec

  phase-exit:
    name: phase exit · strict gates
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # What a PHASE exit needs that a commit does not: the baselines count as failures. A
      # baseline is a to-do list, not a permission, and a phase does not close with one open.
      - name: strict gates
        env:
          VSB_GSEC_URL: ${{ secrets.VSB_GSEC_URL }}
          VSB_GSEC_TOKEN: ${{ secrets.VSB_GSEC_TOKEN }}
        run: npm run gates:phase
