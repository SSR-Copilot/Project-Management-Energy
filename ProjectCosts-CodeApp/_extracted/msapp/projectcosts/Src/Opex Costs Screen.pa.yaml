                        - pcf_OpexCosts_RightPanel_NewEditCost_BodyButtons_InflationProfileUpdates:
                            Control: Timer@2.1.0
                            Properties:
                              Color: =RGBA(255, 255, 255, 1)
                              Duration: =1000
                              Height: =27
                              HoverColor: =RGBA(255, 255, 255, 1)
                              OnTimerEnd: |
                                =UpdateContext(
                                    {
                                        locSpinnerInformationText: "Updating inflation profiles on child costs...",
                                        locIsVisiblePopUpSpinner: true
                                    }
                                );
                                Patch(
                                    'Opex Project Costs',
                                    locOpexCostChild,
                                    {
                                        'Use Inflation Profile': locSelectedOpexCost.'Use Inflation Profile',
                                        'Use Country Inflation Profile': locSelectedOpexCost.'Use Country Inflation Profile',
                                        'Inflation Profile': locSelectedOpexCost.'Inflation Profile',
                                        'Inflation Start Year': locSelectedOpexCost.'Inflation Start Year',
                                        'Inflation Country Area': locSelectedOpexCost.'Inflation Country Area',Threshold:locSelectedOpexCost.Threshold,'Threshold individual':locSelectedOpexCost.'Threshold individual','Threshold Type':locSelectedOpexCost.'Threshold Type','Align With Project Duration':tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_AlignWithProjectDuration.Checked
                                    }
                                );
                                UpdateContext(
                                    {
                                        locOpexCostChild: LookUp(
                                            'Opex Project Costs',
                                            'Parent Cost'.'Opex Project Cost' = locOpexCostChild.'Opex Project Cost'
                                        )
                                    }
                                );
                                If(
                                    Not(IsBlank(locOpexCostChild)),
                                    UpdateContext({locRunTimer: false});
                                    UpdateContext({locRunTimer: true})
                                );
                                If(
                                    IsBlank(locOpexCostChild),
                                    ClearCollect(
                                        colOpexProjectCosts,
                                        Filter(
                                            'Opex Project Costs',
                                            Project.Project = gblSelectedProject.Project
                                        )
                                    );
                                    UpdateContext(
                                        {
                                            locSpinnerInformationText: "",
                                            locIsVisiblePopUpSpinner: false,
                                            locSelectedDeviceOpexCost: Blank(),
                                            locCandidateOpexCostDesc: Blank(),
                                            locTimer: false
                                        }
                                    );
                                    Select(pcf_OpexCosts_RightPanel_NewEditCost_BodyButtons_Reset)
                                );
                              Start: =locRunTimer
                              Visible: =false
                              X: =40
                              Y: =33
      - cmp_OpexCosts_PopUpConfirmation_DeleteCost:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            Description: |-
              =If(
                  IsBlank(locSelectedOpexCost),
                  "Are you sure that you want to permanently delete """ & locSelectedOpexCost.Description & """Cost and all its related periods?",
                  "Are you sure that you want to permanently delete """ & locSelectedOpexCost.Description & """ cost?"
              )
            Height: =Parent.Height
            IconCancelButton: ="Cancel"
            IconConfirmButton: ="Delete"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteOpexCosts: false})
            OnConfirm: |-
              =UpdateContext(
                  {
                      locSpinnerInformationText: "Deleting OPEX cost...",
                      locIsVisiblePopUpSpinner: true,
                      locIsVisiblePopUpDeleteOpexCosts: false
                  }
              );
              If(
                  IsBlank(locSelectedOpexCost.'Parent Cost'),
                  RemoveIf(
                      'Opex Project Costs',
                      Or(
                          'Parent Cost'.'Opex Project Cost' = locSelectedOpexCost.'Opex Project Cost',
                          'Opex Project Cost' = locSelectedOpexCost.'Opex Project Cost'
                      )
                  ),
                  RemoveIf(
                      'Opex Project Costs',
                      'Opex Project Cost' = locSelectedOpexCost.'Opex Project Cost'
                  )
              );
              ClearCollect(
                  colOpexProjectCosts,
                  Filter(
                      'Opex Project Costs',
                      Project.Project = gblSelectedProject.Project
                  )
              );
              UpdateContext(
                  {
                      locSelectedSubaccount: Blank(),
                      locSelectedDeviceTypeInProject: Blank(),
                      locSelectedOpexCost: Blank(),
                      locSelectedOpexCostParent: Blank()
                  }
              );
              UpdateContext(
                  {
                      locIsVisiblePopUpSpinner: false,
                      locSpinnerInformationText: ""
                  }
              );
              /*UpdateContext({
                  locSpinnerInformationText: "Deleting OPEX cost...",
                  locIsVisiblePopUpSpinner: true,
                  locIsVisiblePopUpDeleteOpexCosts: false
              });
              Remove('Opex Project Costs', locSelectedOpexCost);
              ClearCollect(colOpexProjectCosts, Filter('Opex Project Costs', Project.Project = gblSelectedProject.Project));
              UpdateContext({
                  locSelectedSubaccount: Blank(),
                  locSelectedDeviceTypeInProject: Blank(),
                  locSelectedOpexCost: Blank(),
                  locSelectedOpexCostParent: Blank()
              });
              UpdateContext({
                  locIsVisiblePopUpSpinner: false,
                  locSpinnerInformationText: ""
              });*/
            TextCancelButton: ="Cancel"
            TextConfirmButton: ="Delete"
            Title: ="Delete OPEX cost?"
            Visible: =locIsVisiblePopUpDeleteOpexCosts
            Width: =Parent.Width
            WidthConfirmButton: =96
