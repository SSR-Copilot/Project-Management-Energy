Screens:
  Opex Costs Screen:
    Properties:
      Fill: =gblAppStyles.Screen.Fill
      LoadingSpinner: =LoadingSpinner.Data
      OnVisible: |
        =UpdateContext(
            {
                locSelectedAccount: If(
                    gblLeftNavigationSelected.ItemDisplayName = "Operation & Maintenance",
                    First(colOpexAccounts),
                    gblLeftNavigationSelected.ItemDisplayName = "Other OPEX Costs",
                    Last(colOpexAccounts)
                ),
                locSelectedDeviceTypeInProject: Blank(),
                locSelectedOpexCost: Blank(),
                locSelectedOpexCostParent: Blank(),
                locIsVisibleRightPanelNewEditOpexCost: false,
                locIsVisiblePopUpDeleteOpexCosts: false,
                locSpinnerInformationText: "",
                locIsVisiblePopUpSpinner: false,
                locCandidateOpexCostDesc: "",
                locColDistributionFrequency: Table(
                    {
                        Name: "1 month",
                        Value: 1
                    },
                    {
                        Name: "2 months",
                        Value: 2
                    },
                    {
                        Name: "3 months",
                        Value: 3
                    },
                    {
                        Name: "6 months",
                        Value: 6
                    },
                    {
                        Name: "12 months",
                        Value: 12
                    }
                )
            }
        );
        With(
            {
                varSelectedSubaccount: LookUp(
                    colOpexSubaccounts,
                    Account.'Opex Account' = locSelectedAccount.'Opex Account'
                )
            },
            UpdateContext(
                {
                    locSelectedSubaccount: LookUp(
                        colOpexSubaccounts,
                        Account.'Opex Account' = locSelectedAccount.'Opex Account'
                    ),
                    locSelectedSubaccountOandM: If(
                        varSelectedSubaccount.Name = "Operation & Maintenance",
                        true,
                        false
                    )
                }
            )
        );
        ClearCollect(
            colDeviceTypesInProject,
            AddColumns(
                Sort(
                    AddColumns(
                        Filter(
                            DeviceTypesInProjects,
                            AsType(
                                TypeInProject,
                                GeneratorTypeInProjects
                            ).Project.Project = gblSelectedProject.Project
                        ) As DeviceItem,
                        CreatedOnGenerator,
                        LookUp(
                            GeneratorTypeInProjects,
                            And(
                                Project.Project = gblSelectedProject.Project,
                                Name = DeviceItem.Name
                            )
                        )
                    ),
                    CreatedOnGenerator.'Created On',
                    SortOrder.Ascending
                ),
                IsFolded,
                true
            )
        );
        Collect(
            colDeviceTypesInProject,
            AddColumns(
                Filter(
                    DeviceTypesInProjects,
                    AsType(
                        TypeInProject,
                        PVModuleTypeInProjects
                    ).Project.Project = gblSelectedProject.Project
                ),
                IsFolded,
                true
            )
        );
        ClearCollect(
            colOpexProjectCosts,
            Filter(
                'Opex Project Costs',
                Project.Project = gblSelectedProject.Project
            )
        );
    Children:
      - con_OpexCosts_Screen:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =gblAppSizes.Padding.Page
            Width: =Parent.Width
            X: |-
              =If(
                  App.Width < 1920,
                  gblAppSizes.Padding.Page,
                  Max((App.Width-Self.Width)/2,gblAppSizes.Padding.Page)
              )
            Y: =gblAppSizes.Padding.Page
          Children:
            - cmp_OpexCosts_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: =gblTableApprovalStateColors
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: |-
                    =//Navigate('Capex Costs Screen',ScreenTransition.Fade);
                    Launch(gblPMAppURL)
                  Project: =gblProjectHeaderData
                  Width: =Parent.Width
            - con_OpexCosts_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height-Self.Y-con_OpexCosts_Footer.Height-20
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =6
                  PaddingRight: =6
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - con_OpexCosts_LeftNavigationMenu:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =200
                        Width: =If(gblLeftNavigationMenuIsExpanded, gblAppSizes.LeftNavigation.ExpandedWidth,gblAppSizes.LeftNavigation.DecreasedWidth)
                      Children:
                        - cmp_OpexCosts_Left_Navigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftNavigationMenu
                              OnExpand: |-
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |
                                =If(
                                    Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                    Set(
                                        gblLeftNavigationSelected,
                                        LookUp(
                                            LeftNavigationMenu,
                                            ItemKey = Self.SelectedKey
                                        )
                                    );
                                    Navigate(
                                        gblLeftNavigationSelected.TargetScreen,
                                        ScreenTransition.Fade
                                    )
                                );
                              Selected: =gblLeftNavigationSelected
                              Width: =Parent.Width
                  - con_OpexCosts_Content:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =ColorValue(gblAppTheme.palette.white)
                        Height: =Parent.Height-Self.Y
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingRight: =6
                        Visible: =Not(IsBlank(gblSelectedProject))
                        Width: =Parent.Width
                      Children:
                        - con_OpexCosts_Content_OpexAccounts:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =10
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width-Self.X*2
                            Children:
                              - txt_OpexCosts_Content_OpexAccounts_DO_NOT_DELETE:
                                  Control: Label@2.5.1
                                  Properties:
                                    Text: |-
                                      =// Require to workaround MS bug with downloading only needed (column) data - do not see required Name column data in tab
                                      First(colOpexAccounts).Name
                                    Visible: =false
                                    Width: =461
                              - tab_OpexCosts_Content_OpexAccounts:
                                  Control: TabList@2.2.31
                                  Properties:
                                    Alignment: ='TabList.Alignment'.Horizontal
                                    DefaultSelectedItems: =LookUp(colOpexAccounts, 'Opex Account' = locSelectedAccount.'Opex Account')
                                    Height: =50
                                    Items: =colOpexAccounts
                                    OnSelect: |
                                      =UpdateContext(
                                          {
                                              locSelectedAccount: Self.Selected,
                                              locSelectedDeviceTypeInProject: Blank(),
                                              locSelectedOpexCost: Blank()
                                          }
                                      );
                                      UpdateContext(
                                          {
                                              locSelectedSubaccount: If(
                                                  locSelectedAccount.Name = "Operation & Maintenance",
                                                  LookUp(
                                                      colOpexSubaccounts,
                                                      Account.'Opex Account' = locSelectedAccount.'Opex Account'
                                                  ),
                                                  Blank()
                                              ),
                                              locSelectedSubaccountOandM: If(
                                                  locSelectedAccount.Name = "Operation & Maintenance",
                                                  true,
                                                  false
                                              )
                                          }
                                      );
                                    Size: ='TabList.Size'.Medium
                                    Visible: =false
                                    Width: =Parent.Width
                                    Y: =1
                                  Children:
                                    - vsb_name4:
                                        Control: TabListDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="vsb_name"
                                          FieldName: ="vsb_name"
                                          FieldType: ="s"
                                          Order: =2
                        - lbl_OpexCosts_Content_GeneratorsInProject_Instruction:
                            Control: Label@2.5.1
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Font: =gblAppStyles.Label.Font
                              FontWeight: =FontWeight.Semibold
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              Size: =gblAppSizes.Font.Small
                              Text: ="Please add a generator and refresh this page to enter Operation & Maintenance costs"
                              Visible: =gal_OpexCosts_Content_GeneratorsInProject.AllItemsCount=0 && gblLeftNavigationSelected.ItemDisplayName="Operation & Maintenance"
                              Width: =Parent.Width-80
                        - gal_OpexCosts_Content_Subaccounts:
                            Control: Gallery@2.15.0
                            Variant: VariableHeight
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =gblAppStyles.Gallery.BorderColor
                              BorderStyle: =gblAppStyles.Gallery.BorderStyle
                              BorderThickness: =gblAppStyles.Gallery.BorderThickness
                              Fill: =gblAppStyles.Gallery.Fill
                              FillPortions: =0
                              FocusedBorderColor: =gblAppStyles.Gallery.BorderColor
                              FocusedBorderThickness: =gblAppStyles.Gallery.FocusedBorderThickness
                              Height: |+
                                =//Sum(RenameColumns(ForAll(gal_Account_Accounts.AllItems, Value(lbl_Account_AccountItemHeightValue_Hidden.Text)),"Value", "RowHeight"), RowHeight) + Self.TemplatePadding * Self.AllItemsCount + gblAppSizes.Padding.Page
                                Parent.Height-Self.Y

                              Items: =Filter(colOpexSubaccounts, Account.Name = "Other OPEX Costs")
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LoadingSpinner: =LoadingSpinner.None
                              LoadingSpinnerColor: =gblAppStyles.Gallery.LoadingSpinnerColor
                              TemplateFill: =gblAppStyles.Gallery.TemplateFill
                              TemplatePadding: =0
                              TemplateSize: =200
                              Visible: =gblLeftNavigationSelected.ItemDisplayName = "Other OPEX Costs"
                              Width: =Parent.Width-Self.X
                            Children:
                              - lbl_OpexCosts_Content_Subaccounts_CardItemHeightValue_Hidden:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    AutoHeight: =true
                                    BorderColor: =gblAppStyles.Label.BorderColor
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =gblAppStyles.Label.BorderThickness
                                    Color: =gblAppStyles.Label.Color
                                    DisabledBorderColor: =gblAppStyles.Label.DisabledBorderColor
                                    DisabledColor: =gblAppStyles.Label.DisabledColor
                                    DisabledFill: =gblAppStyles.Label.DisabledFill
                                    DisplayMode: =DisplayMode.View
                                    Fill: =gblAppStyles.Label.Fill
                                    FocusedBorderColor: =gblAppStyles.Label.FocusedBorderColor
                                    FocusedBorderThickness: =gblAppStyles.Label.FocusedBorderThickness
                                    Font: =gblAppStyles.Label.Font
                                    FontWeight: =FontWeight.Semibold
                                    Height: =35
                                    HoverBorderColor: =gblAppStyles.Label.HoverBorderColor
                                    HoverColor: =gblAppStyles.Label.HoverColor
                                    HoverFill: =gblAppStyles.Label.HoverFill
                                    PaddingLeft: =0
                                    PressedBorderColor: =gblAppStyles.Label.PressedBorderColor
                                    PressedColor: =gblAppStyles.Label.PressedColor
                                    PressedFill: =gblAppStyles.Label.PressedFill
                                    Size: =gblAppSizes.Font.Medium
                                    Text: =con_OpexCosts_Content_Subaccounts_Card.Height
                                    Visible: =false
                                    Width: =Len(Self.Text)*14
                                    Wrap: =false
                              - con_OpexCosts_Content_Subaccounts_Card:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =gblAppStyles.Container.BorderColor
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =gblAppStyles.Container.BorderThickness
                                    Fill: =ColorValue(gblAppTheme.palette.white)
                                    Height: |+
                                      =If(
                                          ThisItem.IsFolded,
                                          con_OpexCosts_Content_Subaccounts_CardHeader.Height,
                                          con_OpexCosts_Content_Subaccounts_CardHeader.Height+con_OpexCosts_Content_Subaccounts_CardBody.Height
                                      )

                                    Width: =Parent.Width-10
                                  Children:
                                    - con_OpexCosts_Content_Subaccounts_CardBody:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =gblAppStyles.Container.BorderColor
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =ColorValue(gblAppTheme.palette.white)
                                          Height: =Max(gal_OpexCosts_Content_Subaccounts_CardBody_Costs.Y+gal_OpexCosts_Content_Subaccounts_CardBody_Costs.Height+20,50)
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          LayoutOverflowY: =LayoutOverflow.Scroll
                                          PaddingLeft: =20
                                          Width: |-
                                            =//Max(Parent.Width, con_OpexCosts_Content_Subaccounts_CardBody_CostsTableHeader.Width)
                                            Parent.Width
                                          Y: =con_OpexCosts_Content_Subaccounts_CardHeader.Y+con_OpexCosts_Content_Subaccounts_CardHeader.Height
                                        Children:
                                          - pcf_con_OpexCosts_Content_Subaccounts_CardBody_SubaccountsCommandBar:
                                              Control: CodeComponent
                                              ComponentName: cat_PowerCAT.CommandBar
                                              Properties:
                                                Height: =40
                                                Items: |-
                                                  =Table(
                                                      {
                                                          ItemKey: "newOpexProjectCostType",
                                                          ItemDisplayName: "Add Contract Type",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: And(
                                                              DataSourceInfo(
                                                                  'Opex Project Costs',
                                                                  DataSourceInfo.CreatePermission
                                                              ),
                                                              If(
                                                                  locSelectedSubaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount',
                                                                  IsBlank(locSelectedOpexCost),
                                                                  true
                                                              ),
                                                              IsBlank(
                                                                  LookUp(
                                                                      'Opex Project Costs',
                                                                      And(
                                                                          Project.Project = gblSelectedProject.Project,
                                                                          'Is Standard Contract?' = 'Is Standard Contract? (Opex Project Costs)'.Yes,
                                                                          Subaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "newOpexProjectCost",
                                                          ItemDisplayName: "Add Period",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: And(
                                                              Not(IsBlank(locSelectedOpexCost)),
                                                              locSelectedSubaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount',
                                                              DataSourceInfo(
                                                                  'Opex Project Costs',
                                                                  DataSourceInfo.CreatePermission
                                                              ),
                                                              Not(locSelectedOpexCost.'Is Standard Contract?' = 'Is Standard Contract? (Opex Project Costs)'.Yes),
                                                              Not(
                                                                  StartsWith(
                                                                      locSelectedOpexCost.Name,
                                                                      "Standard"
                                                                  )
                                                              ),
                                                              Not(
                                                                  CountRows(
                                                                      Filter(
                                                                          colOpexProjectCosts,
                                                                          And(
                                                                              Description = locCandidateOpexCostDesc,
                                                                              DeviceTypeInProject.DeviceTypesInProject = locSelectedDeviceTypeInProject.DeviceTypesInProject
                                                                          )
                                                                      )
                                                                  ) > 0
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "newAddStandardContractKey",
                                                          ItemDisplayName: "Add Standard Contract",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: And(
                                                              Not(
                                                                  IsBlank(
                                                                      LookUp(
                                                                          'OPEX & Land Lease Standard Assumptions',
                                                                          And(
                                                                              Country.Country = gblSelectedProject.Country.Country,
                                                                              Technology = gblSelectedProject.Technology,
                                                                              'Type Of Contract' = 'Contract Types'.'Opex Other',
                                                                              'Opex Subaccount'.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                                          )
                                                                      )
                                                                  )
                                                              ),
                                                              IsBlank(
                                                                  LookUp(
                                                                      'Opex Project Costs',
                                                                      And(
                                                                          Project.Project = gblSelectedProject.Project,
                                                                          'Is Standard Contract?' = 'Is Standard Contract? (Opex Project Costs)'.Yes,
                                                                          Subaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                                      )
                                                                  )
                                                              ),
                                                              IsBlank(
                                                                  LookUp(
                                                                      'Opex Project Costs',
                                                                      And(
                                                                          Project.Project = gblSelectedProject.Project,
                                                                         // 'Is Standard Contract?' = 'Is Standard Contract? (Opex Project Costs)'.Yes,
                                                                          Subaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "editOpexProjectCost",
                                                          ItemDisplayName: "Edit",
                                                          ItemIconName: "Edit",
                                                          ItemEnabled: And(
                                                              Not(IsBlank(locSelectedOpexCost)),
                                                              locSelectedSubaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount',
                                                              RecordInfo(
                                                                  locSelectedOpexCost,
                                                                  RecordInfo.EditPermission
                                                              ),
                                                              Not(locSelectedOpexCost.'Is Standard Contract?' = 'Is Standard Contract? (Opex Project Costs)'.Yes),
                                                              Not(
                                                                  StartsWith(
                                                                      locSelectedOpexCost.Name,
                                                                      "Standard"
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "deleteOpexProjectCost",
                                                          ItemDisplayName: "Delete",
                                                          ItemIconName: "Delete",
                                                          ItemEnabled: And(
                                                              Not(IsBlank(locSelectedOpexCost)),
                                                              locSelectedSubaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount',
                                                              RecordInfo(
                                                                  locSelectedOpexCost,
                                                                  RecordInfo.DeletePermission
                                                              ),
                                                              If(
                                                                  StartsWith(
                                                                      Lower(locSelectedOpexCost.Description),
                                                                      "standard"
                                                                  ),
                                                                  IsBlank(locSelectedOpexCost.'Parent Cost'),
                                                                  Or(
                                                                      IsBlank(locSelectedOpexCost.'Parent Cost'),
                                                                      With(
                                                                          {
                                                                              locFirstPeriod: LookUp(
                                                                                  colOpexProjectCosts,
                                                                                  'Opex Project Cost' = locSelectedOpexCost.'Parent Cost'.'Opex Project Cost'
                                                                              )
                                                                          },
                                                                          With(
                                                                              {
                                                                                  locLastPeriod: Last(
                                                                                      Sort(
                                                                                          Filter(
                                                                                              colOpexProjectCosts,
                                                                                              'Parent Cost'.'Opex Project Cost' = locFirstPeriod.'Opex Project Cost'
                                                                                          ),
                                                                                          Name,
                                                                                          SortOrder.Ascending
                                                                                      )
                                                                                  )
                                                                              },
                                                                              locLastPeriod.'Opex Project Cost' = locSelectedOpexCost.'Opex Project Cost'
                                                                          )
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      }
                                                  )
                                                OnSelect: |
                                                  =UpdateContext({locSelectedRecordTypeAddPeriod: Blank()});
                                                  Switch(
                                                      Self.Selected.ItemKey,
                                                      "newOpexProjectCostType",
                                                      UpdateContext(
                                                          {
                                                              locSelectedSubaccount: ThisItem,
                                                              locSelectedOpexCostParent: Blank(),
                                                              locSelectedOpexCost: Blank(),
                                                              locIsVisibleRightPanelNewEditOpexCost: true,
                                                              locSelectedProjectCosts: Filter(
                                                                  colOpexProjectCosts,
                                                                  Subaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                              ),
                                                              locSelectedOpexCostNext: Blank(),
                                                              locCODDate: gblSelectedProject.'Operations start date (COD)',
                                                              locSelectedDevice: ThisItem.Name,
                                                              locResetStartDate: true
                                                          }
                                                      );
                                                      UpdateContext({locIsStartDateStandardAssumption: 'IsStartDateStandardAssumption (Opex Project Costs)'.No}),
                                                      "newOpexProjectCost",
                                                      With(
                                                          {
                                                              varSelectedOpexCost: locSelectedOpexCost,
                                                              varSelectedSubaccount: gal_OpexCosts_Content_Subaccounts.Selected
                                                          },
                                                          UpdateContext(
                                                              {
                                                                  locSelectedSubaccount: varSelectedSubaccount,
                                                                  locIsVisibleRightPanelNewEditOpexCost: true,
                                                                  //locSelectedOpexCostParent: locSelectedOpexCost,
                                                                  locSelectedOpexCostParent: Coalesce(
                                                                      LookUp(
                                                                          colOpexProjectCosts,
                                                                          'Opex Project Cost' = locSelectedOpexCost.'Parent Cost'.'Opex Project Cost'
                                                                      ),
                                                                      locSelectedOpexCost
                                                                  ),
                                                                  locSelectedOpexCostNext: locSelectedOpexCost,
                                                                  locSelectedOpexCost: Blank(),
                                                                  locSelectedProjectCosts: Filter(
                                                                      colOpexProjectCosts,
                                                                      Subaccount.'Opex Subaccount' = varSelectedSubaccount.'Opex Subaccount'
                                                                  )
                                                              }
                                                          )
                                                      );
                                                      UpdateContext(
                                                          {
                                                              locCODDate: gblSelectedProject.'Operations start date (COD)',
                                                              locResetStartDate: IsBlank(locSelectedOpexCostNext)
                                                          }
                                                      ),
                                                      "newAddStandardContractKey",
                                                      UpdateContext(
                                                          {
                                                              locIsVisiblePopUpSpinner: true,
                                                              locSpinnerInformationText: "Please wait, loading Standard Assumption Contract..."
                                                          }
                                                      );
                                                      Clear(colOtherOpexPeriods);
                                                      Clear(colOtherOpexStandardAssumptionContract);
                                                      With(
                                                          {
                                                              recFilteredStandardContractsForProject: Filter(
                                                                  'Opex Project Costs',
                                                                  And(
                                                                      Project.Project = gblSelectedProject.Project,
                                                                      'Is Standard Contract?' = 'Is Standard Contract? (Opex Project Costs)'.Yes,
                                                                      Subaccount.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                                  )
                                                              ),
                                                              recCountryTechnologyRelatedStandardAssumption: Sort(
                                                                  Filter(
                                                                      'OPEX & Land Lease Standard Assumptions',
                                                                      And(
                                                                          Country.Country = gblSelectedProject.Country.Country,
                                                                          Technology = gblSelectedProject.Technology,
                                                                          'Type Of Contract' = 'Contract Types'.'Opex Other',
                                                                          'Opex Subaccount'.'Opex Subaccount' = ThisItem.'Opex Subaccount'
                                                                      )
                                                                  ),
                                                                  Description,
                                                                  SortOrder.Ascending
                                                              ),
                                                              recCODDate: gblSelectedProject.'Operations start date (COD)',
                                                              recCODYear: Year(gblSelectedProject.'Operations start date (COD)') + 1
                                                          },
                                                          If(
                                                              CountRows(recFilteredStandardContractsForProject) = 0,
                                                              With(
                                                                  {
                                                                      recSortedCountryTechnologyStandardAssumptions: recCountryTechnologyRelatedStandardAssumption,
                                                                      recStandardAssumptionContracts: Filter(
                                                                          recCountryTechnologyRelatedStandardAssumption,
                                                                          And(Period = 'Opex & Land Lease Period'.'Period 1')
                                                                      )
                                                                  },
                                                                  ForAll(
                                                                      recStandardAssumptionContracts,
                                                                      With(
                                                                          {StandardAssumptionContractRecord: ThisRecord},
                                                                          Collect(
                                                                              colOtherOpexStandardAssumptionContract,
                                                                              Patch(
                                                                                  'Opex Project Costs',
                                                                                  Defaults('Opex Project Costs'),
                                                                                  {
                                                                                      Project: gblSelectedProject,
                                                                                      Subaccount: StandardAssumptionContractRecord.'Opex Subaccount',
                                                                                      DeviceTypeInProject: Blank(),
                                                                                      Name: "Other OPEX Costs" & "-" & StandardAssumptionContractRecord.'Opex Subaccount'.Name & "-" & StandardAssumptionContractRecord.Description,
                                                                                      Description: Trim(StandardAssumptionContractRecord.Description),
                                                                                      'Start Date': recCODDate,
                                                                                      'Opex Project duration years': StandardAssumptionContractRecord.'Duration In Years',
                                                                                      'Opex Project duration months': StandardAssumptionContractRecord.'Duration in Months',
                                                                                      Currency: StandardAssumptionContractRecord.Currency,
                                                                                      'Fix Costs': StandardAssumptionContractRecord.'Fix Costs',
                                                                                      '% of Revenues': StandardAssumptionContractRecord.'% of Revenues',
                                                                                      Threshold: If(
                                                                                          StandardAssumptionContractRecord.'Threshold?' = 'Threshold? (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                                                          'Threshold (Opex Project Costs)'.Yes,
                                                                                          'Threshold (Opex Project Costs)'.No
