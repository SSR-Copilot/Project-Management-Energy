                              IconName: ="CheckMark"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              OnChange: "=UpdateContext(\n    {\n        locSpinnerInformationText: \"Saving OPEX cost...\",\n        locIsVisiblePopUpSpinner: true,\n        locIsVisibleRightPanelNewEditOpexCost: false,\n        locResetStartDate: false\n        /*,locSelectedSubaccount: If(\n            locSelectedAccount.Name = \"Operation & Maintenance\",\n            LookUp(\n                colOpexSubaccounts,\n                Account.'Opex Account' = locSelectedAccount.'Opex Account'\n            ),\n            locSelectedSubaccount\n        ),\n        locSelectedSubaccountOandM: If(\n            locSelectedAccount.Name = \"Operation & Maintenance\",\n            true,\n            false\n        )*/\n    }\n);\nIfError(\n    UpdateContext(\n        {\n            locSelectedOpexCost: Patch(\n                'Opex Project Costs',\n                If(\n                    IsBlank(locSelectedOpexCost),\n                    Defaults('Opex Project Costs'),\n                    locSelectedOpexCost\n                ),\n                {\n                    Project: gblSelectedProject,\n                    Subaccount: locSelectedSubaccount,\n                    DeviceTypeInProject: locSelectedDeviceTypeInProject,\n                    Name: If(\n                        IsBlank(locSelectedDeviceTypeInProject),\n                        locSelectedAccount.Name & \"-\" & locSelectedSubaccount.Name & \"-\" & txt_OpexCosts_RightPanel_NewEditCost_BodyContent_Description.Value,\n                        locSelectedSubaccount.Name & \"-\" & locSelectedDeviceTypeInProject.Name & \"-\" & txt_OpexCosts_RightPanel_NewEditCost_BodyContent_Description.Value\n                    ),\n                    Description: Trim(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_Description.Value),\n                    'Start Date': DateValue(dte_OpexCosts_RightPanel_NewEditCost_BodyContent_StartDate.SelectedDate),\n                    'Opex Project duration years': drp_OpexCosts_RightPanel_NewEditCost_BodyContent_DurationYears.Selected.Value,\n                    'Opex Project duration months': drp_OpexCosts_RightPanel_NewEditCost_BodyContent_DurationMonths.Selected.Value,\n                    Currency: drp_OpexCosts_RightPanel_NewEditCost_BodyContent_Currency.Selected,\n                    'Fix Costs': Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_FixCosts.Value),\n                    '% of Revenues': Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_ProcentOfRevenues.Value),\n                    Threshold: togl_OpexCosts_RightPanel_NewEditCost_BodyContent_Threshold.Checked,\n                    'Threshold Type': rdg_OpexCosts_RightPanel_NewEditCost_BodyContent_Threshold.Selected.Value,\n                    'Threshold individual': Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_Threshold_Individual.Value),\n                    'EUR/MWh': Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_EuroPerMwh.Value),\n                    'EUR/MW': Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_EuroPerMw.Value),\n                    'EUR/WTG': Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_EuroPerWtg.Value),\n                    Aggregation: drp_OpexCosts_RightPanel_NewEditCost_BodyContent_Aggregation.Selected.Value,\n                    'Parent Cost': locSelectedOpexCostParent,\n                    'Use Inflation Profile': tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_InflationProfile.Checked,\n                    'Use Country Inflation Profile': tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_CountryInflationProfile.Checked,\n                    'Inflation Profile': If(\n                        tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_InflationProfile.Checked,\n                        Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_InflationProfile.Value),\n                        Blank()\n                    ),\n                    'Inflation Start Year': If(\n                        tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_InflationProfile.Checked,\n                        Value(txt_OpexCosts_RightPanel_NewEditCost_BodyContent_InflationStartYear.Value),\n                        Blank()\n                    ),\n                    'Inflation Country Area': If(\n                        tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_CountryInflationProfile.Checked,\n                        drp_OpexCosts_RightPanel_NewEditCost_BodyContent_AreaInflationProfile.Selected.Value,\n                        Blank()\n                    ),\n                    'Distribution Frequency': drp_OpexCosts_RightPanel_NewEditCost_BodyContent_DistributionFrequency_Month.Selected.Value,\n                    'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)',\n                    'Align With Project Duration': tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_AlignWithProjectDuration.Checked,\n                    IsStartDateStandardAssumption: Coalesce(\n                        locSelectedOpexCostParent.IsStartDateStandardAssumption,\n                        locIsStartDateStandardAssumption\n                    ),\n                    'External Contract?': tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_ExternelContract.Checked,'Time Zone Rule Version Number':4\n                }\n            )\n        }\n    ),\n    Notify(\n        \"Error: OPEX cost could not be saved correctly. \" & \"Internal error: originated on \" & FirstError.Source & \". Message: \" & FirstError.Message & FirstError.Details.HttpResponse,\n        NotificationType.Error\n    )\n);\n// Get Child Cost for Updating In Loop\nUpdateContext(\n    {\n        varOpexChildCosts: Filter(\n            'Opex Project Costs',\n            'Parent Cost'.'Opex Project Cost' = locSelectedOpexCost.'Opex Project Cost'\n        ),\n        locOpexCostParent: locSelectedOpexCost\n    }\n);\nIf(\n    CountRows(varOpexChildCosts) > 0,\n    UpdateContext(\n        {\n            locSpinnerInformationText: \"Updating inflation profiles on child costs...\",\n            locIsVisiblePopUpSpinner: true\n        }\n    );\n    ForAll(\n        varOpexChildCosts As ChildCost,\n        Patch(\n            'Opex Project Costs',\n            ChildCost,\n            {\n                'Use Inflation Profile': locSelectedOpexCost.'Use Inflation Profile',\n                'Use Country Inflation Profile': locSelectedOpexCost.'Use Country Inflation Profile',\n                'Inflation Profile': locSelectedOpexCost.'Inflation Profile',\n                'Inflation Start Year': locSelectedOpexCost.'Inflation Start Year',\n                'Inflation Country Area': locSelectedOpexCost.'Inflation Country Area',\n                Threshold: locSelectedOpexCost.Threshold,\n                'Threshold individual': locSelectedOpexCost.'Threshold individual',\n                'Threshold Type': locSelectedOpexCost.'Threshold Type',\n                'Align With Project Duration': tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_AlignWithProjectDuration.Checked,\n               'External Contract?': tgl_OpexCosts_RightPanel_NewEditCost_BodyContent_ExternelContract.Checked\n            }\n        )\n    );\n    \n);\nClearCollect(\n    colOpexProjectCosts,\n    Filter(\n        'Opex Project Costs',\n        Project.Project = gblSelectedProject.Project\n    )\n);\nUpdateContext(\n    {\n        locSpinnerInformationText: \"\",\n        locIsVisiblePopUpSpinner: false,\n        locSelectedDeviceOpexCost: Blank(),\n        locCandidateOpexCostDesc: Blank(),\n        locSelectedOpexCostParent: Blank(),\n        locSelectedOpexCost: Blank(),\n        locSelectedDeviceTypeInProject: Blank(),\n        locIsStartDateStandardAssumption: Blank()\n    }\n);\nSelect(pcf_OpexCosts_RightPanel_NewEditCost_BodyButtons_Reset);\n/*\n// Get child cost\nUpdateContext(\n    {\n        locOpexCostChild: LookUp(\n            'Opex Project Costs',\n            'Parent Cost'.'Opex Project Cost' = locSelectedOpexCost.'Opex Project Cost'\n        ),\n        locOpexCostParent: locSelectedOpexCost\n    }\n);\nIf(\n    Not(IsBlank(locOpexCostChild)),\n    UpdateContext({locTimer: true});\n    UpdateContext({locRunTimer: false});\n    UpdateContext({locRunTimer: true})\n);\nUpdateContext(\n    {\n        locSelectedOpexCostParent: Blank(),\n        locSelectedDeviceOpexCost: Blank()\n    }\n);\nIf(\n    !locTimer,\n    ClearCollect(\n        colOpexProjectCosts,\n        Filter(\n            'Opex Project Costs',\n            Project.Project = gblSelectedProject.Project\n        )\n    );\n    UpdateContext(\n        {\n            locSpinnerInformationText: \"\",\n            locIsVisiblePopUpSpinner: false,\n            locSelectedDeviceOpexCost: Blank(),\n            locCandidateOpexCostDesc: Blank()\n        }\n    );\n    Select(pcf_OpexCosts_RightPanel_NewEditCost_BodyButtons_Reset)\n);*/\n"
                              Text: ="Save"
                              TextAlignment: ='PowerCAT.Icon.TextAlignment'.Center
                              Theme: =gblAppThemeJson
