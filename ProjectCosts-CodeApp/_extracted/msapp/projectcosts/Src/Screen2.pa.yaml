Screens:
  Screen2:
    Children:
      - ButtonCanvas2:
          Control: Button@0.0.45
          Properties:
            OnSelect: |-
              =Filter(
                  colCapexCostDataToPatch,
                  And(
                      Month >= LookUp(
                          gblClusterDurations,
                          Order = 5
                      ).StartMonth,
                      Month <= LookUp(
                          gblClusterDurations,
                          Order = 5
                      ).EndMonth,
                      Year >= LookUp(
                          gblClusterDurations,
                          Order = 5
                      ).StartYear,
                      Year <= LookUp(
                          gblClusterDurations,
                          Order = 5
                      ).EndYear
                  )
              )
            X: =40
            Y: =40
      - TextCanvas5:
          Control: Text@0.0.51
          Properties:
            Text: =
            X: =207
            Y: =72
      - TextCanvas3:
          Control: Text@0.0.51
          Properties:
            Height: =636
            Size: =22
            Text: =JSON(colFinatCostDataOptimized,JSONFormat.FlattenValueTables)
            Width: =618
            X: =96
            Y: =132
      - TextCanvas4:
          Control: Text@0.0.51
          Properties:
            X: =60
            Y: =60
