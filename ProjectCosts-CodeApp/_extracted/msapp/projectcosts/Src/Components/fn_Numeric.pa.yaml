ComponentDefinitions:
  fn_Numeric:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      InRange:
        PropertyKind: OutputFunction
        DisplayName: InRange
        Description: A custom property
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A candidate parameter as input number in string format
              DataType: Text
              Default: ="Text"
          - min:
              Description: A min parameter range value
              DataType: Number
              Default: =100
          - max:
              Description: A min parameter range value
              DataType: Number
              Default: =100
      IsInteger:
        PropertyKind: OutputFunction
        DisplayName: IsInteger
        Description: A custom property check if candidate string is integer.
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A candidate parameter as string
              DataType: Text
              Default: ="Text"
      IsNumberOrBlank:
        PropertyKind: OutputFunction
        DisplayName: IsNumberOrBlank
        Description: A custom property
        DataType: Number
        Parameters:
          - candidate:
              Description: A candidate number as string
              DataType: Text
              Default: ="Text"
      IsOneDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsOneDecimal
        Description: This current method checks whether the entered "candidate string" can be converted to deciml with  one decimal place.
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter as candiadte string
              DataType: Text
              Default: ="Text"
      IsThreeDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsThreeDecimal
        Description: This current method checks whether the entered "candidate string" can be converted to decimal with tree points
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter as candidate string
              DataType: Text
              Default: ="Text"
      IsTwoDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsTwoDecimal
        Description: This current method checks whether the entered "candidate string" can be converted to deciml with  one decimal place.
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter as candiadte string
              DataType: Text
              Default: ="Text"
    Properties:
      Height: =50
      InRange: |-
        =And(
            IsNumeric(candidate),
            And(
                Value(candidate) >= min,
                Value(candidate) <= max
            )
        )
      IsInteger: |-
        =And(
            IsNumeric(candidate),
            Not(
                IsMatch(
                    candidate,
                    "[.,]",
                    MatchOptions.Contains
                )
            )
        )
      IsNumberOrBlank: |-
        =With(
            {varInput: Trim(candidate)},
            If(
                IsNumeric(varInput),
                Round(
                    Value(varInput),
                    2
                ),
                Blank()
            )
        )
      IsOneDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^((\+?)?\d+(|\.\d{0,1})?)"
                ),
                IsMatch(
                    candidate,
                    "^((\+?)?\d+(|\,\d{0,1})?)"
                )
            )
        )
      IsThreeDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^((\+?)?\d+(|\.\d{0,3})?)"
                ),
                IsMatch(
                    candidate,
                    "^((\+?)?\d+(|\,\d{0,3})?)"
                )
            )
        )
      IsTwoDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^((\+|-?)?\d+(|\.\d{0,2})?)"
                ),
                IsMatch(
                    candidate,
                    "^((\+|-?)?\d+(|\,\d{0,2})?)"
                )
            )
        )
