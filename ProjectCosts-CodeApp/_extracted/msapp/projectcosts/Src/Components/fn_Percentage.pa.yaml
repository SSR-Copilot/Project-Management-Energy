ComponentDefinitions:
  fn_Percentage:
    DefinitionType: CanvasComponent
    CustomProperties:
      IsPercentage:
        PropertyKind: OutputFunction
        DisplayName: IsPercentage
        Description: This current method checks whether the entered "candidate string" can be converted to percentage
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter candidate percenrtage as string.
              DataType: Text
              Default: ="Text"
    Properties:
      Height: =100
      IsPercentage: =true
