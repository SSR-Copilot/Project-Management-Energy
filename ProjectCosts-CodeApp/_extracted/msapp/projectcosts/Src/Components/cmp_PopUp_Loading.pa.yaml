ComponentDefinitions:
  cmp_PopUp_Loading:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      InformationText:
        PropertyKind: Input
        DisplayName: InformationText
        Description: Information Text
        DataType: Text
        Default: ="Text"
    Children:
      - con_PopUpLoading:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.1)
            Height: =Parent.Height
            Width: =Parent.Width
          Children:
            - con_PopUpLoading_InformationArea:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =ColorValue(gblAppTheme.palette.white)
                  Height: =240
                  RadiusBottomLeft: =5
                  RadiusBottomRight: =5
                  RadiusTopLeft: =5
                  RadiusTopRight: =5
                  X: '=(Parent.Width - Self.Width)/2  '
                  Y: =(Parent.Height - Self.Height)/2
                Children:
                  - spi_PopUpLoading_Spinner:
                      Control: Spinner@1.4.6
                      Properties:
                        AccessibleLabel: ="Waiting"
                        Height: |-
                          =If(
                              cmp_PopUp_Loading.InformationText = "",
                              120,
                              90
                          )
                        X: =(Parent.Width-Self.Width)/2
                        Y: =50
                  - lbl_PopUpLoading_Description:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =gblAppStyles.Label.BorderColor
                        BorderThickness: =gblAppStyles.Label.BorderThickness
                        Color: =gblAppStyles.Label.Color
                        DisabledBorderColor: =gblAppStyles.Label.DisabledBorderColor
                        DisabledColor: =gblAppStyles.Label.DisabledColor
                        DisabledFill: =gblAppStyles.Label.DisabledFill
                        Fill: =gblAppStyles.Label.Fill
                        FocusedBorderColor: =gblAppStyles.Label.FocusedBorderColor
                        FocusedBorderThickness: =gblAppStyles.Label.FocusedBorderThickness
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =Parent.Height-Self.Y
                        HoverBorderColor: =gblAppStyles.Label.HoverBorderColor
                        HoverFill: =gblAppStyles.Label.HoverFill
                        PaddingLeft: =1
                        PressedBorderColor: =gblAppStyles.Label.PressedBorderColor
                        PressedColor: =gblAppStyles.Label.PressedColor
                        PressedFill: =gblAppStyles.Label.PressedFill
                        Size: =gblAppSizes.Font.Medium
                        Text: =cmp_PopUp_Loading.InformationText
                        Tooltip: =Self.Text
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width-Self.X*2
                        Y: =spi_PopUpLoading_Spinner.Y+spi_PopUpLoading_Spinner.Height+10
