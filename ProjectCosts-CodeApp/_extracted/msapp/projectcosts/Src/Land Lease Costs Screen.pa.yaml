                              IconName: ="CheckMark"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              OnChange: "=UpdateContext(\n    {\n        locSpinnerInformationText: \"Saving Land Lease Contract...\",\n        locIsVisiblePopUpSpinner: true,\n        locIsVisibleRightPanelNewEditPeriod: false\n    }\n);\nIf(\n    IsBlank(locSelectedLandLeaseCost) || locSelectedLandLeasePeriod.Period = 'Land Lease Period'.'Period 1',\n    IfError(\n        UpdateContext(\n            {\n                locSelectedLandLeaseCost: Patch(\n                    'Land Lease Project Costs',\n                    If(\n                        IsBlank(locSelectedLandLeaseCost),\n                        Defaults('Land Lease Project Costs'),\n                        LookUp(\n                            'Land Lease Project Costs',\n                            'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n                        )\n                    ),\n                    {\n                        Project: gblSelectedProject,\n                        Subaccount: locSelectedLandLeaseSubaccount,\n                        Name: gblSelectedProject.'Project Name' & \"-\" & locSelectedLandLeaseSubaccount.Name & \"-\" & txt_LandLease_RightPanel_NewEditCost_BodyContent_Description_1.Value,\n                        //'Land Owner': txt_LandLease_RightPanel_NewEditCost_BodyContent_LandOwner.Value,\n                        Description: txt_LandLease_RightPanel_NewEditCost_BodyContent_Description_1.Value,\n                        Currency: drp_LandLease_RightPanel_NewEditCost_BodyContent_Currency_1.Selected,\n                        'Due Date One-Time Payment': If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_OneTimePayment.Checked,\n                            txt_LandLease_RightPanel_NewEditCost_BodyContent_DueDate_1.Value,\n                            Blank()\n                        ),\n                        'Amount One-Time Payment': If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_OneTimePayment.Checked,\n                            Value(txt_LandLease_RightPanel_NewEditCost_BodyContent_Amount_1.Value),\n                            Blank()\n                        ),\n                        Secured: If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_Secured.Checked,\n                            'Land Lease Secured'.Yes,\n                            'Land Lease Secured'.No\n                        ),\n                        'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)',\n                        'Due Date One-Time Payment 2': If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_OneTimePayment.Checked,\n                            txt_LandLease_RightPanel_NewEditCost_BodyContent_DueDate2_1.Value,\n                            Blank()\n                        ),\n                        'Amount One-Time Payment 2': If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_OneTimePayment.Checked,\n                            Value(txt_LandLease_RightPanel_NewEditCost_BodyContent_Amount2_1.Value),\n                            Blank()\n                        ),\n                        'Due Date One-Time Payment 3': If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_OneTimePayment.Checked,\n                            txt_LandLease_RightPanel_NewEditCost_BodyContent_DueDate3_1.Value,\n                            Blank()\n                        ),\n                        'Amount One-Time Payment 3': If(\n                            tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_OneTimePayment.Checked,\n                            Value(txt_LandLease_RightPanel_NewEditCost_BodyContent_Amount3_1.Value),\n                            Blank()\n                        ),\n                        AllWTGAllocated: tgl_LandLease_RightPanel_NewEditContractPeriod_BodyContent_AllocationToAllWTGs.Checked,\n                        'Inflation Country Area': drp_LandLease_RightPanel_NewEditCost_BodyContent_AreaInflationProfile_1.Selected.Value,\n                        'Inflation Profile': Value(txt_LandLease_RightPanel_NewEditCost_BodyContent_InflationProfile_1.Value),\n                        'Inflation Start Year': Value(txt_LandLease_RightPanel_NewEditCost_BodyContent_InflationStartYear_1.Value),\n                        'Use Inflation Profile': tgl_LandLease_RightPanel_NewEditCost_BodyContent_InflationProfile_1.Checked,\n                        'Use Country Inflation Profile': tgl_LandLease_RightPanel_NewEditCost_BodyContent_CountryInflationProfile_1.Checked,\n                        IsStartDateStandardAssumption: locIsStartDateStandardAssumption\n                    }\n                )\n            }\n        );\n        ,\n        Notify(\n            \"Error: Land Lease Contract could not be saved correctly. \" & \"Internal error: originated on \" & FirstError.Source & \". Message: \" & FirstError.Message & FirstError.Details.HttpResponse,\n            NotificationType.Error\n        )\n    );\n    ClearCollect(\n        colAllocatedWtgsInSelectedLandLeaseCost,\n        Filter(\n            'Land Lease Allocation WTGS',\n            'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n        )\n    );\n    ForAll(\n        cmb_LandLease_RightPanel_NewEditCost_BodyContent_AllocationWtg_1.SelectedItems As SelectedGenerator,\n        Patch(\n            'Land Lease Allocation WTGS',\n            With(\n                {\n                    varAllocatedWtgInSelectedLandLeaseCost: LookUp(\n                        colAllocatedWtgsInSelectedLandLeaseCost,\n                        And(\n                            'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost',\n                            'Generator In Project'.GeneratorInProject = SelectedGenerator.GeneratorInProject\n                        )\n                    )\n                },\n                If(\n                    IsBlank(varAllocatedWtgInSelectedLandLeaseCost),\n                    Defaults('Land Lease Allocation WTGS'),\n                    varAllocatedWtgInSelectedLandLeaseCost\n                )\n            ),\n            {\n                Name: locSelectedLandLeaseCost.'Land Owner' & \"-\" & locSelectedLandLeaseCost.Description & \"-\" & SelectedGenerator.Name,\n                'Project Cost': locSelectedLandLeaseCost,\n                'Generator In Project': SelectedGenerator,\n                'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)'\n            }\n        )\n    );\n    ForAll(\n        colAllocatedWtgsInSelectedLandLeaseCost As AllocatedWtgRecord,\n        If(\n            Not(\n                AllocatedWtgRecord.'Generator In Project'.GeneratorInProject in ShowColumns(\n                    cmb_LandLease_RightPanel_NewEditCost_BodyContent_AllocationWtg_1.SelectedItems,\n                    GeneratorInProject\n                )\n            ),\n            Remove(\n                'Land Lease Allocation WTGS',\n                AllocatedWtgRecord\n            )\n        )\n    );\n    \n);\nIfError(\n    UpdateContext(\n        {\n            locSelectedLandLeasePeriod: Patch(\n                'Land Lease Periods',\n                If(\n                    IsBlank(locSelectedLandLeasePeriod),\n                    Defaults('Land Lease Periods'),\n                    locSelectedLandLeasePeriod\n                ),\n                {\n                    Name: txt_LandLease_RightPanel_NewEditCost_BodyContent_Description_1.Value,\n                    'Project Cost': LookUp(\n                        'Land Lease Project Costs',\n                        'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n                    ),\n                    Period: If(\n                        locRightPanelState = \"New\",\n                        Switch(\n                            locParentLandLeasePeriod.Period,\n                            'Land Lease Period'.'Period 1',\n                            'Land Lease Period'.'Period 2',\n                            'Land Lease Period'.'Period 2',\n                            'Land Lease Period'.'Period 3',\n                            'Land Lease Period'.'Period 3',\n                            'Land Lease Period'.'Period 4',\n                            'Land Lease Period'.'Period 4',\n                            'Land Lease Period'.'Period 5',\n                            'Land Lease Period'.'Period 5',\n                            'Land Lease Period'.'Period 6',\n                            'Land Lease Period'.'Period 6',\n                            'Land Lease Period'.'Period 7',\n                            'Land Lease Period'.'Period 7',\n                            'Land Lease Period'.'Period 8',\n                            'Land Lease Period'.'Period 8',\n                            'Land Lease Period'.'Period 9',\n                            'Land Lease Period'.'Period 1'\n                        ),\n                        locSelectedLandLeasePeriod.Period\n                    ),\n                    'Fixed Costs': Value(txt_LandLease_RightPanel_NewEditPeriod_BodyContent_FixedCosts_1.Value),\n                    '% of Revenues': Value(txt_LandLease_RightPanel_NewEditPeriod_BodyContent_PercentOfRevenues_1.Value),\n                    Aggregation: drp_LandLease_RightPanel_NewEditPeriod_BodyContent_Aggregation_1.Selected.Value,\n                    'Land Lease duration years': drp_LandLease_RightPanel_NewEditPeriod_BodyContent_DurationYears_1.Selected.Value,\n                    'Land Lease duration months': drp_LandLease_RightPanel_NewEditPeriod_BodyContent_DurationMonths_1.Selected.Value,\n                    'Start Date': DateValue(dte_LandLease_RightPanel_NewEditCost_BodyContent_StartDate_1.SelectedDate),\n                    'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)',\n                    'EUR/MWh': Value(txt_LandLease_RightPanel_NewEditPeriod_BodyContent_EuroMWh_1.Value),\n                    'EUR/MW': Value(txt_LandLease_RightPanel_NewEditPeriod_BodyContent_EuroMW_1.Value),\n                    'EUR/WTG': Value(txt_LandLease_RightPanel_NewEditPeriod_BodyContent_EuroWTG_1.Value),\n                    'Distribution Frequency': drp_LandLease_RightPanel_NewEditCost_BodyContent_DistributionFrequency_Month_1.Selected.Value\n                }\n            )\n        }\n    ),\n    Notify(\n        \"Error: Land Lease Period could not be saved correctly. \" & \"Internal error: originated on \" & FirstError.Source & \". Message: \" & FirstError.Message & FirstError.Details.HttpResponse,\n        NotificationType.Error\n    )\n);\nClearCollect(\n    colLandLeaseProjectCosts,\n    Filter(\n        'Land Lease Project Costs',\n        Project.Project = gblSelectedProject.Project\n    )\n);\nClearCollect(\n    colLandLeasePeriods,\n    Filter(\n        'Land Lease Periods',\n        'Project Cost'.'Land Lease Project Cost' in colLandLeaseProjectCosts.'Land Lease Project Cost'\n    )\n);\nUpdateContext(\n    {\n        locSelectedLandLeaseCost: Blank(),\n        locSelectedLandLeasePeriod: Blank()\n    }\n);\n// Refresh data\nSelect(btn_LandLease_NewEditPeriod_ResetButton);\nUpdateContext(\n    {\n        locSpinnerInformationText: \"\",\n        locIsVisiblePopUpSpinner: false\n    }\n);\n"
                              Text: ="Save"
