      - cmp_LandLease_PopUpConfirmation_DeletePeriod:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            Description: ="Are you sure that you want to permanently delete " & locSelectedLandLeasePeriod.Period & " expense in the """ & locSelectedLandLeasePeriod.Name & """  Land Lease?"
            Height: =Parent.Height
            IconCancelButton: ="Cancel"
            IconConfirmButton: ="Delete"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteLandLeasePeriod: false})
            OnConfirm: |-
              =UpdateContext({
                  locSpinnerInformationText: "Deleting Land Lease Period...",
                  locIsVisiblePopUpSpinner: true,
                  locIsVisiblePopUpDeleteLandLeasePeriod: false
              });

              Remove('Land Lease Periods', locSelectedLandLeasePeriod);

              Remove(colLandLeasePeriods,locSelectedLandLeasePeriod);
              UpdateContext({
                  locSelectedLandLeasePeriod: Blank()
              });

              UpdateContext({
                  locIsVisiblePopUpSpinner: false,
                  locSpinnerInformationText: ""
              });
            TextCancelButton: ="Cancel"
            TextConfirmButton: ="Delete"
            Title: ="Delete Period?"
            Visible: =locIsVisiblePopUpDeleteLandLeasePeriod
            Width: =Parent.Width
            WidthConfirmButton: =96
      - cmp_LandLease_PopUpConfirmation_DeleteLandLeaseCost:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            Description: ="Are you sure that you want to permanently delete Land Lease """& locSelectedLandLeasePeriod.Name & """ and all related Periods?"
            Height: =Parent.Height
            IconCancelButton: ="Cancel"
            IconConfirmButton: ="Delete"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteLandLeaseCost: false})
            OnConfirm: |
              =UpdateContext(
                  {
                      locSpinnerInformationText: "Deleting Land Lease cost...",
                      locIsVisiblePopUpSpinner: true,
                      locIsVisiblePopUpDeleteLandLeaseCost: false
                  }
              );
              RemoveIf(
                  'Land Lease Allocation WTGS',
                  'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
              );
              RemoveIf(
                  'Land Lease Periods',
                  'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
              );
              RemoveIf(
                  'Land Lease Project Costs',
                  'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
              );
              RemoveIf(
                  colLandLeaseProjectCosts,
                  'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
              );
              RemoveIf(
                  colLandLeasePeriods,
                  'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
              );
              RemoveIf(
                  colAllocatedWtgsInSelectedLandLeaseCost,
                  'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
              );
              UpdateContext(
                  {
                      locSelectedLandLeaseCost: Blank(),
                      locSelectedLandLeasePeriod: Blank()
                  }
              );
              UpdateContext(
                  {
                      locIsVisiblePopUpSpinner: false,
                      locSpinnerInformationText: ""
                  }
              );
            TextCancelButton: ="Cancel"
            TextConfirmButton: ="Delete"
            Title: ="Delete Land Lease?"
            Visible: =locIsVisiblePopUpDeleteLandLeaseCost
            Width: =Parent.Width
            WidthConfirmButton: =96
