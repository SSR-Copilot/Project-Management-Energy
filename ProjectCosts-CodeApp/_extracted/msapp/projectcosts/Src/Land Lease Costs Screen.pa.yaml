Screens:
  Land Lease Costs Screen:
    Properties:
      Fill: =gblAppStyles.Screen.Fill
      LoadingSpinner: =LoadingSpinner.Data
      OnVisible: "=Concurrent(\n    ClearCollect(\n        colLandLeaseSubaccounts,\n        Sort(\n            AddColumns(\n                'Land Lease Subaccounts',\n                IsFolded,\n                true\n            ),\n            Order,\n            SortOrder.Ascending\n        )\n    );\n    ,\n    ClearCollect(\n        colLandLeaseProjectCosts,\n        Filter(\n            'Land Lease Project Costs',\n            Project.Project = gblSelectedProject.Project\n        )\n    );\n    ClearCollect(\n        colLandLeasePeriods,\n        Filter(\n            'Land Lease Periods',\n            'Project Cost'.'Land Lease Project Cost' in colLandLeaseProjectCosts.'Land Lease Project Cost'\n        )\n    );\n    ,\n    ClearCollect(\n        colGeneratorsInProject,\n        AddColumns(\n            Filter(\n                GeneratorInProjects,\n                AsType(\n                    ModuleTypeInProject,\n                    GeneratorTypeInProjects\n                ).Project.Project = gblSelectedProject.Project\n            ),\n            Label,\n            $\"{Name} - {Status}\",\n            Order,\n            Value(\n                Last(\n                    Split(\n                        Name,\n                        \"_\"\n                    )\n                ).Value\n            )\n        )\n    );\n    Collect(\n        colGeneratorsInProject,\n        AddColumns(\n            Filter(\n                GeneratorInProjects,\n                AsType(\n                    ModuleTypeInProject,\n                    PVModuleTypeInProjects\n                ).Project.Project = gblSelectedProject.Project\n            ),\n            Label,\n            AsType(\n                ModuleTypeInProject,\n                PVModuleTypeInProjects\n            ).Label\n        )\n    );\n    ,\n    ClearCollect(\n        colAllocatedWtgsInSelectedLandLeaseCost,\n        Blank()\n    );\n    \n)"
    Children:
      - con_LandLease_Screen:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =5
            LayoutOverflowY: =LayoutOverflow.Scroll
            PaddingBottom: =gblAppSizes.Padding.Page
            Width: =Parent.Width
            X: |-
              =If(
                  App.Width < 1920,
                  gblAppSizes.Padding.Page,
                  Max((App.Width-Self.Width)/2,gblAppSizes.Padding.Page)
              )
            Y: =gblAppSizes.Padding.Page
          Children:
            - cmp_LandLease_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: =gblTableApprovalStateColors
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: |-
                    =//Navigate('Capex Costs Screen',ScreenTransition.Fade);
                    Launch(gblPMAppURL)
                  Project: =gblProjectHeaderData
                  Width: =Parent.Width
            - con_LandLease_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  Height: =Parent.Height-Self.Y-con_LandLease_Footer.Height-20
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingLeft: =6
                  PaddingRight: =6
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - con_LandLease_LeftNavigationMenu:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =Color.White
                        FillPortions: =0
                        Height: =Parent.Height
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinWidth: =200
                        Width: =If(gblLeftNavigationMenuIsExpanded, gblAppSizes.LeftNavigation.ExpandedWidth,gblAppSizes.LeftNavigation.DecreasedWidth)
                      Children:
                        - cmp_LandLease_Left_Navigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftNavigationMenu
                              OnExpand: |-
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |
                                =If(
                                    Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                    Set(
                                        gblLeftNavigationSelected,
                                        LookUp(
                                            LeftNavigationMenu,
                                            ItemKey = Self.SelectedKey
                                        )
                                    );
                                    Navigate(
                                        gblLeftNavigationSelected.TargetScreen,
                                        ScreenTransition.Fade
                                    )
                                );
                              Selected: =gblLeftNavigationSelected
                              Width: =Parent.Width
                  - con_LandLease_Content:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =ColorValue(gblAppTheme.palette.white)
                        Height: =Parent.Height-Self.Y
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Visible: =Not(IsBlank(gblSelectedProject))
                        Width: =Parent.Width
                      Children:
                        - gal_LandLease_Content_Subaccounts:
                            Control: Gallery@2.15.0
                            Variant: VariableHeight
                            Properties:
                              BorderColor: =gblAppStyles.Gallery.BorderColor
                              BorderStyle: =gblAppStyles.Gallery.BorderStyle
                              BorderThickness: =gblAppStyles.Gallery.BorderThickness
                              Fill: =gblAppStyles.Gallery.Fill
                              FocusedBorderColor: =gblAppStyles.Gallery.BorderColor
                              FocusedBorderThickness: =gblAppStyles.Gallery.FocusedBorderThickness
                              Height: |+
                                =//Sum(RenameColumns(ForAll(gal_Account_Accounts.AllItems, Value(lbl_Account_AccountItemHeightValue_Hidden.Text)),"Value", "RowHeight"), RowHeight) + Self.TemplatePadding * Self.AllItemsCount + gblAppSizes.Padding.Page
                                Parent.Height-Self.Y

                              Items: =colLandLeaseSubaccounts
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =42
                              LoadingSpinner: =LoadingSpinner.None
                              LoadingSpinnerColor: =gblAppStyles.Gallery.LoadingSpinnerColor
                              TemplateFill: =gblAppStyles.Gallery.TemplateFill
                              TemplatePadding: =0
                              TemplateSize: =42
                              Width: =Parent.Width-Self.X
                              Y: =10
                            Children:
                              - lbl_OpexCosts_Content_Subaccounts_CardItemHeightValue_Hidden_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    AutoHeight: =true
                                    BorderColor: =gblAppStyles.Label.BorderColor
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =gblAppStyles.Label.BorderThickness
                                    Color: =gblAppStyles.Label.Color
                                    DisabledBorderColor: =gblAppStyles.Label.DisabledBorderColor
                                    DisabledColor: =gblAppStyles.Label.DisabledColor
                                    DisabledFill: =gblAppStyles.Label.DisabledFill
                                    DisplayMode: =DisplayMode.View
                                    Fill: =gblAppStyles.Label.Fill
                                    FocusedBorderColor: =gblAppStyles.Label.FocusedBorderColor
                                    FocusedBorderThickness: =gblAppStyles.Label.FocusedBorderThickness
                                    Font: =gblAppStyles.Label.Font
                                    FontWeight: =FontWeight.Semibold
                                    Height: =35
                                    HoverBorderColor: =gblAppStyles.Label.HoverBorderColor
                                    HoverColor: =gblAppStyles.Label.HoverColor
                                    HoverFill: =gblAppStyles.Label.HoverFill
                                    PaddingLeft: =0
                                    PressedBorderColor: =gblAppStyles.Label.PressedBorderColor
                                    PressedColor: =gblAppStyles.Label.PressedColor
                                    PressedFill: =gblAppStyles.Label.PressedFill
                                    Size: =gblAppSizes.Font.Medium
                                    Text: =con_LandLease_Content_Subaccounts_Card_1.Height
                                    Visible: =false
                                    Width: =Len(Self.Text)*14
                                    Wrap: =false
                              - con_LandLease_Content_Subaccounts_Card_1:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =gblAppStyles.Container.BorderColor
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =gblAppStyles.Container.BorderThickness
                                    Fill: =ColorValue(gblAppTheme.palette.white)
                                    Height: |+
                                      =If(
                                          ThisItem.IsFolded,
                                          con_LandLease_Content_Subaccounts_CardHeader_1.Height,
                                          con_LandLease_Content_Subaccounts_CardHeader_1.Height+con_LandLease_Content_Subaccounts_CardBody_1.Height
                                      )

                                    Width: =Parent.Width-10
                                  Children:
                                    - con_LandLease_Content_Subaccounts_CardBody_1:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =gblAppStyles.Container.BorderColor
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =ColorValue(gblAppTheme.palette.white)
                                          Height: =Max(gal_LandLease_Content_Subaccounts_CardBody_Costs_1.Height+74,50)
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          PaddingLeft: =20
                                          Width: =Parent.Width
                                          Y: =con_LandLease_Content_Subaccounts_CardHeader_1.Y+con_LandLease_Content_Subaccounts_CardHeader_1.Height
                                        Children:
                                          - pcf_con_LandLease_Content_Subaccounts_CardBody_SubaccountsCommandBar_1:
                                              Control: CodeComponent
                                              ComponentName: cat_PowerCAT.CommandBar
                                              Properties:
                                                Height: =40
                                                Items: |-
                                                  =Table(
                                                      {
                                                          ItemKey: "newLandLeaseContractKey",
                                                          ItemDisplayName: "Add Contract Type",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: And(
                                                              DataSourceInfo(
                                                                  'Land Lease Project Costs',
                                                                  DataSourceInfo.CreatePermission
                                                              ),
                                                              If(
                                                                  locSelectedLandLeaseSubaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount',
                                                                  IsBlank(locSelectedLandLeasePeriod),
                                                                  true
                                                              ),
                                                              IsBlank(
                                                                  LookUp(
                                                                      'Land Lease Project Costs',
                                                                      And(
                                                                          Project.Project = gblSelectedProject.Project,
                                                                          'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes,
                                                                          Subaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount'
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "newLandLeasePeriodKey",
                                                          ItemDisplayName: "Add Period",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: And(
                                                              DataSourceInfo(
                                                                  'Land Lease Periods',
                                                                  DataSourceInfo.CreatePermission
                                                              ),
                                                              Not(locSelectedLandLeaseCost.'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes),
                                                              Not(
                                                                  StartsWith(
                                                                      locSelectedLandLeasePeriod.Name,
                                                                      "Standard"
                                                                  )
                                                              ),
                                                              Not(IsBlank(locSelectedLandLeasePeriod)),
                                                              Not(IsBlank(locSelectedLandLeaseCost)),
                                                              locSelectedLandLeaseSubaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount',
                                                              With(
                                                                  {
                                                                      varLandLeasePeriods: Sort(
                                                                          Filter(
                                                                              colLandLeasePeriods,
                                                                              'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'
                                                                          ),
                                                                          Period
                                                                      )
                                                                  },
                                                                  With(
                                                                      {
                                                                          varLastLandLeasePeriod: Last(varLandLeasePeriods),
                                                                          varFirstLandLeasePeriod: First(varLandLeasePeriods)
                                                                      },
                                                                      And(
                                                                          locSelectedLandLeasePeriod.'Land Lease Period' = varLastLandLeasePeriod.'Land Lease Period',
                                                                          Or(
                                                                              Not(IsBlank(varFirstLandLeasePeriod.'Fixed Costs')),
                                                                              Not(IsBlank(varFirstLandLeasePeriod.'% of Revenues')),
                                                                              Not(IsBlank(varFirstLandLeasePeriod.'EUR/MW')),
                                                                              Not(IsBlank(varFirstLandLeasePeriod.'EUR/MWh')),
                                                                              Not(IsBlank(varFirstLandLeasePeriod.'EUR/WTG'))
                                                                          )
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "AddLandLeaseStandardContractKey",
                                                          ItemDisplayName: "Add Standard Contract",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: And(
                                                              Not(
                                                                  IsBlank(
                                                                      LookUp(
                                                                          'OPEX & Land Lease Standard Assumptions',
                                                                          And(
                                                                              Country.Country = gblSelectedProject.Country.Country,
                                                                              Technology = gblSelectedProject.Technology,
                                                                              'Type Of Contract' = 'Contract Types'.Landlease,
                                                                              'Land Lease Subaccount'.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount'
                                                                          )
                                                                      )
                                                                  )
                                                              ),
                                                              IsBlank(
                                                                  LookUp(
                                                                      'Land Lease Project Costs',
                                                                      And(
                                                                          Project.Project = gblSelectedProject.Project,
                                                                          'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes,
                                                                          Subaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount'
                                                                      )
                                                                  )
                                                              ),
                                                              IsBlank(
                                                                  LookUp(
                                                                      'Land Lease Project Costs',
                                                                      And(
                                                                          Project.Project = gblSelectedProject.Project,
                                                                          //'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes,
                                                                          Subaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount'
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "EditLandLeasePeriodKey",
                                                          ItemDisplayName: "Edit",
                                                          ItemIconName: "Edit",
                                                          ItemEnabled: And(
                                                              Not(IsBlank(locSelectedLandLeasePeriod)),
                                                              RecordInfo(
                                                                  locSelectedLandLeasePeriod,
                                                                  RecordInfo.EditPermission
                                                              ),
                                                              locSelectedLandLeaseSubaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount',
                                                              Not(locSelectedLandLeaseCost.'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes),
                                                              Not(
                                                                  StartsWith(
                                                                      locSelectedLandLeasePeriod.Name,
                                                                      "Standard"
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      {
                                                          ItemKey: "deleteLandLeasePeriodKey",
                                                          ItemDisplayName: "Delete",
                                                          ItemIconName: "Delete",
                                                          ItemEnabled: And(
                                                              Not(IsBlank(locSelectedLandLeasePeriod)),
                                                              RecordInfo(
                                                                  locSelectedLandLeasePeriod,
                                                                  RecordInfo.DeletePermission
                                                              ),
                                                              locSelectedLandLeaseSubaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount',
                                                              If(
                                                                  StartsWith(
                                                                      Lower(locSelectedLandLeasePeriod.Name),
                                                                      "standard"
                                                                  ),
                                                                  locSelectedLandLeasePeriod.Period = 'Land Lease Period'.'Period 1',
                                                                  Or(
                                                                      locSelectedLandLeasePeriod.Period = 'Land Lease Period'.'Period 1',
                                                                      With(
                                                                          {
                                                                              locLastPeriod: Last(
                                                                                  Sort(
                                                                                      Filter(
                                                                                          colLandLeasePeriods,
                                                                                          'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeasePeriod.'Project Cost'.'Land Lease Project Cost'
                                                                                      ),
                                                                                      Name,
                                                                                      SortOrder.Ascending
                                                                                  )
                                                                              )
                                                                          },
                                                                          locLastPeriod.'Land Lease Period' = locSelectedLandLeasePeriod.'Land Lease Period'
                                                                      )
                                                                  )
                                                              )
                                                          )
                                                      }
                                                  )
                                                OnSelect: "=Switch(\n    Self.Selected.ItemKey,\n    \"newLandLeaseContractKey\",\n    Clear(colAllocatedWtgsInSelectedLandLeaseCost);\n    UpdateContext(\n        {\n            locSelectedLandLeasePeriod: Blank(),\n            locSelectedLandLeaseCost: Blank(),\n            locShowSecondPayment: false,\n            locShowThirdPayment: false,\n            locRightPanelState: \"New\",\n            locSelectedLandLeaseSubaccount: gal_LandLease_Content_Subaccounts.Selected,\n            locNewPeriodDesc: Blank(),\n            locParentLandLeasePeriod: Blank(),\n            locSelectAllWTG: false,\n            locIsVisibleRightPanelNewEditPeriod: true\n        }\n    );\n    UpdateContext(\n        {\n            locCODDate: gblSelectedProject.'Operations start date (COD)',\n            locIsStartDateStandardAssumption: 'IsStartDateStandardAssumption (Land Lease Project Costs)'.No,\n            locResetStartDate: true\n        }\n    ),\n    \"AddLandLeaseStandardContractKey\",\n        //LoadLandLeaseStandardContractsAndPeriods\n    UpdateContext(\n        {\n            locIsVisiblePopUpSpinner: true,\n            locSpinnerInformationText: \"Please wait, loading Standard Assumption Contract...\"\n        }\n    );\n    Clear(colLoadLandLeasePeriods);\n    Clear(colLandLeaseStandardAssumptionContract);\n    With(\n        {\n            recFilteredStandardContractsForProject: Filter(\n                'Land Lease Project Costs',\n                And(\n                    Project.Project = gblSelectedProject.Project,\n                    'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes,\n                    Subaccount.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount'\n                )\n            ),\n            recCountryTechnologyRelatedStandardAssumption: Sort(\n                Filter(\n                    'OPEX & Land Lease Standard Assumptions',\n                    And(\n                        Country.Country = gblSelectedProject.Country.Country,\n                        Technology = gblSelectedProject.Technology,\n                        'Type Of Contract' = 'Contract Types'.Landlease,\n                        'Land Lease Subaccount'.'Land Lease Subaccount' = ThisItem.'Land Lease Subaccount'\n                    )\n                ),\n                Description,\n                SortOrder.Ascending\n            ),\n            recCODDate: gblSelectedProject.'Operations start date (COD)',\n            recCODYear: Year(gblSelectedProject.'Operations start date (COD)') + 1\n        },\n        If(\n            CountRows(recFilteredStandardContractsForProject) = 0,\n            With(\n                {\n                    recSortedCountryTechnologyStandardAssumptions: recCountryTechnologyRelatedStandardAssumption,\n                    recStandardAssumptionContracts: Filter(\n                        recCountryTechnologyRelatedStandardAssumption,\n                        Period = 'Opex & Land Lease Period'.'Period 1'\n                    )\n                },\n                ForAll(\n                    recStandardAssumptionContracts,\n                    With(\n                        {StandardAssumptionContractRecord: ThisRecord},\n                        Collect(\n                            colLandLeaseStandardAssumptionContract,\n                            Patch(\n                                'Land Lease Project Costs',\n                                Defaults('Land Lease Project Costs'),\n                                {\n                                    Project: gblSelectedProject,\n                                    Subaccount: StandardAssumptionContractRecord.'Land Lease Subaccount',\n                                    Name: gblSelectedProject.'Project Name' & \"-\" & StandardAssumptionContractRecord.'Land Lease Subaccount'.Name & \"-\" & StandardAssumptionContractRecord.Name,\n                                    Description: StandardAssumptionContractRecord.Description,\n                                    Currency: StandardAssumptionContractRecord.Currency,\n                                    'Due Date One-Time Payment': StandardAssumptionContractRecord.'Due Date One-Time Payment',\n                                    'Amount One-Time Payment': Value(\n                                        Text(\n                                            StandardAssumptionContractRecord.'Amount One-Time Payment',\n                                            \"##0.00\"\n                                        )\n                                    ),\n                                    Secured: If(\n                                        StandardAssumptionContractRecord.Secured = 'Secured (OPEX & Land Lease Standard Assumptions)'.Yes,\n                                        'Land Lease Secured'.Yes,\n                                        'Land Lease Secured'.No\n                                    ),\n                                    'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)',\n                                    'Due Date One-Time Payment 2': StandardAssumptionContractRecord.'Due Date One-Time Payment 2',\n                                    'Amount One-Time Payment 2': Value(\n                                        Text(\n                                            StandardAssumptionContractRecord.'Amount One-Time Payment 2',\n                                            \"##0.00\"\n                                        )\n                                    ),\n                                    'Due Date One-Time Payment 3': StandardAssumptionContractRecord.'Due Date One-Time Payment 3',\n                                    'Amount One-Time Payment 3': Value(\n                                        Text(\n                                            StandardAssumptionContractRecord.'Amount One-Time Payment 3',\n                                            \"##0.00\"\n                                        )\n                                    ),\n                                    AllWTGAllocated: If(\n                                        StandardAssumptionContractRecord.AllWTGAllocated = 'AllWTGAllocated (OPEX & Land Lease Standard Assumptions)'.Yes,\n                                        'AllWTGAllocated (Land Lease Project Costs)'.Yes,\n                                        'AllWTGAllocated (Land Lease Project Costs)'.No\n                                    ),\n                                    'Use Inflation Profile': If(\n                                        StandardAssumptionContractRecord.'Use Inflation Profile' = 'Use Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,\n                                        'Use Inflation Profile (Land Lease Project Costs)'.Yes,\n                                        'Use Inflation Profile (Land Lease Project Costs)'.No\n                                    ),\n                                    'Use Country Inflation Profile': If(\n                                        StandardAssumptionContractRecord.'Use Country Inflation Profile' = 'Use Country Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,\n                                        'Use Country Inflation Profile (Land Lease Project Costs)'.Yes,\n                                        'Use Country Inflation Profile (Land Lease Project Costs)'.No\n                                    ),\n                                    'Inflation Country Area': StandardAssumptionContractRecord.'Inflation Country Area',\n                                    'Inflation Profile': Switch(\n                                        true,\n                                        And(\n                                            StandardAssumptionContractRecord.'Use Inflation Profile' = 'Use Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,\n                                            StandardAssumptionContractRecord.'Use Country Inflation Profile' = 'Use Country Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes\n                                        ),\n                                        LookUp(\n                                            'Country Inflation Profiles',\n                                            Country.Country = gblSelectedProject.Country.Country && Year = recCODYear\n                                        ).Inflation,\n                                        And(\n                                            StandardAssumptionContractRecord.'Use Inflation Profile' = 'Use Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,\n                                            StandardAssumptionContractRecord.'Use Country Inflation Profile' = 'Use Country Inflation Profile (OPEX & Land Lease Standard Assumptions)'.No\n                                        ),\n                                        StandardAssumptionContractRecord.'Inflation Profile',\n                                        Blank()\n                                    ),\n                                    'Inflation Start Year': recCODYear,\n                                    IsStartDateStandardAssumption: 'IsStartDateStandardAssumption (Land Lease Project Costs)'.Yes,\n                                    'Is Standard Contract?': 'Is Standard Contract? (Land Lease Project Costs)'.Yes\n                                }\n                            )\n                        );\n                        If(\n                            StandardAssumptionContractRecord.AllWTGAllocated = 'AllWTGAllocated (OPEX & Land Lease Standard Assumptions)'.Yes,\n                            ForAll(\n                                colGeneratorsInProject As recGeneratorInProject,\n                                With(\n                                    {\n                                        recLandLeaseContractCost: LookUp(\n                                            colLandLeaseStandardAssumptionContract,\n                                            'Land Lease Subaccount'.'Land Lease Subaccount' = StandardAssumptionContractRecord.'Land Lease Subaccount'.'Land Lease Subaccount'\n                                        )\n                                    },\n                                    Patch(\n                                        'Land Lease Allocation WTGS',\n                                        Defaults('Land Lease Allocation WTGS'),\n                                        {\n                                            Name: recLandLeaseContractCost.'Land Owner' & \"-\" & StandardAssumptionContractRecord.Description & \"-\" & recGeneratorInProject.Name,\n                                            'Project Cost': recLandLeaseContractCost,\n                                            'Generator In Project': recGeneratorInProject,\n                                            'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)'\n                                        }\n                                    )\n                                )\n                            )\n                        )\n                    )\n                );\n                ForAll(\n                    recSortedCountryTechnologyStandardAssumptions,\n                    With(\n                        {\n                            recStandardAssumptionRecord: ThisRecord,\n                            recLandLeaseSubAccountID: ThisRecord.'Land Lease Subaccount'.'Land Lease Subaccount'\n                        },\n                        If(\n                            recStandardAssumptionRecord.Period = 'Opex & Land Lease Period'.'Period 1',\n                            RemoveIf(\n                                colLoadLandLeasePeriods,\n                                true\n                            )\n                        );\n                        With(\n                            {\n                                recProjectCost: LookUp(\n                                    colLandLeaseStandardAssumptionContract,\n                                    And(Subaccount.'Land Lease Subaccount' = recLandLeaseSubAccountID)\n                                ),\n                                recStartDate: Switch(\n                                    recStandardAssumptionRecord.Period,\n                                    'Opex & Land Lease Period'.'Period 1',\n                                    recCODDate,\n                                    DateAdd(\n                                        Last(\n                                            Sort(\n                                                colLoadLandLeasePeriods,\n                                                Period,\n                                                SortOrder.Ascending\n                                            )\n                                        ).'Start Date',\n                                        Value(\n                                            Last(\n                                                Sort(\n                                                    colLoadLandLeasePeriods,\n                                                    Period,\n                                                    SortOrder.Ascending\n                                                )\n                                            ).'Land Lease duration years'\n                                        ) * 12 + Value(\n                                            Last(\n                                                Sort(\n                                                    colLoadLandLeasePeriods,\n                                                    Period,\n                                                    SortOrder.Ascending\n                                                )\n                                            ).'Land Lease duration months'\n                                        ),\n                                        TimeUnit.Months\n                                    )\n                                )\n                            },\n                            Collect(\n                                colLoadLandLeasePeriods,\n                                Patch(\n                                    'Land Lease Periods',\n                                    Defaults('Land Lease Periods'),\n                                    {\n                                        'Project Cost': recProjectCost,\n                                        Name: recStandardAssumptionRecord.Description,\n                                        Period: Switch(\n                                            recStandardAssumptionRecord.Period,\n                                            'Opex & Land Lease Period'.'Period 1',\n                                            'Land Lease Period'.'Period 1',\n                                            'Opex & Land Lease Period'.'Period 2',\n                                            'Land Lease Period'.'Period 2',\n                                            'Opex & Land Lease Period'.'Period 3',\n                                            'Land Lease Period'.'Period 3',\n                                            'Opex & Land Lease Period'.'Period 4',\n                                            'Land Lease Period'.'Period 4',\n                                            'Opex & Land Lease Period'.'Period 5',\n                                            'Land Lease Period'.'Period 5',\n                                            'Opex & Land Lease Period'.'Period 6',\n                                            'Land Lease Period'.'Period 6',\n                                            'Opex & Land Lease Period'.'Period 7',\n                                            'Land Lease Period'.'Period 7',\n                                            'Opex & Land Lease Period'.'Period 8',\n                                            'Land Lease Period'.'Period 8',\n                                            'Opex & Land Lease Period'.'Period 9',\n                                            'Land Lease Period'.'Period 9',\n                                            'Land Lease Period'.'Period 1'\n                                        ),\n                                        'Fixed Costs': Value(\n                                            Text(\n                                                recStandardAssumptionRecord.'Fix Costs',\n                                                \"#0.00\"\n                                            )\n                                        ),\n                                        Aggregation: Switch(\n                                            recStandardAssumptionRecord.Aggregation,\n                                            'Opex Aggregation'.MAX,\n                                            'Land Lease Aggregation'.MAX,\n                                            'Opex Aggregation'.MIN,\n                                            'Land Lease Aggregation'.MIN,\n                                            'Opex Aggregation'.SUM,\n                                            'Land Lease Aggregation'.SUM\n                                        ),\n                                        'Land Lease duration years': recStandardAssumptionRecord.'Duration In Years',\n                                        'Land Lease duration months': recStandardAssumptionRecord.'Duration in Months',\n                                        'Owning Business Unit': gblSelectedProject.'Besitzer (Unternehmenseinheit)',\n                                        'EUR/MWh': Value(recStandardAssumptionRecord.'EUR/MWh'),\n                                        'EUR/MW': Value(recStandardAssumptionRecord.'EUR/MW'),\n                                        'EUR/WTG': Value(recStandardAssumptionRecord.'EUR/WTG'),\n                                        'Distribution Frequency': Value(recStandardAssumptionRecord.'Distribution Frequency'),\n                                        'Start Date': recStartDate,\n                                        '% of Revenues': recStandardAssumptionRecord.'% of Revenues'\n                                    }\n                                )\n                            )\n                        )\n                    )\n                )\n            )\n        )\n    );\n    Concurrent(\n        ClearCollect(\n            colLandLeaseProjectCosts,\n            Filter(\n                'Land Lease Project Costs',\n                Project.Project = gblSelectedProject.Project\n            )\n        );\n        ClearCollect(\n            colLandLeasePeriods,\n            Filter(\n                'Land Lease Periods',\n                'Project Cost'.'Land Lease Project Cost' in colLandLeaseProjectCosts.'Land Lease Project Cost'\n            )\n        );\n        ,\n        ClearCollect(\n            colGeneratorsInProject,\n            AddColumns(\n                Filter(\n                    GeneratorInProjects,\n                    AsType(\n                        ModuleTypeInProject,\n                        GeneratorTypeInProjects\n                    ).Project.Project = gblSelectedProject.Project\n                ),\n                Label,\n                $\"{Name} - {Status}\",\n                Order,\n                Value(\n                    Last(\n                        Split(\n                            Name,\n                            \"_\"\n                        )\n                    ).Value\n                )\n            )\n        );\n        Collect(\n            colGeneratorsInProject,\n            AddColumns(\n                Filter(\n                    GeneratorInProjects,\n                    AsType(\n                        ModuleTypeInProject,\n                        PVModuleTypeInProjects\n                    ).Project.Project = gblSelectedProject.Project\n                ),\n                Label,\n                AsType(\n                    ModuleTypeInProject,\n                    PVModuleTypeInProjects\n                ).Label\n            )\n        );\n        ,\n        ClearCollect(\n            colAllocatedWtgsInSelectedLandLeaseCost,\n            Blank()\n        );\n    );\n    UpdateContext(\n        {\n            locIsVisiblePopUpSpinner: false,\n            locSpinnerInformationText: \"\"\n        }\n    ),\n    \"newLandLeasePeriodKey\",\n    With(\n        {\n            varLandLeaseCost: LookUp(\n                colLandLeaseProjectCosts,\n                'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n            ),\n            varLandLeasePeriod: LookUp(\n                colLandLeasePeriods,\n                'Land Lease Period' = locSelectedLandLeasePeriod.'Land Lease Period'\n            )\n        },\n        ClearCollect(\n            colAllocatedWtgsInSelectedLandLeaseCost,\n            Filter(\n                'Land Lease Allocation WTGS',\n                'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n            )\n        );\n        UpdateContext(\n            {\n                locSelectedLandLeaseSubaccount: locSelectedLandLeaseSubaccount,\n                locSelectedLandLeaseCost: varLandLeaseCost,\n                locSelectedLandLeasePeriod: Blank(),\n                locLandLeaseNextPeriod: varLandLeasePeriod,\n                locParentLandLeasePeriod: varLandLeasePeriod,\n                locRightPanelState: \"New\",\n                locIsVisibleRightPanelNewEditPeriod: true,\n                locCODDate: Blank()\n            }\n        );\n        UpdateContext(\n            {\n                locNewPeriodDesc: If(\n                    And(\n                        CountRows(\n                            Filter(\n                                colLandLeasePeriods,\n                                'Land Lease Period' = locLandLeaseNextPeriod.'Land Lease Period' && Period = [@'Land Lease Period'].'Period 1'\n                            )\n                        ) = 0,\n                        IsMatch(\n                            locLandLeaseNextPeriod.Name,\n                            \" - \\d+\",\n                            MatchOptions.EndsWith\n                        )\n                    ),\n                    Left(\n                        locLandLeaseNextPeriod.Name,\n                        Find(\n                            \" - \" & Last(\n                                Split(\n                                    locLandLeaseNextPeriod.Name,\n                                    \" - \"\n                                )\n                            ).Value,\n                            locLandLeaseNextPeriod.Name\n                        ) - 1\n                    ) & \" - \" & Value(\n                        Last(\n                            Split(\n                                locLandLeaseNextPeriod.Name,\n                                \" - \"\n                            )\n                        ).Value\n                    ) + 1,\n                    locLandLeaseNextPeriod.Name & \" - 2\"\n                )\n            }\n        );\n        UpdateContext(\n            {\n                locShowSecondPayment: And(\n                    Not(IsBlank(locSelectedLandLeaseCost.'Amount One-Time Payment 2')),\n                    Not(IsBlank(locSelectedLandLeaseCost.'Due Date One-Time Payment 2'))\n                ),\n                locShowThirdPayment: And(\n                    Not(IsBlank(locSelectedLandLeaseCost.'Amount One-Time Payment 3')),\n                    Not(IsBlank(locSelectedLandLeaseCost.'Due Date One-Time Payment 3'))\n                ),\n                locIsStartDateStandardAssumption: locSelectedLandLeaseCost.IsStartDateStandardAssumption,\n                locResetStartDate: false\n            }\n        )\n    ),\n    \"EditLandLeasePeriodKey\",\n    With(\n        {\n            varLandLeaseCost: LookUp(\n                colLandLeaseProjectCosts,\n                'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n            ),\n            varLandLeasePeriod: LookUp(\n                colLandLeasePeriods,\n                'Land Lease Period' = locSelectedLandLeasePeriod.'Land Lease Period'\n            )\n        },\n        ClearCollect(\n            colAllocatedWtgsInSelectedLandLeaseCost,\n            Filter(\n                'Land Lease Allocation WTGS',\n                'Project Cost'.'Land Lease Project Cost' = locSelectedLandLeaseCost.'Land Lease Project Cost'\n            )\n        );\n        UpdateContext(\n            {\n                locSelectedLandLeaseCost: Blank(),\n                locSelectedLandLeasePeriod: Blank(),\n                locCODDate: Blank()\n            }\n        );\n        UpdateContext(\n            {\n                locSelectedLandLeaseSubaccount: locSelectedLandLeaseSubaccount,\n                locSelectedLandLeaseCost: varLandLeaseCost,\n                locSelectedLandLeasePeriod: varLandLeasePeriod,\n                locLandLeaseNextPeriod: Blank(),\n                locRightPanelState: \"Edit\",\n                locIsVisibleRightPanelNewEditPeriod: true\n            }\n        );\n        UpdateContext(\n            {\n                locShowSecondPayment: And(\n                    Not(IsBlank(locSelectedLandLeaseCost.'Amount One-Time Payment 2')),\n                    Not(IsBlank(locSelectedLandLeaseCost.'Due Date One-Time Payment 2'))\n                ),\n                locShowThirdPayment: And(\n                    Not(IsBlank(locSelectedLandLeaseCost.'Amount One-Time Payment 3')),\n                    Not(IsBlank(locSelectedLandLeaseCost.'Due Date One-Time Payment 3'))\n                ),\n                locIsStartDateStandardAssumption: locSelectedLandLeaseCost.IsStartDateStandardAssumption,\n                locResetStartDate: false\n            }\n        )\n    ),\n    \"deleteLandLeasePeriodKey\",\n    UpdateContext(\n        {\n            locIsVisiblePopUpDeleteLandLeasePeriod: locSelectedLandLeasePeriod.Period <> 'Land Lease Period'.'Period 1',\n            locIsVisiblePopUpDeleteLandLeaseCost: locSelectedLandLeasePeriod.Period = 'Land Lease Period'.'Period 1'\n        }\n    );\n    \n);\nSelect(btn_LandLease_NewEditPeriod_ResetButton);\n"
