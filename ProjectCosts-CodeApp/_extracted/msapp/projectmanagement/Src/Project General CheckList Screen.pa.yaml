                                    ).'Approval Cluster State' = 'Approval Cluster States'.'In Progress',
                                    Not(pcf_CheckList_RightPanel_ChangeCluster_Form_Buttons_CancelApproval.Visible)
                                )*/
                                false
                              Width: =220
                              X: =Parent.Width - 35
                              Y: =24
