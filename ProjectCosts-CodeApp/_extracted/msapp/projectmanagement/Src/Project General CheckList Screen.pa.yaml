ate'),\n                    index,\n                    Order\n                ),\n                name,\n                relevance,\n                taskstate,\n                index,\n                clusterstate,\n                editor,\n                editdate\n            )\n        },\n        fn_Common_CheckList.ChecklisAsHTMLTable(varChecklistItems)\n    )\n)"
