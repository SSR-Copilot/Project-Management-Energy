Screens:
  Project General CheckList Screen:
    Properties:
      Fill: |-
        =RGBA(
            255,
            255,
            255,
            1
        )
      LoadingSpinner: '=LoadingSpinner.Data '
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: |
        =Clear(colDataCardDeputyPMPreSelected);
        Clear(colDataCardPMPreSelected);
      OnVisible: |-
        =// ===============================
        // Project General CheckList Screen - OnVisible
        // Start Cluster aware version
        // ===============================
        If(
            IsBlank(gblRecordSelectedProject) || IsBlank(gblRecordSelectedProject.Project),
            // ===============================
        // No selected project
        // ===============================
            Set(
                gblRecordSelectedProject,
                Blank()
            );
            Set(
                gblSelectedCluster,
                Blank()
            );
            Clear(colSelectedProjectStateTracking);
            Clear(colDefaultProjectChecklists);
            Clear(colDefaultProjectApprovalsSettings);
            Clear(colProjectCheckList);
            Clear(colProjectStatesTemporary);
            Clear(colChecklistAllProjectStates);
            Clear(colProjectStatesForChecklist);
            Clear(colProjectStatesForChecklistDisplay);
            UpdateContext(
                {
                    locProjectStartClusterNo: 0,
                    locRecordSelectedProjectState: Defaults('Project States'),
                    locRecordFirstProjectState: Blank(),
                    locSelectedItemProjectState: Blank(),
                    locDefaultFirstProjectStateInProgress: Blank(),
                    locSelectedItemProjectPreviousState: Blank(),
                    locSelectedItemProjectNextState: Blank(),
                    locRecordSelectedProjectPreviousState: Defaults('Project States'),
                    locRecordSelectedProjectStateTracking: First(
                        ShowColumns(
                            FirstN(
                                'Project State Trackings',
                                0
                            ),
                            Name,
                            'Project State Tracking',
                            'Approval Cluster State',
                            'Cluster Step State',
                            'Approval Comment',
                            'Approval Due Date'
                        )
                    ),
                    locGeneralDataEditFieldCompletionDateVisibility: false,
                    locGeneralDataEditFieldCompletionDateItemId: Blank(),
                    locGeneralDataEditFieldCompletionDateX: 0,
                    locGeneralDataEditFieldCompletionDateY: 0,
                    locIsVisibleColumnHoldingDescription: true,
                    locChangeClusterStateConfirmationDialog: false,
                    locChangeClusterStateReturnConfirmationDialog: false,
                    locChangeClusterStateConfirmationDialogValue: First(
                        FirstN(
                            'Project States',
                            0
                        )
                    ),
                    locChangeClusterStateConfirmationDialogApprovalClusterStateValue: Blank()
                }
            ),
            // ===============================
        // Selected project exists
        // ===============================
            Set(
                gblRecordSelectedProject,
                LookUp(
                    Projects,
                    Project = gblRecordSelectedProject.Project
                )
            );
            UpdateContext(
                {
                    locProjectStartClusterNo: Switch(
                        Coalesce(
                            gblRecordSelectedProject.'Start Cluster',
                            'Cluster States'.Greenfield
                        ),
                        'Cluster States'.Greenfield,
                        0,
                        'Cluster States'.'Cluster 1',
                        1,
                        'Cluster States'.'Cluster 2',
                        2,
                        'Cluster States'.'Cluster 3',
                        3,
                        'Cluster States'.'Cluster 4',
                        4,
                        'Cluster States'.'Cluster 5',
                        5,
                        'Cluster States'.'Cluster 6',
                        6,
                        0
                    )
                }
            );
            Set(
                gblCurrentUser,
                Patch(
                    gblCurrentUser,
                    {
                        CanEditSelectedProject: And(
                            DataSourceInfo(
                                Projects,
                                DataSourceInfo.CreatePermission
                            ),
                            Coalesce(
                                RecordInfo(
                                    gblRecordSelectedProject,
                                    RecordInfo.EditPermission
                                ),
                                false
                            )
                        )
                    }
                )
            );
            Set(
                gblSelectedCluster,
                gblRecordSelectedProject.'Cluster State'
            );
            // ===============================
            // 1. Load current tracking rows
            // ===============================
            Refresh('Project State Trackings');
            ClearCollect(
                colSelectedProjectStateTracking,
                ForAll(
                    Filter(
                        'Project State Trackings',
                        Project.Project = gblRecordSelectedProject.Project
                    ) As Source,
                    {
                        ID: Source.'Project State Tracking',
                        Name: Source.Name,
                        ProjectID: Source.Project.Project,
                        ClusterProjectStateID: Source.'Cluster State'.'Project State',
                        StateProgress: Source.'Approval Cluster State',
                        Comment: Source.'Approval Comment',
                        DueDate: Source.'Approval Due Date',
                        FlowRunId: Source.FlowRunId,
                        FlowApprovalId: Source.FlowApprovalId
                    }
                )
            );
            // ===============================
            // 2. Load default checklist data
            // ===============================
            ClearCollect(
                colDefaultProjectChecklists,
                'Project Default Checklists'
            );
            // ===============================
            // 3. Load default approvals BEFORE building state sequence
            // ===============================
            ClearCollect(
                colDefaultProjectApprovalsSettings,
                Filter(
                    'Project Default Approvals',
                    'Gate active' = true && (IsBlank(gblRecordSelectedProjectCountry) || IsBlank(gblRecordSelectedProjectCountry.Country) || 'Approvals Country'.Country = gblRecordSelectedProjectCountry.Country) && (IsBlank(gblRecordSelectedProject) || IsBlank(gblRecordSelectedProject.Technology) || Technology = gblRecordSelectedProject.Technology)
                )
            );
            // ===============================
            // 4. Sync skipped cluster state tracking
            //    Only before real gate approval progress exists.
            //    Safe cases:
            //    - New/acquired project before approval
            //    - Start Cluster changed before first approval
            //    Blocked cases:
            //    - Approval requested
            //    - Approval pending
            //    - Approval completed
            //    - Any real non-skipped cluster progress exists
            // ===============================
            With(
                {varAutoSkippedComment: "Automatically completed because this project starts at a later cluster."},
                With(
                    {
                        varProjectIsStillDraft: Coalesce(
                            gblRecordSelectedProject.'Cluster State'.Name,
                            "Draft"
                        ) = "Draft",
                        varRealGateProgressAlreadyExists: CountRows(
                            Filter(
                                AddColumns(
                                    Filter(
                                        'Project State Trackings' As TrackingRow,
                                        TrackingRow.Project.Project = gblRecordSelectedProject.Project
                                    ) As TrackingRow,
                                    ClusterNo,
                                    Switch(
                                        TrackingRow.'Cluster State'.Name,
                                        "Draft",
                                        0,
                                        "Cluster 1",
                                        1,
                                        "Cluster 2",
                                        2,
                                        "Cluster 3",
                                        3,
                                        "Cluster 4",
                                        4,
                                        "Cluster 5",
                                        5,
                                        "Cluster 6",
                                        6,
                                        999
                                    )
                                ) As ExistingRow,
                            // Any flow reference means approval process has already started.
                                Not(IsBlank(ExistingRow.FlowRunId)) || Not(IsBlank(ExistingRow.FlowApprovalId)) ||
                            // Draft In Progress with blank comment is our initial clean state.
        // Draft Completed / Rejected / Canceled / commented means real approval progress.
         (ExistingRow.ClusterNo = 0 && (ExistingRow.'Approval Cluster State' in [
                                    'Approval Cluster States'.Completed,
                                    'Approval Cluster States'.Rejected,
                                    'Approval Cluster States'.'Request canceled',
                                    'Approval Cluster States'.Canceling,
                                    'Approval Cluster States'.Abandoned,
                                    'Approval Cluster States'.'Inactive/ On-hold'
                                ] || Not(IsBlank(ExistingRow.'Approval Comment')))) ||
                            // Non-draft real progress.
        // Auto-completed skipped clusters before Start Cluster are not real approval progress.
         (ExistingRow.ClusterNo > 0 && Coalesce(
                                    ExistingRow.'Approval Cluster State',
                                    'Approval Cluster States'.'Not Started'
                                ) <> 'Approval Cluster States'.'Not Started' && Not(ExistingRow.ClusterNo < locProjectStartClusterNo && ExistingRow.'Approval Cluster State' = 'Approval Cluster States'.Completed))
                            )
                        ) > 0
                    },
                    If(
                        locProjectStartClusterNo > 0 && varProjectIsStillDraft && Not(varRealGateProgressAlreadyExists),
                        With(
                            {
                                varStatesWithClusterNo: AddColumns(
                                    Filter(
                                        'Project States' As PS,
                                        PS.'Is Visible On Checklist' = true && PS.Name in [
                                            "Draft",
                                            "Cluster 1",
                                            "Cluster 2",
                                            "Cluster 3",
                                            "Cluster 4",
                                            "Cluster 5",
                                            "Cluster 6"
                                        ]
                                    ) As PS,
                                    ClusterNo,
                                    Switch(
                                        PS.Name,
                                        "Draft",
                                        0,
                                        "Cluster 1",
                                        1,
                                        "Cluster 2",
                                        2,
                                        "Cluster 3",
                                        3,
                                        "Cluster 4",
                                        4,
                                        "Cluster 5",
                                        5,
                                        "Cluster 6",
                                        6,
                                        999
                                    )
                                )
                            },
                            If(
                                CountRows(
                                    Filter(
                                        AddColumns(
                                            varStatesWithClusterNo As StateRow,
                                            ExistingApprovalState,
                                            LookUp(
                                                'Project State Trackings',
                                                Project.Project = gblRecordSelectedProject.Project && 'Cluster State'.'Project State' = StateRow.'Project State'
                                            ).'Approval Cluster State',
                                            ExpectedApprovalState,
                                            Switch(
                                                true,
                                            // Draft should be In Progress before first approval
                                                StateRow.ClusterNo = 0,
                                                'Approval Cluster States'.'In Progress',
                                            // Skipped clusters before Start Cluster should be Completed
                                                StateRow.ClusterNo > 0 && StateRow.ClusterNo < locProjectStartClusterNo,
                                                'Approval Cluster States'.Completed,
                                            // Start Cluster and future clusters should be Not Started
                                                'Approval Cluster States'.'Not Started'
                                            )
                                        ),
                                        IsBlank(ExistingApprovalState) || ExistingApprovalState <> ExpectedApprovalState
                                    )
                                ) > 0,
                                Select(btn_CheckList_EnsureSkippedClusterStatesCompleted)
                            )
                        )
                    )
                )
            );
            // ===============================
            // 5. Reload tracking after skipped cluster patch
            // ===============================
            Refresh('Project State Trackings');
            ClearCollect(
                colSelectedProjectStateTracking,
                ForAll(
                    Filter(
                        'Project State Trackings',
                        Project.Project = gblRecordSelectedProject.Project
                    ) As Source,
                    {
                        ID: Source.'Project State Tracking',
                        Name: Source.Name,
                        ProjectID: Source.Project.Project,
                        ClusterProjectStateID: Source.'Cluster State'.'Project State',
                        StateProgress: Source.'Approval Cluster State',
                        Comment: Source.'Approval Comment',
                        DueDate: Source.'Approval Due Date',
                        FlowRunId: Source.FlowRunId,
                        FlowApprovalId: Source.FlowApprovalId
                    }
                )
            );
            // ===============================
            // 6. Build filtered PBI-aware sequence
            // ===============================
            Select(btn_CheckList_BuildProjectStatesSequence);
            // Optional debug/temp collection, now based on filtered sequence
            ClearCollect(
                colProjectStatesTemporary,
                Filter(
                    colProjectStatesForChecklist,
                    State.StateProgress = 'Approval Cluster States'.'In Progress'
                )
            );
            // ===============================
            // 7. Reset checklist data
            // ===============================
            ClearCollect(
                colProjectCheckList,
                Blank()
            );
            ClearCollect(
                colProcessingCheckListSteps,
                Blank()
            );
            // ===============================
            // 8. Local context init
            // ===============================
            UpdateContext(
                {
                    locRecordSelectedProjectState: Defaults('Project States'),
                    locRecordFirstProjectState: If(
                        IsBlank(First(colProjectStatesForChecklist).ID),
                        Blank(),
                        LookUp(
                            'Project States',
                            'Project State' = GUID(First(colProjectStatesForChecklist).ID)
                        )
                    ),
                    locSelectedItemProjectState: Blank(),
                    locDefaultFirstProjectStateInProgress: Coalesce(
                        LookUp(
                            colProjectStatesForChecklist,
                            State.StateProgress = 'Approval Cluster States'.'In Progress'
                        ),
                        First(colProjectStatesForChecklist)
                    ),
                    locSelectedItemProjectPreviousState: Blank(),
                    locSelectedItemProjectNextState: Blank(),
                    locRecordSelectedProjectPreviousState: Defaults('Project States'),
                    locRecordSelectedProjectStateTracking: First(
                        ShowColumns(
                            FirstN(
                                'Project State Trackings',
                                0
                            ),
                            Name,
                            'Project State Tracking',
                            'Approval Cluster State',
                            'Cluster Step State',
                            'Approval Comment',
                            'Approval Due Date'
                        )
                    ),
                    locGeneralDataEditFieldCompletionDateVisibility: false,
                    locGeneralDataEditFieldCompletionDateItemId: Blank(),
                    locGeneralDataEditFieldCompletionDateX: 0,
                    locGeneralDataEditFieldCompletionDateY: 0,
                    locIsVisibleColumnHoldingDescription: true,
                    locChangeClusterStateConfirmationDialog: false,
                    locChangeClusterStateReturnConfirmationDialog: false,
                    locChangeClusterStateConfirmationDialogValue: First(
                        FirstN(
                            'Project States',
                            0
                        )
                    ),
                    locChangeClusterStateConfirmationDialogApprovalClusterStateValue: Blank()
                }
            );
            // ===============================
            // 9. Load checklist for selected/default state
            // ===============================
            UpdateContext({locChecklistUseClickedState: false});
            Reset(cmp_CheckList_Project_States);
            Select(but_Project_States_CheckList_Refresh)
        )
    Children:
      - btn_CheckList_EnsureSkippedClusterStatesCompleted:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: ="btn_CheckList_EnsureSkippedClusterStatesCompleted"
            OnSelect: |-
              =With(
                  {
                      varAutoSkippedComment: "Automatically completed because this project starts at a later cluster."
                  },
                  With(
                      {
                          varProjectIsStillDraft: Coalesce(
                              gblRecordSelectedProject.'Cluster State'.Name,
                              "Draft"
                          ) = "Draft",

                          varRealGateProgressAlreadyExists: CountRows(
                              Filter(
                                  AddColumns(
                                      Filter(
                                          'Project State Trackings' As TrackingRow,
                                          TrackingRow.Project.Project = gblRecordSelectedProject.Project
                                      ) As TrackingRow,
                                      ClusterNo,
                                      Switch(
                                          TrackingRow.'Cluster State'.Name,
                                          "Draft", 0,
                                          "Cluster 1", 1,
                                          "Cluster 2", 2,
                                          "Cluster 3", 3,
                                          "Cluster 4", 4,
                                          "Cluster 5", 5,
                                          "Cluster 6", 6,
                                          999
                                      )
                                  ) As ExistingRow,

                                  Not(IsBlank(ExistingRow.FlowRunId)) ||

                                  Not(IsBlank(ExistingRow.FlowApprovalId)) ||

                                  (
                                      ExistingRow.ClusterNo = 0 &&
                                      (
                                          ExistingRow.'Approval Cluster State' in [
                                              'Approval Cluster States'.Completed,
                                              'Approval Cluster States'.Rejected,
                                              'Approval Cluster States'.'Request canceled',
                                              'Approval Cluster States'.Canceling,
                                              'Approval Cluster States'.Abandoned,
                                              'Approval Cluster States'.'Inactive/ On-hold'
                                          ] ||
                                          Not(IsBlank(ExistingRow.'Approval Comment'))
                                      )
                                  ) ||

                                  (
                                      ExistingRow.ClusterNo > 0 &&
                                      Coalesce(
                                          ExistingRow.'Approval Cluster State',
                                          'Approval Cluster States'.'Not Started'
                                      ) <> 'Approval Cluster States'.'Not Started' &&
                                      Not(
                                          ExistingRow.ClusterNo < locProjectStartClusterNo &&
                                          ExistingRow.'Approval Cluster State' = 'Approval Cluster States'.Completed
                                      )
                                  )
                              )
                          ) > 0
                      },
                      If(
                          locProjectStartClusterNo > 0 &&
                          varProjectIsStillDraft &&
                          Not(varRealGateProgressAlreadyExists),

                          With(
                              {
                                  varStatesWithClusterNo: AddColumns(
                                      Filter(
                                          'Project States' As PS,
                                          PS.'Is Visible On Checklist' = true &&
                                          PS.Name in [
                                              "Draft",
                                              "Cluster 1",
                                              "Cluster 2",
                                              "Cluster 3",
                                              "Cluster 4",
                                              "Cluster 5",
                                              "Cluster 6"
                                          ]
                                      ) As PS,
                                      ClusterNo,
                                      Switch(
                                          PS.Name,
                                          "Draft", 0,
                                          "Cluster 1", 1,
                                          "Cluster 2", 2,
                                          "Cluster 3", 3,
                                          "Cluster 4", 4,
                                          "Cluster 5", 5,
                                          "Cluster 6", 6,
                                          999
                                      )
                                  )
                              },
                              ForAll(
                                  varStatesWithClusterNo As StateRow,
                                  With(
                                      {
                                          varExistingTracking: LookUp(
                                              'Project State Trackings',
                                              Project.Project = gblRecordSelectedProject.Project &&
                                              'Cluster State'.'Project State' = StateRow.'Project State'
                                          ),

                                          varTargetApprovalState: If(
                                              StateRow.Name = "Draft",
                                              'Approval Cluster States'.'In Progress',
                                              If(
                                                  StateRow.ClusterNo > 0 &&
                                                  StateRow.ClusterNo < locProjectStartClusterNo,
                                                  'Approval Cluster States'.Completed,
                                                  'Approval Cluster States'.'Not Started'
                                              )
                                          ),

                                          varTargetComment: If(
                                              StateRow.ClusterNo > 0 &&
                                              StateRow.ClusterNo < locProjectStartClusterNo,
                                              varAutoSkippedComment,
                                              Blank()
                                          )
                                      },
                                      If(
                                          IsBlank(varExistingTracking) ||
                                          varExistingTracking.'Approval Cluster State' <> varTargetApprovalState ||
                                          Coalesce(varExistingTracking.'Approval Comment', "") <> Coalesce(varTargetComment, ""),

                                          Patch(
                                              'Project State Trackings',
                                              Coalesce(
                                                  varExistingTracking,
                                                  Defaults('Project State Trackings')
                                              ),
                                              {
                                                  Project: gblRecordSelectedProject,
                                                  'Cluster State': LookUp(
                                                      'Project States',
                                                      'Project State' = StateRow.'Project State'
                                                  ),
                                                  'Approval Cluster State': varTargetApprovalState,
                                                  'Cluster Step State': Blank(),
                                                  'Approval Due Date': Blank(),
                                                  FlowRunId: Blank(),
                                                  FlowApprovalId: Blank(),
                                                  'Approval Comment': varTargetComment,
                                                  'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                              }
                                          )
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
            Text: ="btn_CheckList_EnsureSkippedClusterStatesCompleted"
            Visible: =false
            X: =60
            Y: =60
      - btn_CheckList_BuildProjectStatesSequence:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: ="btn_CheckList_BuildProjectStatesSequence"
            OnSelect: |-
              =ClearCollect(
                  colChecklistAllProjectStates,
                  ForAll(
                      Sort(
                          Filter(
                              'Project States',
                              ThisRecord.'Is Visible On Checklist' = true
                          ),
                          Order,
                          SortOrder.Ascending
                      ) As Source,
                      With(
                          {
                              varClusterNo: Switch(
                                  Source.Name,
                                  "Draft", 0,
                                  "Cluster 1", 1,
                                  "Cluster 2", 2,
                                  "Cluster 3", 3,
                                  "Cluster 4", 4,
                                  "Cluster 5", 5,
                                  "Cluster 6", 6,
                                  999
                              )
                          },
                          With(
                              {
                                  varGateSourceNo: If(
                                      Source.Name = "Draft" && locProjectStartClusterNo > 0,
                                      If(
                                          locProjectStartClusterNo = 1,
                                          0,
                                          locProjectStartClusterNo - 1
                                      ),
                                      varClusterNo
                                  )
                              },
                              With(
                                  {
                                      varGateSourceState: LookUp(
                                          AddColumns(
                                              Filter(
                                                  'Project States' As GateState,
                                                  GateState.'Is Visible On Checklist' = true
                                              ) As GateState,
                                              ClusterNoForGate,
                                              Switch(
                                                  GateState.Name,
                                                  "Draft", 0,
                                                  "Cluster 1", 1,
                                                  "Cluster 2", 2,
                                                  "Cluster 3", 3,
                                                  "Cluster 4", 4,
                                                  "Cluster 5", 5,
                                                  "Cluster 6", 6,
                                                  999
                                              )
                                          ),
                                          ClusterNoForGate = varGateSourceNo
                                      )
                                  },
                                  With(
                                      {
                                          varGateRecord: LookUp(
                                              colDefaultProjectApprovalsSettings As Approval,
                                              Not(IsBlank(Approval.'Cluster State')) &&
                                              Approval.'Cluster State'.'Project State' = varGateSourceState.'Project State'
                                          )
                                      },
                                      {
                                          ID: Source.'Project State',
                                          Name: Source.Name,
                                          Description: Coalesce(
                                              Source.'Cluster Description',
                                              Source.Name
                                          ),
                                          State: LookUp(
                                              colSelectedProjectStateTracking,
                                              ClusterProjectStateID = Source.'Project State'
                                          ),
                                          HasGate: Not(IsBlank(varGateRecord)),
                                          Gate: varGateRecord.'Project Default Approvals',
                                          Sort: Source.Order,
                                          ClusterNo: varClusterNo
                                      }
                                  )
                              )
                          )
                      )
                  )
              );

              // Operational collection.
              // Used for approval movement logic.
              // Keep this filtered so Draft still moves to Start Cluster correctly.
              ClearCollect(
                  colProjectStatesForChecklist,
                  With(
                      {
                          varFilteredStates: Filter(
                              colChecklistAllProjectStates,
                              ClusterNo = 0 ||
                              (
                                  ClusterNo >= locProjectStartClusterNo &&
                                  ClusterNo <= 6
                              )
                          )
                      },
                      ForAll(
                          Sequence(CountRows(varFilteredStates)),
                          Patch(
                              Last(
                                  FirstN(
                                      varFilteredStates,
                                      Value
                                  )
                              ),
                              {
                                  RowNumber: Value
                              }
                          )
                      )
                  )
              );

              // Display collection.
              // Used only by the visual cluster component.
              // Shows Draft + skipped/completed clusters + remaining clusters.
              ClearCollect(
                  colProjectStatesForChecklistDisplay,
                  ForAll(
                      Sequence(CountRows(colChecklistAllProjectStates)),
                      With(
                          {
                              varDisplayRow: Last(
                                  FirstN(
                                      colChecklistAllProjectStates,
                                      Value
                                  )
                              )
                          },
                          Patch(
                              varDisplayRow,
                              {
                                  RowNumber: Value,
                                  IsSkippedDisplayOnly: varDisplayRow.ClusterNo > 0 &&
                                      varDisplayRow.ClusterNo < locProjectStartClusterNo
                              }
                          )
                      )
                  )
              );

              UpdateContext(
                  {
                      locDefaultFirstProjectStateInProgress: Coalesce(
                          LookUp(
                              colProjectStatesForChecklist,
                              State.StateProgress = 'Approval Cluster States'.'In Progress'
                          ),
                          First(colProjectStatesForChecklist)
                      )
                  }
              )
            Visible: =false
            X: =40
            Y: =40
      - fn_Common_CheckList:
          Control: CanvasComponent
          ComponentName: fn_Common
          Properties:
            Height: =10
            Width: =10
            Y: =Parent.Height-Self.Height
      - con_CheckList_DisplayProject:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmp_CheckList_ProjectHeader:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: =gblTableApprovalStateColors
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: ='Project Main Screen'
                  OnLogoClick: |-
                    =Navigate(
                        'Project Main Screen',
                        ScreenTransition.Fade
                    )
                  Project: =gblProjectHeaderData
                  Width: =1024
            - con_CheckList_DisplayProject_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ColorValue(gblAppTheme.palette.neutralLighter)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutWrap: =true
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - con_CheckList_DisplayProject_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(gblLeftNavigationMenuIsExpanded, gblAppSizes.LeftNavigation.ExpandedWidth,gblAppSizes.LeftNavigation.DecreasedWidth)
                      Children:
                        - cmp_CheckList_Left_Navigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftNavigationMenu
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnExpand: |
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |
                                =If(
                                    Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                    Set(
                                        gblLeftNavigationSelected,
                                        LookUp(
                                            LeftNavigationMenu,
                                            ItemKey = Self.SelectedKey
                                        )
