                            ComponentName: cat_PowerCAT.Icon
                            Properties:
                              AccessibilityLabel: ="pcf_CheckList_RightPanel_ChangeCluster_Form_Buttons_Save"
                              DisplayMode: |-
                                =With(
                                    {
                                        varRecord: LookUp(
                                            'Project State Trackings',
                                            And(
                                                Project.Project = gblRecordSelectedProject.Project,
                                                'Cluster State'.'Project State' = GUID(locSelectedItemProjectState.ID)
                                            )
                                        )
                                    },
                                    If(
                                        Or(
                                            varRecord.'Approval Cluster State' = gblAppConstants.ApprovalClusterStates.Completed,
                                            lbl_GeneralData_RightPanel_ProjectState_InpForm_Comment_Details_ErrorMessage_1.Visible
                                        ),
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                    )
                                )
                              FillColor: =gblAppTheme.palette.themePrimary
                              FontColor: =gblAppTheme.palette.white
                              FontSize: =16
                              Height: =32
                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              HoverIconColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.white
                                )
                              IconName: ="CheckMark"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnChange: |-
                                =UpdateContext(
                                    {
                                        locIsVisibleGDPerformRequestofGateApprovalDialog: true,
                                        locGDPerformRequestofGateApprovalDialogText: $"Cluster data '{locRecordSelectedProjectState.Name}' will be save, please wait..."
                                    }
                                );
                                IfError(
                                    With(
                                        {
                                            recCurrentProjectStateTracking: Patch(
                                                'Project State Trackings',
                                                If(
                                                    IsBlank(
                                                        LookUp(
                                                            'Project State Trackings',
                                                            'Project State Tracking' = locRecordSelectedProjectStateTracking.vsb_projectstatetrackingid
                                                        )
                                                    ),
                                                    Defaults('Project State Trackings'),
                                                    LookUp(
                                                        'Project State Trackings',
                                                        'Project State Tracking' = locRecordSelectedProjectStateTracking.vsb_projectstatetrackingid
                                                    )
                                                ),
                                                {
                                                    Project: gblRecordSelectedProject,
                                                    'Cluster State': LookUp(
                                                        'Project States',
                                                        'Project State' = locRecordSelectedProjectState.'Project State'
                                                    ),
                                                    'Approval Comment': txt_GeneralData_RightPanel_ProjectState_InpForm_Comment_1.Value,
                                                    'Approval Due Date': If(
                                                        dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.Visible,
                                                        dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.SelectedDate,
                                                        Blank()
                                                    ),
                                                    'Approval Cluster State': 'Approval Cluster States'.Completed,
                                                    'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                }
                                            )
                                        },
                                        If(
                                            Not(IsBlank(locSelectedItemProjectNextState)),
                                            UpdateContext(
                                                {
                                                    locRecordSelectedProjectNextStateTracking: Patch(
                                                        'Project State Trackings',
                                                        If(
                                                            IsBlank(
                                                                LookUp(
                                                                    'Project State Trackings',
                                                                    And(
                                                                        Project.Project = gblRecordSelectedProject.Project,
                                                                        'Cluster State'.'Project State' = GUID(locSelectedItemProjectNextState.ID)
                                                                    )
                                                                )
                                                            ),
                                                            Defaults('Project State Trackings'),
                                                            LookUp(
                                                                'Project State Trackings',
                                                                And(
                                                                    Project.Project = gblRecordSelectedProject.Project,
                                                                    'Cluster State'.'Project State' = GUID(locSelectedItemProjectNextState.ID)
                                                                )
                                                            )
                                                        ),
                                                        {
                                                            Project: gblRecordSelectedProject,
                                                            'Cluster State': LookUp(
                                                                'Project States',
                                                                'Project State' = GUID(locSelectedItemProjectNextState.ID)
                                                            ),
                                                            'Approval Comment': Blank(),
                                                            'Approval Due Date': If(
                                                                dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.Visible,
                                                                dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.SelectedDate,
                                                                Blank()
                                                            ),
                                                            'Approval Cluster State': 'Approval Cluster States'.'In Progress',
                                                            'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                        }
                                                    )
                                                }
                                            )
                                        );
                                        With(
                                            {varCurrentProjectStateTrackingGUID: recCurrentProjectStateTracking.'Project State Tracking'},
                                            UpdateContext(
                                                {
                                                    locRecordSelectedProjectStateTracking: First(
                                                        ShowColumns(
                                                            Filter(
                                                                'Project State Trackings',
                                                                'Project State Tracking' = varCurrentProjectStateTrackingGUID
                                                            ),
                                                            Name,
                                                            'Project State Tracking',
                                                            'Approval Cluster State',
                                                            'Cluster Step State',
                                                            'Approval Comment',
                                                            'Approval Due Date'
                                                        )
                                                    ),
                                                    locCurrentClusterStateNote: Patch(
                                                        'Project State Tracking Notes',
                                                        Defaults('Project State Tracking Notes'),
                                                        {
                                                            Name: $"Change {locSelectedItemProjectState.Name} to {locSelectedItemProjectNextState.Name}",
                                                            'Project State Tracking': LookUp(
                                                                'Project State Trackings',
                                                                'Project State Tracking' = varCurrentProjectStateTrackingGUID
                                                            ),
                                                            Comment: Trim(txt_GeneralData_RightPanel_ProjectState_InpForm_Comment_1.Value),
                                                            Note: html_CheckList_RightPanel_ChangeCluster_Form_History.HtmlText,
                                                            'Note Type': 'Note Type'.Checklistitem,
                                                            'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                        }
                                                    )
                                                }
                                            );
                                            // No active Project Default Approval exists, so flow will not run.
                                            // Direct movement should still mark the project approval status as Approved.
                                            If(
                                                locRequestApprovalEntityType = "Cluster Transition" && Not(IsBlank(locSelectedItemProjectNextState)),
                                                Set(
                                                    gblRecordSelectedProject,
                                                    Patch(
                                                        Projects,
                                                        gblRecordSelectedProject,
                                                        {
                                                            'Cluster State': LookUp(
                                                                'Project States',
                                                                'Project State' = GUID(locSelectedItemProjectNextState.ID)
                                                            ),
                                                            'Approval States': 'Approval States'.Approved,
                                                            'Besitzer (Unternehmenseinheit)': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                        }
                                                    )
                                                );
                                                Set(
                                                    gblSelectedCluster,
                                                    gblRecordSelectedProject.'Cluster State'
                                                );
                                                Set(
                                                    gblProjectHeaderData,
                                                    {
                                                        ID: gblRecordSelectedProject.Project,
                                                        Name: gblRecordSelectedProject.'Project Name',
                                                        Technology: Text(gblRecordSelectedProject.Technology),
                                                        Capacity: gblRecordSelectedProject.'Plant WTG Capacity [MW]',
                                                        Status: Text(gblRecordSelectedProject.'Cluster State'.Name),
                                                        Approval: Text(gblRecordSelectedProject.'Approval States')
                                                    }
                                                )
                                            )
                                        );
                                        UpdateContext(
                                            {
                                                locIsVisibleGDPerformRequestofGateApprovalDialog: false,
                                                locGDPerformRequestofGateApprovalDialogText: $"Cluster data '{locRecordSelectedProjectState.Name}' will be saved."
                                            }
                                        )
                                    ),
                                    // Show error message
                                    UpdateContext({locGDPerformRequestofGateApprovalDialogText: $"Error: Project Status was updated.  Internal error: originated on {FirstError.Source}. Message: {FirstError.Message & FirstError.Details.HttpResponse}"})
                                );
                                UpdateContext(
                                    {
                                        locIsVisibleRightPanelProjectState: true,
                                        locIsVisibleGDPerformRequestofGateApprovalDialog: false,
                                        locGDPerformRequestofGateApprovalDialogText: Blank()
                                    }
                                );
                                Navigate('Project General CheckList Screen');
                                Select(btn_CheckList_RightPanel_ChangeCluster_Form_Buttons_Reset);
                                Select(btn_CheckList_RightPanel_ChangeCluster_Form_Buttons_Refresh)
                              Text: ="Save"
                              TextAlignment: ='PowerCAT.Icon.TextAlignment'.Center
                              Theme: =gblAppThemeJson
                              Tooltip: =locRecordSelectedProjectState.Name
                              Visible: |-
                                =Switch(
                                    locRequestApprovalEntityType,
                                    "Checklist Completion",
                                    locSelectedCheckListEntity.'Approval Checklist State' = 'Approval Cluster States'.'In Progress' &&
                                    Not(locSelectedCheckListEntity.'Project Default Checklist' in Distinct('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist')),
                                    "Cluster Transition",
                                    Not(locSelectedItemProjectState.HasGate) &&
                                    LookUp(
                                        colSelectedProjectStateTracking,
                                        ThisRecord.ClusterProjectStateID = GUID(locSelectedItemProjectState.ID)
                                    ).StateProgress = 'Approval Cluster States'.'In Progress',
                                    false
                                )
                              Width: =96
                              X: =Parent.Width - 35
                              Y: =24
                        - pcf_CheckList_RightPanel_ChangeCluster_Form_Buttons_RequestApproval:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.Icon
                            Properties:
                              AccessibilityLabel: ="pcf_CheckList_RightPanel_ChangeCluster_Form_Buttons_RequestApproval"
                              DisplayMode: |-
                                =If(
                                    And(
                                        If( 
                                            locRequestApprovalEntityType = "Cluster Transition",
                                            LookUp(
                                                'Project State Trackings',
                                                And(
                                                    Project.Project = gblRecordSelectedProject.Project,
                                                    'Cluster State'.'Project State' = GUID(locSelectedItemProjectState.ID)
                                                )
                                            ).'Approval Cluster State' <> gblAppConstants.ApprovalClusterStates.Completed,
                                            true
                                        ),
                                        !lbl_GeneralData_RightPanel_ProjectState_InpForm_Comment_Details_ErrorMessage_1.Visible
                                    ),
                                    DisplayMode.Edit,
                                    DisplayMode.Disabled
                                )
                              FillColor: =gblAppTheme.palette.themePrimary
                              FontColor: =If(locRecordSelectedProjectStateTracking.vsb_approvalclusterstate <> gblAppConstants.ApprovalClusterStates.Completed || locRequestApprovalEntityType = "Checklist Completion", gblAppTheme.palette.white, gblAppTheme.palette.Green)
                              FontSize: =16
                              Height: =32
                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              HoverIconColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.white
                                )
                              IconName: "=Switch(\r\n    locRequestApprovalEntityType,\r\n    \"Cluster Transition\",\r\n    If(locRecordSelectedProjectStateTracking.vsb_approvalclusterstate <> gblAppConstants.ApprovalClusterStates.Completed, \"Forward\", \"CheckMark\"),\r\n    \"Checklist Completion\",\r\n    If(locSelectedCheckListEntity.'Approval Checklist State' <> gblAppConstants.ApprovalClusterStates.Completed, \"Forward\", \"CheckMark\")\r\n)\r\n    \r\n"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnChange: |
                                =UpdateContext(
                                    {
                                        locIsVisibleGDPerformRequestofGateApprovalDialog: true,
                                        locGDPerformRequestofGateApprovalDialogText: $"Please wait..."
                                    }
                                );
                                Switch(
                                    locRequestApprovalEntityType,
                                    "Checklist Completion",
                                    IfError(
                                        With(
                                            {
                                                recCurrentCheckList: Patch(
                                                    'Project Checklists',
                                                    locSelectedCheckListEntity,
                                                    {
                                                        'Approval Comment': txt_GeneralData_RightPanel_ProjectState_InpForm_Comment_1.Value,
                                                        'Approval Due Date': If(
                                                            dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.Visible,
                                                            dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.SelectedDate,
                                                            Blank()
                                                        ),
                                                        'Approval Checklist State': 'Approval Cluster States'.'In Progress'
                                                    }
                                                )
                                            },
                                            Trace(
                                                $"GateApproval 001: Start flow :=> {recCurrentCheckList.'Project Checklist'}",
                                                TraceSeverity.Information
                                            );
                                            UpdateContext({locGDPerformRequestofGateApprovalDialogText: $"Please wait..."});
                                            With(
                                                {
                                                    ProjectGUID: gblRecordSelectedProject.Project,
                                                    StateTrackingGUID: recCurrentCheckList.'Project Checklist',
                                                    DefaultApprovalGUID: locSelectedItemProjectState.Gate
                                                },
                                                Set(
                                                    gblFlowRequestOfCheckListApproval,
                                                    PerformCommonRequestofCheckListApproval.Run(
                                                        ProjectGUID,
                                                        recCurrentCheckList.'Project Checklist',
                                                        LookUp(
                                                            'Check List Default Approvals',
                                                            ThisRecord.'Project Default Check List'.'Project Default Checklist' = GUID(locSelectedCheckListEntity.'Project Default Checklist')
                                                        ).'Check List Default Approval',
                                                        locRecordSelectedProjectState.'Project State'
                                                    )
                                                );
                                                If(
                                                    Not(IsBlank(gblFlowRequestOfCheckListApproval.runid)),
                                                    Patch(
                                                        'Project Checklists',
                                                        locSelectedCheckListEntity,
                                                        {
                                                            'Approval Checklist State': 'Approval Cluster States'.'In Progress',
                                                            'Flow Run Id': gblFlowRequestOfCheckListApproval.runid,
                                                            'Flow Approval Id': Coalesce(
                                                                gblFlowRequestOfCheckListApproval.approvalid,
                                                                Blank()
                                                            )
                                                        }
                                                    )
                                                );
                                                UpdateContext(
                                                    {
                                                        locIsVisibleGDPerformRequestofGateApprovalDialog: false,
                                                        locCurrentClusterStateNote: Patch(
                                                            'Project Checklist Tracking Note',
                                                            Defaults('Project Checklist Tracking Note'),
                                                            {
                                                                Name: $"{If(
                                                                    gal_Checklist_DisplayProject_Body_General_Content.Selected.ico_Checklist_DisplayProject_Body_Content_ListRow_ApprovalMode.Icon = "People",
                                                                    "Approval requested",
                                                                    "Completed and notified about Check List"
                                                                )} {locSelectedCheckListEntity.Name} for Project {gblRecordSelectedProject.'Project Name'}",
                                                                'Project Checklist': locSelectedCheckListEntity,
                                                                Comment: $"{If(
                                                                    gal_Checklist_DisplayProject_Body_General_Content.Selected.ico_Checklist_DisplayProject_Body_Content_ListRow_ApprovalMode.Icon = "People",
                                                                    "Approval requested",
                                                                    "Completed and notified about Check List"
                                                                )} {locSelectedCheckListEntity.Name} for Project {gblRecordSelectedProject.'Project Name'}",
                                                                Note: "",
                                                                'Note Type': 'Note Type'.Checklistitem
                                                            }
                                                        )
                                                    }
                                                )
                                            );
                                            Refresh('Project Checklists')
                                        ),
                                        // Show error message
                                        UpdateContext({locGDPerformRequestofGateApprovalDialogText: $"Error: Project Status was updated.  Internal error: originated on {FirstError.Source}. Message: {FirstError.Message & FirstError.Details.HttpResponse}"})
                                    ),
                                    "Cluster Transition",
                                    IfError(
                                        With(
                                            {
                                                varDefaultApprovals: LookUp(
                                                    'Project Default Approvals',
                                                    'Project Default Approvals' = locSelectedItemProjectState.Gate
                                                )
                                            },
                                            With(
                                                {
                                                    recCurrentProjectStateTracking: Patch(
                                                        'Project State Trackings',
                                                        Coalesce(
                                                            LookUp(
                                                                'Project State Trackings',
                                                                'Project State Tracking' = locRecordSelectedProjectStateTracking.vsb_projectstatetrackingid
                                                            ),
                                                            Defaults('Project State Trackings')
                                                        ),
                                                        {
                                                            Project: gblRecordSelectedProject,
                                                            'Cluster State': LookUp(
                                                                'Project States',
                                                                ThisRecord.'Project State' = locRecordSelectedProjectState.'Project State'
                                                            ),
                                                            'Approval Comment': txt_GeneralData_RightPanel_ProjectState_InpForm_Comment_1.Value,
                                                            'Approval Due Date': If(
                                                                dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.Visible,
                                                                dtp_CheckList_RightPanel_ChangeCluster_Form_Inputs_ApprovalDueDate.SelectedDate,
                                                                Blank()
                                                            ),
                                                            'Approval Cluster State': 'Approval Cluster States'.'In Progress',
                                                            'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)',
                                                            'Last Triggered Approval Personas': JSON([
                                                                {
                                                                    PortfolioManager: Coalesce(
                                                                        varDefaultApprovals.'Portfolio Manager'.Mail,
                                                                        "None"
                                                                    ),
                                                                    Approvers: Coalesce(
                                                                        Concat(
                                                                            ForAll(
                                                                                Table(ParseJSON(varDefaultApprovals.'Default Approvals')),
                                                                                {Mail: Value.PersonaRole}
                                                                            ),
                                                                            Mail,
                                                                            Char(13)
                                                                        ),
                                                                        "None"
                                                                    ),
                                                                    Contributors: Coalesce(
                                                                        Concat(
                                                                            ForAll(
                                                                                Table(ParseJSON(varDefaultApprovals.'Default Contributors')),
                                                                                {Mail: Value.PersonaRole}
                                                                            ),
                                                                            Mail,
                                                                            Char(13)
                                                                        ),
                                                                        "None"
                                                                    ),
                                                                    Notifications: Coalesce(
                                                                        Concat(
                                                                            ForAll(
                                                                                Table(ParseJSON(varDefaultApprovals.'Default Notifications')),
                                                                                {Mail: Value.PersonaRole}
                                                                            ),
                                                                            Mail,
                                                                            Char(13)
                                                                        ),
                                                                        "None"
                                                                    )
                                                                }]
                                                            ),
                                                            'Last Triggered Approval Mode': varDefaultApprovals.'Approval Mode'
                                                        }
                                                    )
                                                },
                                                Trace(
                                                    $"GateApproval 001: Start flow :=> {recCurrentProjectStateTracking.'Project State Tracking'}",
                                                    TraceSeverity.Information
                                                );
                                                UpdateContext({locGDPerformRequestofGateApprovalDialogText: $"Please wait..."});
                                                With(
                                                    {
                                                        ProjectGUID: gblRecordSelectedProject.Project,
                                                        StateGUID: locRecordSelectedProjectState.'Project State',
                                                        StateTrackingGUID: recCurrentProjectStateTracking.'Project State Tracking',
                                                        DefaultApprovalGUID: locSelectedItemProjectState.Gate
                                                    },
                                                    Set(
                                                        gblFlowRequestOfGateApproval,
                                                        PerformCommonRequestofGateApproval.Run(
                                                            ProjectGUID,
                                                            StateGUID,
                                                            StateTrackingGUID,
                                                            DefaultApprovalGUID
                                                        )
                                                    );
                                                    If(
                                                        Not(IsBlank(gblFlowRequestOfGateApproval.runid)),
                                                        UpdateIf(
                                                            colSelectedProjectStateTracking,
                                                            ID = recCurrentProjectStateTracking.'Project State Tracking',
                                                            {
                                                                StateProgress: 'Approval Cluster States'.'In Progress',
                                                                FlowRunId: gblFlowRequestOfGateApproval.runid,
                                                                FlowApprovalId: Coalesce(
                                                                    gblFlowRequestOfGateApproval.approvalid,
                                                                    Blank()
                                                                )
                                                            }
                                                        )
                                                    );
                                                    UpdateContext(
                                                        {
                                                            locIsVisibleGDPerformRequestofGateApprovalDialog: false,
                                                            locCurrentClusterStateNote: Patch(
                                                                'Project State Tracking Notes',
                                                                Defaults('Project State Tracking Notes'),
                                                                {
                                                                    Name: $"Approval requested - {gblRecordSelectedProject.'Project Name'}, {locRecordSelectedProjectState.Name}",
                                                                    'Project State Tracking': recCurrentProjectStateTracking,
                                                                    Comment: $"Approval requested - {Trim(txt_GeneralData_RightPanel_ProjectState_InpForm_Comment_1.Value)}",
                                                                    Note: html_CheckList_RightPanel_ChangeCluster_Form_History.HtmlText,
                                                                    'Note Type': 'Note Type'.Checklistitem,
                                                                    'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                                }
                                                            )
                                                        }
                                                    )
                                                );
                                            )
                                        ),
                                        // Show error message
                                        UpdateContext({locGDPerformRequestofGateApprovalDialogText: $"Error: Project Status was updated.  Internal error: originated on {FirstError.Source}. Message: {FirstError.Message & FirstError.Details.HttpResponse}"})
                                    ),
                                    false
                                );
                                UpdateContext(
                                    {
                                        locIsVisibleRightPanelProjectState: false,
                                        locIsVisibleGDPerformRequestofGateApprovalDialog: false,
                                        locGDPerformRequestofGateApprovalDialogText: Blank()
                                    }
                                );
                                Refresh('Project State Trackings');
                                Select(btn_CheckList_RightPanel_ChangeCluster_Form_Buttons_Reset);
                                Select(btn_CheckList_RightPanel_ChangeCluster_Form_Buttons_Refresh);
                                Select(but_Project_States_CheckList_Refresh);
                                Navigate('Project General CheckList Screen');
                              Text: |-
                                =If(
                                    Switch(
                                        locRequestApprovalEntityType,
                                        "Checklist Completion",
                                        locSelectedCheckListEntity.'Approval Checklist State' <> gblAppConstants.ApprovalClusterStates.Completed,
                                        "Cluster Transition",
                                        locRecordSelectedProjectStateTracking.vsb_approvalclusterstate <> gblAppConstants.ApprovalClusterStates.Completed
                                    ),
                                    Switch(
                                        locRequestApprovalEntityType,
                                        "Checklist Completion",
                                        Switch(
                                            LookUp(
                                                'Check List Default Approvals',
                                                'Project Default Check List'.'Project Default Checklist' = GUID(locSelectedCheckListEntity.'Project Default Checklist')
                                            ).'Approval Mode',
                                            'Approval Mode'.'Only Notifications',
                                            "Complete",
                                            "Request Approval"
                                        ),
                                        "Cluster Transition",
                                        If(
                                            LookUp(
                                                'Project Default Approvals',
                                                'Project Default Approvals' = locSelectedItemProjectState.Gate
                                            ).'Approval Mode' <> 'Approval Mode'.'Only Notifications',
                                            "Request Approval",
                                            $"Move to {locSelectedItemProjectNextState.Name}"
                                        )
                                    )
                                )
                              TextAlignment: ='PowerCAT.Icon.TextAlignment'.Center
                              Theme: =gblAppThemeJson
                              Tooltip: =locRecordSelectedProjectState.Name
                              Visible: |-
                                =With(
                                    {
                                        varApprovalClusterState: LookUp(
                                            'Project State Trackings',
                                            ThisRecord.'Project State Tracking' = locRecordSelectedProjectStateTracking.vsb_projectstatetrackingid
                                        ).'Approval Cluster State',
                                        varApprovalCheckListState: locSelectedCheckListEntity.'Approval Checklist State',
                                        flowIdEmpty: IsBlank(
                                            Coalesce(
                                                LookUp(
                                                    'Project State Trackings',
                                                    ThisRecord.'Project State Tracking' = locRecordSelectedProjectStateTracking.vsb_projectstatetrackingid
                                                ).FlowRunId,
                                                locSelectedCheckListEntity.'Flow Approval Id',
                                                Blank()
                                            )
                                        )
                                    },
                                    Switch(
                                        locRequestApprovalEntityType,
                                        "Checklist Completion",
                                        Or(
                                            IsBlank(varApprovalCheckListState),
                                            Not(varApprovalCheckListState in ['Approval Cluster States'.'In Progress' ,'Approval Cluster States'.Completed])
                                        ),
                                        "Cluster Transition",
                                        And(
                                            locSelectedItemProjectState.HasGate,
                                            Or(
                                                Not(varApprovalClusterState in ['Approval Cluster States'.'In Progress','Approval Cluster States'.Completed]) ,
                                                varApprovalClusterState = 'Approval Cluster States'.'In Progress' && flowIdEmpty
                                            )
                                        )
                                    )
                                )
                              Width: =180
                              X: =Parent.Width - 35
                              Y: =24
                        - pcf_CheckList_RightPanel_ChangeCluster_Form_Buttons_Cancel:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.Icon
                            Properties:
                              AccessibilityLabel: ="pcf_CheckList_RightPanel_ChangeCluster_Form_Buttons_Cancel"
                              BorderColor: =gblAppTheme.palette.themePrimary
                              FillColor: =gblAppTheme.palette.white
                              FontColor: =gblAppTheme.palette.themePrimary
                              Height: =32
                              HoverBorderColor: =gblAppTheme.palette.hoverButton
                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              HoverIconColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.themePrimary
                                )
                              IconName: ="Cancel"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnChange: |
                                =UpdateContext(
                                    {
                                        locIsVisibleRightPanelProjectState: false
                                    }
                                );
                              Text: ="Cancel"
                              Theme: =gblAppThemeJson
                              Width: =96
      - con_CheckList_RightPanel_Comment_Form:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Fill: =RGBA(0, 0, 0, 0.3)
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.End
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =locIsVisibleRightPanelEditCheckList
            Width: =Parent.Width
          Children:
            - con_CheckList_RightPanel_Comment_FormContext:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
