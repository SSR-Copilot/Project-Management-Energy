                              - but_Project_States_CheckList_Refresh:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="RefreshProjectStates"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    Height: =24
                                    Icon: ="ArrowReset"
                                    Layout: ='ButtonCanvas.Layout'.IconOnly
                                    OnSelect: |-
                                      =UpdateContext(
                                          {
                                              locGeneralDataIsSavingDialogVisible: true,
                                              locGeneralDataSavingDialogText: $"Loading, please wait..."
                                          }
                                      );
                                      ClearCollect(
                                          colProjectCheckList,
                                          Blank()
                                      );
                                      ClearCollect(
                                          colProcessingCheckListSteps,
                                          Blank()
                                      );
                                      With(
                                          {
                                              varSelectedDisplayState: If(
                                                  Coalesce(
                                                      locChecklistUseClickedState,
                                                      false
                                                  ) && !IsBlank(cmp_CheckList_Project_States.Selected),
                                                  cmp_CheckList_Project_States.Selected,
                                                  locDefaultFirstProjectStateInProgress
                                              )
                                          },
                                          With(
                                              {
                                                  varSelectedItemProjectState: Coalesce(
                                                      LookUp(
                                                          colProjectStatesForChecklist,
                                                          Text(ID) = Text(varSelectedDisplayState.ID)
                                                      ),
                                                      locDefaultFirstProjectStateInProgress,
                                                      First(colProjectStatesForChecklist)
                                                  )
                                              },
                                              With(
                                                  {
                                                      varSelectedItemProjectStateId: GUID(varSelectedItemProjectState.ID),
                                                      varSelectedItemProjectStateRowNumber: varSelectedItemProjectState.RowNumber
                                                  },
                                                  Collect(
                                                      colProcessingCheckListSteps,
                                                      $"SelectedItemProjectState ==> State {varSelectedItemProjectStateId}, RowNumber{varSelectedItemProjectStateRowNumber}"
                                                  );
                                                  If(
                                                      IsBlank(
                                                          LookUp(
                                                              'Project State Trackings',
                                                              And(
                                                                  Project.Project = gblRecordSelectedProject.Project,
                                                                  'Cluster State'.'Project State' = varSelectedItemProjectStateId
                                                              )
                                                          )
                                                      ),
                                                      Collect(
                                                          colProcessingCheckListSteps,
                                                          $"Try to create project default state. SelectedItemProjectState ==> State {varSelectedItemProjectStateId}, RowNumber{varSelectedItemProjectStateRowNumber}"
                                                      );
                                                      UpdateContext(
                                                          {
                                                              locRecordDefaultStateTracking: Patch(
                                                                  'Project State Trackings',
                                                                  Defaults('Project State Trackings'),
                                                                  {
                                                                      Project: LookUp(
                                                                          Projects,
                                                                          ThisRecord.Project = gblRecordSelectedProject.Project
                                                                      ),
                                                                      'Cluster State': LookUp(
                                                                          'Project States',
                                                                          ThisRecord.'Project State' = varSelectedItemProjectStateId
                                                                      ),
                                                                      'Approval Comment': Blank(),
                                                                      'Approval Due Date': Blank(),
                                                                      'Approval Cluster State': If(
                                                                          varSelectedItemProjectState.Name = "Draft",
                                                                          'Approval Cluster States'.'In Progress',
                                                                          'Approval Cluster States'.'Not Started'
                                                                      ),
                                                                      'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                                  }
                                                              )
                                                          }
                                                      );
                                                      Collect(
                                                          colProcessingCheckListSteps,
                                                          $"Record 'Project State Trackings' was created. SelectedItemProjectState ==> ID {locRecordDefaultStateTracking.'Project State Tracking'}, Name {locRecordDefaultStateTracking.Name}"
                                                      )
                                                  );
                                                  With(
                                                      {
                                                          varRecordProjectStateTrackings: First(
                                                              Filter(
                                                                  'Project State Trackings',
                                                                  And(
                                                                      Project.Project = gblRecordSelectedProject.Project,
                                                                      'Cluster State'.'Project State' = varSelectedItemProjectStateId
                                                                  )
                                                              )
                                                          )
                                                      },
                                                      With(
                                                          {varRecordProjectStateTrackingsId: GUID(varRecordProjectStateTrackings.'Project State Tracking')},
                                                          UpdateContext(
                                                              {
                                                                  locSelectedItemProjectState: varSelectedItemProjectState,
                                                                  locRecordSelectedProjectState: LookUp(
                                                                      'Project States',
                                                                      ThisRecord.'Project State' = varSelectedItemProjectStateId
                                                                  ),
                                                                  locRecordSelectedProjectStateTracking: ShowColumns(
                                                                      LookUp(
                                                                          'Project State Trackings',
                                                                          ThisRecord.'Project State Tracking' = varRecordProjectStateTrackingsId
                                                                      ),
                                                                      Name,
                                                                      'Project State Tracking',
                                                                      'Approval Cluster State',
                                                                      'Cluster Step State',
                                                                      'Approval Comment',
                                                                      'Approval Due Date'
                                                                  ),
                                                                  locSelectedItemProjectPreviousState: LookUp(
                                                                      colProjectStatesForChecklist,
                                                                      RowNumber = varSelectedItemProjectStateRowNumber - 1
                                                                  ),
                                                                  locSelectedItemProjectNextState: LookUp(
                                                                      colProjectStatesForChecklist,
                                                                      RowNumber = varSelectedItemProjectStateRowNumber + 1
                                                                  ),
                                                                  locGeneralDataEditFieldCompletionDateVisibility: false
                                                              }
                                                          );
                                                          Collect(
                                                              colProcessingCheckListSteps,
                                                              $"Checklist data was defined. locSelectedItemProjectState=>{JSON(locSelectedItemProjectState)}"
                                                          );
                                                          Collect(
                                                              colProcessingCheckListSteps,
                                                              $"Ensure progectChecklist..."
                                                          );
                                                          If(
                                                              And(
                                                                  locRecordSelectedProjectStateTracking.vsb_approvalclusterstate <> 'Approval Cluster States'.Completed,
                                                                  CountRows(
                                                                      Filter(
                                                                          'Project Checklists',
                                                                          And(
                                                                              ThisRecord.Project.Project = gblRecordSelectedProject.Project,
                                                                              ThisRecord.'Cluster State'.'Project State' = locRecordSelectedProjectState.'Project State'
                                                                          )
                                                                      )
                                                                  ) = 0
                                                              ),
                                                              Collect(
                                                                  colProcessingCheckListSteps,
                                                                  $"Try to ensure projects checklist..."
                                                              );
                                                              ClearCollect(
                                                                  colTemporaryChecklist,
                                                                  FirstN(
                                                                      'Project Checklists',
                                                                      0
                                                                  )
                                                              );
                                                              ForAll(
                                                                  Filter(
                                                                      'Project Default Checklists',
                                                                      ThisRecord.Status = 'Status (Project Default Checklists)'.Active,
                                                                      ThisRecord.'Cluster State'.'Project State' = varSelectedItemProjectStateId,
                                                                      ThisRecord.'Associated Country And Technology'.Country.Country = gblRecordSelectedProject.Country.Country,
                                                                      ThisRecord.'Associated Country And Technology'.Technology = gblRecordSelectedProject.Technology
                                                                  ),
                                                                  Patch(
                                                                      'Project Checklists',
                                                                      Defaults('Project Checklists'),
                                                                      {
                                                                          Name: ThisRecord.Name,
                                                                          Project: gblRecordSelectedProject,
                                                                          'Cluster State': ThisRecord.'Cluster State',
                                                                          'Holding Task Description': ThisRecord.'Holding Task Description',
                                                                          'Gate Relevance': If(
                                                                              And(
                                                                                  Not(IsBlank(ThisRecord.'Gate Relevance')),
                                                                                  ThisRecord.'Gate Relevance' = true
                                                                              ),
                                                                              true,
                                                                              false
                                                                          ),
                                                                          'Task State': 'Task State'.None,
                                                                          'Is Completion Date': If(
                                                                              And(
                                                                                  Not(IsBlank(ThisRecord.'Is Completion Date')),
                                                                                  ThisRecord.'Is Completion Date' = true
                                                                              ),
                                                                              true,
                                                                              false
                                                                          ),
                                                                          Order: ThisRecord.Order,
                                                                          'Project Default Checklist': Text(ThisRecord.'Project Default Checklist'),
                                                                          'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                                      }
                                                                  )
                                                              )
                                                          );
                                                          /*If(
                                                              Not(locRecordSelectedProjectStateTracking.vsb_approvalclusterstate = 'Approval Cluster States'.Completed),
                                                              Remove(
                                                                  'Project Checklists',
                                                                  DropColumns(
                                                                      Filter(
                                                                          AddColumns(
                                                                              AddColumns(
                                                                                  Filter(
                                                                                      'Project Checklists',
                                                                                      Project.Project = gblRecordSelectedProject.Project,
                                                                                      'Cluster State'.'Project State' = varSelectedItemProjectStateId
                                                                                  ),
                                                                                  'PDC GUID',
                                                                                  GUID('Project Default Checklist')
                                                                              ),
                                                                              'Default Checklist Record',
                                                                              LookUp(
                                                                                  'Project Default Checklists',
                                                                                  'Project Default Checklist' = 'PDC GUID'
                                                                              )
                                                                          ),
                                                                          IsBlank('Default Checklist Record')
                                                                      ),
                                                                      'PDC GUID',
                                                                      'Default Checklist Record'
                                                                  )
                                                              )
                                                          );*/
                                                          ClearCollect(
                                                              colProjectCheckList,
                                                              Sort(
                                                                  ShowColumns(
                                                                      AddColumns(
                                                                          DropColumns(
                                                                              Filter(
                                                                                  AddColumns(
                                                                                      AddColumns(
                                                                                          Filter(
                                                                                              'Project Checklists',
                                                                                              ThisRecord.Project.Project = gblRecordSelectedProject.Project,
                                                                                              ThisRecord.'Cluster State'.'Project State' = varSelectedItemProjectStateId
                                                                                          ),
                                                                                          'PDC GUID',
                                                                                          GUID('Project Default Checklist')
                                                                                      ),
                                                                                      'Default Checklist Record',
                                                                                      LookUp(
                                                                                          'Project Default Checklists',
                                                                                          ThisRecord.'Project Default Checklist' = 'PDC GUID'
                                                                                      )
                                                                                  ),
                                                                                  ThisRecord.Status= 'Status (Project Checklists)'.Active
                                                                               //   'Default Checklist Record'.Status = 'Status (Project Default Checklists)'.Active
                                                                              ),
                                                                              'PDC GUID',
                                                                              'Default Checklist Record'
                                                                          ),
                                                                          ID,
                                                                          ThisRecord.'Project Checklist',
                                                                          Type,
                                                                          1,
                                                                          Title,
                                                                          ThisRecord.Name,
                                                                          ClusterState,
                                                                          ThisRecord.'Cluster State',
                                                                          GateRelevance,
                                                                          ThisRecord.'Gate Relevance',
                                                                          HoldingDescription,
                                                                          ThisRecord.'Holding Task Description',
                                                                          IsCompletionDate,
                                                                          ThisRecord.'Is Completion Date',
                                                                          TaskState,
                                                                          'Task State',
                                                                          Note,
                                                                          ThisRecord.Comments,
                                                                          CompletionDate,
                                                                          ThisRecord.'Completion Date',
                                                                          Sort,
                                                                          ThisRecord.Order,
                                                                          RowNumber,
                                                                          ThisRecord.Order
                                                                      ),
                                                                      ID,
                                                                      Type,
                                                                      ClusterState,
                                                                      GateRelevance,
                                                                      Title,
                                                                      HoldingDescription,
                                                                      IsCompletionDate,
                                                                      CompletionDate,
                                                                      TaskState,
