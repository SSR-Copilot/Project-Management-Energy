                  - con_CheckList_RightPanel_ChangeCluster_Form_Buttons:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        BorderStyle: =BorderStyle.None
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =45
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =10
                        LayoutJustifyContent: =LayoutJustifyContent.End
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingRight: =20
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =Parent.Width
                      Children:
                        - btn_CheckList_RightPanel_ChangeCluster_Form_Buttons_Refresh:
                            Control: Button@0.0.45
                            Properties:
                              AccessibleLabel: ="Reset"
                              Align: =Align.Center
                              Appearance: ='ButtonCanvas.Appearance'.Secondary
                              Icon: ="ArrowSync"
                              Layout: ='ButtonCanvas.Layout'.IconOnly
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnSelect: |
                                =Refresh('Project State Trackings');
                                ClearCollect(
                                    colSelectedProjectStateTracking,
                                    ForAll(
                                        Filter(
                                            'Project State Trackings',
                                            Project.Project = gblRecordSelectedProject.Project
                                        ) As Source,
                                        {
                                            ID: Source.'Project State Tracking',
                                            Name: Source.Name,
                                            ProjectID: Source.Project.Project,
                                            ClusterProjectStateID: Source.'Cluster State'.'Project State',
                                            StateProgress: Source.'Approval Cluster State',
                                            Comment: Source.'Approval Comment',
                                            DueDate: Source.'Approval Due Date',
                                            FlowRunId: Source.FlowRunId,
                                            FlowApprovalId: Source.FlowApprovalId
                                        }
                                    )
                                );
                                Refresh('Project State Trackings');
                                ClearCollect(
                                    colSelectedProjectStateTracking,
                                    ForAll(
                                        Filter(
                                            'Project State Trackings',
                                            Project.Project = gblRecordSelectedProject.Project
                                        ) As Source,
                                        {
                                            ID: Source.'Project State Tracking',
                                            Name: Source.Name,
                                            ProjectID: Source.Project.Project,
                                            ClusterProjectStateID: Source.'Cluster State'.'Project State',
                                            StateProgress: Source.'Approval Cluster State',
                                            Comment: Source.'Approval Comment',
                                            DueDate: Source.'Approval Due Date',
                                            FlowRunId: Source.FlowRunId,
                                            FlowApprovalId: Source.FlowApprovalId
                                        }
                                    )
                                );
                                Select(btn_CheckList_BuildProjectStatesSequence);
                                If(
                                    Not(IsBlank(locSelectedItemProjectState)) && Not(IsBlank(locSelectedItemProjectState.ID)),
                                    With(
                                        {
                                            varSelectedStateId: GUID(Text(locSelectedItemProjectState.ID)),
                                            varSelectedRowNumber: Coalesce(
                                                LookUp(
                                                    colProjectStatesForChecklist,
                                                    Text(ID) = Text(locSelectedItemProjectState.ID)
                                                ).RowNumber,
                                                -999
                                            )
                                        },
                                        UpdateContext(
                                            {
                                                locRecordSelectedProjectState: LookUp(
                                                    'Project States',
                                                    'Project State' = varSelectedStateId
                                                )
                                            }
                                        );
                                        UpdateContext(
                                            {
                                                locRecordSelectedProjectStateTracking: ShowColumns(
                                                    LookUp(
                                                        'Project State Trackings',
                                                        Project.Project = gblRecordSelectedProject.Project && 'Cluster State'.'Project State' = varSelectedStateId
                                                    ),
                                                    Name,
                                                    'Project State Tracking',
                                                    'Approval Cluster State',
                                                    'Cluster Step State',
                                                    'Approval Comment',
                                                    'Approval Due Date'
                                                )
                                            }
                                        );
                                        UpdateContext(
                                            {
                                                locSelectedItemProjectPreviousState: LookUp(
                                    colProjectStatesForChecklist,
                                    RowNumber = varSelectedRowNumber - 1
                                )
                                            }
                                        );
                                        UpdateContext(
                                            {
                                                locSelectedItemProjectNextState: LookUp(
                                    colProjectStatesForChecklist,
                                    RowNumber = varSelectedRowNumber + 1
                                )
                                            }
                                        )
                                    )
                                );
                                Reset(cmp_CheckList_Project_States);
