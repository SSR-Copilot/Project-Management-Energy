                                                Reset(txt_Milestones_DisplayProject_Body_General_Content_Years)
                                            );
                                          Text: ="Reset"
                                          Visible: =false
                                          Width: =24
                                    - btn_Milestones_DisplayProject_Body_Buttons_Recalculate:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="RecalculateMilestones"
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          Icon: ="CalendarAdd"
                                          Layout: ='ButtonCanvas.Layout'.IconOnly
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: |-
                                            =With(
                                                {
                                                    varStartClusterNo: Coalesce(
                                                        locSelectedStartClusterNo,
                                                        0
                                                    )
                                                },

                                                // Project Start
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "StartDate"
                                                    ),
                                                    {
                                                        Valid: Or(
                                                            varStartClusterNo >= 1,
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_StartDate.SelectedDate))
                                                        )
                                                    }
                                                );

                                                // Cluster 1: Feasibility Studies
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "FeasibilityStudies"
                                                    ),
                                                    {
                                                        Valid: Or(
                                                            varStartClusterNo >= 2,
                                                            And(
                                                                Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster1.SelectedDate)),
                                                                Or(
                                                                    varStartClusterNo = 1,
                                                                    And(
                                                                        Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_StartDate.SelectedDate)),
                                                                        dtp_Milestones_DisplayProject_Body_General_Content_Cluster1.SelectedDate >
                                                                            dtp_Milestones_DisplayProject_Body_General_Content_StartDate.SelectedDate
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    }
                                                );

                                                // Cluster 2: Project Development Started
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "ProjectDevelopmentStarted"
                                                    ),
                                                    {
                                                        Valid: Or(
                                                            varStartClusterNo >= 3,
                                                            And(
                                                                Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster2.SelectedDate)),
                                                                Or(
                                                                    varStartClusterNo = 2,
                                                                    And(
                                                                        Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster1.SelectedDate)),
                                                                        dtp_Milestones_DisplayProject_Body_General_Content_Cluster2.SelectedDate >
                                                                            dtp_Milestones_DisplayProject_Body_General_Content_Cluster1.SelectedDate
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    }
                                                );

                                                // Cluster 3: Application Submitted
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "ApplicationSubmitted"
                                                    ),
                                                    {
                                                        Valid: Or(
                                                            varStartClusterNo >= 4,
                                                            And(
                                                                Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster3.SelectedDate)),
                                                                Or(
                                                                    varStartClusterNo = 3,
                                                                    And(
                                                                        Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster2.SelectedDate)),
                                                                        dtp_Milestones_DisplayProject_Body_General_Content_Cluster3.SelectedDate >
                                                                            dtp_Milestones_DisplayProject_Body_General_Content_Cluster2.SelectedDate
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    }
                                                );

                                                // Cluster 4: Legally Binding Permits
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "LegallyBindingPermits"
                                                    ),
                                                    {
                                                        Valid: Or(
                                                            varStartClusterNo >= 5,
                                                            And(
                                                                Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster4.SelectedDate)),
                                                                Or(
                                                                    varStartClusterNo = 4,
                                                                    And(
                                                                        Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster3.SelectedDate)),
                                                                        dtp_Milestones_DisplayProject_Body_General_Content_Cluster4.SelectedDate >
                                                                            dtp_Milestones_DisplayProject_Body_General_Content_Cluster3.SelectedDate
                                                                    )
                                                                )
                                                            )
                                                        )
                                                    }
                                                );

                                                // Final Investment Decision
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "FinalInvestmentDecision"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_FiD.SelectedDate)),
                                                            Or(
                                                                varStartClusterNo >= 5,
                                                                And(
                                                                    Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster4.SelectedDate)),
                                                                    dtp_Milestones_DisplayProject_Body_General_Content_FiD.SelectedDate >
                                                                        dtp_Milestones_DisplayProject_Body_General_Content_Cluster4.SelectedDate
                                                                )
                                                            )
                                                        )
                                                    }
                                                );

                                                // Cluster 5: Construction
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "Construction"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster5.SelectedDate)),
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_FiD.SelectedDate)),
                                                            dtp_Milestones_DisplayProject_Body_General_Content_Cluster5.SelectedDate >
                                                                dtp_Milestones_DisplayProject_Body_General_Content_FiD.SelectedDate
                                                        )
                                                    }
                                                );

                                                // Cluster 6: Operations Start Date
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "OperationsStartDate"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6.SelectedDate)),
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster5.SelectedDate)),
                                                            dtp_Milestones_DisplayProject_Body_General_Content_Cluster6.SelectedDate >
                                                                dtp_Milestones_DisplayProject_Body_General_Content_Cluster5.SelectedDate
                                                        )
                                                    }
                                                );

                                                // Project End Date
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "EndDate"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_EndDate.SelectedDate)),
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6.SelectedDate)),
                                                            dtp_Milestones_DisplayProject_Body_General_Content_EndDate.SelectedDate >
                                                                dtp_Milestones_DisplayProject_Body_General_Content_Cluster6.SelectedDate
                                                        )
                                                    }
                                                );

                                                // Sales Start Date
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "SalesStartDate"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Sales_StartDate.SelectedDate)),
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Sales_CompletionDate.SelectedDate)),
                                                            dtp_Milestones_DisplayProject_Body_General_Content_Sales_StartDate.SelectedDate <
                                                                dtp_Milestones_DisplayProject_Body_General_Content_Sales_CompletionDate.SelectedDate
                                                        )
                                                    }
                                                );

                                                // Sales Completion Date
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "StartCompleted"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Sales_CompletionDate.SelectedDate)),
                                                            Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Sales_StartDate.SelectedDate)),
                                                            dtp_Milestones_DisplayProject_Body_General_Content_Sales_CompletionDate.SelectedDate >
                                                                dtp_Milestones_DisplayProject_Body_General_Content_Sales_StartDate.SelectedDate
                                                        )
                                                    }
                                                );

                                                // Share of Farmdown
                                                Patch(
                                                    colMilestonesFormValidation,
                                                    LookUp(
                                                        colMilestonesFormValidation,
                                                        Name = "ShareOfFarmdown"
                                                    ),
                                                    {
                                                        Valid: And(
                                                            Not(IsBlank(txt_Milestones_DisplayProject_Body_General_Content_Share_of_Farmdown.Value)),
                                                            fn_Numeric_Milestones.IsTwoDecimal(txt_Milestones_DisplayProject_Body_General_Content_Share_of_Farmdown.Value),
                                                            fn_Numeric_Milestones.InRange(
                                                                txt_Milestones_DisplayProject_Body_General_Content_Share_of_Farmdown.Value,
                                                                0,
                                                                100
                                                            )
                                                        )
                                                    }
                                                )
                                            )
                                          Text: ="RecalculateMilestones"
                                          Visible: =false
                                          Width: =32
                                    - btn_Milestones_DateInputs_Reset:
                                        Control: Button@0.0.45
                                        Properties:
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          OnSelect: |+
                                            =Concurrent(
