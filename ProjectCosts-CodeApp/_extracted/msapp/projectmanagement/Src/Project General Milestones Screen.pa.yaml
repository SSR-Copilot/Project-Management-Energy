                                          Theme: =gblAppThemeJson
                                          Tooltip: ="Reset values entered."
                                          Width: =96
      - fn_Numeric_Milestones:
          Control: CanvasComponent
          ComponentName: fn_Numeric
          Properties:
            Height: =10
            Width: =10
            Y: =Parent.Height-Self.Height
      - cmp_PopUp_Milestones_Information:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Information
          Properties:
            Description: =locGeneralMilestonesInformationDialogText
            Height: =Parent.Height
            OnCancel: |-
              =UpdateContext({locGeneralMilestonesInformationDialog: false});
            OnConfirm: |-
              =UpdateContext({locGeneralMilestonesInformationDialog: false});
            Title: =locGeneralMilestonesInformationDialogTitle
            Visible: =locGeneralMilestonesInformationDialog
            Width: =Parent.Width
      - cmp_PopUp_Leave_Milestones_Confirmation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Yes"
            Description: ="You have unsaved data. Do you really want to leave current form without saving?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locLeaveMilestonesConfirmationDialog: false});
            OnConfirm: |
              =UpdateContext({locLeaveMilestonesConfirmationDialog: false});
              If(
                  CountRows(
                      Filter(
                          colMilestonesFormValidation,
                          Dirty = true
                      )
                  ) > 0,
                  If(
                      cmp_Milestones_Left_Navigation.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                      Set(
                          gblLeftNavigationSelected,
                          LookUp(
                              LeftNavigationMenu,
                              ItemKey = cmp_Milestones_Left_Navigation.SelectedKey
                          )
                      );
                      Navigate(gblLeftNavigationSelected.TargetScreen),
                      Navigate(
                          'Project Main Screen',
                          ScreenTransition.Fade
                      )
                  )
              );
            Title: ="Unsaved data"
            Visible: =locLeaveMilestonesConfirmationDialog
            Width: =Parent.Width
      - cmp_PopUp_Confirmation_IndividualVolume_Review:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: ="Changing the COD may affect existing revenue contracts with individual volumes. Please review the affected revenue contracts."
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locIsVisibleIndividualVolumeWarning : false})
            OnConfirm: |-
              =UpdateContext({locIsVisibleIndividualVolumeWarning : false});
              Select(btn_Project_Milestone_Save);
            Title: ="Review Impact of COD Change"
            Visible: =locIsVisibleIndividualVolumeWarning
            Width: =Parent.Width
      - cmp_PopUp_Milestones_Loading_General_Screen:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Loading
          Properties:
            Height: =Parent.Height
            InformationText: =locLongOperationProcessingDialogText
            Visible: =locLongOperationProcessingDialog
            Width: =Parent.Width
      - cmp_PopUp_Milestones_Saving_Dialog:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Loading
          Properties:
            Height: =Parent.Height
            InformationText: =locGeneralDataSavingDialogText
            Visible: =locGeneralDataIsSavingDialogVisible
            Width: =Parent.Width
