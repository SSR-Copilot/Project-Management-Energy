                                                                    gblRecordSelectedProject.'4-Legally binding permits'
                                                            )
                                                        ),
                                                        Text: "Check input for Final Investment Decision date.",
                                                        Previous: gblRecordSelectedProject.'Final Investment Decision'
                                                    },
                                                    {
                                                        Name: "Construction",
