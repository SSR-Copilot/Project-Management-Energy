                                                                gblRecordSelectedProject.'5-Construction'
                                                        ),
                                                        Text: "Check input for Cluster 6 Date."
                                                    },
                                                    {
                                                        Name: "EndDate",
                                                        Dirty: false,
                                                        Valid: And(
                                                            Not(IsBlank(gblRecordSelectedProject.'End Date')),
                                                            gblRecordSelectedProject.'End Date' >
                                                                gblRecordSelectedProject.'Operations start date (COD)'
                                                        ),
                                                        Text: "Check input for End Date."
                                                    },
                                                    {
                                                        Name: "StartSales",
