                                                        Valid: true,
                                                        Text: ""
                                                    },
                                                    {
                                                        Name: "SalesStartDate",
                                                        Dirty: false,
                                                        Valid: Not(IsBlank(gblRecordSelectedProject.'Sales Start Date')),
                                                        Text: "Check input for Sales Start Date."
                                                    },
                                                    {
                                                        Name: "StartCompleted",
                                                        Dirty: false,
                                                        Valid: Not(IsBlank(gblRecordSelectedProject.'Sales completed')),
                                                        Text: "Check input for Sales Completion Date."
                                                    },
                                                    {
                                                        Name: "ShareOfFarmdown",
