Screens:
  Admin Project Default Checklists Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext(
            {
                locIsVisibleChecklistRightPanel: false,
                locSelectedChecklistEntity: Blank(),
                locAdminLoadingDialog: false,
                //locAdminLoadingTitle: "",
                locAdminLoadingDialogText: Blank(),
                locSelectedCountryAndTechnology: First(
                    SortByColumns(
                        'Checklist Country And Technologies',
                        "vsb_name"
                    )
                ),
                locSelectedCluster: Blank()
            }
        );
        ClearCollect(
            colChecklistClusters,
            AddColumns(
                SortByColumns(
                    Filter(
                        'Project States',
                        'Is Visible On Checklist'
                    ),
                    "vsb_order",
                    SortOrder.Ascending
                ),
                IsFolded,
                true
            )
        )
    Children:
      - con_Admin_Project_Checklist:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmp_Admin_Project_Checklist_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: |-
                    =Table(
                        {
                            State: "Draft",
                            Color: "#41aab4"
                        },
                        {
                            State: "Approving",
                            Color: "#f5911e"
                        },
                        {
                            State: "Approved",
                            Color: "#82a51e"
                        },
                        {
                            State: "Rejected",
                            Color: "#d20532"
                        }
                    )
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: =Navigate('Project Main Screen',ScreenTransition.Fade)
                  Project: |-
                    ={
                        ID: GUID("00000000-0000-0000-0000-000000000000"),
                        Name: "Checklist settings",
                        Technology: Blank(),
                        Capacity: Blank(),
                        Status: Blank(),
                        Approval: Blank()
                    }
                  Width: =1024
            - con_Admin_Project_Checklist_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ColorValue(gblAppTheme.palette.neutralLighter)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_Admin_Project_Checklist_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(gblLeftNavigationMenuIsExpanded, gblAppSizes.LeftNavigation.ExpandedWidth,gblAppSizes.LeftNavigation.DecreasedWidth)
                      Children:
                        - cmp_Costs_DisplayProjectBody_LeftNavigation_1:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftAdminNavigationMenu
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnExpand: |+
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |-
                                =If(
                                    Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                    Set(
                                        gblLeftNavigationSelected,
                                        LookUp(
                                            LeftAdminNavigationMenu,
                                            ItemKey = Self.SelectedKey
                                        )
                                    );
                                    Navigate(
                                        gblLeftNavigationSelected.TargetScreen,
                                        ScreenTransition.Fade
                                    )
                                )
                                /*
                                With(
                                    {
                                        _clickedKey: Self.SelectedKey,
                                        _currentKey: gblLeftNavigationSelected.ItemKey
                                    },
                                    If(
                                        !IsBlank(_clickedKey) && _clickedKey <> _currentKey,
                                        With(
                                            {
                                                _targetRecord: LookUp(
                                                    LeftAdminNavigationMenu,
                                                    ItemKey = _clickedKey
                                                )
                                            },
                                            Set(
                                                gblLeftNavigationSelected,
                                                _targetRecord
                                            );
                                            Navigate(
                                                _targetRecord.TargetScreen,
                                                ScreenTransition.Fade
                                            )
                                        )
                                    )
                                )*/
                              Selected: =gblLeftNavigationSelected
                              Width: =200
                  - con_Admin_Project_Checklist_RightContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingLeft: =10
                        PaddingRight: =10
                        PaddingTop: =15
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_Admin_Project_Checklist_Header:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =tab_Admin_Project_Checklist_Association.Height+20
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LayoutMinHeight: =32
                              LayoutMinWidth: =Parent.Width-Self.X*2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - tab_Admin_Project_Checklist_Association:
                                  Control: TabList@2.2.31
                                  Properties:
                                    DefaultSelectedItems: =locSelectedCountryAndTechnology
                                    Height: =32
                                    Items: |-
                                      =Sort(
                                          'Checklist Country And Technologies',
                                          Order,
                                          SortOrder.Ascending
                                      )
                                    OnChange: |-
                                      =UpdateContext({locSelectedCountryAndTechnology: Self.Selected})
                                    Size: ='TabList.Size'.Small
                                    Width: =Parent.Width - Self.X*2
                                  Children:
                                    - Name10:
                                        Control: TabListDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Name"
                                          FieldName: ="vsb_name"
                                          FieldType: ="s"
                                          Order: =1
                                    - Order1:
                                        Control: TabListDataField@1.5.0
                                        Variant: textualColumn
                                        IsLocked: true
                                        Properties:
                                          FieldDisplayName: ="Order"
                                          FieldName: ="vsb_order"
                                          FieldType: ="s"
                                          Order: =2
                        - gal_DefaultChecklist_AdminScreen:
                            Control: Gallery@2.15.0
                            Variant: VariableHeight
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderColor: =Color.Transparent
                              BorderStyle: =BorderStyle.None
                              Fill: =Color.Transparent
                              FillPortions: =0
                              FocusedBorderColor: =Color.Transparent
                              FocusedBorderThickness: =0
                              Height: |-
                                =//Sum(RenameColumns(ForAll(gal_Account_Accounts.AllItems, Value(lbl_Account_AccountItemHeightValue_Hidden.Text)),"Value", "RowHeight"), RowHeight) + Self.TemplatePadding * Self.AllItemsCount + gblAppSizes.Padding.Page
                                Parent.Height-Self.Y
                              Items: =colChecklistClusters
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              LoadingSpinnerColor: =ColorValue(gblAppTheme.palette.themePrimary)
                              ShowScrollbar: =false
                              TemplateFill: =gblAppColors.Gallery.TemplateFill
                              TemplatePadding: =0
                              TemplateSize: =400
                              Width: =Parent.Width-Self.X
                            Children:
                              - con_Main_DefaultChecklist_AdminScreen:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    BorderColor: =Color.Transparent
                                    BorderStyle: =BorderStyle.None
                                    Fill: =ColorValue(gblAppTheme.palette.white)
                                    Height: |+
                                      =If(
                                          ThisItem.IsFolded,
                                          con_Header_DefaultChecklist_AdminScreen.Height,
                                          con_Header_DefaultChecklist_AdminScreen.Height+con_DefaultChecklistDetails_DefaultChecklist_AdminScreen.Height
                                      )

                                    Width: =Parent.Width-10
                                  Children:
                                    - con_DefaultChecklistDetails_DefaultChecklist_AdminScreen:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =Color.Transparent
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =ColorValue(gblAppTheme.palette.white)
                                          Height: =pcf_CommandBar_Cluster_DefaultChecklist_AdminScreen.Height +con_Header_TasksInClusterDefaultChecklist_AdminScreen.Height + gal_TasksInClusterDefaultChecklist_AdminScreen.Height
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutOverflowX: =LayoutOverflow.Scroll
                                          PaddingLeft: =20
                                          PaddingTop: =10
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          Width: |+
                                            =Parent.Width
                                          Y: =42
                                        Children:
                                          - pcf_CommandBar_Cluster_DefaultChecklist_AdminScreen:
                                              Control: CodeComponent
                                              ComponentName: cat_PowerCAT.CommandBar
                                              Properties:
                                                Height: =32
                                                Items: |-
                                                  =Table(
                                                      {
                                                          ItemKey: "addNewChecklistEntity",
                                                          ItemDisplayName: "Add Task",
                                                          ItemIconName: "Add",
                                                          ItemEnabled: true
                                                      },
                                                      {
                                                          ItemKey: "reorderChecklist",
                                                          ItemDisplayName: "Reorder",
                                                          ItemIconName: "NumberedList",
                                                          ItemEnabled: true
                                                      }
                                                  )
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                OnSelect: |
                                                  =Switch(
                                                      Self.Selected.ItemKey,
                                                      "addNewChecklistEntity",
                                                      UpdateContext(
                                                          {
                                                              locIsVisibleChecklistRightPanel: true,
                                                              locSelectedChecklistEntity: Blank(),
                                                              locSelectedCluster: ThisItem,
                                                              locTotalRows: CountRows(
                                                                  Filter(
                                                                      'Project Default Checklists',
                                                                      'Associated Country And Technology'.'Checklist Country And Technology' = locSelectedCountryAndTechnology.'Checklist Country And Technology',
                                                                      'Cluster State'.'Project State' = ThisItem.'Project State'
                                                                  )
                                                              )
                                                          }
                                                      );
                                                      "reorderChecklist",
                                                      UpdateContext(
                                                          {
                                                              locShowReorderForm: true,
                                                              locResetOrderingList: "Reset" & Rand()
                                                          }
                                                      );
                                                      ClearCollect(
                                                          colTasksToReorder,
                                                          Filter(
                                                              'Project Default Checklists',
                                                              'Associated Country And Technology'.'Checklist Country And Technology' = locSelectedCountryAndTechnology.'Checklist Country And Technology',
                                                              'Cluster State'.'Project State' = ThisItem.'Project State'
                                                          )
                                                      )
                                                  );
                                                Width: =1210
                                                X: =20
                                          - con_Header_TasksInClusterDefaultChecklist_AdminScreen:
                                              Control: GroupContainer@1.5.0
                                              Variant: ManualLayout
                                              Properties:
                                                AlignInContainer: =AlignInContainer.SetByContainer
                                                DropShadow: =DropShadow.None
                                                Fill: =ColorValue("#FAFAFA")
                                                FillPortions: =0
                                                Height: =32
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                RadiusBottomLeft: =2
                                                RadiusBottomRight: =2
                                                RadiusTopLeft: =2
                                                RadiusTopRight: =2
                                                Width: =1210
                                                X: =20
                                                Y: =pcf_CommandBar_Cluster_DefaultChecklist_AdminScreen.Y + pcf_CommandBar_Cluster_DefaultChecklist_AdminScreen.Height
                                              Children:
                                                - lbl_IsActive_TasksInClusterDefaultChecklist_AdminScreen:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      AutoHeight: =true
                                                      Height: =22
                                                      Text: ="Active"
                                                      Weight: ='TextCanvas.Weight'.Semibold
                                                      Width: =180
                                                      X: =lbl_CompletionDate_TasksInClusterDefaultChecklist_AdminScreen.X+lbl_CompletionDate_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      Y: =Parent.Height/2-Self.Height/2
                                                - lbl_CompletionDate_TasksInClusterDefaultChecklist_AdminScreen:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      AutoHeight: =true
                                                      Height: =22
                                                      Text: ="Completion Date"
                                                      Weight: ='TextCanvas.Weight'.Semibold
                                                      Width: =180
                                                      X: =lbl_GateRelevance_TasksInClusterDefaultChecklist_AdminScreen.X+lbl_GateRelevance_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      Y: =Parent.Height/2-Self.Height/2
                                                - lbl_GateRelevance_TasksInClusterDefaultChecklist_AdminScreen:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      AutoHeight: =true
                                                      Height: =22
                                                      Text: ="Gate Relevance"
                                                      Weight: ='TextCanvas.Weight'.Semibold
                                                      Width: =180
                                                      X: =lbl_HoldingDescription_TasksInClusterDefaultChecklist_AdminScreen.X+lbl_HoldingDescription_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      Y: =Parent.Height/2-Self.Height/2
                                                - lbl_HoldingDescription_TasksInClusterDefaultChecklist_AdminScreen:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      AutoHeight: =true
                                                      Height: =22
                                                      Text: ="Holding Description"
                                                      Weight: ='TextCanvas.Weight'.Semibold
                                                      Width: =350
                                                      X: =lbl_Description_TasksInClusterDefaultChecklist_AdminScreen.X+lbl_Description_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      Y: =Parent.Height/2-Self.Height/2
                                                - lbl_Description_TasksInClusterDefaultChecklist_AdminScreen:
                                                    Control: Text@0.0.51
                                                    Properties:
                                                      AutoHeight: =true
                                                      Height: =22
                                                      Text: ="Description"
                                                      Weight: ='TextCanvas.Weight'.Semibold
                                                      Width: =300
                                                      X: =gblAppSizes.Position.X
                                                      Y: =Parent.Height/2-Self.Height/2
                                          - gal_TasksInClusterDefaultChecklist_AdminScreen:
                                              Control: Gallery@2.15.0
                                              Variant: VariableHeight
                                              Properties:
                                                AlignInContainer: =AlignInContainer.SetByContainer
                                                BorderColor: =RGBA(245, 245, 245, 1)
                                                FillPortions: =0
                                                Height: =Self.AllItemsCount*34 + 26
                                                Items: |-
                                                  =SortByColumns(
                                                      Filter(
                                                          'Project Default Checklists',
                                                          And(
                                                              'Associated Country And Technology'.'Checklist Country And Technology' = tab_Admin_Project_Checklist_Association.Selected.'Checklist Country And Technology',
                                                              'Cluster State'.'Project State' = ThisItem.'Project State',
                                                              Not('To Delete' = true)
                                                          )
                                                      ),
                                                      "vsb_order",
                                                      SortOrder.Ascending
                                                  )
                                                LayoutMaxHeight: =
                                                LayoutMaxWidth: =
                                                LoadingSpinnerColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                                TemplatePadding: =0
                                                TemplateSize: =34
                                                Width: =1210
                                              Children:
                                                - con_Details_TasksInClusterDefaultChecklist_AdminScreen:
                                                    Control: GroupContainer@1.5.0
                                                    Variant: ManualLayout
                                                    Properties:
                                                      BorderColor: =RGBA(0, 0, 0, 0)
                                                      BorderStyle: =BorderStyle.None
                                                      DropShadow: =DropShadow.None
                                                      Height: =Parent.TemplateHeight
                                                      RadiusBottomLeft: =0
                                                      RadiusBottomRight: =0
                                                      RadiusTopLeft: =0
                                                      RadiusTopRight: =0
                                                      Width: =Parent.Width
                                                    Children:
                                                      - ico_Delete_TasksInClusterDefaultChecklist_AdminScreen:
                                                          Control: CodeComponent
                                                          ComponentName: cat_PowerCAT.Icon
                                                          Properties:
                                                            BorderColor: ="#fff0"
                                                            DisplayMode: |+
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  DisplayMode.View,
                                                                  DisplayMode.Edit
                                                              )
                                                            FillColor: ="#fff0"
                                                            Height: =34
                                                            HoverBorderColor: ="#fff0"
                                                            HoverFillColor: ="#fff0"
                                                            IconColor: =If(Self.DisplayMode = DisplayMode.Edit, gblAppTheme.palette.akzent3, "#bbb" )
                                                            IconName: ="Delete"
                                                            OnChange: |-
                                                              =If(
                                                                  Self.DisplayMode = DisplayMode.Edit,
                                                                  UpdateContext(
                                                                      {
                                                                          locSelectedChecklistEntity: ThisItem,
                                                                          locIsVisiblePopUpDeleteDefaultChecklist: true
                                                                      }
                                                                  )
                                                              )
                                                            Tooltip: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  "This Check List item is in use by a Project Gate. Delete the Project Gate to edit the Check List item."
                                                              )
                                                            Width: =34
                                                            X: |+
                                                              =ico_Edit_TasksInClusterDefaultChecklist_AdminScreen.X+ico_Edit_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      - ico_Edit_TasksInClusterDefaultChecklist_AdminScreen:
                                                          Control: CodeComponent
                                                          ComponentName: cat_PowerCAT.Icon
                                                          Properties:
                                                            BorderColor: ="#fff0"
                                                            DisplayMode: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  DisplayMode.View,
                                                                  DisplayMode.Edit
                                                              )
                                                            FillColor: ="#fff0"
                                                            Height: =34
                                                            HoverFillColor: ="#fff0"
                                                            IconColor: =If(Self.DisplayMode = DisplayMode.Edit, gblAppTheme.palette.akzent3, "#bbb" )
                                                            IconName: ="Edit"
                                                            OnChange: |-
                                                              =If(
                                                                  Self.DisplayMode = DisplayMode.Edit,
                                                                  UpdateContext(
                                                                      {
                                                                          locIsVisibleChecklistRightPanel: true,
                                                                          locSelectedChecklistEntity: ThisItem    
                                                                      }
                                                                  )
                                                              )
                                                            Tooltip: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  "This Check List item is in use by a Project Gate. Delete the Project Gate to edit the Check List item."
                                                              )
                                                            Width: =34
                                                            X: |+
                                                              =ico_ActivateDeactivate_TasksInClusterDefaultChecklist_AdminScreen.X+ico_ActivateDeactivate_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      - ico_ActivateDeactivate_TasksInClusterDefaultChecklist_AdminScreen:
                                                          Control: CodeComponent
                                                          ComponentName: cat_PowerCAT.Icon
                                                          Properties:
                                                            DisplayMode: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  DisplayMode.Disabled,
                                                                  DisplayMode.Edit
                                                              )
                                                            FontColor: =If(ThisItem.Status = 'Status (Project Default Checklists)'.Active,gblAppTheme.palette.akzent3,gblAppTheme.palette.themePrimary)
                                                            Height: =34
                                                            IconColor: =If(Self.DisplayMode = DisplayMode.Edit, If(ThisItem.Status = 'Status (Project Default Checklists)'.Active,gblAppTheme.palette.akzent3,gblAppTheme.palette.themePrimary), "#bbb" )
                                                            IconName: =If(ThisItem.Status = 'Status (Project Default Checklists)'.Active,"DeactivateOrders","ActivateOrders")
                                                            IconType: ='PowerCAT.Icon.IconType'.ActionButton
                                                            OnChange: |-
                                                              =UpdateContext({locIsVisiblePopUpActivationDefaultChecklist: true, locSelectedChecklistEntity: ThisItem})
                                                            Text: =ThisItem.Status
                                                            Tooltip: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') &&  'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  "This Check List item is in use by a Project Gate. Delete the Project Gate to edit the Check List item."
                                                              )
                                                            Width: =90
                                                            X: =lbl_IsActive_TasksInClusterDefaultChecklist_AdminScreen.X
                                                      - ico_EnablelCompletionDate_TasksInClusterDefaultChecklist_AdminScreen:
                                                          Control: CodeComponent
                                                          ComponentName: cat_PowerCAT.Icon
                                                          Properties:
                                                            BorderColor: ="#fff0"
                                                            DisplayMode: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist')  && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  DisplayMode.Disabled,
                                                                  DisplayMode.Edit
                                                              )
                                                            FontColor: =If(ThisItem.'Is Completion Date',gblAppTheme.palette.akzent3,gblAppTheme.palette.themePrimary)
                                                            Height: =34
                                                            HoverFontColor: =If(ThisItem.'Is Completion Date',gblAppTheme.palette.akzent3,gblAppTheme.palette.themePrimary)
                                                            HoverIconColor: =If(ThisItem.'Is Completion Date',gblAppTheme.palette.akzent3,gblAppTheme.palette.themePrimary)
                                                            IconColor: =If(Self.DisplayMode = DisplayMode.Edit, If(ThisItem.'Is Completion Date',gblAppTheme.palette.akzent3,gblAppTheme.palette.themePrimary), "#bbb" )
                                                            IconName: =If(ThisItem.'Is Completion Date',"CalendarReply","Calendar")
                                                            IconType: ='PowerCAT.Icon.IconType'.ActionButton
                                                            OnChange: |+
                                                              =UpdateContext(
                                                                  {
                                                                      locAdminLoadingDialog: true,
                                                                      locAdminLoadingDialogText: $"Completion Date for '{ThisItem.Name}' will be changed, please wait..."
                                                                  }
                                                              );
                                                              IfError(
                                                                  UpdateContext(
                                                                      {
                                                                          locSelectedChecklistEntity: Patch(
                                                                              'Project Default Checklists',
                                                                              LookUp(
                                                                                  'Project Default Checklists',
                                                                                  'Project Default Checklist' = ThisItem.'Project Default Checklist'
                                                                              ),
                                                                              {'Is Completion Date': Not(ThisItem.'Is Completion Date')}
                                                                          )
                                                                      }
                                                                  );
                                                                  UpdateContext({locAdminLoadingDialogText: $"Completion Date was successfully changed."});
                                                                  Refresh('Project Default Approvals'),
                                                                  UpdateContext({locAdminLoadingDialogText: $"Error: Completion Date could not be changed. Internal error: originated on {FirstError.Source}. Message: {FirstError.Message} {FirstError.Details.HttpResponse}"})
                                                              );
                                                              UpdateContext(
                                                                  {
                                                                      locAdminLoadingDialog: false,
                                                                      locAdminLoadingDialogText: Blank()
                                                                  }
                                                              );
                                                            Text: =If(ThisItem.'Is Completion Date', "Yes", "No")
                                                            TextAlignment: ='PowerCAT.Icon.TextAlignment'.Left
                                                            Tooltip: |-
                                                              =If(
                                                                  !IsBlank(LookUp('Check List Default Approvals', 'Project Default Check List'.'Project Default Checklist' = GUID(ThisItem.'Project Default Checklist') && 'Approval Mode' <> [@'Approval Mode'].'Only Notifications')),
                                                                  "This Check List item is in use by a Project Gate. Delete the Project Gate to edit the Check List item."
                                                              )
                                                            Width: =60
                                                            X: =lbl_GateRelevanceValue_TasksInClusterDefaultChecklist_AdminScreen.X+lbl_GateRelevanceValue_TasksInClusterDefaultChecklist_AdminScreen.Width
                                                      - lbl_GateRelevanceValue_TasksInClusterDefaultChecklist_AdminScreen:
                                                          Control: Text@0.0.51
                                                          Properties:
                                                            Height: =Parent.Height
                                                            PaddingLeft: =4
                                                            PaddingRight: =4
                                                            Size: =gblAppSizes.Font.Large
                                                            Text: =ThisItem.'Gate Relevance'
                                                            VerticalAlign: =VerticalAlign.Middle
                                                            Weight: ='TextCanvas.Weight'.Regular
