      - cmp_DeleteChecklistItem_AdminScreen:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Delete"
            Description: ="Are you sure that you want to permanently delete task """ & locSelectedChecklistEntity.Name & """?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="Trash"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteDefaultChecklist: false})
            OnConfirm: |-
              =UpdateContext(
                  {
                      locIsVisiblePopUpDeleteDefaultChecklist: false,
                      locAdminLoadingDialog: true,
                      locAdminLoadingDialogText: $"Deleteing item '{txt_Admin_Checklist_Form_Fields_Name.Value}', please wait..."
                  }
              );
              UpdateContext(
                  {
                      locSelectedChecklistEntity: Patch(
                          'Project Default Checklists',
                          LookUp(
                              'Project Default Checklists',
                              'Project Default Checklist' = locSelectedChecklistEntity.'Project Default Checklist'
                          ),
                          {'To Delete': true}
                      )
                  }
              );
              /*Remove(
                  'Project Default Checklists',
                  locSelectedChecklistEntity
              );*/
              ClearCollect(
                  colTasksToReorder,
                  Filter(
                      'Project Default Checklists',
                      'Associated Country And Technology'.'Checklist Country And Technology' = locSelectedChecklistEntity.'Associated Country And Technology'.'Checklist Country And Technology',
                      'Cluster State'.'Project State' = locSelectedChecklistEntity.'Cluster State'.'Project State',
                      Order > locSelectedChecklistEntity.Order
                  )
              );
              ForAll(
                  colTasksToReorder,
                  Patch(
                      'Project Default Checklists',
                      ThisRecord,
                      {Order: ThisRecord.Order - 1}
                  )
              );
              UpdateContext({locAdminLoadingDialog: false})
            Title: ="Delete checklist item?"
            Visible: =locIsVisiblePopUpDeleteDefaultChecklist
            Width: =Parent.Width
      - cmp_ActivateDeactiveChecklistItem_AdminScreen:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: =If(locSelectedChecklistEntity.Status = 'Status (Project Default Checklists)'.Active,"Decativate", "Activate")
            Description: ="Are you sure that you want to change status of task """ & locSelectedChecklistEntity.Name & """?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="Trash"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpActivationDefaultChecklist: false})
            OnConfirm: |-
              =UpdateContext(
                  {
                      locAdminLoadingDialog: true,
                      locAdminLoadingDialogText: $"Checklist item '{txt_Admin_Checklist_Form_Fields_Name.Value}' will be saved, please wait...",
                      locIsVisiblePopUpActivationDefaultChecklist: false
                  }
              );
              Patch(
                  'Project Default Checklists',
                  locSelectedChecklistEntity,
                  {
                      Status: If(
                          locSelectedChecklistEntity.Status = 'Status (Project Default Checklists)'.Active,
                          'Status (Project Default Checklists)'.Inactive,
                          'Status (Project Default Checklists)'.Active
                      )
                  }
              );
              UpdateContext({locAdminLoadingDialog: false})
            Title: =$"{If(locSelectedChecklistEntity.Status = 'Status (Project Default Checklists)'.Active,"Decativate", "Activate")} checklist item?"
            Visible: =locIsVisiblePopUpActivationDefaultChecklist
            Width: =Parent.Width
