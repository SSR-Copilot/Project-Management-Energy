Screens:
  App Loading Screen:
    Properties:
      Fill: =gblAppColors.Screen.Fill
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |+
        =UpdateContext({locLoading: false});
        // Get Fabric Table Data
        // keep <= your app data row limit
        Clear(colAssumptionsGermanyTaxSQL);
        Clear(colAssumptionsFranceSQL);
        // 1. Calculate the max rows outside the loop and store them
        UpdateContext(
            {
                locLastRowGermany: First(
                    SortByColumns(
                        'Assumptions Local Tax Germanies',
                        "vsb_row_num",
                        SortOrder.Descending
                    )
                ).vsb_row_num,
                // Ensure you use the exact logical name here
                locLastRowFrance: First(
                    SortByColumns(
                        'Assumptions Local Tax Frances',
                        "vsb_row_num",// Assuming France has the exact same schema
                        SortOrder.Descending
                    )
                ).vsb_row_num,
                locBatchSize: 2000
            }
        );
        UpdateContext(
            {
                locAbsoluteMax: Max(
                    locLastRowGermany,
                    locLastRowFrance
                )
            }
        );
        // 2. Run the batched collection
        ForAll(
            Sequence(
                RoundUp(
                    locAbsoluteMax / locBatchSize,
                    0
                )
            ) As Batch,
            With(
                {
                    // Pre-calculate the exact math boundaries here to avoid breaking delegation in the Filter
                    locStartPoint: (Batch.Value - 1) * locBatchSize,
                    locEndPoint: Batch.Value * locBatchSize
                },
                Concurrent(
                // Germany Collection
                    If(
                        locLastRowGermany >= locStartPoint,
                        Collect(
                            colAssumptionsGermanyTaxSQL,
                            Filter(
                                'Assumptions Local Tax Germanies',
                                vsb_row_num > locStartPoint And vsb_row_num <= locEndPoint
                            )
                        )
                    ),
                // France Collection
                    If(
                        locLastRowFrance >= locStartPoint,
                        Collect(
                            colAssumptionsFranceSQL,
                            Filter(
                                'Assumptions Local Tax Frances',
                                vsb_row_num > locStartPoint And vsb_row_num <= locEndPoint
                            )
                        )
                    )
                )
            )
        );
        UpdateContext({locLoading: true});
    Children:
      - btn_Navigate_to_EditProjectScreen_Deeplinking:
          Control: Button@0.0.45
          Properties:
            OnSelect: |
              =If(
                  IsBlank(Param("projectid")),
                  Navigate(
                      'Project Main Screen',
                      ScreenTransition.Fade
                  ),
                  Set(
                      gblRecordSelectedProject,
                      LookUp(
                          Projects,
                          Project = GUID(Param("projectid"))
                      )
                  );
                  Set(
                      gblRecordSelectedProjectCountry,
                      LookUp(
                          Countries,
                          Country = gblRecordSelectedProject.Country.Country
                      )
                  );
                  Set(
                      gblCurrentUser,
                      Patch(
                          gblCurrentUser,
                          {
                              CanEditSelectedProject: And(
                                  DataSourceInfo(
                                      Projects,
                                      DataSourceInfo.CreatePermission
                                  ),
                                  Coalesce(
                                      RecordInfo(
                                          gblRecordSelectedProject,
                                          RecordInfo.EditPermission
                                      ),
                                      false
                                  )
                              )
                          }
                      )
                  );
                  Set(
                      gblLeftNavigationSelected,
                      LookUp(
                          LeftNavigationMenu,
                          ThisRecord.ItemKey = "GeneralDataCommonKey"
                      )
                  );
                  Set(
                      gblProjectHeaderData,
                      {
                          ID: gblRecordSelectedProject.Project,
                          Name: gblRecordSelectedProject.'Project Name',
                          Technology: Text(gblRecordSelectedProject.Technology),
                          Capacity: gblRecordSelectedProject.'Plant WTG Capacity [MW]',
                          Status: LookUp(
                              'Project States',
                              ThisRecord.'Project State' = gblRecordSelectedProject.'Cluster State'.'Project State'
                          ).Name,
                          Approval: Text(gblRecordSelectedProject.'Approval States')
                      }
                  );
                  Navigate(
                      'Project General Data Screen',
                      ScreenTransition.Fade,
                      {locGeneralDataTabSelected: "generalDataTab"}
                  )
              );
            Visible: =false
            X: =40
            Y: =40
