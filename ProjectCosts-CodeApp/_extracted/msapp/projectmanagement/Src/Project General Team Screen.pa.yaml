Screens:
  Project General Team Screen:
    Properties:
      Fill: |-
        =RGBA(
            255,
            255,
            255,
            1
        )
      LoadingSpinner: '=LoadingSpinner.Data '
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: |
        =Clear(colDataCardDeputyPMPreSelected);
        Clear(colDataCardPMPreSelected);
      OnVisible: |
        =Set(
            gblRecordSelectedProject,
            LookUp(
                Projects,
                ThisRecord.Project = gblRecordSelectedProject.Project
            )
        );
        Set(
                        gblCurrentUser,
                        Patch(
                            gblCurrentUser,
                            {
                                CanEditSelectedProject: And(
                                    DataSourceInfo(
                                        Projects,
                                        DataSourceInfo.CreatePermission
                                    ),
                                    Coalesce(
                                        RecordInfo(
                                            gblRecordSelectedProject,
                                            RecordInfo.EditPermission
                                        ),
                                        false
                                    )
                                )
                            }
                        )
                    );
        Set(
            gblSelectedCluster,
            gblRecordSelectedProject.'Cluster State'
        );
        UpdateContext(
            {
                locTeamDataIsSavingDialogVisible: false,
                locTeamlDataSavingDialogText: Blank(),
                locIsVisiblePopUpDeleteMember: false,
                locDeleteMemberlDialogText: Blank(),
                locIsVisibleRightPanelEditTeam: false,
                locSelectedMember: First(
                    FirstN(
                        'Project Members',
                        0
                    )
                ),
                locFoundedMemberExists: false
            }
        );
        ClearCollect(
            colProjectMembers,
            {
                id: Blank(),
                position: Positions.'Project Manager',
                member: gblRecordSelectedProject.'Project Manager',
                order: 1
            }
        );
        If(
            Not(IsBlank(gblRecordSelectedProject.'Deputy Project Manager')),
            Collect(
                colProjectMembers,
                {
                    id: Blank(),
                    position: Positions.'Deputy Project Manager',
                    member: gblRecordSelectedProject.'Deputy Project Manager',
                    order: 2
                }
            )
        );
        ClearCollect(
            colProjectsPrincipals,
            RenameColumns(
                FirstN(
                    Users,
                    0
                ),
                'Azure AD Object ID',
                Id,
                'Full Name',
                DisplayName,
                'Primary Email',
                Mail
            )
        );
        ClearCollect(
            colProjectsPrincipalsPreSelected,
            colProjectsPrincipals
        );
    Children:
      - fn_Common_Team:
          Control: CanvasComponent
          ComponentName: fn_Common
          Properties:
            Height: =10
            Width: =10
            Y: =Parent.Height-Self.Height
      - con_Team_DisplayProject:
