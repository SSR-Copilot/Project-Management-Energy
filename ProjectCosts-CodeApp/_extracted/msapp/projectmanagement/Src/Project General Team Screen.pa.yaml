      - cmp_PopUp_Team_Leave_Confirmation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Yes"
            Description: ="You have unsaved data. Do you really want to leave current form without saving?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locLeaveGeneralDataConfirmationDialog: false});
            OnConfirm: |-
              =UpdateContext({locLeaveGeneralDataConfirmationDialog: false});
              If(
                  cmp_CheckList_Left_Navigation_1.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                  Set(
                      gblLeftNavigationSelected,
                      LookUp(
                          LeftNavigationMenu,
                          ItemKey = cmp_CheckList_Left_Navigation_1.SelectedKey
                      )
                  );
                  Navigate(gblLeftNavigationSelected.TargetScreen),
                  Navigate(
                      'Project Main Screen',
                      ScreenTransition.Fade
                  )
              )
            Title: ="Unsaved data"
            Visible: =locLeaveGeneralDataConfirmationDialog
            Width: =Parent.Width
      - cmp_PopUp_Team_Saving_Dialog:
