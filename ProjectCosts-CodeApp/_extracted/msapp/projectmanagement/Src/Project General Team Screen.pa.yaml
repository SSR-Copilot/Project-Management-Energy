      - cmp_PopUp_Member_Delete_Confirmation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Yes"
            Description: =$"Are you sure you want to delete the project member ""{locSelectedMember.Member.'Display Name'}""?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |
              =UpdateContext({locIsVisiblePopUpDeleteMember: false});
            OnConfirm: |
              =IfError(
                  Remove(
                      'Project Members',
                      locSelectedMember
                  );
                  Refresh('Project Members'),
                  UpdateContext({locDeleteMemberlDialogText: $"Error: Project member could not be deleted. Internal error: originated on {FirstError.Source}. Message: {FirstError.Message} {FirstError.Details.HttpResponse}"})
              );
              UpdateContext(
                  {
                      locSelectedMember: Blank(),
                      locIsVisiblePopUpDeleteMember: false
                  }
              );
            Title: =$"Deletion of Project Member"
            Visible: =locIsVisiblePopUpDeleteMember
            Width: =Parent.Width
