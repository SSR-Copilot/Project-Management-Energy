                              LayoutMaxWidth: =
                              OnChange: "=UpdateContext(\n    {\n        locShowPVProdForm: false,\n        locIsVisibleSpinner: true,\n        locIsVisibleSpinnerText: \"Please wait, saving....\"\n    }\n);\nUpdateContext(\n    {\n        locSelectedEnergyYield: Patch(\n            'Energy Yields',\n            If(\n                IsBlank(locSelectedEnergyYield),\n                Defaults('Energy Yields'),\n                locSelectedEnergyYield\n            ),\n            {\n                Project: gblRecordSelectedProject,\n                'Energy Yield Assessment': rad_ProductionDataPV_Assesment.Selected.Value,\n                Description: txt_ProductionDataPV_Description.Value,\n                'Irradiation [kWh/kWp]': Value(txt_ProductionDataPV_Irradation.Value),\n                'Gross Yield [MWh]': Value(txt_ProductionDataPV_GrossYield.Value),\n                'Total losses [%]': Value(txt_ProductionDataPV_TotalLosses.Value),\n                'Net Yield p50 [MWh]': Value(txt_ProductionDataPV_NetYieldP50.Value),\n                'Uncertainty [%] ': Value(txt_ProductionDataPV_Uncertainty.Value),\n                'Net Yield p75 [MWh]': Value(txt_ProductionDataPV_NetYieldP75.Value),\n                'Net Yield p90 [MWh]': Value(txt_ProductionDataPV_NetYieldP90.Value),\n                'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)',\n                Type: 'Yield Type'.PV,\n                'Production Allocation ': If(\n                    rad_ProductionDataPV_Allocation.Selected.Value = \"Input Irradiation\",\n                    'Production Allocation  (Energy Yields)'.'Input Irradation',\n                    'Production Allocation  (Energy Yields)'.'Input Gross Yield'\n                ),\n                'Production losses/p50?': If(\n                    rad_ProductionDataPV_Lossessp50.Selected.Value = \"Input losses\",\n                    'Production losses/p50? (Energy Yields)'.'Input losses',\n                    'Production losses/p50? (Energy Yields)'.'Input Net Yield p50'\n                ),\n                'Production Uncertainty/ p75 and p90?': If(\n                    rad_ProductionDataPV_UncertaintyNet.Selected.Value = \"Input Uncertainty\",\n                    'Production Uncertainty/ p75 and p90? (Energy Yields)'.'Input Uncertainty',\n                    'Production Uncertainty/ p75 and p90? (Energy Yields)'.'Input Net Yield p75/p90'\n                ),\n                'Consider Seasonality': tgl_ProductionDataPV_ConsiderSeasonality.Checked,\n                'Consider Negative Prices': tgl_ProductionDataPV_ConsiderNegativePrice.Checked\n            }\n        )\n    }\n);\nConcurrent(\n    If(\n        tgl_ProductionDataPV_ConsiderSeasonality.Checked,\n        With(\n            {\n                _colJSON: ShowColumns(\n                    colPVSeasonalityValues,\n                    ID,\n                    IsStandard\n                )\n            },\n            Patch(\n                'PV Seasonality Values',\n                Coalesce(\n                    locSelectedPVSeasonalityYieldRecord,\n                    Defaults('PV Seasonality Values')\n                ),\n                {\n                    Name: \"Seasonality - \" & locSelectedEnergyYield.Description,\n                    'PV Energy Yield': locSelectedEnergyYield,\n                    January: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 1\n                        ).Value\n                    ),\n                    February: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 2\n                        ).Value\n                    ),\n                    March: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 3\n                        ).Value\n                    ),\n                    April: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 4\n                        ).Value\n                    ),\n                    May: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 5\n                        ).Value\n                    ),\n                    June: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 6\n                        ).Value\n                    ),\n                    July: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 7\n                        ).Value\n                    ),\n                    August: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 8\n                        ).Value\n                    ),\n                    September: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 9\n                        ).Value\n                    ),\n                    October: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 10\n                        ).Value\n                    ),\n                    November: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 11\n                        ).Value\n                    ),\n                    December: Value(\n                        LookUp(\n                            colPVSeasonalityValues,\n                            ID = 12\n                        ).Value\n                    ),\n                    'Standard Values JSON': $\"{{\"\"Jan\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 1\n                        ).IsStandard\n                    )},\n\"\"Feb\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 2\n                        ).IsStandard\n                    )},\n\"\"Mar\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 3\n                        ).IsStandard\n                    )},\n\"\"Apr\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 4\n                        ).IsStandard\n                    )},\n\"\"May\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 5\n                        ).IsStandard\n                    )},\n\"\"Jun\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 6\n                        ).IsStandard\n                    )},\n\"\"Jul\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 7\n                        ).IsStandard\n                    )},\n\"\"Aug\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 8\n                        ).IsStandard\n                    )},\n\"\"Sep\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 9\n                        ).IsStandard\n                    )},\n\"\"Oct\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 10\n                        ).IsStandard\n                    )},\n\"\"Nov\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 11\n                        ).IsStandard\n                    )},\n\"\"Dec\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 12\n                        ).IsStandard\n                    )}}}\",\n                    'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'\n                }\n            )\n        ),\n        If(\n            Not(IsBlank(locSelectedPVSeasonalityYieldRecord)),\n            Remove(\n                'PV Seasonality Values',\n                locSelectedPVSeasonalityYieldRecord\n            )\n        )\n    ),\n    If(\n        tgl_ProductionDataPV_ConsiderNegativePrice.Checked,\n        With(\n            {\n                _existingRecords: Filter(\n                    'PV Negative Prices',\n                    'PV Energy Yield'.'Energy Yield' = locSelectedEnergyYield.'Energy Yield'\n                )\n            },\n            ForAll(\n                colNegativePrices As _currentPrice,\n                With(\n                    {\n                        _match: LookUp(\n                            _existingRecords,\n                            Year = _currentPrice.Year\n                        )\n                    },\n                    Patch(\n                        'PV Negative Prices',\n                        Coalesce(\n                            _match,\n                            Defaults('PV Negative Prices')\n                        ),\n                        {\n                            Name: $\"Negative Price - {_currentPrice.Year}\",\n                            'PV Energy Yield': locSelectedEnergyYield,\n                            Year: _currentPrice.Year,\n                            'Net Yield p50 Reduction': _currentPrice.ReductionValue,\n                            'Is Standard Value?': _currentPrice.StandardAssumption,\n                            'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'\n                        }\n                    )\n                )\n            )\n        ),\n        RemoveIf(\n            'PV Negative Prices',\n            'PV Energy Yield'.'Energy Yield' = locSelectedEnergyYield.'Energy Yield'\n        )\n    ),\n    With(\n        {\n            _NegativePriceEnergyYield: Filter(\n                'Energy Yields',\n                Project.Project = gblRecordSelectedProject.Project,\n                Status = 'Status (Energy Yields)'.Active,\n                'Consider Negative Prices' = 'Consider Negative Prices (Energy Yields)'.Yes\n            ),\n            _NegativePriceRevenueContracts: Filter(\n                'Project Revenues',\n                Project.Project = gblRecordSelectedProject.Project,\n                'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.Yes,\n                NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No\n            ),\n            _NONNegativePriceRevenueContracts: Filter(\n                'Project Revenues',\n                Project.Project = gblRecordSelectedProject.Project,\n                'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.No,\n                NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No\n            )\n        },\n        Concurrent(\n            If(\n                IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NegativePriceRevenueContracts),\n                ForAll(\n                    _NegativePriceRevenueContracts,\n                    Patch(\n                        'Project Revenues',\n                        ThisRecord,\n                        {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.No}\n                    )\n                )\n            ),\n            If(\n                !IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NONNegativePriceRevenueContracts),\n                ForAll(\n                    _NONNegativePriceRevenueContracts,\n                    Patch(\n                        'Project Revenues',\n                        ThisRecord,\n                        {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.Yes}\n                    )\n                )\n            )\n        )\n    )\n);\nIf(\n    rad_ProductionDataPV_Assesment.Selected.Value = 'Yield Assessment'.External,\n    ClearCollect(\n        colProductionActiveInternal,\n        Filter(\n            'Energy Yields',\n            Project.Project = gblRecordSelectedProject.Project,\n            Status = 'Status (Energy Yields)'.Active,\n            'Energy Yield Assessment' = 'Yield Assessment'.Internal,\n            Type = 'Yield Type'.PV\n        )\n    );\n    UpdateIf(\n        colProductionActiveInternal,\n        true,\n        {Status: 'Status (Energy Yields)'.Inactive}\n    );\n    Patch(\n        'Energy Yields',\n        colProductionActiveInternal\n    );\n    \n);\nSelect(btn_Seasonality_NegativePrice_Reset_Hidden);\nClear(colProductionActiveInternal);\nSelect(btn_Load_StandardContracts_For_Project)"
                              Text: |-
                                =If(
                                    IsBlank(txt_GeneratorData_RightPanel_Form_PvModuleType_Fields_OtherSupplier.Value),
                                    "Save",
                                    "Request permission"
                                )
                              TextAlignment: ='PowerCAT.Icon.TextAlignment'.Center
                              Theme: =gblAppThemeJson
                              Tooltip: =""
                              Width: |-
                                =If(
                                    IsBlank(txt_GeneratorData_RightPanel_Form_PvModuleType_Fields_OtherSupplier.Value),
                                    96,
                                    190
                                )
                              X: =Parent.Width - 35
                              Y: =24
                        - btn_Cancel_ProductionDataPV:
                            Control: CodeComponent
                            ComponentName: cat_PowerCAT.Icon
                            Properties:
                              BorderColor: =gblAppTheme.palette.themePrimary
                              FillColor: =gblAppTheme.palette.white
                              FontColor: =gblAppTheme.palette.themePrimary
                              Height: =32
                              HoverBorderColor: =gblAppTheme.palette.hoverButton
                              HoverFillColor: =gblAppTheme.palette.hoverButton
                              HoverFontColor: =gblAppTheme.palette.themePrimary
                              HoverIconColor: =gblAppTheme.palette.themePrimary
                              IconColor: |-
                                =If(
                                    Self.DisplayMode = DisplayMode.Disabled,
                                    gblAppTheme.palette.black,
                                    gblAppTheme.palette.themePrimary
                                )
                              IconName: ="Cancel"
                              IconType: ='PowerCAT.Icon.IconType'.ActionButton
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnChange: |
                                =UpdateContext({locShowPVProdForm: false});
                                Select(btn_Seasonality_NegativePrice_Reset_Hidden);
                              Text: ="Cancel"
                              Theme: =gblAppThemeJson
                              Width: =96
      - btn_Load_StandardContracts_For_Project:
          Control: Button@0.0.45
          Properties:
            Height: =1
            OnSelect: |-
              =UpdateContext(
                  {
                      locIsVisibleSpinner: true,
                      locIsVisibleSpinnerText: "Please wait, saving...."
                  }
              );
              Concurrent(
                  Refresh('Land Lease Periods'),
                  Refresh('Land Lease Project Costs'),
                  Refresh('OPEX & Land Lease Standard Assumptions'),
                  Refresh(GeneratorInProjects)
              );
              Concurrent(
                  ClearCollect(
                      colGeneratorsInProject,
                      AddColumns(
                          Filter(
                              GeneratorInProjects,
                              AsType(
                                  ModuleTypeInProject,
                                  GeneratorTypeInProjects
                              ).Project.Project = gblRecordSelectedProject.Project
                          ),
                          Label,
                          $"{Name} - {Status}",
                          Order,
                          Value(
                              Last(
                                  Split(
                                      Name,
                                      "_"
                                  )
                              ).Value
                          )
                      )
                  ),
                  ClearCollect(
                      colDeviceTypesInProject,
                      AddColumns(
                          Sort(
                              AddColumns(
                                  Filter(
                                      DeviceTypesInProjects,
                                      AsType(
                                          TypeInProject,
                                          GeneratorTypeInProjects
                                      ).Project.Project = gblRecordSelectedProject.Project
                                  ) As DeviceItem,
                                  CreatedOnGenerator,
                                  LookUp(
                                      GeneratorTypeInProjects,
                                      And(
                                          Project.Project = gblRecordSelectedProject.Project,
                                          Name = DeviceItem.Name
                                      )
                                  )
                              ),
                              CreatedOnGenerator.'Created On',
                              SortOrder.Ascending
                          ),
                          IsFolded,
                          true
                      )
                  )
              );
              Concurrent(
                  Collect(
                      colGeneratorsInProject,
                      AddColumns(
                          Filter(
                              GeneratorInProjects,
                              AsType(
                                  ModuleTypeInProject,
                                  PVModuleTypeInProjects
                              ).Project.Project = gblRecordSelectedProject.Project
                          ),
                          Label,
                          AsType(
                              ModuleTypeInProject,
                              PVModuleTypeInProjects
                          ).Label
                      )
                  ),
                  Collect(
                      colDeviceTypesInProject,
                      AddColumns(
                          Filter(
                              DeviceTypesInProjects,
                              AsType(
                                  TypeInProject,
                                  PVModuleTypeInProjects
                              ).Project.Project = gblRecordSelectedProject.Project
                          ),
                          IsFolded,
                          true
                      )
                  )
              );
              ClearCollect(
                  colEnergyYieldsInProject,
                  AddColumns(
                      Sort(
                          Filter(
                              'Energy Yields',
                              Project.Project = gblRecordSelectedProject.Project
                          ),
                          Name,
                          SortOrder.Ascending
                      ),
                      IsFolded,
                      true
                  )
              );
              ClearCollect(
                  colEnergyYieldsInProjectToCalcWTG,
                  Filter(
                      colEnergyYieldsInProject,
                      Type = 'Yield Type'.WTG,
                      Status = 0
                  )
              );
              ClearCollect(
                  colEnergyYieldsInProjectToCalcPV,
                  Filter(
                      colEnergyYieldsInProject,
                      Type = 'Yield Type'.PV,
                      Status = 0
                  )
              );
              Set(
                  gblRecordSelectedProject,
                  Patch(
                      Projects,
                      gblRecordSelectedProject,
                      {
                          'Gross Yield [MWh]': IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Gross Yield [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Gross Yield [MWh]'
                              )
                          ) + IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Gross Yield [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Gross Yield [MWh]'
                              )
                          ),
                          'Wind Speed at Hub Height [m/s]': IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Wind Speed at Hub Height'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Wind Speed at Hub Height'
                              )
                          ),
                          'Net Yield p50': IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Net Yield p50 [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Net Yield p50 [MWh]'
                              )
                          ) + IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Net Yield p50 [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Net Yield p50 [MWh]'
                              )
                          ),
                          'Net Yield p75': IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Net Yield p75 [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Net Yield p75 [MWh]'
                              )
                          ) + IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Net Yield p75 [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Net Yield p75 [MWh]'
                              )
                          ),
                          'Net Yield p90': IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Net Yield p90 [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcWTG,
                                  'Net Yield p90 [MWh]'
                              )
                          ) + IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Net Yield p90 [MWh]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Net Yield p90 [MWh]'
                              )
                          ),
                          'Irradiation [kWh/kWp]': IfError(
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Irradiation [kWh/kWp]'
                              ),
                              0,
                              Average(
                                  colEnergyYieldsInProjectToCalcPV,
                                  'Irradiation [kWh/kWp]'
                              )
                          )
                      }
                  )
              );
              If(
                  And(
                      gblRecordSelectedProject.'Net Yield p50' > 0,
                      gblRecordSelectedProject.'Standard Cost Created' = 'Standard Cost Created (Projects)'.No
                  ),
                  UpdateContext(
                      {
                          locIsVisibleSpinner: true,
                          locIsVisibleSpinnerText: "Please wait, loading standard assumption contract..."
                      }
                  );
                  Concurrent(
                      //LoadLandLeaseStandardContractsAndPeriods
                      Clear(colLoadLandLeasePeriods);
                      Clear(colLandLeaseStandardAssumptionContract);
                      With(
                          {
                              recFilteredStandardContractsForProject: Filter(
                                  'Land Lease Project Costs',
                                  And(
                                      Project.Project = gblRecordSelectedProject.Project,
                                      'Is Standard Contract?' = 'Is Standard Contract? (Land Lease Project Costs)'.Yes
                                  )
                              ),
                              recCountryTechnologyRelatedStandardAssumption: Sort(
                                  Filter(
                                      'OPEX & Land Lease Standard Assumptions',
                                      And(
                                          Country.Country = gblRecordSelectedProject.Country.Country,
                                          Technology = gblRecordSelectedProject.Technology,
                                          'Type Of Contract' = 'Contract Types'.Landlease
                                      )
                                  ),
                                  Description,
                                  SortOrder.Ascending
                              ),
                              recCODDate: gblRecordSelectedProject.'Operations start date (COD)',
                              recCODYear: Year(gblRecordSelectedProject.'Operations start date (COD)') + 1
                          },
                          If(
                              CountRows(recFilteredStandardContractsForProject) = 0,
                              With(
                                  {
                                      recSortedCountryTechnologyStandardAssumptions: recCountryTechnologyRelatedStandardAssumption,
                                      recStandardAssumptionContracts: Filter(
                                          recCountryTechnologyRelatedStandardAssumption,
                                          Period = 'Opex & Land Lease Period'.'Period 1'
                                      )
                                  },
                                  ForAll(
                                      recStandardAssumptionContracts,
                                      With(
                                          {StandardAssumptionContractRecord: ThisRecord},
                                          Collect(
                                              colLandLeaseStandardAssumptionContract,
                                              Patch(
                                                  'Land Lease Project Costs',
                                                  Defaults('Land Lease Project Costs'),
                                                  {
                                                      Project: gblRecordSelectedProject,
                                                      Subaccount: StandardAssumptionContractRecord.'Land Lease Subaccount',
                                                      Name: gblRecordSelectedProject.'Project Name' & "-" & StandardAssumptionContractRecord.'Land Lease Subaccount'.Name & "-" & StandardAssumptionContractRecord.Name,
                                                      Description: StandardAssumptionContractRecord.Description,
                                                      Currency: StandardAssumptionContractRecord.Currency,
                                                      'Due Date One-Time Payment': StandardAssumptionContractRecord.'Due Date One-Time Payment',
                                                      'Amount One-Time Payment': Value(
                                                          Text(
                                                              StandardAssumptionContractRecord.'Amount One-Time Payment',
                                                              "##0.00"
                                                          )
                                                      ),
                                                      Secured: If(
                                                          StandardAssumptionContractRecord.Secured = 'Secured (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                          'Land Lease Secured'.Yes,
                                                          'Land Lease Secured'.No
                                                      ),
                                                      'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)',
                                                      'Due Date One-Time Payment 2': StandardAssumptionContractRecord.'Due Date One-Time Payment 2',
                                                      'Amount One-Time Payment 2': Value(
                                                          Text(
                                                              StandardAssumptionContractRecord.'Amount One-Time Payment 2',
                                                              "##0.00"
                                                          )
                                                      ),
                                                      'Due Date One-Time Payment 3': StandardAssumptionContractRecord.'Due Date One-Time Payment 3',
                                                      'Amount One-Time Payment 3': Value(
                                                          Text(
                                                              StandardAssumptionContractRecord.'Amount One-Time Payment 3',
                                                              "##0.00"
                                                          )
                                                      ),
                                                      AllWTGAllocated: If(
                                                          StandardAssumptionContractRecord.AllWTGAllocated = 'AllWTGAllocated (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                          'AllWTGAllocated (Land Lease Project Costs)'.Yes,
                                                          'AllWTGAllocated (Land Lease Project Costs)'.No
                                                      ),
                                                      'Use Inflation Profile': If(
                                                          StandardAssumptionContractRecord.'Use Inflation Profile' = 'Use Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                          'Use Inflation Profile (Land Lease Project Costs)'.Yes,
                                                          'Use Inflation Profile (Land Lease Project Costs)'.No
                                                      ),
                                                      'Use Country Inflation Profile': If(
                                                          StandardAssumptionContractRecord.'Use Country Inflation Profile' = 'Use Country Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                          'Use Country Inflation Profile (Land Lease Project Costs)'.Yes,
                                                          'Use Country Inflation Profile (Land Lease Project Costs)'.No
                                                      ),
                                                      'Inflation Country Area': StandardAssumptionContractRecord.'Inflation Country Area',
                                                      'Inflation Profile': Switch(
                                                          true,
                                                          And(
                                                              StandardAssumptionContractRecord.'Use Inflation Profile' = 'Use Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                              StandardAssumptionContractRecord.'Use Country Inflation Profile' = 'Use Country Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes
                                                          ),
                                                          LookUp(
                                                              'Country Inflation Profiles',
                                                              Country.Country = gblRecordSelectedProject.Country.Country && Year = recCODYear
                                                          ).Inflation,
                                                          And(
                                                              StandardAssumptionContractRecord.'Use Inflation Profile' = 'Use Inflation Profile (OPEX & Land Lease Standard Assumptions)'.Yes,
                                                              StandardAssumptionContractRecord.'Use Country Inflation Profile' = 'Use Country Inflation Profile (OPEX & Land Lease Standard Assumptions)'.No
                                                          ),
                                                          StandardAssumptionContractRecord.'Inflation Profile',
                                                          Blank()
                                                      ),
                                                      'Inflation Start Year': recCODYear,
                                                      IsStartDateStandardAssumption: 'IsStartDateStandardAssumption (Land Lease Project Costs)'.Yes,
                                                      'Is Standard Contract?': 'Is Standard Contract? (Land Lease Project Costs)'.Yes
                                                  }
                                              )
                                          );
                                          If(
                                              StandardAssumptionContractRecord.AllWTGAllocated = 'AllWTGAllocated (OPEX & Land Lease Standard Assumptions)'.Yes,
                                              ForAll(
                                                  colGeneratorsInProject As recGeneratorInProject,
                                                  With(
                                                      {
                                                          recLandLeaseContractCost: LookUp(
                                                              colLandLeaseStandardAssumptionContract,
                                                              'Land Lease Subaccount'.'Land Lease Subaccount' = StandardAssumptionContractRecord.'Land Lease Subaccount'.'Land Lease Subaccount'
                                                          )
                                                      },
                                                      Patch(
                                                          'Land Lease Allocation WTGS',
                                                          Defaults('Land Lease Allocation WTGS'),
                                                          {
                                                              Name: recLandLeaseContractCost.'Land Owner' & "-" & StandardAssumptionContractRecord.Description & "-" & recGeneratorInProject.Name,
                                                              'Project Cost': recLandLeaseContractCost,
                                                              'Generator In Project': recGeneratorInProject,
                                                              'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                                          }
                                                      )
                                                  )
                                              )
                                          )
                                      )
                                  );
                                  ForAll(
                                      recSortedCountryTechnologyStandardAssumptions,
                                      With(
                                          {
                                              recStandardAssumptionRecord: ThisRecord,
                                              recLandLeaseSubAccountID: ThisRecord.'Land Lease Subaccount'.'Land Lease Subaccount'
                                          },
                                          If(
                                              recStandardAssumptionRecord.Period = 'Opex & Land Lease Period'.'Period 1',
                                              RemoveIf(
                                                  colLoadLandLeasePeriods,
                                                  true
                                              )
                                          );
                                          With(
                                              {
                                                  recProjectCost: LookUp(
                                                      colLandLeaseStandardAssumptionContract,
                                                      And(Subaccount.'Land Lease Subaccount' = recLandLeaseSubAccountID)
                                                  ),
                                                  recStartDate: Switch(
                                                      recStandardAssumptionRecord.Period,
                                                      'Opex & Land Lease Period'.'Period 1',
                                                      recCODDate,
                                                      DateAdd(
                                                          Last(
                                                              Sort(
                                                                  colLoadLandLeasePeriods,
                                                                  Period,
                                                                  SortOrder.Ascending
                                                              )
                                                          ).'Start Date',
                                                          Value(
                                                              Last(
                                                                  Sort(
                                                                      colLoadLandLeasePeriods,
                                                                      Period,
                                                                      SortOrder.Ascending
                                                                  )
                                                              ).'Land Lease duration years'
                                                          ) * 12 + Value(
                                                              Last(
                                                                  Sort(
                                                                      colLoadLandLeasePeriods,
                                                                      Period,
                                                                      SortOrder.Ascending
                                                                  )
                                                              ).'Land Lease duration months'
                                                          ),
                                                          TimeUnit.Months
                                                      )
                                                  )
                                              },
                                              Collect(
                                                  colLoadLandLeasePeriods,
                                                  Patch(
                                                      'Land Lease Periods',
