      - cmp_ActivateDeactivate_ProjectProd:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: |-
              =If(
                  locSelectedEnergyYield.Status = 0,
                  "Deactivate",
                  "Activate"
              )
            Description: |-
              =$"Are you sure you want to {If(
                  locSelectedEnergyYield.Status = 0,
                  "deactivate",
                  "activate"
              )}: {locSelectedEnergyYield.Description}?"
            Height: =Parent.Height
            IconLeftButton: ="CheckMark"
            IconRightButton: ="Trash"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpChangeProductionStatus: false});
            OnConfirm: |-
              =If(
                  locSelectedEnergyYield.Status = 0,
                  Patch(
                      'Energy Yields',
                      LookUp(
                          'Energy Yields',
                          'Energy Yield' = locSelectedEnergyYield.'Energy Yield'
                      ),
                      {Status: 'Status (Energy Yields)'.Inactive}
                  ),
                  Patch(
                      'Energy Yields',
                      LookUp(
                          'Energy Yields',
                          'Energy Yield' = locSelectedEnergyYield.'Energy Yield'
                      ),
                      {Status: 'Status (Energy Yields)'.Active}
                  )
              );
              Refresh('Energy Yields');
              Refresh('Project Revenues');
              With(
                  {
                      _NegativePriceEnergyYield: Filter(
                          'Energy Yields',
                          Project.Project = gblRecordSelectedProject.Project,
                          Status = 'Status (Energy Yields)'.Active,
                          'Consider Negative Prices' = 'Consider Negative Prices (Energy Yields)'.Yes
                      ),
                      _NegativePriceRevenueContracts: Filter(
                          'Project Revenues',
                          Project.Project = gblRecordSelectedProject.Project,
                          'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.Yes,
                          NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No
                      ),
                      _NONNegativePriceRevenueContracts: Filter(
                          'Project Revenues',
                          Project.Project = gblRecordSelectedProject.Project,
                          'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.No,
                          NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No
                      )
                  },
                  Concurrent(
                      If(
                          IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NegativePriceRevenueContracts),
                          ForAll(
                              _NegativePriceRevenueContracts,
                              Patch(
                                  'Project Revenues',
                                  ThisRecord,
                                  {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.No}
                              )
                          )
                      ),
                      If(
                          !IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NONNegativePriceRevenueContracts),
                          ForAll(
                              _NONNegativePriceRevenueContracts,
                              Patch(
                                  'Project Revenues',
                                  ThisRecord,
                                  {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.Yes}
                              )
                          )
                      )
                  )
              );
              Select(btn_Load_StandardContracts_For_Project);
              UpdateContext({locIsVisiblePopUpChangeProductionStatus: false})
            Title: |-
              =If(
                  locSelectedEnergyYield.Status = 0,
                  "Deactivate Production?",
                  "Activate Production?"
              )
            Visible: =locIsVisiblePopUpChangeProductionStatus
            Width: =Parent.Width
      - cmp_Delete_ProjectProd:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Delete"
            Description: =$"Are you sure to delete {locSelectedEnergyYield.Description}?"
            Height: =Parent.Height
            IconLeftButton: ="CheckMark"
            IconRightButton: ="Trash"
            OnCancel: |-
              =UpdateContext({locIsVisiblePopUpDeleteProduction: false});
            OnConfirm: |-
              =Remove(
                  'Energy Yields',
                  locSelectedEnergyYield
              );
              Refresh('Project Revenues');
              With(
                  {
                      _NegativePriceEnergyYield: Filter(
                          'Energy Yields',
                          Project.Project = gblRecordSelectedProject.Project,
                          Status = 'Status (Energy Yields)'.Active,
                          'Consider Negative Prices' = 'Consider Negative Prices (Energy Yields)'.Yes
                      ),
                      _NegativePriceRevenueContracts: Filter(
                          'Project Revenues',
                          Project.Project = gblRecordSelectedProject.Project,
                          'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.Yes,
                          NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No
                      ),
                      _NONNegativePriceRevenueContracts: Filter(
                          'Project Revenues',
                          Project.Project = gblRecordSelectedProject.Project,
                          'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.No,
                          NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No
                      )
                  },
                  Concurrent(
                      If(
                          IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NegativePriceRevenueContracts),
                          ForAll(
                              _NegativePriceRevenueContracts,
                              Patch(
                                  'Project Revenues',
                                  ThisRecord,
                                  {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.No}
                              )
                          )
                      ),
                      If(
                          !IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NONNegativePriceRevenueContracts),
                          ForAll(
                              _NONNegativePriceRevenueContracts,
                              Patch(
                                  'Project Revenues',
                                  ThisRecord,
                                  {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.Yes}
                              )
                          )
                      )
                  )
              );
              Select(btn_Load_StandardContracts_For_Project);
              UpdateContext(
                  {
                      locIsVisiblePopUpDeleteProduction: false,
                      locSelectedEnergyYield: First(colEnergyYieldsInProject)
                  }
              )
            Title: ="Delete production?"
            Visible: =locIsVisiblePopUpDeleteProduction && Not(locPreventGeneratorCapacityPopUp)
            Width: =Parent.Width
      - cmp_PopUp_LoadingSpinner_Production:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Loading
          Properties:
            Height: =Parent.Height
            InformationText: =locIsVisibleSpinnerText
            Visible: =locIsVisibleSpinner
            Width: =Parent.Width
