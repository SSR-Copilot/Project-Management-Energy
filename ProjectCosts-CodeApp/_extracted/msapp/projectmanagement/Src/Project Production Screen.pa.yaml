      - cmp_PopUp_Leave_Procuction_Confirmation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Yes"
            Description: ="You have unsaved data. Do you really want to leave current form without saving?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |+
              =UpdateContext({locLeaveProductionConfirmationDialog: false});

            OnConfirm: |
              =UpdateContext({locLeaveProductionConfirmationDialog: false});
              If(
                  CountRows(
                      Filter(
                          colProductionFormValidation,
                          Dirty = true
                      )
                  ) > 0,
                  If(
                      cmp_Production_Left_Navigation.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                      Set(
                          gblLeftNavigationSelected,
                          LookUp(
                              LeftNavigationMenu,
                              ItemKey = cmp_Production_Left_Navigation.SelectedKey
                          )
                      );
                      Navigate(gblLeftNavigationSelected.TargetScreen),
                      Navigate(
                          'Project Main Screen',
                          ScreenTransition.Fade
                      )
                  )
              );
            Title: ="Unsaved data"
            Visible: =locLeaveProductionConfirmationDialog
            Width: =Parent.Width
