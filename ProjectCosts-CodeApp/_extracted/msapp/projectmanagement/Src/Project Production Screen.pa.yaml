                              OnChange: "=UpdateContext(\n    {\n        locShowWTGProdForm: false,\n        locIsVisibleSpinner: true,\n        locIsVisibleSpinnerText: \"Please wait, saving....\"\n    }\n);\nUpdateContext(\n    {\n        locSelectedEnergyYield: Patch(\n            'Energy Yields',\n            If(\n                IsBlank(locSelectedEnergyYield),\n                Defaults('Energy Yields'),\n                locSelectedEnergyYield\n            ),\n            {\n                Project: gblRecordSelectedProject,\n                'Energy Yield Assessment': rad_ProductionDataWTG_Assesment.Selected.Value,\n                Description: txt_ProductionDataWTG_Description.Value,\n                'Wind Speed at Hub Height': Value(txt_ProductionDataWTG_WindSpeed.Value),\n                Allocation: rad_ProductionDataWTG_Allocation.Selected.Value,\n                'Gross Yield [MWh]': If(\n                    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n                    CountIf(\n                        colGeneratorsInProjectsTemporary,\n                        true\n                    ) * Value(txt_ProductionDataWTG_GrossYield.Value),\n                    Value(txt_ProductionDataWTG_GrossYield.Value)\n                ),\n                'Total losses [%]': If(\n                    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n                    Blank(),\n                    Value(txt_ProductionDataWTG_TotalLosses.Value)\n                ),\n                'Net Yield p50 [MWh]': If(\n                    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n                    CountIf(\n                        colGeneratorsInProjectsTemporary,\n                        true\n                    ) * Value(txt_ProductionDataWTG_NetYieldP50.Value),\n                    Value(txt_ProductionDataWTG_NetYieldP50.Value)\n                ),\n                'Uncertainty [%] ': If(\n                    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n                    Blank(),\n                    Value(txt_ProductionDataWTG_Uncertainty.Value)\n                ),\n                'Net Yield p75 [MWh]': If(\n                    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n                    CountIf(\n                        colGeneratorsInProjectsTemporary,\n                        true\n                    ) * Value(txt_ProductionDataWTG_NetYieldP75.Value),\n                    Value(txt_ProductionDataWTG_NetYieldP75.Value)\n                ),\n                'Net Yield p90 [MWh]': If(\n                    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n                    CountIf(\n                        colGeneratorsInProjectsTemporary,\n                        true\n                    ) * Value(txt_ProductionDataWTG_NetYieldP90.Value),\n                    Value(txt_ProductionDataWTG_NetYieldP90.Value)\n                ),\n                'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)',\n                Type: 'Yield Type'.WTG,\n                'Production losses/p50?': If(\n                    rad_ProductionDataWTG_Lossessp50.Selected.Value = \"Input losses\",\n                    'Production losses/p50? (Energy Yields)'.'Input losses',\n                    'Production losses/p50? (Energy Yields)'.'Input Net Yield p50'\n                ),\n                'Production Uncertainty/ p75 and p90?': If(\n                    rad_ProductionDataWTG_UncertaintyNet.Selected.Value = \"Input Uncertainty\",\n                    'Production Uncertainty/ p75 and p90? (Energy Yields)'.'Input Uncertainty',\n                    'Production Uncertainty/ p75 and p90? (Energy Yields)'.'Input Net Yield p75/p90'\n                ),\n                'Consider Seasonality': tgl_ProductionDataWTG_ConsiderSeasonality.Checked,\n                'Consider Negative Prices': tgl_ProductionDataWTG_ConsiderNegativePrice.Checked\n            }\n        )\n    }\n);\nConcurrent(\n    If(\n        tgl_ProductionDataWTG_ConsiderSeasonality.Checked,\n        With(\n            {\n                _colJSON: ShowColumns(\n                    colWTGSeasonalityValues,\n                    ID,\n                    IsStandard\n                )\n            },\n            Patch(\n                'PV Seasonality Values',\n                Coalesce(\n                    locSelectedWTGSeasonalityYieldRecord,\n                    Defaults('PV Seasonality Values')\n                ),\n                {\n                    Name: \"Seasonality - \" & locSelectedEnergyYield.Description,\n                    'PV Energy Yield': locSelectedEnergyYield,\n                    January: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 1\n                        ).Value\n                    ),\n                    February: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 2\n                        ).Value\n                    ),\n                    March: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 3\n                        ).Value\n                    ),\n                    April: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 4\n                        ).Value\n                    ),\n                    May: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 5\n                        ).Value\n                    ),\n                    June: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 6\n                        ).Value\n                    ),\n                    July: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 7\n                        ).Value\n                    ),\n                    August: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 8\n                        ).Value\n                    ),\n                    September: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 9\n                        ).Value\n                    ),\n                    October: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 10\n                        ).Value\n                    ),\n                    November: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 11\n                        ).Value\n                    ),\n                    December: Value(\n                        LookUp(\n                            colWTGSeasonalityValues,\n                            ID = 12\n                        ).Value\n                    ),\n                    'Standard Values JSON': $\"{{\"\"Jan\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 1\n                        ).IsStandard\n                    )},\n\"\"Feb\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 2\n                        ).IsStandard\n                    )},\n\"\"Mar\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 3\n                        ).IsStandard\n                    )},\n\"\"Apr\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 4\n                        ).IsStandard\n                    )},\n\"\"May\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 5\n                        ).IsStandard\n                    )},\n\"\"Jun\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 6\n                        ).IsStandard\n                    )},\n\"\"Jul\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 7\n                        ).IsStandard\n                    )},\n\"\"Aug\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 8\n                        ).IsStandard\n                    )},\n\"\"Sep\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 9\n                        ).IsStandard\n                    )},\n\"\"Oct\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 10\n                        ).IsStandard\n                    )},\n\"\"Nov\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 11\n                        ).IsStandard\n                    )},\n\"\"Dec\"\":{Text(\n                        LookUp(\n                            _colJSON,\n                            ID = 12\n                        ).IsStandard\n                    )}}}\",\n                    'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'\n                }\n            )\n        ),\n        If(\n            Not(IsBlank(locSelectedWTGSeasonalityYieldRecord)),\n            Remove(\n                'PV Seasonality Values',\n                locSelectedWTGSeasonalityYieldRecord\n            )\n        )\n    ),\n    If(\n        tgl_ProductionDataWTG_ConsiderNegativePrice.Checked,\n        With(\n            {\n                _existingRecords: Filter(\n                    'PV Negative Prices',\n                    'PV Energy Yield'.'Energy Yield' = locSelectedEnergyYield.'Energy Yield'\n                )\n            },\n            ForAll(\n                colNegativePrices As _currentPrice,\n                With(\n                    {\n                        _match: LookUp(\n                            _existingRecords,\n                            Year = _currentPrice.Year\n                        )\n                    },\n                    Patch(\n                        'PV Negative Prices',\n                        Coalesce(\n                            _match,\n                            Defaults('PV Negative Prices')\n                        ),\n                        {\n                            Name: $\"Negative Price - {_currentPrice.Year}\",\n                            'PV Energy Yield': locSelectedEnergyYield,\n                            Year: _currentPrice.Year,\n                            'Net Yield p50 Reduction': _currentPrice.ReductionValue,\n                            'Is Standard Value?': _currentPrice.StandardAssumption,\n                            'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'\n                        }\n                    )\n                )\n            )\n        ),\n        RemoveIf(\n            'PV Negative Prices',\n            'PV Energy Yield'.'Energy Yield' = locSelectedEnergyYield.'Energy Yield'\n        )\n    ),\n    With(\n        {\n            _NegativePriceEnergyYield: Filter(\n                'Energy Yields',\n                Project.Project = gblRecordSelectedProject.Project,\n                Status = 'Status (Energy Yields)'.Active,\n                'Consider Negative Prices' = 'Consider Negative Prices (Energy Yields)'.Yes\n            ),\n            _NegativePriceRevenueContracts: Filter(\n                'Project Revenues',\n                Project.Project = gblRecordSelectedProject.Project,\n                'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.Yes,\n                NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No\n            ),\n            _NONNegativePriceRevenueContracts: Filter(\n                'Project Revenues',\n                Project.Project = gblRecordSelectedProject.Project,\n                'Consider Negative Prices' = 'Consider Negative Prices (Project Revenues)'.No,\n                NegativePriceManualOverride = 'NegativePriceManualOverride (Project Revenues)'.No\n            )\n        },\n        Concurrent(\n            If(\n                IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NegativePriceRevenueContracts),\n                ForAll(\n                    _NegativePriceRevenueContracts,\n                    Patch(\n                        'Project Revenues',\n                        ThisRecord,\n                        {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.No}\n                    )\n                )\n            ),\n            If(\n                !IsEmpty(_NegativePriceEnergyYield) && !IsEmpty(_NONNegativePriceRevenueContracts),\n                ForAll(\n                    _NONNegativePriceRevenueContracts,\n                    Patch(\n                        'Project Revenues',\n                        ThisRecord,\n                        {'Consider Negative Prices': 'Consider Negative Prices (Project Revenues)'.Yes}\n                    )\n                )\n            )\n        )\n    )\n);\n//currently support only \"Whole plant\" - PBI to determinate\n/*\nIf(\n    rad_ProductionDataWTG_Allocation.Selected.Value = 'Yield Allocation'.'Each turbine',\n    ForAll(\n        colGeneratorsInProjectsTemporary,\n        Patch(\n            'Energy Yield Generators',\n            Defaults('Energy Yield Generators'),\n            {\n                'Energy Yield ID': locSelectedEnergyYield,\n                'Gross Yield [MWh]': Value(txt_ProductionDataWTG_GrossYield.Value),\n                'Net Yield p50 [MWh]': Value(txt_ProductionDataWTG_NetYieldP50.Value),\n                'Net Yield p75 [MWh]': Value(txt_ProductionDataWTG_NetYieldP75.Value),\n                'Net Yield p90 [MWh]': Value(txt_ProductionDataWTG_NetYieldP90.Value),\n                'Generator Name': ThisRecord.GeneartorName\n            }\n        )\n    ),\n    \"\"\n);\n*/If(\n    rad_ProductionDataWTG_Assesment.Selected.Value = 'Yield Assessment'.External,\n    ClearCollect(\n        colProductionActiveInternal,\n        Filter(\n            'Energy Yields',\n            Project.Project = gblRecordSelectedProject.Project,\n            Status = 'Status (Energy Yields)'.Active,\n            'Energy Yield Assessment' = 'Yield Assessment'.Internal,\n            Type = 'Yield Type'.WTG\n        )\n    );\n    UpdateIf(\n        colProductionActiveInternal,\n        true,\n        {Status: 'Status (Energy Yields)'.Inactive}\n    );\n    Patch(\n        'Energy Yields',\n        colProductionActiveInternal\n    );\n    \n);\nSelect(btn_Seasonality_NegativePrice_Reset_Hidden);\nClear(colProductionActiveInternal);\nSelect(btn_Load_StandardContracts_For_Project)"
                              Text: |-
