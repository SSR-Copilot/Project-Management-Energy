Screens:
  Project Production Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: |-
        =UpdateContext(
            {
                locLeaveProductionConfirmationDialog: false,
                locSelectedEnergyYield: Blank(),
                locShowPVProdForm: false,
                locShowWTGProdForm: false,
                locIsVisiblePopUpChangeProductionStatus: false,
                locIsVisiblePopUpDeleteProduction: false,
                locOAndMSubaccount: Blank()
            }
        );

        Clear(colGeneratorTypeInProjects);
        Clear(colGeneratorTypesPagging);
        Clear(colGeneratorsInProjectsTemporary);
        Clear(colPanelGeneratorFormValidation);
        Clear(colPanelWtgFormValidation);
        Clear(colPanelInverterFormValidation);
        Clear(colTemporaryGeneratorList);
        Clear(colProductionFormValidation);
        Clear(colEnergyYieldsInProject);
        Clear(colStandardSeasonalityYeild);
        Clear(colStandardNegativePricePV);
        Clear(colNegativePrices);
        Clear(colWTGSeasonalityValues);
        Clear(colPVSeasonalityValues);
      OnVisible: "=UpdateContext(\n    {\n        locLeaveProductionConfirmationDialog: false,\n        locGeneratorsPageSize: 30,\n        locSelectedEnergyYield: Blank(),\n        locShowPVProdForm: false,\n        locShowWTGProdForm: false,\n        locIsVisiblePopUpChangeProductionStatus: false,\n        locIsVisiblePopUpDeleteProduction: false,\n        locOAndMSubaccount: LookUp(\n            'Opex Subaccounts',\n            Name = \"Operation & Maintenance\"\n        )\n    }\n);\nSet(\n    gblRecordSelectedProject,\n    LookUp(\n        Projects,\n        ThisRecord.Project = gblRecordSelectedProject.Project\n    )\n);\nSet(\n    gblCurrentUser,\n    Patch(\n        gblCurrentUser,\n        {\n            CanEditSelectedProject: And(\n                DataSourceInfo(\n                    Projects,\n                    DataSourceInfo.CreatePermission\n                ),\n                Coalesce(\n                    RecordInfo(\n                        gblRecordSelectedProject,\n                        RecordInfo.EditPermission\n                    ),\n                    false\n                )\n            )\n        }\n    )\n);\nClearCollect(\n    colGeneratorTypeInProjects,\n    AddColumns(\n        Filter(\n            GeneratorTypeInProjects,\n            Project.Project = gblRecordSelectedProject.Project\n        ),\n        IsFolded,\n        true\n    )\n);\nClearCollect(\n    colGeneratorTypesPagging,\n    ForAll(\n        colGeneratorTypeInProjects,\n        {\n            Id: ThisRecord.GeneratorTypeInProject,\n            Event: \"\",\n            TotalRows: ThisRecord.'Number of Generators',\n            Page: 1,\n            Pages: 0,\n            PageSize: locGeneratorsPageSize\n        }\n    )\n);\nWith(\n    {\n        varFilteredGenerators: AddColumns(\n            Filter(\n                GeneratorInProjects,\n                And(\n                    Not(IsEmpty(colGeneratorTypeInProjects)),\n                    AsType(\n                        ModuleTypeInProject,\n                        GeneratorTypeInProjects\n                    ).GeneratorTypeInProject in colGeneratorTypeInProjects.GeneratorTypeInProject\n                )\n            ),\n            GeneartorName,\n            Name,\n            Index,\n            Value(\n                Last(\n                    Split(\n                        Name,\n                        \"_\"\n                    )\n                ).Value\n            )\n        )\n    },\n    ClearCollect(\n        colGeneratorsInProjectsTemporary,\n        varFilteredGenerators\n    );\n    Trace(\n        $\"Info: Generators types are collected colGeneratorsInProjectsTemporary...\",\n        TraceSeverity.Critical\n    )\n);\nClearCollect(\n    colPanelGeneratorFormValidation,\n    Blank()\n);\nClearCollect(\n    colPanelWtgFormValidation,\n    Blank()\n);\nClearCollect(\n    colPanelInverterFormValidation,\n    Blank()\n);\nClearCollect(\n    colTemporaryGeneratorList,\n    Blank()\n);\nClearCollect(\n    colProductionFormValidation,\n    Table(\n        {\n            Name: \"GrossYield\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"ParkEfficiency\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"WindSpeed\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"AnnualDegradation\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"AvailabilityLosses\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"OtherLosses\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"NetYield_p50\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"NetYield_p75\",\n            Dirty: false,\n            Valid: true\n        },\n        {\n            Name: \"NetYield_p90\",\n            Dirty: false,\n            Valid: true\n        }\n    )\n);\nClearCollect(\n    colEnergyYieldsInProject,\n    AddColumns(\n        Sort(\n            Filter(\n                'Energy Yields',\n                Project.Project = gblRecordSelectedProject.Project\n            ),\n            Name,\n            SortOrder.Ascending\n        ),\n        IsFolded,\n        true\n    )\n);\n// For Fetching Standard Values from Fabric in Local\nConcurrent(\n    ClearCollect(\n        colStandardSeasonalityYeild,\n        With(\n            {\n                FilteredStandardAssumptions: SortByColumns(\n                    Filter(\n                        'Assumptions Revenues SQL',\n                        country = gblRecordSelectedProject.Country.Name,\n                        valuetype = \"seasonality\"\n                    ),\n                    \"category\"\n                )\n            },\n            ForAll(\n                FilteredStandardAssumptions,\n                With(\n                    {rec: ThisRecord},\n                    {\n                        Month: Value(rec.category),\n                        PV: Switch(\n                            First(\n                                Split(\n                                    Language(),\n                                    \"-\"\n                                )\n                            ).Value,\n                            \"en\",\n                            Value(pv) * 100,\n                            Value(\n                                Substitute(\n                                    pv,\n                                    \".\",\n                                    \",\"\n                                )\n                            ) * 100\n                        ),\n                        WTG: Switch(\n                            First(\n                                Split(\n                                    Language(),\n                                    \"-\"\n                                )\n                            ).Value,\n                            \"en\",\n                            Value(wind) * 100,\n                            Value(\n                                Substitute(\n                                    wind,\n                                    \".\",\n                                    \",\"\n                                )\n                            ) * 100\n                        )\n                    }\n                )\n            )\n        )\n    )\n    /*ClearCollect(\n        colStandardSeasonalityYeild,\n        [\n            {\n                Month: 1,\n                PV: 6.5,\n                WTG: 8.0\n            },\n            {\n                Month: 2,\n                PV: 7.0,\n                WTG: 7.5\n            },\n            {\n                Month: 3,\n                PV: 8.5,\n                WTG: 8.0\n            },\n            {\n                Month: 4,\n                PV: 9.5,\n                WTG: 8.5\n            },\n            {\n                Month: 5,\n                PV: 10.5,\n                WTG: 9.0\n            },\n            {\n                Month: 6,\n                PV: 11.0,\n                WTG: 9.5\n            },\n            {\n                Month: 7,\n                PV: 11.5,\n                WTG: 10.0\n            },\n            {\n                Month: 8,\n                PV: 11.0,\n                WTG: 9.5\n            },\n            {\n                Month: 9,\n                PV: 9.5,\n                WTG: 8.5\n            },\n            {\n                Month: 10,\n                PV: 7.5,\n                WTG: 7.5\n            },\n            {\n                Month: 11,\n                PV: 4.5,\n                WTG: 7.0\n            },\n            {\n                Month: 12,\n                PV: 3.0,\n                WTG: 7.0\n            }\n        ]\n    )*/,\n    ClearCollect(\n        colStandardNegativePricePV,\n        With(\n            {\n                FilteredAssumptions: SortByColumns(\n                    Filter(\n                        'Assumptions Revenues SQL',\n                        country = gblRecordSelectedProject.Country.Name,\n                        valuetype = \"negativeprices\"\n                    ),\n                    \"category\"\n                )\n            },\n            ForAll(\n                FilteredAssumptions,\n                With(\n                    {rec: ThisRecord},\n                    {\n                        Year: Value(rec.category),\n                        PV: Round(\n                            Value(\n                                Switch(\n                                    First(\n                                        Split(\n                                            Language(),\n                                            \"-\"\n                                        )\n                                    ).Value,\n                                    \"en\",\n                                    Value(rec.pv),\n                                    Value(\n                                        Substitute(\n                                            rec.pv,\n                                            \".\",\n                                            \",\"\n                                        )\n                                    )\n                                ) * 100\n                            ),\n                            1\n                        ),\n                        Wind: Round(\n                            Value(\n                                Switch(\n                                    First(\n                                        Split(\n                                            Language(),\n                                            \"-\"\n                                        )\n                                    ).Value,\n                                    \"en\",\n                                    Value(rec.wind),\n                                    Value(\n                                        Substitute(\n                                            rec.wind,\n                                            \".\",\n                                            \",\"\n                                        )\n                                    )\n                                ) * 100\n                            ),\n                            1\n                        )\n                    }\n                )\n            )\n        )\n    );\n    \n);\nUpdateContext({locSelectedEnergyYield: First(colEnergyYieldsInProject)})"
    Children:
      - fn_Numeric_With_Separtors_Production:
          Control: CanvasComponent
          ComponentName: fn_Numeric_With_Separtors
          Properties:
            Height: =0
            Visible: =false
            Width: =0
      - btn_Seasonality_NegativePrice_Reset_Hidden:
          Control: Button@0.0.45
          Properties:
            Height: =0
            OnSelect: |
              =UpdateContext({locSelectedEnergyYield: Blank()});
              /*Concurrent(
                  Reset(tgl_ProductionDataWTG_ConsiderSeasonality),
                  Reset(tgl_ProductionDataPV_ConsiderSeasonality),
                  Reset(tgl_ProductionDataPV_ConsiderNegativePrice),
                  Reset(tgl_ProductionDataWTG_ConsiderNegativePrice)
              );*/
              Concurrent(
                  ClearCollect(
                      colPVSeasonalityValues,
                      ForAll(
                          Sequence(
                              12,
                              1
                          ),
                          With(
                              {rec: ThisRecord},
                              {
                                  ID: rec.Value,
                                  Month: Text(
                                      Date(
                                          Year(Today()),
                                          rec.Value,
                                          1
                                      ),
                                      "[$-en-US]mmmm"
                                  ),
                                  Value: 0,
                                  TextValue: Text(
                                      0,
                                      "#0.0",
                                      Language()
                                  ),
                                  IsStandard: false
                              }
                          )
                      )
                  ),
                  ClearCollect(
                      colWTGSeasonalityValues,
                      ForAll(
                          Sequence(
                              12,
                              1
                          ),
                          With(
                              {rec: ThisRecord},
                              {
                                  ID: rec.Value,
                                  Month: Text(
                                      Date(
                                          Year(Today()),
                                          rec.Value,
                                          1
                                      ),
                                      "[$-en-US]mmmm"
                                  ),
                                  Value: 0,
                                  TextValue: Text(
                                      0,
                                      "#0.0",
                                      Language()
                                  ),
                                  IsStandard: false
                              }
                          )
                      )
                  )
              );
              Concurrent(
                  //Reset(txt_ProductionSeasonalityYieldPV_MonthValue),
                  Clear(colNegativePrices),
                  Clear(colPVSeasonalityValues),
                  Clear(colWTGSeasonalityValues)
                  //,Reset(txt_ProductionSeasonalityYieldWTG_MonthValue)
              );
            Visible: =false
            Width: =0
      - fn_Calculate_EnergyYield_P75_P90:
          Control: CanvasComponent
          ComponentName: fn_Calculate_P75_P90
      - fn_Numeric_Production:
          Control: CanvasComponent
          ComponentName: fn_Numeric
          Properties:
            Height: =10
            Width: =10
            Y: =Parent.Height-Self.Height
      - con_Production_DisplayProject:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =App.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =App.Width
          Children:
            - cmp_Production_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: =gblTableApprovalStateColors
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: ='Project Main Screen'
                  OnLogoClick: |
                    =If(
                        CountRows(
                            Filter(
                                colProductionFormValidation,
                                Dirty = true
                            )
                        ) > 0,
                        UpdateContext({locLeaveProductionConfirmationDialog: true}),
                        Navigate(
                            'Project Main Screen',
                            ScreenTransition.Fade
                        )
                    );
                  Project: =gblProjectHeaderData
                  Width: =1024
            - con_Production_Form_Context:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ColorValue(gblAppTheme.palette.neutralLighter)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LayoutWrap: =true
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - con_Production_DisplayProject_Body_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Width: =If(gblLeftNavigationMenuIsExpanded, gblAppSizes.LeftNavigation.ExpandedWidth,gblAppSizes.LeftNavigation.DecreasedWidth)
                      Children:
                        - cmp_Production_Left_Navigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftNavigationMenu
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnExpand: |
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |
                                =If(
                                    CountRows(
                                        Filter(
                                            colProductionFormValidation,
                                            Dirty = true
                                        )
                                    ) > 0,
                                    UpdateContext({locLeaveProductionConfirmationDialog: true}),
                                    If(
                                        Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                        Set(
                                            gblLeftNavigationSelected,
                                            LookUp(
                                                LeftNavigationMenu,
                                                ItemKey = Self.SelectedKey
                                            )
                                        );
                                        Navigate(
                                            gblLeftNavigationSelected.TargetScreen,
                                            ScreenTransition.Fade
                                        )
                                    )
                                );
                              Selected: =gblLeftNavigationSelected
                              Width: =200
                  - con_Production_DisplayProject_Body_RightContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - con_Milestones_Page_LockMessage_2:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(89, 89, 89, 1)
                              FillPortions: =0
                              Height: |-
                                =If(
                                    And(
                                        IsBlank(gblRecordSelectedProject.'Project ID'),
                                        IsBlank(gblRecordSelectedProject.'Project Start Date'),
                                        Or(
                                            gblRecordSelectedProject.'Total Capacity' = 0,
                                            IsBlank(gblRecordSelectedProject.'Total Capacity')
                                        )
                                    ),
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.Height * 5,
                                    IsBlank(gblRecordSelectedProject.'Project Start Date'),
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.Height * 4,
                                    Or(
                                        gblRecordSelectedProject.'Total Capacity' = 0,
                                        IsBlank(gblRecordSelectedProject.'Total Capacity')
                                    ),
                                    // else / default height when none of the above conditions are true
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.Height * 3,
                                    lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.Height
                                )
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =10
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =Parent.Width
                              LayoutMinHeight: =
                              PaddingLeft: =20
                              Visible: |-
                                =Or(
                                    IsBlank(gblRecordSelectedProject.'Project ID'),// General not completed
                                    IsBlank(gblRecordSelectedProject.'End Date'),// Milestones not completed
                                    Or(
                                        gblRecordSelectedProject.'Total Capacity' = 0,
                                        IsBlank(gblRecordSelectedProject.'Total Capacity')
                                    )
                                )
                              X: =40
                              Y: =40
                            Children:
                              - icon_milestones_lock_2:
                                  Control: Classic/Icon@2.5.0
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                    DisabledColor: =RGBA(225, 223, 221, 1)
                                    DisabledFill: =RGBA(0, 0, 0, 0)
                                    FocusedBorderThickness: =4
                                    Height: =20
                                    HoverBorderColor: =RGBA(0, 0, 0, 0)
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(0, 0, 0, 0)
                                    Icon: =Icon.Lock
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    PressedBorderColor: =RGBA(0, 0, 0, 0)
                                    PressedColor: =RGBA(16, 110, 190, 1)
                                    PressedFill: =RGBA(0, 0, 0, 0)
                                    Width: =20
                                    X: =40
                                    Y: =Parent.Height-Self.Height
                              - con_Milestones_pagelock_section_2:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMaxHeight: =
                                    LayoutMinHeight: =
                                    LayoutMinWidth: =16
                                    PaddingBottom: =8
                                    PaddingLeft: =8
                                    PaddingRight: =8
                                    PaddingTop: =8
                                  Children:
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =20
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          Text: ="This page is locked. To unlock it, please complete the following sections:"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          X: =icon_milestones_lock_2.Width+icon_milestones_lock_2.X+10
                                          Y: =Parent.Height-Self.Height
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_7:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.X
                                          PaddingTop: =0
                                          Text: ="• General"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: =IsBlank(gblRecordSelectedProject.'Project ID')
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_8:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.X
                                          PaddingTop: =0
                                          Text: ="• Milestones"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: =IsBlank(gblRecordSelectedProject.'End Date')
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                                    - lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_9:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AutoHeight: =true
                                          Font: =gblAppColors.Label.Font
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          Height: =Self.AutoHeight
                                          LayoutMaxHeight: =
                                          LayoutMaxWidth: =
                                          PaddingLeft: =lbl_ProjectRevenues_DisplayProjectBodyRightContent_Balancing_Price_VisibilityMessage_6.X
                                          PaddingTop: =0
                                          Text: ="• Generator"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Visible: |-
                                            =Or(
                                                gblRecordSelectedProject.'Total Capacity' = 0,
                                                IsBlank(gblRecordSelectedProject.'Total Capacity')
                                            )
                                          Weight: ='TextCanvas.Weight'.Regular
                                          Width: =Parent.Width-Self.X
                                          Y: =(Parent.Height-Self.Height)/2
                        - con_Production_DisplayProject_Body_CommandBar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.SetByContainer
                              BorderStyle: =BorderStyle.None
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =50
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              PaddingLeft: =10
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.Width
                            Children:
                              - pcf_ProjectRevenues_Content_ContractCommandBar_1:
                                  Control: CodeComponent
                                  ComponentName: cat_PowerCAT.CommandBar
                                  Properties:
                                    AccessibilityLabel: ="pcf_ProjectRevenues_Content_ContractCommandBar_1"
                                    DisplayMode: |-
                                      =If(
                                          con_Milestones_Page_LockMessage_2.Visible,
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    Height: =40
                                    Items: |-
                                      =Table(
                                          {
                                              ItemKey: "newProductionWTG",
                                              ItemDisplayName: "Add Production WTG",
                                              ItemIconName: "Add",
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          },
                                          {
                                              ItemKey: "newProductionPV",
                                              ItemDisplayName: "Add Production PV",
                                              ItemIconName: "Add",
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          },
                                          {
                                              ItemKey: "editProductionWTG",
                                              ItemDisplayName: "Edit",
                                              ItemIconName: "Edit",
                                              ItemVisible: locSelectedEnergyYield.Type = 'Yield Type'.WTG,
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          },
                                          {
                                              ItemKey: "editProductionPV",
                                              ItemDisplayName: "Edit",
                                              ItemIconName: "Edit",
                                              ItemVisible: locSelectedEnergyYield.Type = 'Yield Type'.PV,
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          },
                                          {
                                              ItemKey: "deleteProductionItem",
                                              ItemDisplayName: "Delete",
                                              ItemIconName: "Delete",
                                              ItemVisible: !IsBlank(locSelectedEnergyYield),
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          },
                                          {
                                              ItemKey: "activateProdItem",
                                              ItemDisplayName: "Activate Production",
                                              ItemIconName: "ActivateOrders",
                                              ItemVisible: locSelectedEnergyYield.Status <> 'Status (Energy Yields)'.Active && !IsBlank(locSelectedEnergyYield.Status),
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          },
                                          {
                                              ItemKey: "deactivateProdItem",
                                              ItemDisplayName: "Deactivate Production",
                                              ItemIconName: "DeactivateOrders",
                                              ItemVisible: locSelectedEnergyYield.Status <> 'Status (Energy Yields)'.Inactive && !IsBlank(locSelectedEnergyYield.Status),
                                              ItemEnabled: And(gblCurrentUser.CanEditSelectedProject, gblRecordSelectedProject.'Total Capacity' <> 0)
                                          }
                                      )
                                    LayoutMaxHeight: =
                                    LayoutMaxWidth: =
                                    OnSelect: |
                                      =// 1. Initial State Reset for all possible Form Controls
                                      Reset(rad_ProductionDataWTG_Assesment);
                                      Reset(txt_ProductionDataWTG_Description);
                                      Reset(txt_ProductionDataWTG_WindSpeed);
                                      Reset(rad_ProductionDataWTG_Allocation);
                                      Reset(txt_ProductionDataWTG_GrossYield);
                                      Reset(rad_ProductionDataWTG_Lossessp50);
