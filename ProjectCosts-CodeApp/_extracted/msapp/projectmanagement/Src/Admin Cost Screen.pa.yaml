                                  'Applied By Email': User().Email,
                                  'Applied By Full Name': User().FullName,
                                  'Contract Type': locSelectedCategory
                              }
                          )
                      )
                  }
              );
              Concurrent(
                  ClearCollect(
                      colApplyAndApplyAllTracking,
                      'Apply and Apply All Trackings'
                  ),
                  UpdateContext({locSelectedApplyAndApplyAllTracking: Blank()})
              );
              /*
              UpdateContext(
                  {
                      locFabricSyncCostJob: Patch(
                          'Fabric Sync Jobs',
                          Defaults('Fabric Sync Jobs'),
                          {
                              Name: "",
                              'Cost Type': If(
                                  IsBlank(locSelectedCategory),
                                  "All",
                                  Switch(
                                      locSelectedCategory,
                                      'Contract Types'.Landlease,
                                      "952850000",
                                      'Contract Types'.'Opex O&M',
                                      "952850001",
                                      'Contract Types'.'Opex Other',
                                      "952850002",
                                      'Contract Types'.'DEVEX/CAPEX',
                                      "952850003"
                                  )
                              ),
                              'Job Type': LookUp(
                                  'Fabric Job Types',
                                  Name = "Apply Standard Assumption for Cost"
                              ),
                              'Job Status': 'Job States'.Dirty,
                              Country: cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry,
                              Technology: Switch(
                                  cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                  "PV",
                                  Technology.PV,
                                  "Wind",
                                  Technology.Wind,
                                  "BESS",
                                  Technology.BESS,
                                  "Hydro",
                                  Technology.Hydro
                              )
                          }
                      )
                  }
              );
              SynchronizeStandardAssumptionCosts.Run(
                  locFabricSyncCostJob.'Cost Type',
                  locFabricSyncCostJob.Country.Country,
                  Int(locFabricSyncCostJob.Technology),
                  locFabricSyncCostJob.'Fabric Sync Job'
              );
              Notify(
                  $"Synchronization of {If(
                      IsBlank(locSelectedCategory),
                      "all cost categories",
                      Switch(
                          locSelectedCategory,
                          'Contract Types'.Landlease,
                          "Landlease costs",
                          'Contract Types'.'Opex O&M',
                          "O&M costs",
                          'Contract Types'.'Opex Other',
                          "other opex costs",
                          'Contract Types'.'DEVEX/CAPEX',
                          "DEVEX/CAPEX costs"
                      )
                  )} for {locFabricSyncCostJob.Country.Name} - {Text(locFabricSyncCostJob.Technology)} initiated."
              );*/
              UpdateContext(
                  {
                      locIsVisibleApplyAndApplyAll: false,
