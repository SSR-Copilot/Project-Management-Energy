      - cmp_PopUp_Confirmation_Delete_Contract_Or_Period:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: |-
              =Switch(
                  locSelectedCategory,
                  'Contract Types'.'DEVEX/CAPEX',
                  $"Are you sure you want to delete the ""{locSelectedStandardCost.Description}"" cost?",
                  If(
                      locSelectedLandLeaseCost.Period = 'Opex & Land Lease Period'.'Period 1',
                      $"Are you sure you want to delete the ""{locSelectedLandLeaseCost.Description}"" contract and all related periods?",
                      $"Are you sure you want to delete the ""{locSelectedLandLeaseCost.Description}"" period?"
                  )
              )
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: =UpdateContext({locIsVisibleDeleteConfirmation:false,locSelectedLandLeaseCost:Blank()})
            OnConfirm: |+
              =Switch(
                  locSelectedCategory,
                  'Contract Types'.'DEVEX/CAPEX',
                  UpdateContext({locSelectedDevexCapexCategory: locSelectedStandardCost.Category});
                  Select(btn_AdminCost_DevexCapex_Delete_StandardCost_Confirm);
                  Select(btn_Filter_Devex_Capex_Assumptions),
                  UpdateContext(
                      {
                          locSpinnerInformationText: "Please wait, deleting...",
                          locIsVisiblePopUpSpinner: true,
                          locIsVisibleDeleteConfirmation: false
                      }
                  );
                  UpdateContext(
                      {
                          locContractOrPeriodToDelete: locSelectedLandLeaseCost,
                          locSecondLastPeriod: First(
                              LastN(
                                  Sort(
                                      Filter(
                                          colOpexandLandLeaseStandardAssumptions,
                                          If(
                                              Not(IsBlank(locSelectedOAndMSubaccount.'Opex Subaccount')),
                                              'Opex Subaccount'.'Opex Subaccount' = locSelectedOAndMSubaccount.'Opex Subaccount',
                                              Not(IsBlank(locSelectedOtherOpexSubaccount.'Opex Subaccount')),
                                              'Opex Subaccount'.'Opex Subaccount' = locSelectedOtherOpexSubaccount.'Opex Subaccount',
                                              Not(IsBlank(locSelectedLandLeaseSubaccount.'Land Lease Subaccount')),
                                              'Land Lease Subaccount'.'Land Lease Subaccount' = locSelectedLandLeaseSubaccount.'Land Lease Subaccount'
                                          ),
                                          Country.Country = cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Country,
                                          Text(Technology) = cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                          'Type Of Contract' = locContractOrPeriodToDelete.'Type Of Contract'
                                      ),
                                      Description,
                                      SortOrder.Ascending
                                  ),
                                  2
                              )
                          )
                      }
                  );
                  IfError(
                      If(
                          locContractOrPeriodToDelete.Period = 'Opex & Land Lease Period'.'Period 1',
                          Concurrent(
                              RemoveIf(
                                  'OPEX & Land Lease Standard Assumptions',
                                  And(
                                      If(
                                          Not(IsBlank(locSelectedOAndMSubaccount.'Opex Subaccount')),
                                          'Opex Subaccount'.'Opex Subaccount' = locSelectedOAndMSubaccount.'Opex Subaccount',
                                          Not(IsBlank(locSelectedOtherOpexSubaccount.'Opex Subaccount')),
                                          'Opex Subaccount'.'Opex Subaccount' = locSelectedOtherOpexSubaccount.'Opex Subaccount',
                                          Not(IsBlank(locSelectedLandLeaseSubaccount.'Land Lease Subaccount')),
                                          'Land Lease Subaccount'.'Land Lease Subaccount' = locSelectedLandLeaseSubaccount.'Land Lease Subaccount'
                                      ),
                                      Country.Country = cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Country,
                                      Text(Technology) = cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                      'Type Of Contract' = locContractOrPeriodToDelete.'Type Of Contract'
                                  )
                              ),
