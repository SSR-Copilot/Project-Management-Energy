      - cmp_PopUp_Confirmation_Apply_And_ApplyAll:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: |-
              =$"Are you sure you want to apply standard {If(
                  IsBlank(locSelectedCategory),
                  "contracts to all cost categories",
                  locSelectedCategory = 'Contract Types'.Landlease,
                  "land lease contracts ",
                  locSelectedCategory = 'Contract Types'.'Opex O&M',
                  "O&M contracts ",
                  locSelectedCategory = 'Contract Types'.'Opex Other',
                  "other opex contracts ",locSelectedCategory='Contract Types'.'DEVEX/CAPEX',"Devex/Capex contracts"
              )} for ""{cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Name}"" and ""{cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue}"" ?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: =UpdateContext({locIsVisibleApplyAndApplyAll:false,locSelectedCategory:Blank()});
            OnConfirm: |
              =UpdateContext(
                  {
                      locIsVisibleApplyAndApplyAll: false,
                      locIsVisiblePopUpSpinner: true,
                      locSpinnerInformationText: "Applying standard contracts, syncing job in progress....."
                  }
              );
              UpdateContext(
                  {
                      locSelectedApplyAndApplyAllTracking: With(
                          {
                              locAction: If(
                                  IsBlank(locSelectedCategory),
                                  'Action? (Apply and Apply All Trackings)'.'Apply All',
                                  'Action? (Apply and Apply All Trackings)'.Apply
                              )
                          },
                          Patch(
                              'Apply and Apply All Trackings',
                              If(
                                  IsBlank(locSelectedApplyAndApplyAllTracking),
                                  Defaults('Apply and Apply All Trackings'),
                                  locSelectedApplyAndApplyAllTracking
                              ),
                              {
                                  Name: cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Name & " - " & cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue & " - " & Text(locAction),
                                  Country: cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry,
                                  Technology: Switch(
                                      cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
