Screens:
  Admin Cost Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: "=Concurrent(\n    Clear(colOpexandLandLeaseStandardAssumptions),\n    Clear(colAdminCostCategories),\n //  Clear(col_cmpCountryPickerItems),\n    Clear(colOAndMSubaccounts),\n    Clear(colOtherOpexSubaccounts),\n    Clear(colLandLeaseSubaccounts),\n    UpdateContext(\n        {\n            locContractOrPeriodToDelete: Blank(),\n            locNextPeriodReferenceCost: Blank(),\n           \n            locParentPeriod: Blank(),\n            \n            locSelectedLandLeaseCost: Blank(),\n            locSelectedLandLeaseSubaccount: Blank(),\n            locSelectedOAndMSubaccount: Blank(),\n            locSelectedOtherOpexSubaccount: Blank(),\n            locSelectedCategory: Blank()\n        }\n    )\n)"
      OnVisible: |-
        =Concurrent(
            ClearCollect(
                colApplyAndApplyAllTracking,
                'Apply and Apply All Trackings'
            );
            ,
            ClearCollect(
                colLandLeaseSubaccounts,
                Sort(
                    'Land Lease Subaccounts',
                    Order,
                    SortOrder.Ascending
                )
            ),
            ClearCollect(
                colOtherOpexSubaccounts,
                Sort(
                    Filter(
                        'Opex Subaccounts',
                        Not(
                            Or(
                                Account.Order = 1,
                                Name = "Operation & Maintenance"
                            )
                        )
                    ),
                    Order,
                    SortOrder.Ascending
                )
            ),
            ClearCollect(
                colOAndMSubaccounts,
                Filter(
                    'Opex Subaccounts',
                    Or(
                        Account.Order = 1,
                        Name = "Operation & Maintenance"
                    )
                )
            ),
            ClearCollect(
                col_cmpCountryPickerItems,
                Sort(
                    AddColumns(
                        Countries,
                        'Flag Image',
                        Switch(
                            Name,
                            "Germany",
                            'germany-flag-png-large',
                            "Croatia",
                            'croatia-flag-png-large',
                            "France",
                            'france-flag-png-large',
                            "Greece",
                            'greece-flag-png-large',
                            "Finland",
                            'finland-flag-png-large',
                            "Spain",
                            'spain-flag-png-large',
                            "Italy",
                            'italy-flag-png-large',
                            "Poland",
                            'poland-flag-png-large',
                            "Romania",
                            'romania-flag-png-large'
                        ),
                        Order,
                        Switch(
                            Name,
                            "Germany",
                            1,
                            "Croatia",
                            6,
                            "France",
                            2,
                            "Greece",
                            8,
                            "Finland",
                            5,
                            "Spain",
                            7,
                            "Italy",
                            4,
                            "Poland",
                            3,
                            "Romania",
                            9
                        ),
                        Expanded,
                        false
                    ),
                    ThisRecord.Order
                )
            ),
            ClearCollect(
                colAdminCostCategories,
                Table(
                    {
                        Category: "DEVEX/CAPEX",
                        IsFolded: true,
                        TypeOfCategory: 'Contract Types'.'DEVEX/CAPEX'
                    },
                    {
                        Category: "Operation & Maintenance",
                        IsFolded: true,
                        TypeOfCategory: 'Contract Types'.'Opex O&M'
                    },
                    {
                        Category: "Land Lease",
                        IsFolded: true,
                        TypeOfCategory: 'Contract Types'.Landlease
                    },
                    {
                        Category: "Other OPEX Costs",
                        IsFolded: true,
                        TypeOfCategory: 'Contract Types'.'Opex Other'
                    }
                )
            ),
            ClearCollect(
                colOpexandLandLeaseStandardAssumptions,
                Sort(
                    'OPEX & Land Lease Standard Assumptions',
                    Description,
                    SortOrder.Ascending
                )
            ),
            /*
            ClearCollect(
                colDevexCapexAssumptions,
                'Devex/Capex Standard Assumptions'
            ),*/
            ClearCollect(
                colCapexAccountCategories,
                SortByColumns(
                    Filter(
                        'CAPEX Account Lists',
                        And(
                            Not(IsBlank('Parent Account')),
                            'Parent Account'.Number = "00001"
                        ),
                        Not(Name = "Overleveraging")
                    ),
                    "vsb_order",
                    SortOrder.Ascending
                )
            );
            ClearCollect(
                colCapexAccounts,
                Sort(
                    Filter(
                        'CAPEX Account Lists',
                        'Parent Account'.'CAPEX Account List' in Filter(
                            colCapexAccountCategories,
                            Not(IsBlank(ThisRecord.'CAPEX Account List'))
                        ).'CAPEX Account List'
                    ),
                    Order,
                    SortOrder.Ascending
                )
            );
            ClearCollect(
                colCapexSubaccounts,
                SortByColumns(
                    Filter(
                        AddColumns(
                            'CAPEX Account Lists' As Item,
                            AccountOrder,
                            LookUp(
                                colCapexAccounts,
                                'CAPEX Account List' = Item.'Parent Account'.'CAPEX Account List'
                            ).Order,
                            CategoryOrder,
                            LookUp(
                                colCapexAccounts,
                                'CAPEX Account List' = Item.'Parent Account'.'CAPEX Account List'
                            ).'Parent Account'.Order,
                            AggregatedName,
                            Item.'Parent Account'.Name & " / " & Item.Name & " " & Item.Number,
                            Category,
                            LookUp(
                                colCapexAccounts,
                                'CAPEX Account List' = Item.'Parent Account'.'CAPEX Account List',
                                'Parent Account'.'CAPEX Account List'
                            )
                        ),
                        'Parent Account'.'CAPEX Account List' in colCapexAccounts.'CAPEX Account List'
                    ),
                    "CategoryOrder",
                    SortOrder.Ascending,
                    "AccountOrder",
                    SortOrder.Ascending,
                    "vsb_order",
                    SortOrder.Ascending
                )
            ),
            ClearCollect(
                colSpvDevCoSubaccountsMapping,
                'SPVDevCo Mapping Capex Devexes'
            )
        );
        Select(btn_Filter_Devex_Capex_Assumptions)
    Children:
      - btn_Filter_Devex_Capex_Assumptions:
          Control: Button@0.0.45
          Properties:
            OnSelect: |-
              =ClearCollect(
                  colDevexCapexassumptions1,
                  Ungroup(
                      ForAll(
                          Filter(
                              colCapexAccountCategories As CT,
                              !IsBlank(
                                  LookUp(
                                      'Devex/Capex Standard Assumptions',
                                      And(
                                          Category.'CAPEX Account List' = CT.'CAPEX Account List',
                                          Country.Country = Coalesce(
                                              cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Country,
                                              First(col_cmpCountryPickerItems).Country
                                          ),
                                          Lower(Text(Technology)) = Lower(
                                              Coalesce(
                                                  cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                                  "Wind"
                                              )
                                          )
                                      )
                                  )
                              )
                          ) As Cat,
                          Table(
                              {
                                  Category: Cat,
                                  IsParent: true,
                                  IsFolded: If(
                                      IsBlank(locSelectedDevexCapexCategory),
                                      true,
                                      Cat.'CAPEX Account List' = locSelectedDevexCapexCategory.'CAPEX Account List',
                                      false,
                                      true
                                  )
                              },
                              SortByColumns(
                                  AddColumns(
                                      Filter(
                                          'Devex/Capex Standard Assumptions',
                                          And(
                                              Category.'CAPEX Account List' = Cat.'CAPEX Account List',
                                              Country.Country = Coalesce(
                                                  cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Country,
                                                  First(col_cmpCountryPickerItems).Country
                                              ),
                                              Lower(Text(Technology)) = Lower(
                                                  Coalesce(
                                                      cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                                      "Wind"
                                                  )
                                              )
                                          )
                                      ),
                                      CategoryOrder,
                                      Category.Order,
                                      AccountOrder,
                                      Subaccount.'Parent Account'.Order,
                                      SubaccountOrder,
                                      Subaccount.Order,
                                      IsFolded,
                                      If(
                                          IsBlank(locSelectedDevexCapexCategory),
                                          true,
                                          Category.'CAPEX Account List' = locSelectedDevexCapexCategory.'CAPEX Account List',
                                          false,
                                          true
                                      ),
                                      IsParent,
                                      false
                                  ),
                                  "CategoryOrder",
                                  SortOrder.Ascending,
                                  "AccountOrder",
                                  SortOrder.Ascending,
                                  "SubaccountOrder",
                                  SortOrder.Ascending
                              )
                          )
                      ),
                      Value
                  )
              )
            Visible: =false
            X: =252
            Y: =592
      - btn_AdminCost_DevexCapex_Delete_StandardCost_Confirm:
          Control: Button@0.0.45
          Properties:
            OnSelect: |
              =UpdateContext(
                  {
                      locSpinnerInformationText: "Please wait, deleting...",
                      locIsVisiblePopUpSpinner: true,
                      locIsVisibleDeleteConfirmation: false
                  }
              );
              IfError(
                  RemoveIf(
                      'Devex/Capex Standard Assumptions',
                      'Devex/Capex Standard Assumptions' = locSelectedStandardCost.'Devex/Capex Standard Assumptions'
                  );
                  If(
                      CountIf(
                          colDevexCapexassumptions1,
                          vsb_Category.'CAPEX Account List' = locSelectedStandardCost.Category.'CAPEX Account List'
                      ) = 1,
                      RemoveIf(
                          colDevexCapexassumptions1,
                          Category.vsb_capexaccountlistid = locSelectedStandardCost.Category.'CAPEX Account List'
                      );
                      RemoveIf(
                          colDevexCapexassumptions1 As Item,
                          Item.vsb_devexcapexstandardassumptionsid = locSelectedStandardCost.'Devex/Capex Standard Assumptions'
                      ),
                      RemoveIf(
                          colDevexCapexassumptions1 As Item,
                          Item.vsb_devexcapexstandardassumptionsid = locSelectedStandardCost.'Devex/Capex Standard Assumptions'
                      )
                  );
                  RemoveIf(
                      colDevexCapexassumptions1 As Item,
                      Item.vsb_devexcapexstandardassumptionsid = locSelectedStandardCost.'Devex/Capex Standard Assumptions'
                  ),
                  Notify($"Error : {FirstError.Message}, standard cost could not be deleted")
              );
              UpdateContext(
                  {
                      locSpinnerInformationText: "",
                      locIsVisiblePopUpSpinner: false,
                      locSelectedStandardCost: Blank(),
                      locSelectedCategory: Blank()
                  }
              );
              UpdateContext(
                  {
                      locIsVisibleApplyAndApplyAll: false,
                      locIsVisiblePopUpSpinner: true,
                      locSpinnerInformationText: "Applying standard contracts, syncing job in progress....."
                  }
              );
              UpdateContext(
                  {
                      locSelectedApplyAndApplyAllTracking: With(
                          {
                              locAction: If(
                                  IsBlank(locSelectedCategory),
                                  'Action? (Apply and Apply All Trackings)'.'Apply All',
                                  'Action? (Apply and Apply All Trackings)'.Apply
                              )
                          },
                          Patch(
                              'Apply and Apply All Trackings',
                              If(
                                  IsBlank(locSelectedApplyAndApplyAllTracking),
                                  Defaults('Apply and Apply All Trackings'),
                                  locSelectedApplyAndApplyAllTracking
                              ),
                              {
                                  Name: cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry.Name & " - " & cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue & " - " & Text(locAction),
                                  Country: cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry,
                                  Technology: Switch(
                                      cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                      "PV",
                                      Technology.PV,
                                      "Wind",
                                      Technology.Wind,
                                      "BESS",
                                      Technology.BESS,
                                      "Hydro",
                                      Technology.Hydro
                                  ),
                                  'Action?': locAction,
                                  'Applied By Email': User().Email,
                                  'Applied By Full Name': User().FullName,
                                  'Contract Type': locSelectedCategory
                              }
                          )
                      )
                  }
              );
              Concurrent(
                  ClearCollect(
                      colApplyAndApplyAllTracking,
                      'Apply and Apply All Trackings'
                  ),
                  UpdateContext({locSelectedApplyAndApplyAllTracking: Blank()})
              );
              /*
              UpdateContext(
                  {
                      locFabricSyncCostJob: Patch(
                          'Fabric Sync Jobs',
                          Defaults('Fabric Sync Jobs'),
                          {
                              Name: "",
                              'Cost Type': If(
                                  IsBlank(locSelectedCategory),
                                  "All",
                                  Switch(
                                      locSelectedCategory,
                                      'Contract Types'.Landlease,
                                      "952850000",
                                      'Contract Types'.'Opex O&M',
                                      "952850001",
                                      'Contract Types'.'Opex Other',
                                      "952850002",
                                      'Contract Types'.'DEVEX/CAPEX',
                                      "952850003"
                                  )
                              ),
                              'Job Type': LookUp(
                                  'Fabric Job Types',
                                  Name = "Apply Standard Assumption for Cost"
                              ),
                              'Job Status': 'Job States'.Dirty,
                              Country: cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedCountry,
                              Technology: Switch(
                                  cmp_Admin_Costs_Assumption_NestedCountryPickerColumn.SelectedNestedValue,
                                  "PV",
                                  Technology.PV,
                                  "Wind",
                                  Technology.Wind,
                                  "BESS",
                                  Technology.BESS,
                                  "Hydro",
                                  Technology.Hydro
                              )
                          }
                      )
                  }
              );

              SynchronizeStandardAssumptionCosts.Run(
                  locFabricSyncCostJob.'Cost Type',
                  locFabricSyncCostJob.Country.Country,
                  Int(locFabricSyncCostJob.Technology),
                  locFabricSyncCostJob.'Fabric Sync Job'
              );
              Notify(
                  $"Synchronization of {If(
                      IsBlank(locSelectedCategory),
                      "all cost categories",
                      Switch(
                          locSelectedCategory,
                          'Contract Types'.Landlease,
                          "Landlease costs",
                          'Contract Types'.'Opex O&M',
                          "O&M costs",
                          'Contract Types'.'Opex Other',
                          "other opex costs",
                          'Contract Types'.'DEVEX/CAPEX',
                          "DEVEX/CAPEX costs"
                      )
                  )} for {locFabricSyncCostJob.Country.Name} - {Text(locFabricSyncCostJob.Technology)} initiated."
              );*/
              UpdateContext(
                  {
                      locIsVisibleApplyAndApplyAll: false,
                      locSelectedCategory: Blank(),
                      locSelectedApplyAndApplyAllTracking: Blank()
                  }
              );
              UpdateContext(
                  {
                      locIsVisiblePopUpSpinner: false,
                      locSpinnerInformationText: " "
                  }
              );
            Text: ="Delete Standard Cost"
            Visible: =false
            X: =40
            Y: =40
