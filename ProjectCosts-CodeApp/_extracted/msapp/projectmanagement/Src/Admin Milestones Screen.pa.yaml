Screens:
  Admin Milestones Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext(
            {
                locIsVisibleChecklistRightPanel: false,
                locSelectedChecklistEntity: Blank(),
                locAdminLoadingDialog: false,
               // locAdminLoadingTitle: "",
                locAdminLoadingDialogText: Blank(),
                locIsVisibleMilestoneAssumptionsRightPanel: false
            }
        );
        ClearCollect(
            colMilestoneStandardAssumptions,
            With(
                {
                    varColCountries: AddColumns(
                        Countries,
                        Title,
                        Name,
                        Order,
                        Value(Key),
                        IsFolded,
                        true
                    )
                },
                SortByColumns(
                    varColCountries,
                    "Order",
                    SortOrder.Ascending
                )
            )
        )
    Children:
      - con_Admin_Milestones:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmp_Admin_Milestones_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: |-
                    =Table(
                        {
                            State: "Draft",
                            Color: "#41aab4"
                        },
                        {
                            State: "Approving",
                            Color: "#f5911e"
                        },
                        {
                            State: "Approved",
                            Color: "#82a51e"
                        },
                        {
                            State: "Rejected",
                            Color: "#d20532"
                        }
                    )
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: =Navigate('Project Main Screen',ScreenTransition.Fade)
                  Project: |-
                    ={
                        ID: GUID("00000000-0000-0000-0000-000000000000"),
                        Name: "Milestones",
                        Technology: Blank(),
                        Capacity: Blank(),
                        Status: Blank(),
                        Approval: Blank()
                    }
                  Width: =1024
            - con_Admin_Milestones_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ColorValue(gblAppTheme.palette.neutralLighter)
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
