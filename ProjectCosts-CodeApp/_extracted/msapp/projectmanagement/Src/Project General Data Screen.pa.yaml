Screens:
  Project General Data Screen:
    Properties:
      Fill: =gblAppColors.Screen.Fill
      LoadingSpinner: '=LoadingSpinner.Data '
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnHidden: |-
        =Select(btn_GeneralData_DisplayProject_Body_Buttons_Reset);
        Clear(colDataCardDeputyPMPreSelected);
        Clear(colDataCardPMPreSelected);
        UpdateContext({locTaxFactorPercentage: Blank()})
      OnVisible: |
        =Set(
            gblRecordSelectedProject,
            LookUp(
                Projects,
                ThisRecord.Project = gblRecordSelectedProject.Project
            )
        );
        Patch(
            colMapLocation,
            {ID: 1},
            {
                Latitude: Value(gblRecordSelectedProject.Latitude),
                Longitude: Value(gblRecordSelectedProject.Longitude)
            }
        );
        UpdateContext(
            {
                locRequiredfieldHeight: 56,
                locIsVisibleRightPanelNewEditShareholdingEntity: false,
                locIsVisibleRightPanelEditCheckList: false,
                locIsVisiblePopUpConfirmationDialog: false,
                // locIsVisiblePopUpConfirmationDialogDesc: Blank(),
                locIsGeneralFormDirty: false,
                locIShareholdingEntityFormDirty: false,
                // locUpdatedProjectManager: Blank(),
                // locSelectedProjectManager: Blank(),
        locChangedLatitude: Value(gblRecordSelectedProject.Latitude),
                locChangedLongitude: Value(gblRecordSelectedProject.Longitude),
                locChangedLatitude2: Value(gblRecordSelectedProject.Latitude),
                locChangedLongitude2: Value(gblRecordSelectedProject.Longitude),
                locSubTechnologyVisibility: If(
                    Not(IsBlank(gblRecordSelectedProject.Technology)) && Text(gblRecordSelectedProject.Technology) = "Hybrid",
                    true,
                    false
                ),
                //  locSelectedTechnology: Blank(),
                locShareholdingEntity: Blank(),
                locShareholdingEntities: false,
                //locSelectedCheckListEntity: Blank(),
                locNeedShareholdingEntitiesUpdate: false,
                locLongOperationProcessingDialog: false,
                locLeaveGeneralDataConfirmationDialog: false,
                locGeneralDataInformationDialog: false,
                locGeneralDataInformationDialogTitle: "",
                locGeneralDataInformationDialogText: "",
                locAllowStartRequestFlow: true,
                locErrorsGeneralDataToolTipVisibility: false,
                locRecalculationFormulaVisibility: false,
                locNeedPlantCostsRecalculation: false,
                locGeneralDataIsSavingDialogVisible: false,
                locGeneralDataSavingDialogText: Blank(),
                locIsVisibleRightPanelProjectState: false,
                locIsVisibleGDPerformRequestofGateApprovalDialog: false,
                locGDPerformRequestofGateApprovalDialogText: "",
                locTaxFactorPercentage: gblRecordSelectedProject.'Tax Factor [%]',
                locMunicipality: gblRecordSelectedProject.Municipality,
                //locMunicipalityFranceRecord : Filter('Assumptions Local Tax France SQL',Municipality = gblRecordSelectedProject.Municipality),
                locTempMunicipality: gblRecordSelectedProject.Municipality,locStartCluster:gblRecordSelectedProject.'Start Cluster'
            }
        );
        //Project Manager
        Collect(
            colDataCardPMPreSelected,
            Blank()
        );
        Collect(
            colDataCardProjectManagers,
            Blank()
        );
        // Deputy Project Manager
        Collect(
            colDataCardDeputyPMPreSelected,
            Blank()
        );
        Collect(
            colDataCardDeputyProjectManagers,
            Blank()
        );
        Collect(
            colTemProjectIds,
            Blank()
        );
        Collect(
            colProjectGenerators,
            FirstN(
                GeneratorTypeInProjects,
                0
            )
        );
        ClearCollect(
            colProcessingSteps,
            Blank()
        );
        ClearCollect(
            colDataCardDeputyPMPreSelected,
            FirstN(
                colDataCardPMPreSelected,
                0
            )
        );
        Concurrent(
            If(
                Not(IsBlank(gblRecordSelectedProject.'Project Manager')),
                ClearCollect(
                    colDataCardPMPreSelected,
                    AddColumns(
                        Office365Users.UserProfile(gblRecordSelectedProject.'Project Manager'.Id),
                        PersonaKey,
                        Id,
                        PersonaName,
                        DisplayName,
                        PersonaRole,
                        Mail
                    )
                )
            ),
            If(
                Not(IsBlank(gblRecordSelectedProject.'Deputy Project Manager')),
                ClearCollect(
                    colDataCardDeputyPMPreSelected,
                    AddColumns(
                        Office365Users.UserProfile(gblRecordSelectedProject.'Deputy Project Manager'.Id),
                        PersonaKey,
                        Id,
                        PersonaName,
                        DisplayName,
                        PersonaRole,
                        Mail
                    )
                )
            ),
            If(
                Not(
                    IsBlank(
                        LookUp(
                            colDistinctCurrentUserTeamsRoles,
                            ThisRecord.Name = gblTextControllingSecurityRoleName
                        )
                    )
                ),
                UpdateContext({locIsUserInControllingGroup: true});
                Trace(
                    $"Current user has'Controlling Security Roles'. locIsUserInControllingGroup --> {locIsUserInControllingGroup}",
                    TraceSeverity.Information
                ),
                Trace(
                    $"Current user has not 'Controlling Security Roles'. locIsUserInControllingGroup {locIsUserInControllingGroup}",
                    TraceSeverity.Information
                )
            ),
            If(
                Not(IsBlank(gblRecordSelectedProject)),
                ClearCollect(
                    colShareholdingEntities,
                    Filter(
                        ShareholderEntityInProjects,
                        ThisRecord.Project.Project = gblRecordSelectedProject.Project
                    )
                ),
                ClearCollect(
                    colShareholdingEntities,
                    Blank()
                )
            )
        );
        //ClearCollect(colShareholdingEntityTypes,Filter(Choice(shareholding)));
        UpdateContext(
            {
                locRecordCurrentProjectManager: gblRecordSelectedProject.'Project Manager',
                locTaxFactorPercentage: Coalesce(
                    gblRecordSelectedProject.'Tax Factor [%]',
                    Value(
                        LookUp(
                            colAssumptionsGermanyTaxSQL,
                            municipality = gblRecordSelectedProject.Municipality,
                            tradetaxrate
                        )
                    )
                )
            }
        );

        Select(btn_GeneralData_DisplayProject_Body_Buttons_Reset);
    Children:
      - fn_Numeric_With_Separtors_GD:
          Control: CanvasComponent
          ComponentName: fn_Numeric_With_Separtors
          Properties:
            Height: =0
            Width: =0
      - btn_General_CancelActiveDraftGateApprovalForStartClusterChange:
          Control: ModernButton@1.0.0
          Properties:
            AccessibleLabel: ="btn_CheckList_EnsureSkippedClusterStatesCompleted"
            OnSelect: |-
              =With(
                  {
                      varAutoSkippedComment: "Automatically completed because this project starts at a later cluster."
                  },
                  With(
                      {
                          varStatesWithClusterNo: AddColumns(
                              Filter(
                                  'Project States' As PS,
                                  PS.'Is Visible On Checklist' = true &&
                                  (
                                      PS.Name = "Draft" ||
                                      PS.Name = "Cluster 1" ||
                                      PS.Name = "Cluster 2" ||
                                      PS.Name = "Cluster 3" ||
                                      PS.Name = "Cluster 4" ||
                                      PS.Name = "Cluster 5" ||
                                      PS.Name = "Cluster 6"
                                  )
                              ) As PS,
                              ClusterNo,
                              Switch(
                                  PS.Name,
                                  "Draft", 0,
                                  "Cluster 1", 1,
                                  "Cluster 2", 2,
                                  "Cluster 3", 3,
                                  "Cluster 4", 4,
                                  "Cluster 5", 5,
                                  "Cluster 6", 6,
                                  999
                              )
                          )
                      },
                      With(
                          {
                              varDraftState: LookUp(
                                  varStatesWithClusterNo,
                                  Name = "Draft"
                              ),
                              varOldGateSourceState: LookUp(
                                  varStatesWithClusterNo,
                                  ClusterNo = If(
                                      locGeneralSaveOldStartClusterNo <= 1,
                                      0,
                                      locGeneralSaveOldStartClusterNo - 1
                                  )
                              ),
                              varOldDraftApprovalNextState: LookUp(
                                  varStatesWithClusterNo,
                                  ClusterNo = If(
                                      locGeneralSaveOldStartClusterNo = 0,
                                      1,
                                      locGeneralSaveOldStartClusterNo
                                  )
                              )
                          },
                          With(
                              {
                                  varDraftTracking: LookUp(
                                      'Project State Trackings',
                                      Project.Project = gblRecordSelectedProject.Project &&
                                      'Cluster State'.'Project State' = varDraftState.'Project State'
                                  ),
                                  varOldGateRecord: LookUp(
                                      'Project Default Approvals',
                                      Not(IsBlank('Cluster State')) &&
                                      'Cluster State'.'Project State' = varOldGateSourceState.'Project State'
                                  )
                              },

                              // =====================================================
                              // 1. If old Draft approval is still running, cancel it
                              // =====================================================
                              If(
                                  And(
                                      Not(IsBlank(varDraftTracking)),
                                      Not(IsBlank(varDraftTracking.FlowRunId)),
                                      varDraftTracking.'Approval Cluster State' = 'Approval Cluster States'.'In Progress'
                                  ),
                                  IfError(
                                      PerformRequestofGateApprovalCancellation.Run(
                                          gblProjectManagmentAppID,
                                          JSON(
                                              {
                                                  ProjectGuid: gblRecordSelectedProject.Project,
                                                  ProjectId: gblRecordSelectedProject.'Project ID',
                                                  ProjectName: gblRecordSelectedProject.'Project Name',
                                                  StateGuid: varDraftState.'Project State',
                                                  StateName: varDraftState.Name,
                                                  StateTrackingGuid: varDraftTracking.'Project State Tracking',
                                                  HasGate: Not(IsBlank(varOldGateRecord)),
                                                  GateSettingsGuid: varOldGateRecord.'Project Default Approvals',
                                                  PreviousClusterGuid: Blank(),
                                                  NextClusterGuid: varOldDraftApprovalNextState.'Project State',
                                                  PortfolioManager: Coalesce(
                                                      varOldGateRecord.'Portfolio Manager'.Mail,
                                                      ""
                                                  ),
                                                  FlowRunId: varDraftTracking.FlowRunId,
                                                  FlowApprovalId: varDraftTracking.FlowApprovalId
                                              }
                                          )
                                      ),
                                      false
                                  )
                              );

                              // =====================================================
                              // 2. Force Project Cluster State back to Draft
                              // =====================================================
                              Set(
                                  gblRecordSelectedProject,
                                  Patch(
                                      Projects,
                                      gblRecordSelectedProject,
                                      {
                                          'Cluster State': LookUp(
                                              'Project States',
                                              'Project State' = varDraftState.'Project State'
                                          ),
                                          'Besitzer (Unternehmenseinheit)': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                      }
                                  )
                              );

                              // =====================================================
                              // 3. Rebuild tracking rows based on NEW Start Cluster
                              //
                              // Draft          = In Progress
                              // Skipped rows   = Completed
                              // Start + later  = Not Started
                              // =====================================================
                              ForAll(
                                  varStatesWithClusterNo As StateRow,
                                  With(
                                      {
                                          varExistingTracking: LookUp(
                                              'Project State Trackings',
                                              Project.Project = gblRecordSelectedProject.Project &&
                                              'Cluster State'.'Project State' = StateRow.'Project State'
                                          ),
                                          varTargetApprovalState: If(
                                              StateRow.Name = "Draft",
                                              'Approval Cluster States'.'In Progress',
                                              If(
                                                  StateRow.ClusterNo > 0 &&
                                                  StateRow.ClusterNo < locGeneralSaveNewStartClusterNo,
                                                  'Approval Cluster States'.Completed,
                                                  'Approval Cluster States'.'Not Started'
                                              )
                                          ),
                                          varTargetComment: If(
                                              StateRow.ClusterNo > 0 &&
                                              StateRow.ClusterNo < locGeneralSaveNewStartClusterNo,
                                              varAutoSkippedComment,
                                              Blank()
                                          )
                                      },
                                      Patch(
                                          'Project State Trackings',
                                          Coalesce(
                                              varExistingTracking,
                                              Defaults('Project State Trackings')
                                          ),
                                          {
                                              Project: gblRecordSelectedProject,
                                              'Cluster State': LookUp(
                                                  'Project States',
                                                  'Project State' = StateRow.'Project State'
                                              ),
                                              'Approval Cluster State': varTargetApprovalState,
                                              'Cluster Step State': Blank(),
                                              'Approval Due Date': Blank(),
                                              FlowRunId: Blank(),
                                              FlowApprovalId: Blank(),
                                              'Approval Comment': varTargetComment,
                                              'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                          }
                                      )
                                  )
                              )
                          )
                      )
                  )
              )
            Text: ="btn_CheckList_EnsureSkippedClusterStatesCompleted"
            Visible: =false
            X: =60
            Y: =60
      - btn_GeneralData_Save_Actual:
          Control: ModernButton@1.0.0
          Properties:
            OnSelect: |
              =Trace($"SPV Company Code : {txt_GeneralData_DisplayProject_Body_General_Content_SPVCompanyCode.Text}");
              UpdateContext(
                  {
                      locGeneralDataIsSavingDialogVisible: true,
                      locGeneralDataSavingDialogText: $"The project is being saved, please wait..",
                      locNewProjectCreation: IsBlank(gblRecordSelectedProject.'Project ID')
                  }
              );
              // =====================================================
              // Capture old/new Start Cluster before saving project
              // IMPORTANT: Do not run cleanup here.
              // Cleanup must run only after project save succeeds.
              // =====================================================
              With(
                  {
                      varOldStartCluster: Coalesce(
                          gblRecordSelectedProject.'Start Cluster',
                          'Cluster States'.Greenfield
                      ),
                      varNewStartCluster: If(
                          drp_GeneralData_DisplayProject_Body_TechnologyTab_Content_ProjectDevelopment.Selected.Value = 'Development Type'.'Acquired Project',
                          drp_GeneralData_DisplayProject_Body_General_Content_ClusterChange.Selected.Value,
                          'Cluster States'.Greenfield
                      )
                  },
                  UpdateContext(
                      {
                          locGeneralSaveOldStartClusterNo: Switch(
                              varOldStartCluster,
                              'Cluster States'.Greenfield,
                              0,
                              'Cluster States'.'Cluster 1',
                              1,
                              'Cluster States'.'Cluster 2',
                              2,
                              'Cluster States'.'Cluster 3',
                              3,
                              'Cluster States'.'Cluster 4',
                              4,
                              'Cluster States'.'Cluster 5',
                              5,
                              'Cluster States'.'Cluster 6',
                              6,
                              0
                          ),
                          locGeneralSaveNewStartClusterNo: Switch(
                              varNewStartCluster,
                              'Cluster States'.Greenfield,
                              0,
                              'Cluster States'.'Cluster 1',
                              1,
                              'Cluster States'.'Cluster 2',
                              2,
                              'Cluster States'.'Cluster 3',
                              3,
                              'Cluster States'.'Cluster 4',
                              4,
                              'Cluster States'.'Cluster 5',
                              5,
                              'Cluster States'.'Cluster 6',
                              6,
                              0
                          ),
                          locGeneralSaveStartClusterChanged: Switch(
                              varOldStartCluster,
                              'Cluster States'.Greenfield,
                              0,
                              'Cluster States'.'Cluster 1',
                              1,
                              'Cluster States'.'Cluster 2',
                              2,
                              'Cluster States'.'Cluster 3',
                              3,
                              'Cluster States'.'Cluster 4',
                              4,
                              'Cluster States'.'Cluster 5',
                              5,
                              'Cluster States'.'Cluster 6',
                              6,
                              0
                          ) <> Switch(
                              varNewStartCluster,
                              'Cluster States'.Greenfield,
                              0,
                              'Cluster States'.'Cluster 1',
                              1,
                              'Cluster States'.'Cluster 2',
                              2,
                              'Cluster States'.'Cluster 3',
                              3,
                              'Cluster States'.'Cluster 4',
                              4,
                              'Cluster States'.'Cluster 5',
                              5,
                              'Cluster States'.'Cluster 6',
                              6,
                              0
                          )
                      }
                  )
              );
              ClearCollect(
                  colProcessingSteps,
                  Blank()
              );
              Trace($"SPV Company Code : {Value(txt_GeneralData_DisplayProject_Body_General_Content_SPVCompanyCode.Text)}");
              IfError(
                  Set(
                      gblRecordSelectedProject,
                      Patch(
                          Projects,
                          If(
                              IsBlank(gblRecordSelectedProject),
                              Defaults(Projects),
                              gblRecordSelectedProject
                          ),
                          {
                              'Project Name': txt_GeneralData_DisplayProject_Body_General_Content_ProjectName.Text,
                              'Project Manager': LookUp(
                                  'Microsoft Entra IDs',
                                  Or(
                                      IsBlank(First(pcf_GeneralData_DisplayProject_Body_General_Content_Manager_PeoplePicker.SelectedPeople)),
                                      ThisRecord.'A unique identifer for Microsoft Entra ID' = GUID(First(pcf_GeneralData_DisplayProject_Body_General_Content_Manager_PeoplePicker.SelectedPeople).PersonaKey)
                                  )
                              ),
                              'Deputy Project Manager': If(
                                  Not(IsBlank(First(pcf_GeneralData_DisplayProject_Body_General_Content_Deputy_Manager_PeoplePicker.SelectedPeople))),
                                  LookUp(
                                      'Microsoft Entra IDs',
                                      ThisRecord.'A unique identifer for Microsoft Entra ID' = GUID(First(pcf_GeneralData_DisplayProject_Body_General_Content_Deputy_Manager_PeoplePicker.SelectedPeople).PersonaKey)
                                  ),
                                  Blank()
                              ),
                              'SPV Name': txt_GeneralData_DisplayProject_Body_General_Content_SPVName.Text,
                              'Short Name': txt_GeneralData_DisplayProject_Body_General_Content_ShortName.Text,
                              'Project Type': drp_GeneralData_DisplayProject_Body_General_Content_ProjectType.Selected.Value,
                              Country: Coalesce(
                                  drp_GeneralData_DisplayProject_Body_General_Content_Country.Selected,
                                  gblRecordSelectedProject.Country
                              ),
                              'Area/State/Province': Coalesce(
                                  drp_GeneralData_DisplayProject_Body_General_Content_Area.Selected,
                                  gblRecordSelectedProject.'Area/State/Province'
                              ),
                              District: txt_GeneralData_DisplayProject_Body_General_Content_District.Text,
                              Municipality: If(
                                  drp_GeneralData_DisplayProject_Body_General_Content_Country.Selected.Name = "Germany",
                                  cmb_GeneralData_DisplayProject_Body_General_Content_Municipality_Germany.Selected.municipality,
                                  drp_GeneralData_DisplayProject_Body_General_Content_Country.Selected.Name = "France",
                                  cmb_GeneralData_DisplayProject_Body_General_Content_Municipality_France_1.Selected.Municipality,
                                  txt_GeneralData_DisplayProject_Body_General_Content_Municipality.Text
                              ),
                              Utilization: LookUp(
                                  'Custom Choice Values',
                                  'Custom Choice Value' = drp_GeneralData_DisplayProject_Body_General_Content_TerrainUt.Selected.vsb_customchoicevalueid
                              ),
                              'Terrain Size': Value(txt_GeneralData_DisplayProject_Body_General_Content_TerrainSize.Text),
                              Latitude: Value(txt_GeneralData_DisplayProject_Body_General_Content_Latitude.Text),
                              Longitude: Value(txt_GeneralData_DisplayProject_Body_General_Content_Longitude.Text),
                              Technology: drp_GeneralData_DisplayProject_Body_TechnologyTab_Content_Technology.Selected.Value,
                              'Approval States': If(
                                  IsBlank(gblRecordSelectedProject.'Approval States'),
                                  'Approval States'.Draft,
                                  gblRecordSelectedProject.'Approval States'
                              ),
                              'SPV Company Code': If(
                                  Len(txt_GeneralData_DisplayProject_Body_General_Content_SPVName.Text) = 0,
                                  Blank(),
                                  Value(txt_GeneralData_DisplayProject_Body_General_Content_SPVCompanyCode.Text)
                              ),
                              'SPV Legal Structure': If(
                                  And(drp_GeneralData_DisplayProject_Body_General_Content_Country.Selected.Name = "Germany"),
                                  drp_GeneralData_DisplayProject_Body_General_Content_SPVLegalStructure.Selected.Value,
                                  Blank()
                              ),
                              'Cluster State': Coalesce(
                                  gblRecordSelectedProject.'Cluster State',
                                  LookUp(
                                      'Project States',
                                      Name = "Draft"
                                  )
                              ),
                              'Tax Factor [%]': Value(txt_GeneralData_DisplayProject_Body_General_Content_Tax_Factor.Text),
                              'Besitzer (Unternehmenseinheit)': Coalesce(
                                  drp_GeneralData_DisplayProject_Body_General_Content_Country.Selected.'Besitzer (Unternehmenseinheit)',
                                  gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                              ),
                              'Share of Farmdown': Coalesce(
                                  gblRecordSelectedProject.'Share of Farmdown',
                                  50
                              ),
                              'Is Standard Share of Farmdown?': Coalesce(
                                  gblRecordSelectedProject.'Is Standard Share of Farmdown?',
                                  'Is Standard Share of Farmdown? (Projects)'.Yes
                              ),
                              'Standard Cost Created': Coalesce(
                                  gblRecordSelectedProject.'Standard Cost Created',
                                  'Standard Cost Created (Projects)'.No
                              ),
                              'Development Type': drp_GeneralData_DisplayProject_Body_TechnologyTab_Content_ProjectDevelopment.Selected.Value,
                              'Start Cluster': If(
                                  drp_GeneralData_DisplayProject_Body_TechnologyTab_Content_ProjectDevelopment.Selected.Value = 'Development Type'.'Acquired Project',
                                  drp_GeneralData_DisplayProject_Body_General_Content_ClusterChange.Selected.Value,
                                  'Cluster States'.Greenfield
                              ),
                              'Acquisition date': If(
                                  drp_GeneralData_DisplayProject_Body_TechnologyTab_Content_ProjectDevelopment.Selected.Value = 'Development Type'.'Acquired Project',
                                  dte_GeneralData_DisplayProject_Body_General_Content_Acquisition_Date.SelectedDate,
                                  Blank()
                              ),
                              'Acquisition Price': If(
                                  drp_GeneralData_DisplayProject_Body_TechnologyTab_Content_ProjectDevelopment.Selected.Value = 'Development Type'.'Acquired Project',
                                  fn_Numeric_With_Separtors_GD.toNumber(txt_GeneralData_DisplayProject_Body_TechnologyTab_Content_AcquisitionPrice.Text),
                                  Blank()
                              )
                          }
                      )
                  );
                  Collect(
                      colProcessingSteps,
                      "Project data was saved/updated successfully."
                  );
                  Set(
                      gblRecordSelectedProject,
                      LookUp(
                          Projects,
                          ThisRecord.Project = gblRecordSelectedProject.Project
                      )
                  );
                  Set(
                      gblRecordSelectedProject,
                      Patch(
                          Projects,
                          gblRecordSelectedProject,
                          {
                              'Internal Project ID': If(
                                  IsBlank(gblRecordSelectedProject.'Internal Project ID'),
                                  gblRecordSelectedProject.'Project ID',
                                  gblRecordSelectedProject.'Internal Project ID'
                              ),
                              'Besitzer (Unternehmenseinheit)': Coalesce(
                                  drp_GeneralData_DisplayProject_Body_General_Content_Country.Selected.'Business Unit',
                                  gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                              )
                          }
                      )
                  );
                  // =====================================================
                  // Start Cluster changed:
                  // clean/rebuild approval tracking only AFTER project save
                  // =====================================================
                  If(
                      locGeneralSaveStartClusterChanged,
                      Select(btn_General_CancelActiveDraftGateApprovalForStartClusterChange);
                      Set(
                          gblRecordSelectedProject,
                          LookUp(
                              Projects,
                              ThisRecord.Project = gblRecordSelectedProject.Project
                          )
                      );
                      Collect(
                          colProcessingSteps,
                          "Project start cluster tracking was refreshed successfully."
                      )
                  );
                  Set(
                      gblCurrentUser,
                      Patch(
                          gblCurrentUser,
                          {
                              CanEditSelectedProject: And(
                                  DataSourceInfo(
                                      Projects,
                                      DataSourceInfo.CreatePermission
                                  ),
                                  Coalesce(
                                      RecordInfo(
                                          gblRecordSelectedProject,
                                          RecordInfo.EditPermission
                                      ),
                                      false
                                  )
                              )
                          }
                      )
                  );
                  Set(
                      gblRecordSelectedProjectCountry,
                      LookUp(
                          Countries,
                          Country = gblRecordSelectedProject.Country.Country
                      )
                  );
                  If(
                      locNeedShareholdingEntitiesUpdate,
                      ClearCollect(
                          colShareholdingEntities,
                          ForAll(
                              colShareholdingEntities As Updated,
                              Patch(
                                  ShareholderEntityInProjects,
                                  If(
                                      IsBlank(
                                          LookUp(
                                              ShareholderEntityInProjects,
                                              'Shareholder Entitiy' = Updated.'Shareholder Entitiy'
                                          )
                                      ),
                                      Defaults(ShareholderEntityInProjects),
                                      LookUp(
                                          ShareholderEntityInProjects,
                                          'Shareholder Entitiy' = Updated.'Shareholder Entitiy'
                                      )
                                  ),
                                  {
                                      'Shareholder Entitiy Type': Updated.'Shareholder Entitiy Type',
                                      Project: gblRecordSelectedProject,
                                      'Custom Name': Updated.'Custom Name',
                                      'Ownership [%]': Updated.'Ownership [%]',
                                      'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                  }
                              )
                          )
                      );
                      Collect(
                          colProcessingSteps,
                          "Project Shareholder Entitiy was saved/updated successfully."
                      )
                  );
                  If(
                      locNeedPlantCostsRecalculation,
                      ClearCollect(
                          colProjectGeneratorsUpdated,
                          Patch(
                              GeneratorTypeInProjects,
                              colProjectGenerators
                          )
                      );
                      Set(
                          gblRecordSelectedProject,
                          Patch(
                              Projects,
                              gblRecordSelectedProject,
                              {
                                  'Plant WTG Cost [EUR]': Sum(
                                      colProjectGenerators,
                                      'Generators Cost'
                                  )
                              }
                          )
                      );
                      Collect(
                          colProcessingSteps,
                          $"Plant WTG Cost (WTG's: {CountIf(
                              colProjectGeneratorsUpdated,
                              true
                          )}), was recalculated and updated successfully."
                      )
                  );
                  // =====================================================
                  // Ensure Draft tracking exists.
                  // For new/normal projects, Draft starts as In Progress.
                  // If cleanup already created it, this block will not overwrite it.
                  // =====================================================
                  With(
                      {
                          varSelectedItemProjectStateId: LookUp(
                              'Project States',
                              ThisRecord.Name = "Draft"
                          ).'Project State'
                      },
                      If(
                          IsBlank(
                              LookUp(
                                  'Project State Trackings',
                                  And(
                                      Project.Project = gblRecordSelectedProject.Project,
                                      'Cluster State'.'Project State' = varSelectedItemProjectStateId
                                  )
                              )
                          ),
                          UpdateContext(
                              {
                                  locRecordDefaultStateTracking: Patch(
                                      'Project State Trackings',
                                      Defaults('Project State Trackings'),
                                      {
                                          Project: LookUp(
                                              Projects,
                                              ThisRecord.Project = gblRecordSelectedProject.Project
                                          ),
                                          'Cluster State': LookUp(
                                              'Project States',
                                              ThisRecord.'Project State' = varSelectedItemProjectStateId
                                          ),
                                          'Approval Comment': Blank(),
                                          'Approval Due Date': Blank(),
                                          'Approval Cluster State': 'Approval Cluster States'.'In Progress',
                                          'Owning Business Unit': gblRecordSelectedProject.'Besitzer (Unternehmenseinheit)'
                                      }
                                  )
                              }
                          )
                      )
                  );
                  Notify(
                      Concat(
                          colProcessingSteps,
                          $"{Value} {Char(10)}"
                      ),
                      NotificationType.Success,
                      gblAppConstants.DefNotifyTimeoutMilliseconds
                  ),
                  Notify(
                      "Error: Project could not be saved. " & "Internal error: originated on " & FirstError.Source & ". Message: " & FirstError.Message & FirstError.Details.HttpResponse,
                      NotificationType.Error
                  )
              );
              Clear(colTemProjectIds);
              Refresh(ShareholderEntityInProjects);
              ClearCollect(
                  colShareholdingEntities,
                  Filter(
                      ShareholderEntityInProjects,
                      ThisRecord.Project.Project = gblRecordSelectedProject.Project
                  )
              );
              Set(
                  gblProjectHeaderData,
                  {
                      ID: gblRecordSelectedProject.Project,
                      Name: gblRecordSelectedProject.'Project Name',
                      Technology: Text(gblRecordSelectedProject.Technology),
                      Capacity: gblRecordSelectedProject.'Plant WTG Capacity [MW]',
                      Status: Text(gblRecordSelectedProject.'Cluster State'.Name),
                      Approval: Text(gblRecordSelectedProject.'Approval States')
                  }
              );
              Patch(
                  colMapLocation,
                  {ID: 1},
                  {
                      Latitude: gblRecordSelectedProject.Latitude,
                      Longitude: gblRecordSelectedProject.Longitude
                  }
              );
              UpdateContext(
                  {
                      locChangedLatitude: gblRecordSelectedProject.Latitude,
                      locChangedLongitude: gblRecordSelectedProject.Longitude,
                      locChangedLatitude2: gblRecordSelectedProject.Latitude,
                      locChangedLongitude2: gblRecordSelectedProject.Longitude,
                      locNeedShareholdingEntitiesUpdate: false,
