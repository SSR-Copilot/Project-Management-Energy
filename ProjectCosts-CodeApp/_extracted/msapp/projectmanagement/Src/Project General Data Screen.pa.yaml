                                                                        locIsClusterChangeFormDirty: false,
                                                                        locIsVisibleRightPanelClusterChange: true
                                                                    }
                                                                );
                                                                Select(btn_cluster_change_reset_control)
                                                            )
                                                        )
                                                    )
                                                )
                                            )
