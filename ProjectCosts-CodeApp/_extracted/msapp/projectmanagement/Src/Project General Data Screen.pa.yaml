                                  Control: Text@0.0.51
                                  Properties:
                                    AutoHeight: =true
                                    Height: =22
                                    Text: =LookUp(colClusterStatesDataTable,Order=6).'Cluster Description'
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    Width: =Parent.Width-Self.X*2
                                    X: =20
                                    Y: =3
                              - but_Milestones_DisplayProject_Body_General_Content_Cluster6_1:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="but_Milestones_DisplayProject_Body_General_Content_Cluster6"
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    DisplayMode: =If(Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate)), DisplayMode.Edit,DisplayMode.Disabled)
                                    FontColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                    Icon: ="CalendarAdd"
                                    Layout: ='ButtonCanvas.Layout'.IconOnly
                                    OnSelect: |-
                                      =With(
                                          {
                                              varRecalculatedDate: fn_Common_Milestones.DateAddMonths(
                                                  dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate,
                                                  First(
                                                      Filter(
                                                          colMilestonesAssumptions,
                                                          And(
                                                              Name = gblAppConstants.MilestonesAssumptions.AverageDurationMonths,
                                                              Country.Country = gblRecordSelectedProject.Country.Country,
                                                              Technology = gblRecordSelectedProject.Technology
                                                          )
                                                      )
                                                  ).'Cluster 5'
                                              )
                                          },
                                          Reset(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1);
                                          UpdateContext({locClusterChangeCluster6Date: varRecalculatedDate})
                                      );
                                      UpdateIf(
                                          colMilestonesFormValidation,
                                          Name = "OperationsStartDate",
                                          {
                                              Valid: And(
                                                  Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate)),
                                                  dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate > dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate
                                              ),
                                              Dirty: true
                                          }
                                      );
                                      UpdateContext({locCluster6DateStandardAssumption: true})
                                    Visible: |-
                                      =And(locClusterChangeIsDownward ,
                                      dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.DisplayMode = DisplayMode.Edit ,
                                      Or(
                                          gblRecordSelectedProject.Technology = gblAppConstants.Texnology.Wind,
                                          gblRecordSelectedProject.Technology = gblAppConstants.Texnology.PV
                                      ))
                                    Width: |-
                                      =If(
                                          Or(
                                              gblRecordSelectedProject.Technology = gblAppConstants.Texnology.Wind,
                                              gblRecordSelectedProject.Technology = gblAppConstants.Texnology.PV
                                          ),
                                          32,
                                          0
                                      )
                                    X: =dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.X+dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.Width + 4
                                    Y: =lbl_Milestones_DisplayProject_Body_General_Content_StartDate.Height + 3
                              - dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1:
                                  Control: ModernDatePicker@1.0.1
                                  Properties:
                                    AccessibleLabel: ="dtp_Milestones_DisplayProject_Body_General_Content_Cluster6"
                                    BorderStyle: =""
                                    Color: =If(locCluster6DateStandardAssumption,ColorValue(gblAppTheme.palette.themePrimary))
                                    DefaultDate: |-
                                      =//If(IsBlank(gblRecordSelectedProject.'Operations start date (COD)'),locProjectCluster6Date,gblRecordSelectedProject.'Operations start date (COD)')

                                      locClusterChangeCluster6Date
                                    DisplayMode: =DisplayMode.Disabled
                                    Font: =""
                                    FontWeight: =""
                                    IsEditable: =true
                                    Italic: =locCluster6DateStandardAssumption
                                    Placeholder: ="Select a date..."
                                    Size: =0
                                    StartOfWeek: =StartOfWeek.Monday
                                    Width: =Parent.Width-Self.X*2-but_Milestones_DisplayProject_Body_General_Content_Cluster6_1.Width
                                    X: =lbl_Milestones_DisplayProject_Body_General_Content_Cluster6_1.X
                                    Y: =lbl_Milestones_DisplayProject_Body_General_Content_Cluster6_1.Height + 3
                              - lbl_Milestones_DisplayProject_Body_General_Content_Cluster6_ErrorMessage_1:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =gblAppColors.Error
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    Font: =Font.'Segoe UI'
                                    Height: =16
                                    Size: =9
                                    Text: |-
                                      =If(
                                          IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate),
                                          "Cluster 6 date cannot be blank.",

                                          And(
                                              Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate)),
                                              dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate <=
                                                  dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate
                                          ),
                                          "Cluster 6 must be later than Cluster 5."
                                      )
                                    Visible: |-
                                      =locClusterChangeIsDownward &&
                                      con_Milestones_DisplayProject_Body_General_Content_Cluster6_1.Visible &&
                                      Or(
                                          And(
                                              dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.DisplayMode = DisplayMode.Edit,
                                              IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate)
                                          ),

                                          And(
                                              Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate)),
                                              Not(IsBlank(dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate)),
                                              dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.SelectedDate <=
                                                  dtp_Milestones_DisplayProject_Body_General_Content_Cluster5_1.SelectedDate
                                          )
                                      )
                                    Width: =Parent.Width-Self.X*2
                                    Wrap: =false
                                    X: =lbl_Milestones_DisplayProject_Body_General_Content_Cluster6_1.X
                                    Y: =dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.X + dtp_Milestones_DisplayProject_Body_General_Content_Cluster6_1.Height + 3
