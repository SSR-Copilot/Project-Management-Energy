      - cmp_PopUp_Leave_GeneralData_Confirmation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Yes"
            Description: =$"You have unsaved data. Do you really want to leave current form without saving?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =UpdateContext({locLeaveGeneralDataConfirmationDialog: false});
            OnConfirm: |-
              =UpdateContext({locLeaveGeneralDataConfirmationDialog: false});
              Trace(
                  $"Selected {cmp_GeneralData_Left_Navigation.SelectedKey}<>{gblLeftNavigationSelected.ItemKey}={cmp_GeneralData_Left_Navigation.SelectedKey <> gblLeftNavigationSelected.ItemKey}",
                  TraceSeverity.Information
              );
              If(
                  cmp_GeneralData_Left_Navigation.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                  Set(
                      gblLeftNavigationSelected,
                      LookUp(
                          LeftNavigationMenu,
                          ItemKey = cmp_GeneralData_Left_Navigation.SelectedKey
                      )
                  );
                  Navigate(gblLeftNavigationSelected.TargetScreen),
                  Navigate(
                      'Project Main Screen',
                      ScreenTransition.Fade
                  )
              )
            Title: ="Unsaved data"
            Visible: =locLeaveGeneralDataConfirmationDialog
            Width: =Parent.Width
