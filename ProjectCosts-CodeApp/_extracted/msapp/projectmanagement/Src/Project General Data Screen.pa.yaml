            Width: =Parent.Width
      - cmp_GeneralData_PopUp_ConfirmationDeleteShareholdingEntity:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: =$"Are you sure that you want to delete '{If(Not(IsBlank(locShareholdingEntity.Name)),Text(locShareholdingEntity.'Shareholder Entitiy Type'),locShareholdingEntity.'Custom Name')}'?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="Trash"
            OnCancel: |
              =UpdateContext({locIsVisiblePopUpConfirmationDialog: false});
            OnConfirm: "=If(\n    Not(IsBlank(locShareholdingEntity)),\n    IfError(\n        Remove(\n            colShareholdingEntities,\n            locShareholdingEntity\n        );\n        If(\n            Not(IsBlank(locShareholdingEntity.Name)),\n            Remove(\n                ShareholderEntityInProjects,\n                LookUp(\n                    ShareholderEntityInProjects,\n                    Name = locShareholdingEntity.Name\n                )\n            )\n        );\n        Notify(\n            \"Shareholding Entities was successfully deleted.\",\n            NotificationType.Success,\n            500\n        ),\n        Notify(\n            \"Error: Shareholding Entities could not be deleted. \" & \"Internal error: originated on \" & FirstError.Source & \". Message: \" & FirstError.Message & FirstError.Details.HttpResponse,\n            NotificationType.Error\n        )\n    );\n    \n);\nUpdateContext(\n    {\n        locShareholdingEntity: Blank(),\n        locShareholdingEntitiesOwnershipSum: Sum(\n            colShareholdingEntities,\n            'Ownership [%]'\n        ),\n        locIsVisiblePopUpConfirmationDialog: false,\n        locIsGeneralFormDirty: true\n    }\n);\n"
            Title: ="Delete Shareholding Entity?"
            Visible: =locIsVisiblePopUpConfirmationDialog
            Width: =Parent.Width
      - cmp_PopUp_Loading_General_Screen:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Loading
          Properties:
            Height: =Parent.Height
            InformationText: ="Test"
            Visible: =locLongOperationProcessingDialog
            Width: =Parent.Width
      - cmp_GeneralData_Map_PopUp_ConfirmationChangeLocation:
          Control: CanvasComponent
          ComponentName: cmp_PopUp_Confirmation
          Properties:
            CancelButtonText: ="Cancel"
            ConfirmButtonText: ="Confirm"
            Description: ="Are you sure that you want to change the project location?"
            Height: =Parent.Height
            IconLeftButton: ="Cancel"
            IconRightButton: ="CheckMark"
            OnCancel: |-
              =
                  UpdateContext({locLocationChanged: false})
            OnConfirm: |
              =Trace(
                  $"OnConfirm: Latitude:=> {map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Latitude}, Longitude:=> {map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Longitude}",
                  TraceSeverity.Information
              );
              If(
                  Or(
                      locChangedLatitude <> map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Latitude,
                      locChangedLongitude <> map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Longitude
                  ),
                  UpdateContext(
                      {
                          locChangedLatitude: map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Latitude,
                          locChangedLongitude: map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Longitude,
                          locChangedLatitude2: map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Latitude,
                          locChangedLongitude2: map_con_GeneralData_DisplayProject_Body_General_Content_Map.ClickedLocation.Longitude
                      }
                  );
                  Patch(
                      colMapLocation,
                      {ID: 1},
                      {
                          Latitude: locChangedLatitude,
                          Longitude: locChangedLongitude
                      }
                  )
              );
              UpdateContext(
                  {
                      locLocationChanged: false,
                      locIsGeneralFormDirty: true
                  }
              );
            Title: ="Project Location Confirmation"
            Visible: =locLocationChanged
            Width: =Parent.Width
