                            Properties:
                              AlignInContainer: =AlignInContainer.Start
                              BorderColor: =RGBA(245, 245, 245, 1)
                              DelayItemLoading: =false
                              Height: =Parent.Height
                              Items: |-
                                =With(
                                    {
                                        varColSortedApprovals: AddColumns(
                                            DropColumns(
                                                Filter(
                                                    AddColumns(
                                                        'Project Default Approvals',
                                                        TechText,
                                                        Text(Technology)
                                                    ),
                                                    'Approvals Country'.Country = cmp_Admin_ProjectGates_NestedCountryTechnologyPicker.SelectedCountry.Country,
                                                    //IsBlank(cmp_NestedCountryPickerColumn_1.SelectedNestedValue) || 
                                                    TechText = cmp_Admin_ProjectGates_NestedCountryTechnologyPicker.SelectedNestedValue
                                                ),
                                                TechText
                                            ),
                                            Order,
                                            'Cluster State'.Order,
                                            Id,
                                            'Project Default Approvals'
                                        ),
                                        varAllGates: Filter(
                                            'Project States',
                                            'Is Visible On Checklist',
                                            Order < 6
                                        )
                                    },
