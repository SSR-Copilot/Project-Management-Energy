Screens:
  Admin Project Gates Approvals Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |-
        =UpdateContext(
            {
                locIsVisibleApprovalsRightPanel: false,
                locSelectedApprovalsEntity: Blank(),
                locAdminLoadingDialog: false,
               // locAdminLoadingTitle: "",
                locAdminLoadingDialogText: Blank()
            }
        );
        ClearCollect(
            colApprovals1,
            RenameColumns(
                FirstN(
                    Users,
                    0
                ),
                'Azure AD Object ID',
                Id,
                'Full Name',
                DisplayName,
                'Primary Email',
                Mail
            )
        );
        ClearCollect(
            colApprovals1PreSelected,
            colApprovals1
        );
        ClearCollect(
            colApprovals2,
            colApprovals1
        );
        ClearCollect(
            colApprovals2PreSelected,
            colApprovals2
        );
        ClearCollect(
            colApprovals3,
            colApprovals1
        );
        ClearCollect(
            colApprovals3PreSelected,
            colApprovals3
        );
        ClearCollect(
            colApprovals4,
            colApprovals1
        );
        ClearCollect(
            colApprovals4PreSelected,
            colApprovals4
        );

        ClearCollect(
            col_cmpCountryPickerItems,
            Sort(
                AddColumns(
                    Countries,
                    'Flag Image',
                    Switch(
                        Name,
                        "Germany",
                        'germany-flag-png-large',
                        "Croatia",
                        'croatia-flag-png-large',
                        "France",
                        'france-flag-png-large',
                        "Greece",
                        'greece-flag-png-large',
                        "Finland",
                        'finland-flag-png-large',
                        "Spain",
                        'spain-flag-png-large',
                        "Italy",
                        'italy-flag-png-large',
                        "Poland",
                        'poland-flag-png-large',
                        "Romania",
                        'romania-flag-png-large'
                    ),
                    Order,
                    Switch(
                        Name,
                        "Germany",
                        1,
                        "Croatia",
                        6,
                        "France",
                        2,
                        "Greece",
                        8,
                        "Finland",
                        5,
                        "Spain",
                        7,
                        "Italy",
                        4,
                        "Poland",
                        3,
                        "Romania",
                        9
                    ),
                    Expanded,
                    false
                ),
                ThisRecord.Order
            )
        );

        ClearCollect(
            col_CollapsedApprovalGates,
            FirstN( 
                AddColumns(
                    'Project Default Approvals',
                    Order,0,
                    Id, GUID()
                ),
                0
            )
        )
    Children:
      - con_Admin_ProjectGates_Approvals:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmp_Admin_ProjectGatest_Approvals_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: |-
                    =Table(
                        {
                            State: "Draft",
                            Color: "#41aab4"
                        },
                        {
                            State: "Approving",
                            Color: "#f5911e"
                        },
                        {
                            State: "Approved",
                            Color: "#82a51e"
                        },
                        {
                            State: "Rejected",
                            Color: "#d20532"
                        }
                    )
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: =Navigate('Project Main Screen',ScreenTransition.Fade)
                  Project: |-
                    ={
                        ID: GUID("00000000-0000-0000-0000-000000000000"),
                        Name: "Project Gates",
                        Technology: Blank(),
                        Capacity: Blank(),
                        Status: Blank(),
                        Approval: Blank()
                    }
                  Width: =1024
            - con_Admin_ProjectGatest_Approvals_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =ColorValue(gblAppTheme.palette.neutralLighter)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - con_Admin_ProjectGatest_Approvals_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.SetByContainer
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
