                                    Theme: =gblAppThemeJson
                                    Tooltip: ="User"
                                    Width: =con_cmp_In_Header_UserImage.X - con_cmp_In_Header_UserName.X
                                    X: =15
                                    Y: =6
                        - con_cmp_In_Header_UserImage:
