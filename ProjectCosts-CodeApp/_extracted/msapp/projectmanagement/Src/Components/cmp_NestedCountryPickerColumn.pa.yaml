ComponentDefinitions:
  cmp_NestedCountryPickerColumn:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Countries:
        PropertyKind: Input
        DisplayName: Countries
        Description: A custom property
        RaiseOnReset: true
        DataType: Table
        Default: |-
          =Filter(
              col_cmpCountryPickerItems,
              !(Name in [
                  "Spain",
                  "Greece",
                  "Romania"
              ])
          )
      Nestings:
        PropertyKind: Input
        DisplayName: Nestings
        Description: A custom property
        RaiseOnReset: true
        DataType: Table
        Default: |-
          =// Use the Record Schema with Country: Countryname and Childs as string array (PowerFx converts it to {Value:String} objects).
          // For Childs Filter for SingleColumn (Text) Table based on your needs or alter manually. 

          [
              {
                  Country: "Germany",
                  Childs: [
                      {
                          Order: 1,
                          Value: "Wind"
                      },
                      {
                          Order: 2,
                          Value: "PV"
                      }
                  ]
              },
              {
                  Country: "France",
                  Childs: [
                      {
                          Order: 1,
                          Value: "Wind"
                      },
                      {
                          Order: 2,
                          Value: "PV"
                      }
                  ]
              },
              {
                  Country: "Poland",
                  Childs: [
                      {
                          Order: 1,
                          Value: "Wind"
                      },
                      {
                          Order: 2,
                          Value: "PV"
                      }
                  ]
              },
              {
                  Country: "Italy",
                  Childs: [
                      {
                          Order: 1,
                          Value: "Wind"
                      },
                      {
                          Order: 2,
                          Value: "PV"
                      }
                  ]
              },
              {
                  Country: "Finland",
                  Childs: [
                      {
                          Order: 1,
                          Value: "Wind"
                      },
                      {
                          Order: 2,
                          Value: "PV"
                      }
                  ]
              },
              {
                  Country: "Croatia",
                  Childs: [
                      {
                          Order: 1,
                          Value: "Wind"
                      },
                      {
                          Order: 2,
                          Value: "PV"
                      }
                  ]
              }
          ]
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: A custom property
        ReturnType: None
        Default: =
      SelectedCountry:
        PropertyKind: Output
        DisplayName: Selected Country
        Description: A custom property
        DataType: Record
      SelectedNestedValue:
        PropertyKind: Output
        DisplayName: Selected Nested Value
        Description: A custom property
        DataType: Text
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      SelectedCountry: =LookUp(Countries, Country = gal_Countries.Selected.Country)
      SelectedNestedValue: =gal_Countries.Selected.gal_CountryNestedChilds.Selected.Value
      Width: =200
    Children:
      - gal_Countries:
          Control: Gallery@2.15.0
          Variant: VariableHeight
          Properties:
            BorderColor: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            Items: |-
              =AddColumns(
                  cmp_NestedCountryPickerColumn.Countries As C,
                  'Nested Items',
                  Filter(
                      cmp_NestedCountryPickerColumn.Nestings As Nestings,
                      Nestings.Country = C.Name
                  )
              )
            OnSelect: =cmp_NestedCountryPickerColumn.OnSelect();
            TemplatePadding: =0
            TemplateSize: =50
            Width: =Parent.Width
          Children:
            - gal_CountryNestedChilds:
                Control: Gallery@2.15.0
                Variant: Vertical
                Properties:
                  BorderColor: =RGBA(245, 245, 245, 1)
                  Fill: =con_CountryFlagAndLabel.Fill
                  Height: |+
                    =Self.AllItemsCount * Self.TemplateHeight
                  Items: =LookUp(cmp_NestedCountryPickerColumn.Nestings As Nesting, Nesting.Country = ThisItem.Name).Childs
                  LoadingSpinner: =LoadingSpinner.None
                  OnSelect: =Set(loc_SelectedNestedTextValue, TextCanvas4.Text); cmp_NestedCountryPickerColumn.OnSelect();
                  ShowScrollbar: =false
                  TemplatePadding: =0
                  TemplateSize: =35
                  Visible: =ThisItem.Expanded
                  Width: =Parent.Width
                  WrapCount: =0
                  Y: =50
                Children:
                  - TextCanvas3:
                      Control: Text@0.0.51
                      Properties:
                        Fill: =If(cbx_CountrySelected.Checked && ThisItem.IsSelected,RGBA(0,0,0,0.1), RGBA(255,255,255,1))
                        Height: =Parent.TemplateHeight
                        PaddingLeft: =40
                        Size: =If(ThisItem.IsSelected && Checkbox1.Value, 16, 14)
                        Text: =ThisItem.Value
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: =If(ThisItem.IsSelected && Checkbox1.Value,"Semibold","Regular")
                        Width: =gal_CountryNestedChilds.Width - Self.X
                        Wrap: =false
                  - Rectangle1:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(191, 191, 191, 1)
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =RGBA(0, 120, 212, 1)
                        FocusedBorderThickness: =4
                        Height: =38
                        HoverFill: =RGBA(0, 120, 212, 1)
                        OnSelect: =
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =1
                        X: =16
                        Y: =-19
                  - Rectangle1_1:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =If(cbx_CountrySelected.Checked && ThisItem.IsSelected, Color.White, RGBA(191, 191, 191, 1))
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =RGBA(0, 120, 212, 1)
                        FocusedBorderThickness: =4
                        Height: =1
                        HoverFill: =RGBA(0, 120, 212, 1)
                        OnSelect: =
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =16
                        X: =16
                        Y: =17
                  - ButtonCanvas5:
                      Control: Button@0.0.45
                      Properties:
                        Appearance: ='ButtonCanvas.Appearance'.Transparent
                        Height: =Parent.TemplateHeight
                        OnSelect: =cmp_NestedCountryPickerColumn.OnSelect()
                        Text: =
                        Width: =Parent.TemplateWidth
            - con_CountryFlagAndLabel:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =If(ThisItem.IsSelected && !ThisItem.Expanded, RGBA(0,0,0,0.1), RGBA(0,0,0,0))
                  Height: =Parent.TemplateHeight
                  LayoutDirection: =LayoutDirection.Horizontal
                  PaddingLeft: =8
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =Parent.Width
                Children:
                  - TextCanvas4:
                      Control: Text@0.0.51
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FontColor: =RGBA(0, 0, 0, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Text: =gal_CountryNestedChilds.Selected.Value
                        Visible: =false
                  - Button2:
                      Control: Classic/Button@2.2.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        AutoDisableOnSelect: =false
                        BorderColor: =RGBA(53, 61, 63, 1)
                        BorderThickness: =1
                        Color: =RGBA(53, 61, 63, 1)
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(53, 61, 63, 1)
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Segoe UI'
                        Height: =16
                        HoverBorderColor: =RGBA(53, 61, 63, 1)
                        HoverColor: =RGBA(53, 61, 63, 1)
                        HoverFill: =RGBA(237, 237, 237, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        OnSelect: |-
                          =Patch(
                              col_cmpCountryPickerItems,
                              DropColumns(ThisItem, 'Nested Items'),
                              {
                                Expanded: !ThisItem.Expanded  
                              }
                          );
                          cmp_NestedCountryPickerColumn.OnSelect()
                        PaddingLeft: =1
                        PaddingRight: =0
                        PaddingTop: =0
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(106, 122, 127, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        RadiusBottomLeft: =4
                        RadiusBottomRight: =4
                        RadiusTopLeft: =4
                        RadiusTopRight: =4
                        Text: =If(ThisItem.Expanded, "-","+")
                        Visible: =CountRows(ThisItem.'Nested Items'.Childs) > 0
                        Width: =16
                  - Rectangle2:
                      Control: Rectangle@2.3.0
                      Properties:
                        AlignInContainer: =AlignInContainer.Stretch
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        DisabledFill: =RGBA(0, 0, 0, 0)
                        DisplayMode: =DisplayMode.Disabled
                        Fill: =RGBA(0, 120, 212, 1)
                        FocusedBorderThickness: =4
                        HoverFill: =RGBA(0, 120, 212, 1)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =0
                        PressedFill: =RGBA(0, 120, 212, 1)
                        Width: =12 + If(!Button2.Visible, Button2.Width) - If(ThisItem.IsSelected, 2)
                  - con_CountryFlagShadow:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        AlignInContainer: =AlignInContainer.Center
                        DropShadow: =DropShadow.Regular
                        FillPortions: =0
                        Height: =24 + If(ThisItem.IsSelected, 4)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        Width: =36 + If(ThisItem.IsSelected, 4)
                        X: =32
                        Y: =gal_Countries.TemplateHeight - Self.Height - ((gal_Countries.TemplateHeight - Self.Height)/2)
                      Children:
                        - img_CountryFlagImage:
                            Control: Image@2.2.3
                            Properties:
                              BorderColor: =RGBA(0, 0, 0, 0)
                              BorderStyle: =BorderStyle.None
                              BorderThickness: =2
                              DisabledBorderColor: =RGBA(0, 0, 0, 0)
                              DisabledFill: =RGBA(0, 0, 0, 0)
                              FocusedBorderThickness: =4
                              Height: =Parent.Height
                              HoverBorderColor: =RGBA(0, 0, 0, 0)
                              HoverFill: =RGBA(0, 0, 0, 0)
                              Image: =ThisItem.'Flag Image'
                              ImagePosition: =ImagePosition.Fill
                              PressedBorderColor: =RGBA(0, 0, 0, 0)
                              PressedFill: =RGBA(0, 0, 0, 0)
                              Width: =Parent.Width
                  - lbl_CountryName:
                      Control: Text@0.0.51
                      Properties:
                        Height: =gal_Countries.TemplateHeight
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PaddingLeft: =8
                        Size: =If(ThisItem.IsSelected, 16, 14)
                        Text: =ThisItem.Name
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: =If(ThisItem.IsSelected,"Semibold","Regular")
                        Width: =132
                        X: =con_CountryFlagShadow.X + con_CountryFlagShadow.Width
                  - Checkbox1:
                      Control: Classic/CheckBox@2.1.0
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        BorderThickness: =2
                        CheckboxBorderColor: =RGBA(96, 94, 92, 1)
                        CheckmarkFill: =RGBA(0, 120, 212, 1)
                        Color: =RGBA(50, 49, 48, 1)
                        Default: =ThisItem.IsSelected
                        DisabledBorderColor: =RGBA(0, 0, 0, 0)
                        DisabledColor: =RGBA(161, 159, 157, 1)
                        FocusedBorderThickness: =4
                        Font: =Font.'Segoe UI'
                        HoverBorderColor: =RGBA(0, 0, 0, 0)
                        HoverColor: =RGBA(50, 49, 48, 1)
                        HoverFill: =RGBA(0, 0, 0, 0)
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        PressedBorderColor: =RGBA(0, 0, 0, 0)
                        PressedColor: =RGBA(50, 49, 48, 1)
                        PressedFill: =RGBA(0, 0, 0, 0)
                        Text: =
                        Visible: =false
            - cbx_CountrySelected:
                Control: CheckBox@0.0.30
                Properties:
                  Checked: =ThisItem.IsSelected
                  Visible: =false
                  X: =40
                  Y: =18
