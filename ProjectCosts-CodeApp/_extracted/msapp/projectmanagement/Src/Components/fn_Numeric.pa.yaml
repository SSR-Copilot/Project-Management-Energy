ComponentDefinitions:
  fn_Numeric:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      InRange:
        PropertyKind: OutputFunction
        DisplayName: InRange
        Description: A custom property
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A candidate parameter as input number in string format
              DataType: Text
              Default: ="125"
          - min:
              Description: A min parameter range value
              DataType: Number
              Default: =100
          - max:
              Description: A min parameter range value
              DataType: Number
              Default: =100
      InRangeAbs:
        PropertyKind: OutputFunction
        DisplayName: InRangeAbs
        Description: Validates numeric candidate within min..max by absolute value (supports negatives).
        DataType: Boolean
        Parameters:
          - candidate:
              Description: Candidate number as text (supports '-' sign)
              DataType: Text
              Default: ="-1.5"
          - min:
              Description: Minimum magnitude
              DataType: Number
              Default: =-5
          - max:
              Description: Maximum magnitude
              DataType: Number
              Default: =10
      InRangeCulture:
        PropertyKind: OutputFunction
        DisplayName: InRangeCulture
        Description: A custom property
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A candidate parameter as input number in string format
              DataType: Text
              Default: =0
          - min:
              Description: A min parameter range value
              DataType: Number
              Default: =100
          - max:
              Description: A max parameter range value
              DataType: Number
              Default: =100
          - culture:
              Description: A culture name parameter for candidate
              DataType: Text
              Default: ="en-US"
      IsInteger:
        PropertyKind: OutputFunction
        DisplayName: IsInteger
        Description: A custom property check if candidate string is integer.
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A candidate parameter as string
              DataType: Text
              Default: ="125"
      IsOneDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsOneDecimal
        Description: This current method checks whether the entered "candidate string" can be converted to deciml with  one decimal place.
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter as candiadte string
              DataType: Text
              Default: ="Text"
      IsSixDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsSixDecimal
        Description: A custom property
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter
              DataType: Text
              Default: ="Text"
      IsThreeDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsThreeDecimal
        Description: This current method checks whether the entered "candidate string" can be converted to decimal with tree points
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter as candidate string
              DataType: Text
              Default: ="Text"
      IsTwoDecimal:
        PropertyKind: OutputFunction
        DisplayName: IsTwoDecimal
        Description: This current method checks whether the entered "candidate string" can be converted to deciml with  one decimal place.
        DataType: Boolean
        Parameters:
          - candidate:
              Description: A parameter as candiadte string
              DataType: Text
              Default: ="Text"
    Properties:
      Height: =0
      InRange: |-
        =And(
            IsNumeric(candidate),
            And(
                Value(candidate) >= min,
                Value(candidate) <= max
            )
        )
      InRangeAbs: |+
        =IfError(
            With({ v: Value(candidate) },
                And(
                    v >= min,
                    v <= max
                )
            ),
            false
        )
      InRangeCulture: |-
        =IfError(
            And(
                Value(
                    candidate,
                    culture
                ) >= min,
                Value(
                    candidate,
                    culture
                ) <= max
            ),
            false
        )
      IsInteger: |-
        =And(
            IsNumeric(candidate),
            Not(
                IsMatch(
                    candidate,
                    "[.,]",
                    MatchOptions.Contains
                )
            )
        )
      IsOneDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\.\d{0,1})?$"
                ),
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\,\d{0,1})?$"
                )
            )
        )
      IsSixDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\.\d{0,6})?$"
                ),
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\,\d{0,6})?$"
                )
            )
        )
      IsThreeDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\.\d{0,3})?$"
                ),
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\,\d{0,3})?$"
                )
            )
        )
      IsTwoDecimal: |-
        =With(
            {
                varLang: Lower(
                    First(
                        Split(
                            Language(),
                            "-"
                        )
                    ).Value
                )
            },
            Switch(
                varLang,
                "en",
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\.\d{0,2})?$"
                ),
                IsMatch(
                    candidate,
                    "^[+-]?\d+(?:\,\d{0,2})?$"
                )
            )
        )
      Width: =0
