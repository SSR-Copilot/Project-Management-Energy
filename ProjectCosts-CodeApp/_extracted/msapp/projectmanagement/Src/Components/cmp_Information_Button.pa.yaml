ComponentDefinitions:
  cmp_Information_Button:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      Color:
        PropertyKind: Input
        DisplayName: Color
        Description: A custom property
        DataType: Color
        Default: =RGBA(0, 0, 0, 1)
      Items:
        PropertyKind: Input
        DisplayName: Items
        Description: A custom property
        RaiseOnReset: true
        DataType: Table
        Default: |-
          =Table(
              {
                  Valid: false,
                  Text: "Info 1"
              },
              {
                  Valid: false,
                  Text: "Info 2"
              }
          )
      MaxHeight:
        PropertyKind: Input
        DisplayName: MaxHeight
        Description: A custom property
        DataType: Number
        Default: =100
      MaxWidth:
        PropertyKind: Input
        DisplayName: MaxWidth
        Description: A custom property
        DataType: Number
        Default: =100
      OnSelect:
        PropertyKind: Event
        DisplayName: OnSelect
        Description: A custom property
        ReturnType: Boolean
        Default: =true
      ToolTipVisibility:
        PropertyKind: Input
        DisplayName: ToolTipVisibility
        Description: A custom property
        DataType: Boolean
        Default: =false
    Properties:
      Height: =32
      Width: =400
    Children:
      - con_Information_Button_Container:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderStyle: =BorderStyle.None
            DropShadow: =DropShadow.None
            Height: =32
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
            Y: =Parent.Height-Self.Height
          Children:
            - pcf_ico_Information_Button:
                Control: CodeComponent
                ComponentName: cat_PowerCAT.Icon
                Properties:
                  AccessibilityLabel: ="Required fields"
                  FontColor: =gblAppTheme.palette.akzent5
                  Height: =32
                  IconColor: =gblAppTheme.palette.akzent5
                  IconName: ="Info"
                  IconType: ='PowerCAT.Icon.IconType'.ActionButton
                  OnChange: =cmp_Information_Button.OnSelect();
                  Text: =$"Required fields"
                  Tooltip: =""
                  Width: =Parent.Width
      - con_Information_ToolTip:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderColor: =RGBA(255, 0, 0, 0.5)
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =If(cmp_Information_Button.ToolTipVisibility, Parent.Height - con_Information_Button_Container.Height, 0)
            Visible: =cmp_Information_Button.ToolTipVisibility
            Width: =If(cmp_Information_Button.ToolTipVisibility, Parent.Width, 0)
          Children:
            - con_Information_ToolTip_Scroll:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  BorderStyle: =BorderStyle.None
                  DropShadow: =DropShadow.None
                  Height: =Parent.Height
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =5
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                  Width: =Parent.Width
                  Y: =20
                Children:
                  - con_Information_ToolTip_Text:
                      Control: HtmlViewer@2.1.0
                      Properties:
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisplayMode: =DisplayMode.View
                        Fill: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Segoe UI'
                        Height: =CountRows(cmp_Information_Button.Items) * 16
                        HtmlText: |-
                          =$"<ul>{Concat(
                              cmp_Information_Button.Items,
                              If(
                                  Not(Valid),
                                  $"<li>{Substitute(
                                      Text,
                                      Char(10),
                                      "</br>"
                                  )} </li>",
                                  ""
                              )
                          )}<ul>"
                        LayoutMaxHeight: =
                        LayoutMaxWidth: =
                        LayoutMinHeight: =CountRows(cmp_Information_Button.Items) * 24 + 30
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Width: =Parent.Width + 50
            - con_Information_ToolTip_Dismiss:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: ="Required fields"
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(255, 0, 0, 0.5)
                  DisabledBorderColor: =RGBA(245, 245, 245, 1)
                  DisabledColor: =RGBA(225, 223, 221, 1)
                  DisabledFill: =RGBA(0, 0, 0, 0)
                  FocusedBorderThickness: =4
                  Height: =16
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(16, 110, 190, 1)
                  HoverFill: =RGBA(0, 0, 0, 0)
                  Icon: =Icon.Cancel
                  OnSelect: =cmp_Information_Button.OnSelect();
                  PressedBorderColor: =RGBA(0, 0, 0, 0)
                  PressedColor: =RGBA(16, 110, 190, 1)
                  PressedFill: =RGBA(0, 0, 0, 0)
                  Width: =16
                  X: =Parent.Width - Self.Width - 8
                  Y: =4
