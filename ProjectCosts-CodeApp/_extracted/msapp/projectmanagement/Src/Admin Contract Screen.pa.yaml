                                                      - img_Parent_TriState_Checkbox:
                                                          Control: Image@2.2.3
                                                          Properties:
                                                            BorderColor: =RGBA(0, 0, 0, 0)
                                                            BorderStyle: =BorderStyle.None
                                                            BorderThickness: =2
                                                            DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                                            DisabledFill: =RGBA(0, 0, 0, 0)
                                                            DisplayMode: |-
                                                              =// Calculate how many children are AVAILABLE (Not Used)
                                                              With(
                                                                  {
                                                                      _AvailableCount: CountRows(
                                                                          Filter(col_Edit_DevCoCosts, ParentId = ThisItem.Id && Level = 3 && !Used)
                                                                      )
                                                                  },
                                                                  // If nothing is available, Disable the control. Otherwise, allow Edit.
                                                                  If(
                                                                      _AvailableCount = 0, 
                                                                      DisplayMode.Disabled, 
                                                                      DisplayMode.Edit
                                                                  )
                                                              )
                                                            Fill: =Color.Transparent
                                                            FocusedBorderThickness: =4
                                                            Height: =32
                                                            HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                            HoverFill: =RGBA(0, 0, 0, 0)
                                                            Image: "=// Existing Image Property Logic\nWith(\n    {\n        // 1. Define the Pools\n        _ChildPool: Filter(\n            col_Edit_DevCoCosts,\n            ParentId = ThisItem.Id && Level = 3\n        ),\n        _AvailablePool: Filter(\n            col_Edit_DevCoCosts,\n            ParentId = ThisItem.Id && Level = 3 && !Used\n        ),\n        _SelectedPool: Filter(\n            col_Edit_DevCoCosts,\n            ParentId = ThisItem.Id && Level = 3 && Selected && !Used\n        )\n    },\n    With(\n        {\n            _TotalCount: CountRows(_ChildPool),        // All children (Used + Unused)\n            _AvailableCount: CountRows(_AvailablePool), // Only Unused\n            _SelectedCount: CountRows(_SelectedPool)    // Selected by user\n        },\n        With(\n            {\n                // 2. DETERMINE STATE\n                _State: If(\n                    // CASE A: Everything is locked by others\n                    _AvailableCount = 0,\n                    \"LOCKED\",\n\n                    // CASE B: Nothing is selected\n                    _SelectedCount = 0,\n                    \"UNCHECKED\",\n\n                    // CASE C: (NEW LOGIC) \n                    // To show \"CHECKED\", we must have selected everything AND nothing can be missing/used.\n                    // If Selected count equals TOTAL count, it is fully checked.\n                    _SelectedCount = _TotalCount, \n                    \"CHECKED\",\n\n                    // CASE D: Default to Partial\n                    // This covers: \n                    // 1. User selected some but not all available.\n                    // 2. User selected ALL available, but Total > Available (some are Used).\n                    \"PARTIAL\"\n                )\n            },\n            \n            // 3. SVG RENDERING (No changes needed here, just re-pasting for context)\n            \"data:image/svg+xml;utf8,\" & EncodeUrl(\n                \"<svg width='24' height='24' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'>\" & Switch(\n                    _State,\n                    \"LOCKED\",\n                    \"<rect x='1' y='1' width='22' height='22' rx='2' ry='2' fill='#C8C6C4'/>\" & \n                    \"<path d='M6 12 L10 16 L18 8' stroke='#FFFFFF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/>\",\n                    \n                    \"UNCHECKED\",\n                    \"<rect x='1' y='1' width='22' height='22' rx='2' ry='2' fill='none' stroke='#605E5C' stroke-width='1.5'/>\",\n                    \n                    \"CHECKED\",\n                    \"<rect x='1' y='1' width='22' height='22' rx='2' ry='2' fill='#0078D4'/>\" & \n                    \"<path d='M6 12 L10 16 L18 8' stroke='#FFFFFF' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/>\",\n                    \n                    \"PARTIAL\",\n                    \"<rect x='1' y='1' width='22' height='22' rx='2' ry='2' fill='#0078D4'/>\" & \n                    \"<line x1='7' y1='12' x2='17' y2='12' stroke='#FFFFFF' stroke-width='2' stroke-linecap='round'/>\"\n                ) & \"</svg>\"\n            )\n        )\n    )\n)"
                                                            OnSelect: "=// 1. SAFETY CHECK: Do not run if disabled (Double check, though DisplayMode usually handles this)\r\nIf(Self.DisplayMode <> DisplayMode.Disabled,\r\n    With(\r\n        {\r\n            // Count selected items within the AVAILABLE pool\r\n            _SelectedAvailableCount: CountRows(\r\n                Filter(col_Edit_DevCoCosts, ParentId = ThisItem.Id && Level = 3 && Selected && !Used)\r\n            )\r\n        },\r\n        \r\n        // 2. DETERMINE ACTION\r\n        // New Logic: If ANY available item is selected (>0) -> Turn OFF. Only if 0 are selected -> Turn ON.\r\n        With(\r\n            {\r\n                _TurnOn: If(_SelectedAvailableCount = 0, true, false)\r\n            },\r\n\r\n            // 3. UPDATE PARENT\r\n            UpdateIf(col_Edit_DevCoCosts, Id = ThisItem.Id, {Selected: _TurnOn});\r\n\r\n            // 4. UPDATE CHILDREN (Only the available ones!)\r\n            UpdateIf(\r\n                col_Edit_DevCoCosts,\r\n                ParentId = ThisItem.Id && Level = 3 && !Used, \r\n                {Selected: _TurnOn}\r\n            );\r\n\r\n            // 5. REFRESH\r\n            UpdateContext({locContractDevCoCostsCahnged: true}); \r\n            \r\n        )\r\n    )\r\n)"
                                                            PaddingBottom: =6
                                                            PaddingLeft: =9
                                                            PaddingRight: =6
                                                            PaddingTop: =6
                                                            PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                            PressedFill: =RGBA(0, 0, 0, 0)
                                                            Width: =32
                                                            X: =Parent.Width-Self.Width-40
