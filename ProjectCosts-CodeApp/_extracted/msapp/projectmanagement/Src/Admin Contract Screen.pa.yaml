                                                - btn_Edit_AdminContracts:
                                                    Control: Button@0.0.45
                                                    Properties:
                                                      Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                      BorderColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                                      FontColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                                      Icon: ="Edit"
                                                      IconStyle: ='ButtonCanvas.IconStyle'.Outline
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      OnSelect: "=// 1. REFRESH DATASOURCE\r\nRefresh('BoP Contracts Standard Assumptions');\r\n\r\n// 2. INITIALIZE COLLECTION (Reset to base state)\r\nClearCollect(\r\n    col_Edit_DevCoCosts,\r\n    SortByColumns(colCapexAllAccounts, \"Nummer\", SortOrder.Ascending)\r\n);\r\n\r\n// 3. DEFINE SCOPE & FETCH DATA\r\nWith(\r\n    {\r\n        // A. Capture the ID of the contract we are editing\r\n        varCurrentContractId: ThisItem.'BoP Contracts Standard Assumptions',\r\n\r\n        // B. Pre-calculate the Technology Option Set Value (Delegation Fix)\r\n        varTargetTechnology: Switch(\r\n            cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,\r\n            \"PV\", Technology.PV,\r\n            \"Wind\", Technology.Wind,\r\n            \"BESS\", Technology.BESS,\r\n            \"Hydro\", Technology.Hydro \r\n            // Add other technologies if necessary\r\n        )\r\n    },\r\n    \r\n    // C. Nested With to use varTargetTechnology in the Filter\r\n    With(\r\n        {\r\n            varScopeCosts: Filter(\r\n                'BoP Contracts Standard Assumption DevCo Costs',\r\n                'BoP Contract Standard Assumption'.Country.Name = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name,\r\n                'BoP Contract Standard Assumption'.Technology = varTargetTechnology\r\n            )\r\n        },\r\n\r\n        // 4. ITERATE AND FLAG (Classify: Selected vs Used)\r\n        ForAll(\r\n            varScopeCosts As Source,\r\n            UpdateIf(\r\n                col_Edit_DevCoCosts,\r\n                Id = Source.'CAPEX Account'.'CAPEX Account List',\r\n                {\r\n                    // Selected = It belongs to ME\r\n                    Selected: (Source.'BoP Contract Standard Assumption'.'BoP Contracts Standard Assumptions' = varCurrentContractId),\r\n                    \r\n                    // Used = It belongs to SOMEONE ELSE\r\n                    Used: (Source.'BoP Contract Standard Assumption'.'BoP Contracts Standard Assumptions' <> varCurrentContractId),\r\n                    \r\n                    // Metadata for tooltips/debugging\r\n                    UsedInContractDevCo: Source.'BoP Contract Standard Assumption'.'BoP Contracts Standard Assumptions',\r\n                    ContractDevCo: Source.'BoP Contracts Standard Assumption DevCo Costs'\r\n                }\r\n            )\r\n        )\r\n    )\r\n);\r\n\r\n// 5. OPEN PANEL & SET VARIABLES\r\nUpdateContext({\r\n    locIsVisibleBoPStandardAssumptionContract: true,\r\n    locContractTypeBoPAssumption: ThisItem.'Contract Types',\r\n    locSelectedBoPStandardContract: ThisItem,\r\n    locContractDevCoCostsDirty: false,        \r\n    locSelectedContractMarginPercentage: ThisItem.'Margin Percentage',    \r\n    locSelectedContractMarginFixedValues: ThisItem.'Margin Fixed Value',\r\n    locSelectedContractMarginType :ThisItem.'Margin Type'\r\n});\r\nSelect(btn_Add_Edit_AdminContracts_Reset);"
                                                      Text: ="Edit"
