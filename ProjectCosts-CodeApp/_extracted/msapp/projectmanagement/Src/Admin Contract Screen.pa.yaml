                                                - htmlDevCoCostTagList:
                                                    Control: HtmlViewer@2.1.0
                                                    Properties:
                                                      AlignInContainer: =AlignInContainer.Center
                                                      AutoHeight: =true
                                                      DisabledBorderColor: =RGBA(161, 159, 157, 1)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =0
                                                      HtmlText: |-
                                                        =With(
                                                            {
                                                                // 1. PREPARE DATA: Filter AND Add a "Rank" for custom sorting
                                                                _ScopedData: AddColumns(
                                                                    Filter(
                                                                        col_Costs_Flat_Cache,
                                                                        ParentID = ThisItem.'BoP Contracts Standard Assumptions'
                                                                    ),
                                                                    Rank,
                                                                    Switch(
                                                                        AccountName,
                                                                        "Wind Turbine / Panels",
                                                                        1,
                                                                        "Development Expenses",
                                                                        2,
                                                                        "Construction Expenses",
                                                                        3,
                                                                        "Substation / Grid Connection",
                                                                        4,
                                                                        "Other CAPEX",
                                                                        5,
                                                                        99// Default for unknown items puts them at the end
                                                                    )
                                                                ),
                                                                // 2. STYLES
                                                                RowStyle: "display: flex; flex-direction: row; align-items: baseline; gap: 10px; margin-bottom: 12px;",
                                                                HeaderStyle: "min-width: fit-content; font-size: 14px; font-weight: 600; color: #595959; font-family: 'Segoe UI';",
                                                                TagContainer: "display: flex; flex-wrap: wrap; gap: 8px;",
                                                                TagStyle: "display: inline-flex; align-items: center; padding: 4px 12px; background-color: #EDEBE9; color: #323130; border-radius: 16px; font-size: 13px; font-weight: 600; white-space: nowrap; font-family: 'Segoe UI';"
                                                            },
                                                            // 3. RENDER: Sort the GROUPS, not the raw data
                                                            Concat(
                                                                SortByColumns(
                                                                    GroupBy(
                                                                        _ScopedData,
                                                                        AccountName,
                                                                        Rank,// <--- Keep 'Rank' in the group definition so we can sort by it later
                                                                        GroupedSubAccounts
                                                                    ),
                                                                    "Rank",// <--- Sort the Groups by the custom Rank number
                                                                    SortOrder.Ascending
                                                                ),
                                                                "<div style='" & RowStyle & "'>" &
                                                                    // ROOT ACCOUNT NAME
                                                         "<div style='" & HeaderStyle & "'>" & AccountName & " :</div>" &
                                                                    // TAG LIST
                                                         "<div style='" & TagContainer & "'>" & Concat(
                                                                    GroupedSubAccounts,
                                                                    "<span style='" & TagStyle & "'>" & CategoryName & "</span>"
                                                                ) & "</div>" & "</div>"
                                                            )
                                                        )
                                                      LayoutMinHeight: =16
                                                      LayoutMinWidth: =16
                                                      PaddingBottom: =0
                                                      PaddingLeft: =2
                                                      PaddingTop: =0
                                                      Width: =Parent.Width
