Screens:
  Admin Contract Screen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
      OnVisible: |
        =Concurrent(
            UpdateContext(
                {
                    locIsVisibleBoPStandardAssumptionContract: false,
                    locContractTypeBoPAssumption: Blank(),
                    locContractsCostsMax: 1000000000,
                    locContractDevCoCostsDirty: false,
                    locIsVisiblePopUpDeleteContract: false,
                    locContractSpinnerInformationText: "Saving Contract data...",
                    locIsContractVisiblePopUpSpinner: false,
                    locIsVisibleApplyTracking: false,
                    locSelectedBoPStandardContractForApply: Blank(),
                    locFabricSyncCostJob: Blank()
                }
            ),
            ClearCollect(
                colApplyAndApplyAllTracking,
                'Apply and Apply All Trackings'
            ),
            ClearCollect(
                colAdminContracts,
                AddColumns(
                    'BoP Contracts Standard Assumptions',
                    IsFolded,
                    true
                )
            ),
            ClearCollect(
                col_Costs_Flat_Cache,
                AddColumns(
                    'BoP Contracts Standard Assumption DevCo Costs',
                    ParentID,
                    'BoP Contract Standard Assumption'.'BoP Contracts Standard Assumptions',
                    CategoryName,
                    'CAPEX Account'.Name,
                    ParentOrder,
                    RootCapexAccount.Order,
                    AccountName,
                    RootCapexAccount.Name
                )
            ),
            ClearCollect(
                col_Global_DevCoCosts,
                AddColumns(
                    'BoP Contracts Standard Assumption DevCo Costs',
                    CategoryName,
                    'CAPEX Account'.Name,
                    TagName,
                    'CAPEX Account'.Name
                )
            )
        );
        ClearCollect(
            col_cmpCountryPickerItems,
            Sort(
                AddColumns(
                    Countries,
                    'Flag Image',
                    Switch(
                        Name,
                        "Germany",
                        'germany-flag-png-large',
                        "Croatia",
                        'croatia-flag-png-large',
                        "France",
                        'france-flag-png-large',
                        "Greece",
                        'greece-flag-png-large',
                        "Finland",
                        'finland-flag-png-large',
                        "Spain",
                        'spain-flag-png-large',
                        "Italy",
                        'italy-flag-png-large',
                        "Poland",
                        'poland-flag-png-large',
                        "Romania",
                        'romania-flag-png-large'
                    ),
                    Order,
                    Switch(
                        Name,
                        "Germany",
                        1,
                        "Croatia",
                        6,
                        "France",
                        2,
                        "Greece",
                        8,
                        "Finland",
                        5,
                        "Spain",
                        7,
                        "Italy",
                        4,
                        "Poland",
                        3,
                        "Romania",
                        9
                    ),
                    Expanded,
                    false
                ),
                ThisRecord.Order
            )
        );
        ClearCollect(
            colCapexAllAccounts,
            Blank()
        );
        ClearCollect(
            colCapexAllAccountsTemporary,
            'CAPEX Account Lists'
        );
        ClearCollect(
            colSelectedConratctWithDevCoCosts,
            colCapexAllAccounts
        );
        With(
            {
                varColParentAccounts: Filter(
                    colCapexAllAccountsTemporary,
                    And(
                        'Parent Account'.Number = "00001",
                        Not(ThisRecord.Number = "10006")
                    )
                )
            },
            ForAll(
                varColParentAccounts,
                With(
                    {
                        varId: ThisRecord.'CAPEX Account List',
                        varParentId: ThisRecord.'CAPEX Account List',
                        varName: ThisRecord.Name,
                        varNummer: ThisRecord.Number,
                        varOrder: ThisRecord.Order
                    },
                    With(
                        {
                            varChilds: Filter(
                                colCapexAllAccountsTemporary,
                                'Parent Account'.'CAPEX Account List' = varId
                            )
                        },
                        Collect(
                            colCapexAllAccounts,
                            {
                                Id: varParentId,
                                ParentId: Blank(),
                                ParentIdLevel1: Blank(),
                                ParentIdLevel2: Blank(),
                                Nummer: varNummer,
                                Name: varName,
                                TotalCost: 0,
                                Order: varOrder,
                                Level: 1,
                                ChildsCount: CountIf(
                                    varChilds,
                                    true
                                ),
                                ContractDevCo: EmptyGUID,
                                Selected: false,
                                UsedInContractDevCo: EmptyGUID,
                                Used: false,
                                IsFolded: true
                            }
                        );
                        ForAll(
                            varChilds,
                            With(
                                {
                                    varId: ThisRecord.'CAPEX Account List',
                                    varParentIdLevel1: ThisRecord.'CAPEX Account List',
                                    varName: ThisRecord.Name,
                                    varNummer: ThisRecord.Number,
                                    varOrder: ThisRecord.Order
                                },
                                With(
                                    {
                                        varChildsLevel2: Filter(
                                            colCapexAllAccountsTemporary,
                                            'Parent Account'.'CAPEX Account List' = varId
                                        )
                                    },
                                    Collect(
                                        colCapexAllAccounts,
                                        {
                                            Id: varId,
                                            ParentId: varParentId,
                                            ParentIdLevel1: varParentIdLevel1,
                                            ParentIdLevel2: Blank(),
                                            Nummer: varNummer,
                                            Name: varName,
                                            TotalCost: 0,
                                            Level: 2,
                                            Order: varOrder,
                                            ChildsCount: CountIf(
                                                varChildsLevel2,
                                                true
                                            ),
                                            ContractDevCo: EmptyGUID,
                                            Selected: false,
                                            UsedInContractDevCo: EmptyGUID,
                                            Used: false,
                                            IsFolded: true
                                        }
                                    );
                                    ForAll(
                                        varChildsLevel2,
                                        With(
                                            {
                                                varId: ThisRecord.'CAPEX Account List',
                                                varParentIdLevel2: ThisRecord.'CAPEX Account List',
                                                varName: ThisRecord.Name,
                                                varNummer: ThisRecord.Number,
                                                varOrder: ThisRecord.Order
                                            },
                                            With(
                                                {
                                                    varChildsLevel3: Filter(
                                                        colCapexAllAccountsTemporary,
                                                        'Parent Account'.'CAPEX Account List' = varId
                                                    )
                                                },
                                                Collect(
                                                    colCapexAllAccounts,
                                                    {
                                                        Id: varId,
                                                        ParentId: varParentId,
                                                        ParentIdLevel1: varParentIdLevel1,
                                                        ParentIdLevel2: varParentIdLevel2,
                                                        Nummer: varNummer,
                                                        Name: varName,
                                                        TotalCost: 0,
                                                        Level: 3,
                                                        Order: varOrder,
                                                        ChildsCount: CountIf(
                                                            varChildsLevel3,
                                                            true
                                                        ),
                                                        ContractDevCo: EmptyGUID,
                                                        Selected: false,
                                                        UsedInContractDevCo: EmptyGUID,
                                                        Used: false,
                                                        IsFolded: true
                                                    }
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    )
                )
            )
        );
        UpdateContext(
            {
                locDevContractLimitExceeded: CountIf(
                    colAdminContracts,
                    And(
                        Country.Name = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name,
                        Text(Technology) = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,
                        'Contract Types' = 'BoP Contract Types'.'Development Contract'
                    )
                ) >= 10,
                locConstructionContractLimitExceeded: CountIf(
                    colAdminContracts,
                    And(
                        Country.Name = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name,
                        Text(Technology) = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,
                        'Contract Types' = 'BoP Contract Types'.'Construction Contract'
                    )
                ) >= 10
            }
        );
    Children:
      - fn_Numeric_AdminContracts:
          Control: CanvasComponent
          ComponentName: fn_Numeric
          Properties:
            Height: =-1
            Visible: =false
            Width: =-1
            X: =20
            Y: =20
      - con_Admin_Contracts:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - cmp_Admin_Contracts_Header:
                Control: CanvasComponent
                ComponentName: cmp_Header
                Properties:
                  ApprovalStatesColor: |-
                    =Table(
                        {
                            State: "Draft",
                            Color: "#41aab4"
                        },
                        {
                            State: "Approving",
                            Color: "#f5911e"
                        },
                        {
                            State: "Approved",
                            Color: "#82a51e"
                        },
                        {
                            State: "Rejected",
                            Color: "#d20532"
                        }
                    )
                  Height: =70
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  LogoWidth: =210
                  MainScreen: =App.ActiveScreen
                  OnLogoClick: =Navigate('Project Main Screen',ScreenTransition.Fade)
                  Project: |-
                    ={
                        ID: GUID("00000000-0000-0000-0000-000000000000"),
                        Name: "Contracts",
                        Technology: Blank(),
                        Capacity: Blank(),
                        Status: Blank(),
                        Approval: Blank()
                    }
                  Width: =1024
            - con_AdminContract_Body:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =5
                  LayoutMinHeight: =16
                  PaddingBottom: =5
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =5
                Children:
                  - con_AdminContracts_LeftNavigation:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutMinWidth: =16
                        Width: =If(cmp_AdminContracrs_Left_Navigation.IsExpanded,200,32)
                      Children:
                        - cmp_AdminContracrs_Left_Navigation:
                            Control: CanvasComponent
                            ComponentName: cmp_Left_Navigation
                            Properties:
                              FontSize: =gblAppSizes.Font.Medium
                              Height: =Parent.Height
                              IsExpanded: =gblLeftNavigationMenuIsExpanded
                              Items: =LeftAdminNavigationMenu
                              LayoutMaxHeight: =
                              LayoutMaxWidth: =
                              OnExpand: |
                                =Set(
                                    gblLeftNavigationMenuIsExpanded,
                                    Not(gblLeftNavigationMenuIsExpanded)
                                );
                              OnSelect: |-
                                =If(
                                    Self.SelectedKey <> gblLeftNavigationSelected.ItemKey,
                                    Set(
                                        gblLeftNavigationSelected,
                                        LookUp(
                                            LeftAdminNavigationMenu,
                                            ItemKey = Self.SelectedKey
                                        )
                                    );
                                    Navigate(
                                        gblLeftNavigationSelected.TargetScreen,
                                        ScreenTransition.Fade
                                    )
                                )
                              Selected: =gblLeftNavigationSelected
                              Width: =200
                  - con_AdminContracts_Country_Technology_Picker:
                      Control: GroupContainer@1.5.0
                      Variant: ManualLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =0
                        LayoutMinWidth: =16
                        RadiusBottomLeft: =1
                        RadiusBottomRight: =1
                        RadiusTopLeft: =1
                        RadiusTopRight: =1
                        Width: =200
                      Children:
                        - cmp_AdminContraacts_NestedCountryPickerColumn:
                            Control: CanvasComponent
                            ComponentName: cmp_NestedCountryPickerColumn
                            Properties:
                              Countries: =Filter(col_cmpCountryPickerItems, !(Name in [ "Spain", "Greece", "Romania" ]))
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.Height
                              Nestings: |-
                                =// Use the Record Schema with Country: Countryname and Childs as string array (PowerFx converts it to {Value:String} objects).
                                // For Childs Filter for SingleColumn (Text) Table based on your needs or alter manually. 
                                [
                                    {
                                        Country: "Germany",
                                        Childs: [
                                            {
                                                Order: 1,
                                                Value: "Wind"
                                            },
                                            {
                                                Order: 2,
                                                Value: "PV"
                                            },
                                            {
                                                Order: 3,
                                                Value: "BESS"
                                            }
                                        ]
                                    },
                                    {
                                        Country: "France",
                                        Childs: [
                                            {
                                                Order: 1,
                                                Value: "Wind"
                                            },
                                            {
                                                Order: 2,
                                                Value: "PV"
                                            },
                                            {
                                                Order: 3,
                                                Value: "BESS"
                                            }
                                        ]
                                    },
                                    {
                                        Country: "Poland",
                                        Childs: [
                                            {
                                                Order: 1,
                                                Value: "Wind"
                                            },
                                            {
                                                Order: 2,
                                                Value: "PV"
                                            },
                                            {
                                                Order: 3,
                                                Value: "BESS"
                                            }
                                        ]
                                    },
                                    {
                                        Country: "Italy",
                                        Childs: [
                                            {
                                                Order: 1,
                                                Value: "Wind"
                                            },
                                            {
                                                Order: 2,
                                                Value: "PV"
                                            },
                                            {
                                                Order: 3,
                                                Value: "BESS"
                                            }
                                        ]
                                    },
                                    {
                                        Country: "Finland",
                                        Childs: [
                                            {
                                                Order: 1,
                                                Value: "Wind"
                                            },
                                            {
                                                Order: 2,
                                                Value: "PV"
                                            },
                                            {
                                                Order: 3,
                                                Value: "BESS"
                                            }
                                        ]
                                    },
                                    {
                                        Country: "Croatia",
                                        Childs: [
                                            {
                                                Order: 1,
                                                Value: "Wind"
                                            },
                                            {
                                                Order: 2,
                                                Value: "PV"
                                            },
                                            {
                                                Order: 3,
                                                Value: "BESS"
                                            }
                                        ]
                                    }
                                ]
                              OnSelect: =Select(btnGeneralPurposeReset)
                              Width: =Parent.Width
                  - con_AdminContracts_StandardAssumptions_RightContent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =10
                      Children:
                        - con_AdminContract_Selected_Country_Technology:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: = RGBA(0,0,0,0.1)
                              FillPortions: =0
                              Height: =50
                              LayoutMinHeight: =16
                            Children:
                              - lbl_AdminContract_Selected_Country_Technology:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 0, 0, 0)
                                    BorderStyle: =BorderStyle.None
                                    BorderThickness: =2
                                    Color: =RGBA(50, 49, 48, 1)
                                    DisabledBorderColor: =RGBA(0, 0, 0, 0)
                                    DisabledColor: =RGBA(161, 159, 157, 1)
                                    FocusedBorderThickness: =4
                                    FontWeight: =FontWeight.Semibold
                                    Text: =$"Contracts / {cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name} / {cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue}"
                                    Width: =250
                                    X: =20
                                    Y: =(Parent.Height-Self.Height)/2
                              - btn_AdminContract_Add_Development_Contract:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                    DisplayMode: |
                                      =If(
                                          locDevContractLimitExceeded,
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    FontColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                    Icon: ="Add"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: "=UpdateContext({\n    locKeepExpandedID: LookUp(colAdminContracts, !IsFolded).'BoP Contracts Standard Assumptions'\n});\nIf(\n    locDevContractLimitExceeded,\n    Notify(\n        \"Maximum 10 development contracts allowed for \" & \n        cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name & \n        \" - \" & \n        cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,\n        NotificationType.Warning\n    ),\n    UpdateContext(\n        {\n            locIsVisibleBoPStandardAssumptionContract: true,\n            locContractTypeBoPAssumption: 'BoP Contract Types'.'Development Contract',\n            locSelectedBoPStandardContract: Blank(),\n            locContractDevCoCostsDirty: false,\n            locSelectedContractMarginPercentage: Blank(), \n            locSelectedContractMarginFixedValues: Blank(),\n            locSelectedContractMarginType :'Contract Margin Type'.Percentage\n        }\n    );\n    With(\n        {\n            // 1. Pre-calculate Technology (Delegation Fix)\n            varTargetTechnology: Switch(\n                cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,\n                \"PV\", Technology.PV,\n                \"Wind\", Technology.Wind,\n                \"BESS\", Technology.BESS,\n                \"Hydro\", Technology.Hydro\n            ),\n            varContractTypesChoices: 'BoP Contract Types'\n        },\n        \n        // 2. Reset Collection\n        ClearCollect(\n            col_Edit_DevCoCosts,\n            SortByColumns(colCapexAllAccounts, \"Nummer\", SortOrder.Ascending)\n        );\n\n        // 3. Fetch ALL existing costs (Conflicts)\n        With(\n            {\n                varScopeCosts: Filter(\n                    'BoP Contracts Standard Assumption DevCo Costs',\n                    'BoP Contract Standard Assumption'.Country.Name = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name,\n                    'BoP Contract Standard Assumption'.Technology = varTargetTechnology\n                )\n            },\n            \n            // 4. Mark EVERYTHING found as 'Used' (New contracts own nothing, so everything found is a conflict)\n            ForAll(\n                varScopeCosts As Source,\n                UpdateIf(\n                    col_Edit_DevCoCosts,\n                    Id = Source.'CAPEX Account'.'CAPEX Account List',\n                    {\n                        Selected: false,\n                        Used: true,\n                        UsedInContractDevCo: Source.'BoP Contract Standard Assumption'.'BoP Contracts Standard Assumptions'\n                    }\n                )\n            )\n        )\n    );\n)\n"
                                    Text: ="Add Development Contract"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =230
                                    X: =lbl_AdminContract_Selected_Country_Technology.X+lbl_AdminContract_Selected_Country_Technology.Width+15
                                    Y: =((Parent.Height-Self.Height)/2)
                              - btn_AdminContract_Add_Construction_Contract:
                                  Control: Button@0.0.45
                                  Properties:
                                    Align: =Align.Left
                                    Appearance: ='ButtonCanvas.Appearance'.Secondary
                                    BorderColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                    BorderThickness: =1
                                    DisplayMode: |-
                                      =If(
                                          locConstructionContractLimitExceeded,
                                          DisplayMode.Disabled,
                                          DisplayMode.Edit
                                      )
                                    FontColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                    Icon: ="Add"
                                    IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                    OnSelect: "=UpdateContext(\n    {\n        locKeepExpandedID: LookUp(\n            colAdminContracts,\n            !IsFolded\n        ).'BoP Contracts Standard Assumptions'\n    }\n);\nIf(\n    locConstructionContractLimitExceeded,\n    Notify(\n        \"Maximum 10 construction contracts allowed for \" & cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name & \" - \" & cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,\n        NotificationType.Warning\n    ),\n    UpdateContext(\n        {\n            locIsVisibleBoPStandardAssumptionContract: true,\n            locContractTypeBoPAssumption: 'BoP Contract Types'.'Construction Contract',\n            locSelectedBoPStandardContract: Blank(),\n            locContractDevCoCostsDirty: false,\n            locSelectedContractMarginPercentage: Blank(),\n            locSelectedContractMarginFixedValues: Blank(),\n            locSelectedContractMarginType :'Contract Margin Type'.Percentage\n        }\n    );\n    With(\n        {\n            // 1. Pre-calculate Technology (Delegation Fix)\n            varTargetTechnology: Switch(\n                cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,\n                \"PV\",\n                Technology.PV,\n                \"Wind\",\n                Technology.Wind,\n                \"BESS\",\n                Technology.BESS,\n                \"Hydro\",\n                Technology.Hydro\n            ),\n            varContractTypesChoices: 'BoP Contract Types'\n        },\n        // 2. Reset Collection\n        ClearCollect(\n            col_Edit_DevCoCosts,\n            SortByColumns(\n                colCapexAllAccounts,\n                \"Nummer\",\n                SortOrder.Ascending\n            )\n        );\n        // 3. Fetch ALL existing costs (Conflicts)\nWith(\n            {\n                varScopeCosts: Filter(\n                    'BoP Contracts Standard Assumption DevCo Costs',\n                    'BoP Contract Standard Assumption'.Country.Name = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Name,\n                    'BoP Contract Standard Assumption'.Technology = varTargetTechnology\n                )\n            },\n            // 4. Mark EVERYTHING found as 'Used' (New contracts own nothing, so everything found is a conflict)\n            ForAll(\n                varScopeCosts As Source,\n                UpdateIf(\n                    col_Edit_DevCoCosts,\n                    Id = Source.'CAPEX Account'.'CAPEX Account List',\n                    {\n                        Selected: false,\n                        Used: true,\n                        UsedInContractDevCo: Source.'BoP Contract Standard Assumption'.'BoP Contracts Standard Assumptions'\n                    }\n                )\n            )\n        )\n    );\n    \n)"
                                    Text: ="Add Construction Contract"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Width: =230
                                    X: =btn_AdminContract_Add_Development_Contract.X+btn_AdminContract_Add_Development_Contract.Width+15
                                    Y: =(Parent.Height-Self.Height)/2
                        - con_AdminContract_ApplyAll_Apply_Tracking:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: |-
                                =If(
                                    con_AdminContract_Apply_All_Last_Tracking.Visible,
                                    120,
                                    80
                                )
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =16
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - con_AdminContract_ApplyAll_Warinig_Button:
                                  Control: GroupContainer@1.5.0
                                  Variant: ManualLayout
                                  Properties:
                                    AlignInContainer: =AlignInContainer.Center
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =70
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =Parent.Width-40
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Width: =Parent.Width-40
                                  Children:
                                    - con_AdminContract_ApplyAll_Inner_Warning_Button:
                                        Control: GroupContainer@1.5.0
                                        Variant: ManualLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          Fill: =RGBA(204, 226, 241, 0.5)
                                          Height: =45
                                          Width: =Parent.Width
                                          Y: =10
                                        Children:
                                          - btn_AdminContract_ApplyAll:
                                              Control: Button@0.0.45
                                              Properties:
                                                Appearance: ='ButtonCanvas.Appearance'.Secondary
                                                BorderColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                                BorderStyle: =BorderStyle.Solid
                                                BorderThickness: =1
                                                DisplayMode: =DisplayMode.Disabled
                                                FontColor: =ColorValue(gblAppTheme.palette.themePrimary)
                                                Icon: ="Checkmark"
                                                IconStyle: ='ButtonCanvas.IconStyle'.Filled
                                                OnSelect: |
                                                  =UpdateContext(
                                                      {
                                                          locIsVisibleApplyTracking: true,
                                                          locSelectedBoPStandardContractForApply: Blank(),
                                                          locSelectedApplyAndApplyAllTracking: LookUp(
                                                              colApplyAndApplyAllTracking,
                                                              And(
                                                                  Country.Country = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedCountry.Country,
                                                                  Text(Technology) = cmp_AdminContraacts_NestedCountryPickerColumn.SelectedNestedValue,
                                                                  'Action?' = 'Action? (Apply and Apply All Trackings)'.'Apply All',
                                                                  'Contract Type' = 'Contract Types'.BoP
                                                              )
                                                          )
                                                      }
                                                  );
                                                Text: ="Apply to All"
                                                VerticalAlign: =VerticalAlign.Middle
                                                Width: =140
                                                X: =10
                                                Y: =(Parent.Height-Self.Height)/2
                                          - ico_AdminContract_ApplyAll:
                                              Control: Classic/Icon@2.5.0
                                              Properties:
                                                BorderColor: =RGBA(0, 0, 0, 0)
                                                Color: =ColorValue(gblAppTheme.palette.Grayscale10)
                                                DisabledBorderColor: =RGBA(245, 245, 245, 1)
                                                DisabledColor: =RGBA(225, 223, 221, 1)
                                                DisabledFill: =RGBA(0, 0, 0, 0)
                                                FocusedBorderThickness: =4
                                                Height: =18
                                                HoverBorderColor: =RGBA(0, 0, 0, 0)
                                                HoverColor: =RGBA(16, 110, 190, 1)
                                                HoverFill: =RGBA(0, 0, 0, 0)
                                                Icon: =Icon.Information
                                                PressedBorderColor: =RGBA(0, 0, 0, 0)
                                                PressedColor: =RGBA(16, 110, 190, 1)
                                                PressedFill: =RGBA(0, 0, 0, 0)
                                                Width: =18
                                                X: =btn_AdminContract_ApplyAll.X+btn_AdminContract_ApplyAll.Width+15
                                                Y: =(Parent.Height-Self.Height)/2
